-content:space-between;gap:14px;align-items:flex-start;margin:12px 0}.dqi-table-wrap{overflow:auto;border:1px solid var(--b);border-radius:7px;background:#fff}.dqi-table{width:100%;border-collapse:collapse;font-size:12px}.dqi-table th,.dqi-table td{padding:7px 8px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:top}.dqi-table th{background:#f7f8f9;position:sticky;top:0;z-index:1}.dqi-badge{display:inline-block;padding:2px 7px;border-radius:12px;background:#e9eef1;color:#53616b;font-size:10px;font-weight:700;white-space:nowrap}.dqi-badge.critical{background:#fde4e4;color:var(--crit)}.dqi-badge.review{background:#fff0cf;color:var(--rev)}.dqi-badge.atypical{background:#e6f1fb;color:var(--at)}.dqi-badge.ok{background:#e7f2db;color:#4d6a20}.dqi-info,.dqi-warn,.dqi-danger{padding:10px 12px;border-radius:5px;margin:9px 0;font-size:12px}.dqi-info{background:#f3f8fb;border:1px solid #c8d9e4}.dqi-warn{background:#fff8e8;border:1px solid #e2ce98}.dqi-danger{background:#fff1f1;border:1px solid #e1b4b4;color:#812929}.dqi-selection{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 11px;background:#f8faf6;border:1px solid #d7e1c8;border-radius:6px;margin:8px 0}.dqi-pattern{display:flex;justify-content:space-between;gap:10px;padding:9px;border-bottom:1px solid #edf0f2}.dqi-pager{display:flex;justify-content:center;gap:6px;margin:10px}.dqi-progress{height:8px;background:#edf0f2;border-radius:8px;overflow:hidden}.dqi-progress span{display:block;height:100%;background:var(--g)}@media(max-width:1100px){.dqi-steps{grid-template-columns:repeat(3,1fr)}.dqi-toolbar{grid-template-columns:repeat(3,1fr)}.dqi-stats,.dqi-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.dqi-hero,.dqi-head,.dqi-selection{flex-direction:column;align-items:stretch}.dqi-steps,.dqi-toolbar,.dqi-stats,.dqi-grid{grid-template-columns:1fr}}
</style>
<script>
(function(){
'use strict';
if(window.__dracQualityItemsV1)return;window.__dracQualityItemsV1=true;
const CFG={MODULE:'items',VERSION:'1.5.0',ITEMS:'/api/v1/items',MEMORY:'__KOHATOOLS_ASSET_ROOT__apps/quality/shared/quality-memory-firebase.js?ktv=3.43.1',SETTINGS_KEY:'dq_items_settings_v1',PAGE:50,PER_PAGE:500,MIN_GAP:250,DEEP_MAX:300,DEFAULTS:{lastSeenReviewDays:1825,lastSeenAtypicalDays:1095,lostReviewDays:1095,damagedReviewDays:730,withdrawnReviewDays:730,minorityMinItems:5,minorityMajorityPct:85,terminalLostStatuses:'2,3',terminalWithdrawnStatuses:'1',terminalMinDays:365,excludeHomeLibraries:'',excludeHoldingLibraries:'',excludeLocations:'',excludePermanentLocations:'',excludeCollections:'',allowApiDelete:false}};
const root=document.getElementById('dqi-app');if(!root)return;const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),fmt=v=>new Intl.NumberFormat('fr-FR').format(Number(v)||0),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tail=Promise.resolve(),lastEnd=0;function kfetch(url,opt={}){const job=tail.catch(()=>{}).then(async()=>{const w=Math.max(0,CFG.MIN_GAP-(Date.now()-lastEnd));if(w)await sleep(w);try{return await fetch(url,opt)}finally{lastEnd=Date.now()}});tail=job.catch(()=>{});return job}
function loadSettings(){try{return {...CFG.DEFAULTS,...JSON.parse(localStorage.getItem(CFG.SETTINGS_KEY)||'{}')}}catch(_){return {...CFG.DEFAULTS}}}
const state={rows:[],tab:'overview',page:1,search:'',severity:'',home:'',holding:'',type:'',statusFilter:'',selected:new Set(),settings:loadSettings(),loading:false,stop:false,deep:new Map(),simulation:null,memoryStatus:null};const RANK={ok:0,atypical:1,review:2,critical:3};
function days(v){const t=Date.parse(v||'');return Number.isFinite(t)?Math.floor((Date.now()-t)/86400000):null}function bucket(n){if(n==null)return'unknown';if(n<30)return'<30';if(n<180)return'30-179';if(n<365)return'180-364';if(n<730)return'365-729';if(n<1095)return'730-1094';if(n<1825)return'1095-1824';return'1825+'}
function nitem(o){return{id:Number(o.item_id),biblio_id:Number(o.biblio_id),barcode:o.external_id||'',title:o.biblio?.title||'',home:o.home_library_id||'',holding:o.holding_library_id||'',item_type:o.item_type_id||o.effective_item_type_id||'',collection:o.collection_code||'',location:o.location||'',permanent_location:o.permanent_location||'',callnumber:o.callnumber||'',acq:o.acquisition_date||null,last_seen:o.last_seen_date||null,last_checkout:o.last_checkout_date||null,replacement:o.replacement_price,lost:Number(o.lost_status||0),lost_date:o.lost_date||null,damaged:Number(o.damaged_status||0),damaged_date:o.damaged_date||null,withdrawn:Number(o.withdrawn||0),withdrawn_date:o.withdrawn_date||null,nfl:Number(o.not_for_loan_status||0),timestamp:o.timestamp||null,raw:o}}
const RULES=[
{id:'ITEM-001',title:'Code-barres absent',severity:'review',test:r=>!r.barcode},{id:'ITEM-002',title:'Bibliothèque propriétaire absente',severity:'critical',test:r=>!r.home},{id:'ITEM-003',title:'Bibliothèque détentrice absente',severity:'critical',test:r=>!r.holding},{id:'ITEM-004',title:'Type de document absent',severity:'review',test:r=>!r.item_type},{id:'ITEM-005',title:'Cote absente',severity:'atypical',test:r=>!r.callnumber},{id:'ITEM-006',title:'Prix de remplacement absent',severity:'atypical',test:r=>r.replacement===null||r.replacement===undefined||r.replacement===''},{id:'ITEM-007',title:"Date d'acquisition future",severity:'critical',test:r=>r.acq&&Date.parse(r.acq)>Date.now()+86400000},{id:'ITEM-008',title:'Jamais vu depuis très longtemps',severity:'atypical',test:r=>days(r.last_seen)>=state.settings.lastSeenAtypicalDays},{id:'ITEM-009',title:'Dernière vue extrêmement ancienne',severity:'review',test:r=>days(r.last_seen)>=state.settings.lastSeenReviewDays},{id:'ITEM-010',title:'Perdu depuis très longtemps',severity:'review',test:r=>r.lost>0&&days(r.lost_date)>=state.settings.lostReviewDays},{id:'ITEM-011',title:'Endommagé depuis très longtemps',severity:'review',test:r=>r.damaged>0&&days(r.damaged_date)>=state.settings.damagedReviewDays},{id:'ITEM-012',title:'Retiré depuis très longtemps',severity:'review',test:r=>r.withdrawn>0&&days(r.withdrawn_date)>=state.settings.withdrawnReviewDays},{id:'ITEM-013',title:'Date de perte présente mais statut non perdu',severity:'review',test:r=>r.lost<=0&&!!r.lost_date},{id:'ITEM-014',title:'Date endommagé présente mais statut normal',severity:'review',test:r=>r.damaged<=0&&!!r.damaged_date},{id:'ITEM-015',title:'Date de retrait présente mais statut non retiré',severity:'review',test:r=>r.withdrawn<=0&&!!r.withdrawn_date},{id:'ITEM-016',title:'Bibliothèque détentrice différente sans transfert actif',severity:'atypical',deep:true,test:r=>r.home&&r.holding&&r.home!==r.holding&&!r._deep?.transfer},{id:'ITEM-017',title:'Exemplaire retiré mais encore prêté',severity:'critical',deep:true,test:r=>r.withdrawn>0&&!!r._deep?.checkout},{id:'ITEM-018',title:'Exemplaire perdu mais encore prêté',severity:'review',deep:true,test:r=>r.lost>0&&!!r._deep?.checkout},{id:'ITEM-019',title:'Prêt et transfert actif simultanés',severity:'critical',deep:true,test:r=>!!r._deep?.checkout&&!!r._deep?.transfer},{id:'ITEM-020',title:'Réservation active sur exemplaire retiré/perdu',severity:'review',deep:true,test:r=>!!r._deep?.first_hold&&(r.withdrawn>0||r.lost>0)},{id:'ITEM-021',title:'Réclamation de retour sur exemplaire non prêté',severity:'review',deep:true,test:r=>(r._deep?.return_claims?.length||0)>0&&!r._deep?.checkout},{id:'ITEM-022',title:'Valeur minoritaire atypique dans la notice',severity:'atypical',test:r=>!!r._minority},{id:'ITEM-023',title:'Code-barres dupliqué dans le lot chargé',severity:'critical',test:r=>!!r._duplicateBarcode}
];
function codeSet(v){return new Set(String(v||'').split(/[;,\n]/).map(x=>x.trim()).filter(Boolean))}function excludedByRules(r){const s=state.settings;return codeSet(s.excludeHomeLibraries).has(r.home)||codeSet(s.excludeHoldingLibraries).has(r.holding)||codeSet(s.excludeLocations).has(r.location)||codeSet(s.excludePermanentLocations).has(r.permanent_location)||codeSet(s.excludeCollections).has(r.collection)}
function evaluate(r){if(excludedByRules(r))return{hits:[],severity:'ok',excluded:true};let hits=[];for(const rule of RULES){if(rule.deep&&!r._deep)continue;try{if(rule.test(r))hits.push(rule)}catch(_){}}let severity='ok';for(const h of hits)if(RANK[h.severity]>RANK[severity])severity=h.severity;return{hits,severity,excluded:false}}
function prepareDerived(){const bars=new Map();for(const r of state.rows){r._duplicateBarcode=false;r._minority=null;if(!excludedByRules(r)&&r.barcode){const a=bars.get(r.barcode)||[];a.push(r);bars.set(r.barcode,a)}}for(const a of bars.values())if(a.length>1)a.forEach(r=>r._duplicateBarcode=true);for(const field of ['item_type','collection','location']){const groups=new Map(),others=['item_type','collection','location'].filter(x=>x!==field);for(const r of state.rows){if(excludedByRules(r))continue;const key=[r.biblio_id,r.home,...others.map(k=>r[k]||'__EMPTY__')].join('|'),a=groups.get(key)||[];a.push(r);groups.set(key,a)}for(const a of groups.values()){if(a.length<state.settings.minorityMinItems)continue;const counts=new Map();for(const r of a){const v=r[field]||'__EMPTY__';counts.set(v,(counts.get(v)||0)+1)}const sorted=[...counts.entries()].sort((x,y)=>y[1]-x[1]);if(sorted.length<2)continue;const [major,n]=sorted[0],pct=Math.round(n/a.length*100);if(pct<state.settings.minorityMajorityPct)continue;for(const r of a)if(!r._minority&&(r[field]||'__EMPTY__')!==major)r._minority={field,major,pct,scope:'notice+site+champs homogènes'}}}}
function classified(){return state.rows.map(r=>{r._deep=state.deep.get(r.id)||r._deep;return Object.assign(r,{_q:evaluate(r)})})}function filtered(){let a=classified();const q=state.search.trim().toLowerCase();if(q)a=a.filter(r=>[r.barcode,r.title,r.callnumber,r.id,r.biblio_id].some(v=>String(v??'').toLowerCase().includes(q)));if(state.severity)a=a.filter(r=>r._q.severity===state.severity);if(state.home)a=a.filter(r=>r.home===state.home);if(state.holding)a=a.filter(r=>r.holding===state.holding);if(state.type)a=a.filter(r=>r.item_type===state.type);if(state.statusFilter)a=a.filter(r=>state.statusFilter==='lost'?r.lost>0:state.statusFilter==='damaged'?r.damaged>0:state.statusFilter==='withdrawn'?r.withdrawn>0:state.statusFilter==='nfl'?r.nfl!==0:true);return a}
function setStatus(t,c=''){const e=$('dqi-status');if(!e)return;e.className='dqi-status visible '+c;e.textContent=t}function badge(s){return`<span class="dqi-badge ${s}">${s==='critical'?'Critique':s==='review'?'À vérifier':s==='atypical'?'Atypique':'Conforme'}</span>`}
function shell(){root.innerHTML=`<div class="dqi-hero"><div><small>QUALITÉ KOHA · EXEMPLAIRES</small><h2>Maintenance des exemplaires</h2><p>Intégrité, états figés, cohérence notice/exemplaires et préparation des traitements de masse.</p></div><div class="dqi-actions"><button id="dqi-load" class="btn btn-primary">Charger les exemplaires</button><button id="dqi-stop" class="btn btn-default">Arrêter</button></div></div><div id="dqi-status" class="dqi-status"></div><div class="dqi-steps">${[['overview','1','Vue générale'],['anomalies','2','Anomalies'],['explore','3','Exploration'],['batch','4','Traitements'],['rules','5','Règles'],['memory','6','Mémoire']].map(x=>`<button class="dqi-step" data-tab="${x[0]}"><strong>${x[1]} · ${x[2]}</strong><small>${x[0]==='batch'?'simulation obligatoire':'analyse locale'}</small></button>`).join('')}</div><div id="dqi-content"></div>`;root.querySelectorAll('.dqi-step').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.page=1;render()});$('dqi-load').onclick=()=>loadAll();$('dqi-stop').onclick=()=>{state.stop=true;setStatus('Arrêt demandé après la requête en cours.','ok')};render()}
function toolbar(){const uniq=k=>[...new Set(state.rows.map(r=>r[k]).filter(Boolean))].sort();return`<div class="dqi-toolbar"><input id="f-q" placeholder="Code-barres, titre, cote, ID…" value="${esc(state.search)}"><select id="f-sev"><option value="">Toutes sévérités</option>${['critical','review','atypical','ok'].map(x=>`<option ${state.severity===x?'selected':''} value="${x}">${x}</option>`).join('')}</select><select id="f-home"><option value="">Tous propriétaires</option>${uniq('home').map(x=>`<option ${state.home===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="f-hold"><option value="">Tous détenteurs</option>${uniq('holding').map(x=>`<option ${state.holding===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="f-type"><option value="">Tous types</option>${uniq('item_type').map(x=>`<option ${state.type===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="f-status"><option value="">Tous états</option>${[['lost','Perdu'],['damaged','Endommagé'],['withdrawn','Retiré'],['nfl','Non prêtable']].map(([v,l])=>`<option value="${v}" ${state.statusFilter===v?'selected':''}>${l}</option>`).join('')}</select></div>`}
function bindToolbar(){[['f-q','search'],['f-sev','severity'],['f-home','home'],['f-hold','holding'],['f-type','type'],['f-status','statusFilter']].forEach(([id,k])=>$(id)?.addEventListener(id==='f-q'?'input':'change',e=>{state[k]=e.target.value;state.page=1;render()}))}
function stats(){const a=classified(),n=s=>a.filter(r=>r._q.severity===s).length;return`<div class="dqi-stats"><div class="dqi-stat"><span>Chargés</span><strong>${fmt(a.length)}</strong></div><div class="dqi-stat"><span>Critiques</span><strong>${fmt(n('critical'))}</strong></div><div class="dqi-stat"><span>À vérifier</span><strong>${fmt(n('review'))}</strong></div><div class="dqi-stat"><span>Atypiques</span><strong>${fmt(n('atypical'))}</strong></div><div class="dqi-stat"><span>Approfondis</span><strong>${fmt(state.deep.size)}</strong></div></div>`}
function fbButtons(id,rule){return `<span class="dqi-actions"><button class="btn btn-default btn-xs fb" data-id="${id}" data-rule="${rule}" data-d="anomaly">Anomalie</button><button class="btn btn-default btn-xs fb" data-id="${id}" data-rule="${rule}" data-d="normal">Normal</button><button class="btn btn-default btn-xs fb" data-id="${id}" data-rule="${rule}" data-d="watch">Surveiller</button></span>`}function table(rows,select=true){return`<div class="dqi-table-wrap"><table class="dqi-table"><thead><tr>${select?'<th></th>':''}<th>Exemplaire</th><th>Notice</th><th>Sites</th><th>Type / collection</th><th>États</th><th>Dernière vue</th><th>Diagnostic</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr>${select?`<td><input class="sel" type="checkbox" value="${r.id}" ${state.selected.has(String(r.id))?'checked':''}></td>`:''}<td><strong>${esc(r.barcode||'#'+r.id)}</strong><br><span class="dqi-note">#${r.id} · ${esc(r.callnumber||'sans cote')}</span></td><td>${esc(r.title||'Notice #'+r.biblio_id)}<br><span class="dqi-note">#${r.biblio_id}</span></td><td>${esc(r.home||'—')} → ${esc(r.holding||'—')}</td><td>${esc(r.item_type||'—')} · ${esc(r.collection||'—')}<br>${esc(r.location||'—')}${r._minority?`<br><span class="dqi-badge atypical">minoritaire ${esc(r._minority.field)} (${r._minority.pct}% ${esc(r._minority.major)})</span>`:''}</td><td>${r.lost?`<span class="dqi-badge review">perdu ${r.lost}</span>`:''}${r.damaged?`<span class="dqi-badge atypical">endommagé ${r.damaged}</span>`:''}${r.withdrawn?`<span class="dqi-badge review">retiré</span>`:''}${r.nfl?`<span class="dqi-badge atypical">NPL ${r.nfl}</span>`:''}${!r.lost&&!r.damaged&&!r.withdrawn&&!r.nfl?'—':''}</td><td>${esc(r.last_seen||'—')}<br><span class="dqi-note">${days(r.last_seen)==null?'':days(r.last_seen)+' j'}</span></td><td>${r._q.excluded?'<span class="dqi-badge ok">Exclu des règles</span>':badge(r._q.severity)}${r._q.hits.map(h=>`<div><code>${h.id}</code> ${esc(h.title)}${fbButtons(r.id,h.id)}</div>`).join('')||'—'}<div class="dqi-note">Appréciation globale</div>${fbButtons(r.id,'DOSSIER')}</td><td><a class="btn btn-default btn-xs" target="_blank" href="/cgi-bin/koha/catalogue/moredetail.pl?biblionumber=${r.biblio_id}&itemnumber=${r.id}">Voir</a>${r._deep?' <span class="dqi-badge ok">profond</span>':''}</td></tr>`).join('')}</tbody></table></div>`}function bindRows(){root.querySelectorAll('.sel').forEach(x=>x.onchange=()=>{x.checked?state.selected.add(x.value):state.selected.delete(x.value)});root.querySelectorAll('.fb').forEach(b=>b.onclick=()=>sendFeedback(b.dataset.id,b.dataset.rule,b.dataset.d))}
function paginate(a){const pages=Math.max(1,Math.ceil(a.length/CFG.PAGE));state.page=Math.min(state.page,pages);const start=(state.page-1)*CFG.PAGE;return{rows:a.slice(start,start+CFG.PAGE),pages}}
function pager(p){return`<div class="dqi-pager"><button class="btn btn-default btn-sm" id="prev" ${state.page<=1?'disabled':''}>Précédent</button><span>Page ${state.page}/${p.pages}</span><button class="btn btn-default btn-sm" id="next" ${state.page>=p.pages?'disabled':''}>Suivant</button></div>`}
function render(){root.querySelectorAll('.dqi-step').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab));if(state.tab==='overview')renderOverview();else if(state.tab==='anomalies')renderAnomalies();else if(state.tab==='explore')renderExplore();else if(state.tab==='batch')renderBatch();else if(state.tab==='rules')renderRules();else renderMemory()}
function renderOverview(){const a=classified();$('dqi-content').innerHTML=`${stats()}<div class="dqi-card"><h3>Principe</h3><p>Le chargement global utilise l'API REST Koha en pages de ${CFG.PER_PAGE}, strictement séquencées. Les contrôles relationnels (prêt, transfert, réservation, litige) ne sont chargés que pour une sélection.</p></div><div class="dqi-grid"><div class="dqi-card"><strong>Perdus anciens</strong><div>${fmt(a.filter(r=>r.lost>0&&days(r.lost_date)>=state.settings.lostReviewDays).length)}</div></div><div class="dqi-card"><strong>Retirés anciens</strong><div>${fmt(a.filter(r=>r.withdrawn>0&&days(r.withdrawn_date)>=state.settings.withdrawnReviewDays).length)}</div></div><div class="dqi-card"><strong>Jamais vus ≥ 5 ans</strong><div>${fmt(a.filter(r=>days(r.last_seen)>=state.settings.lastSeenReviewDays).length)}</div></div><div class="dqi-card"><strong>Codes-barres dupliqués</strong><div>${fmt(a.filter(r=>r._duplicateBarcode).length)}</div></div><div class="dqi-card"><strong>Minorités notice</strong><div>${fmt(a.filter(r=>r._minority).length)}</div></div></div>`}
function renderAnomalies(){const a=filtered(),p=paginate(a);$('dqi-content').innerHTML=`${toolbar()}${stats()}<div class="dqi-selection"><div><button id="sel-page" class="btn btn-default btn-sm">Sélectionner page</button> <button id="sel-filter" class="btn btn-default btn-sm">Sélectionner résultats</button> <button id="sel-clear" class="btn btn-default btn-sm">Vider</button></div><strong>${fmt(state.selected.size)} sélectionné(s)</strong></div>${table(p.rows)}${pager(p)}`;bindToolbar();bindRows();$('prev').onclick=()=>{state.page--;renderAnomalies()};$('next').onclick=()=>{state.page++;renderAnomalies()};$('sel-page').onclick=()=>{p.rows.forEach(r=>state.selected.add(String(r.id)));renderAnomalies()};$('sel-filter').onclick=()=>{a.forEach(r=>state.selected.add(String(r.id)));renderAnomalies()};$('sel-clear').onclick=()=>{state.selected.clear();renderAnomalies()}}
function fingerprint(r){return[`sev:${r._q.severity}`,`lost:${r.lost>0}`,`damaged:${r.damaged>0}`,`withdrawn:${r.withdrawn>0}`,`nfl:${r.nfl!==0}`,`homeHold:${r.home===r.holding}`,`seen:${bucket(days(r.last_seen))}`,`type:${r.item_type||'none'}`].join('|')}
function renderExplore(){const m=new Map();for(const r of classified()){const k=fingerprint(r),g=m.get(k)||{k,n:0,sample:r};g.n++;m.set(k,g)}const groups=[...m.values()].sort((a,b)=>a.n-b.n);$('dqi-content').innerHTML=`<div class="dqi-head"><div><h3>3 · Situations atypiques</h3><p>Empreintes d'état rares : elles servent à découvrir des cas auxquels aucune règle n'avait encore pensé.</p></div></div><div class="dqi-card">${groups.slice(0,100).map(g=>`<div class="dqi-pattern"><div><code>${esc(g.k)}</code><br><span class="dqi-note">Exemple local : ${esc(g.sample.barcode||'#'+g.sample.id)}</span></div><strong>${fmt(g.n)}</strong></div>`).join('')||'Charge les exemplaires.'}</div>`}
async function deepAnalyze(){const ids=[...state.selected].slice(0,CFG.DEEP_MAX);if(!ids.length)return alert('Sélectionne des exemplaires.');if(state.selected.size>CFG.DEEP_MAX&&!confirm(`Limiter l'analyse approfondie aux ${CFG.DEEP_MAX} premiers exemplaires ?`))return;let done=0;for(const id of ids){const base=state.rows.find(r=>String(r.id)===String(id));if(!base)continue;try{const u=new URL(`/api/v1/biblios/${base.biblio_id}/items`,location.origin);u.searchParams.set('q',JSON.stringify({item_id:base.id}));u.searchParams.set('_per_page','10');const resp=await kfetch(u,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json','x-koha-embed':'checkout,transfer,first_hold,return_claims,_status'}});if(!resp.ok)throw new Error(`HTTP ${resp.status}`);const arr=await resp.json(),x=arr.find(z=>Number(z.item_id)===base.id)||arr[0];state.deep.set(base.id,{checkout:x?.checkout||null,transfer:x?.transfer||null,first_hold:x?.first_hold||null,return_claims:Array.isArray(x?.return_claims)?x.return_claims:[]});done++;setStatus(`Analyse approfondie : ${done}/${ids.length}…`,'loading')}catch(e){console.error(e)}}render();setStatus(`Analyse approfondie terminée : ${done} exemplaire(s).`,'ok')}
function renderBatch(){const rows=state.rows.filter(r=>state.selected.has(String(r.id))).map(r=>Object.assign(r,{_q:evaluate(r)}));$('dqi-content').innerHTML=`<div class="dqi-head"><div><h3>4 · Traitements par lot</h3><p>Analyse approfondie, préparation du Batch item modification natif, export et suppression API très verrouillée.</p></div></div><div class="dqi-actions"><button id="deep" class="btn btn-primary">Approfondir la sélection</button><button id="native-mod" class="btn btn-default">Préparer modification par lot Koha</button><button id="export" class="btn btn-default">Exporter CSV</button><button id="sim-del" class="btn btn-danger" ${state.settings.allowApiDelete?'':'disabled'}>Simuler suppression</button></div>${!state.settings.allowApiDelete?"<div class='dqi-info'>La suppression API est désactivée par défaut. Elle ne doit être activée qu'après validation des règles métier ; Koha bloque de toute façon prêt, réservation, analytique et dernier exemplaire réservé.</div>":''}${state.simulation?renderSimulation():''}${table(rows.slice(0,100))}`;bindRows();$('deep').onclick=deepAnalyze;$('native-mod').onclick=prepareNativeBatch;$('export').onclick=()=>exportCsv(rows);$('sim-del').onclick=simulateDelete}
function prepareNativeBatch(){const rows=state.rows.filter(r=>state.selected.has(String(r.id))),bars=rows.map(r=>r.barcode).filter(Boolean);if(!bars.length)return alert('Aucun code-barres exploitable.');navigator.clipboard.writeText(bars.join('\n')).then(()=>{window.open('/cgi-bin/koha/tools/batchMod.pl','_blank');setStatus(`${bars.length} code(s)-barres copiés. Colle-les dans l'outil natif de modification par lot.`, 'ok')})}
function statusSet(v){return new Set(String(v||'').split(',').map(x=>Number(x.trim())).filter(Number.isFinite))}function terminalEligible(x,d){const lostOk=x.lost>0&&statusSet(state.settings.terminalLostStatuses).has(x.lost)&&days(x.lost_date)>=state.settings.terminalMinDays,withdrawnOk=x.withdrawn>0&&statusSet(state.settings.terminalWithdrawnStatuses).has(x.withdrawn)&&days(x.withdrawn_date)>=state.settings.terminalMinDays;return (lostOk||withdrawnOk)&&!!d&&!d.checkout&&!d.transfer&&!d.first_hold&&!(d.return_claims?.length)}async function fetchItemRelations(x){const u=new URL(`/api/v1/biblios/${x.biblio_id}/items`,location.origin);u.searchParams.set('q',JSON.stringify({item_id:x.id}));u.searchParams.set('_per_page','10');const r=await kfetch(u,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json','x-koha-embed':'checkout,transfer,first_hold,return_claims'}});if(!r.ok)throw new Error(`Relations HTTP ${r.status}`);const a=await r.json(),z=a.find(i=>Number(i.item_id)===x.id);return z?{checkout:z.checkout||null,transfer:z.transfer||null,first_hold:z.first_hold||null,return_claims:Array.isArray(z.return_claims)?z.return_claims:[]}:null}async function simulateDelete(){const ids=[...state.selected];if(!ids.length)return;const eligible=[],changed=[],errors=[];for(const id of ids){try{const resp=await kfetch(`${CFG.ITEMS}/${id}`,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(resp.status===404){changed.push({id,why:'introuvable'});continue}if(!resp.ok)throw new Error(`HTTP ${resp.status}`);const x=nitem(await resp.json()),d=await fetchItemRelations(x);state.deep.set(x.id,d);const q=evaluate(Object.assign(x,{_deep:d}));if(terminalEligible(x,d))eligible.push({x,q});else changed.push({id,why:'statut non terminal, ancienneté insuffisante ou dépendance active'})}catch(e){errors.push({id,e:String(e.message||e)})}}state.simulation={eligible,changed,errors,at:Date.now()};renderBatch()}
function renderSimulation(){const s=state.simulation;return`<div class="dqi-card" style="margin-top:10px"><h4>Simulation suppression</h4><p>${fmt(s.eligible.length)} éligible(s) selon les statuts terminaux, l’ancienneté et l’absence de dépendance · ${fmt(s.changed.length)} bloqué(s) · ${fmt(s.errors.length)} erreur(s).</p><div class="dqi-danger"><strong>Important :</strong> la simulation exige désormais un statut terminal configuré, au moins ${fmt(state.settings.terminalMinDays)} jours et aucun prêt, transfert, réservation ou litige.</div><div class="dqi-actions"><button id="apply-del" class="btn btn-danger">Supprimer les ${fmt(s.eligible.length)} validés</button><button id="clear-sim" class="btn btn-default">Effacer</button></div></div>`}
async function applyDelete(){const s=state.simulation;if(!s?.eligible?.length)return;if(!confirm(`Supprimer réellement ${s.eligible.length} exemplaire(s) ?\n\nKoha sera relu avant chaque DELETE. Opération irréversible.`))return;let ok=0,skip=0,err=0;for(const e of s.eligible){try{const cur=await kfetch(`${CFG.ITEMS}/${e.x.id}`,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(!cur.ok){skip++;continue}const x=nitem(await cur.json()),d=await fetchItemRelations(x);if(!terminalEligible(x,d)){skip++;continue}const del=await kfetch(`${CFG.ITEMS}/${x.id}`,{method:'DELETE',credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(del.status===204)ok++;else if(del.status===409)skip++;else throw new Error(`HTTP ${del.status}`)}catch(e){console.error(e);err++}setStatus(`Suppression : ${ok} OK · ${skip} ignoré(s) · ${err} erreur(s)…`,'loading')}state.selected.clear();state.simulation=null;await loadAll(true);setStatus(`Suppression terminée : ${ok} OK · ${skip} ignoré(s) · ${err} erreur(s).`,err?'error':'ok')}
function ruleHelp(r){return `<strong>Détecte :</strong> ${esc(r.title)}. <strong>Ce que cela ne prouve pas :</strong> ce signal seul ne démontre ni une erreur ni l’action à effectuer. <strong>Contrôle attendu :</strong> contrôler la notice, les états, les sites et les dépendances actives de l’exemplaire.${r.deep?' Cette règle ne s’active qu’après l’analyse approfondie.':''}`}
function renderRules(){const s=state.settings;$('dqi-content').innerHTML=`<div class="dqi-head"><div><h3>5 · Règles et source</h3><p><strong>Source :</strong> API REST Koha des exemplaires, chargée uniquement sur demande. Seuils locaux. Ils peuvent ensuite être partagés via Firebase.</p></div></div><div class="dqi-card"><table class="dqi-table"><tbody>${[['lastSeenAtypicalDays','Dernière vue atypique (jours)'],['lastSeenReviewDays','Dernière vue à vérifier (jours)'],['lostReviewDays','Perdu ancien (jours)'],['damagedReviewDays','Endommagé ancien (jours)'],['withdrawnReviewDays','Retiré ancien (jours)'],['minorityMinItems','Minimum exemplaires pour majorité'],['minorityMajorityPct','Majorité minimum (%)'],['terminalMinDays','Ancienneté minimale d’un statut terminal']].map(([k,l])=>`<tr><td>${l}</td><td><input class="setting" data-k="${k}" type="number" min="0" value="${Number(s[k])||0}"></td></tr>`).join('')}<tr><td>Codes perdu terminaux</td><td><input id="terminal-lost" value="${esc(s.terminalLostStatuses)}" placeholder="2,3"></td></tr><tr><td>Codes retiré terminaux</td><td><input id="terminal-withdrawn" value="${esc(s.terminalWithdrawnStatuses)}" placeholder="1"></td></tr>${[['excludeHomeLibraries','Sites propriétaires exclus'],['excludeHoldingLibraries','Sites détenteurs exclus'],['excludeLocations','Localisations exclues'],['excludePermanentLocations','Sous-localisations / localisations permanentes exclues'],['excludeCollections','Codes collection (ccode) exclus']].map(([k,l])=>`<tr><td>${l}</td><td><input class="exclusion" data-k="${k}" value="${esc(s[k]||'')}" placeholder="Codes séparés par virgules"><div class="dqi-note">Ces exemplaires restent visibles, mais ne déclenchent aucune règle.</div></td></tr>`).join('')}<tr><td>Autoriser suppression API</td><td><input id="allow-delete" type="checkbox" style="width:auto" ${s.allowApiDelete?'checked':''}></td></tr></tbody></table><div class="dqi-actions"><button id="save" class="btn btn-primary">Enregistrer</button><button id="publish" class="btn btn-default">Publier seuils Firebase</button></div></div><div class="dqi-card"><h4>${RULES.length} règles système</h4>${RULES.map(r=>`<div style="margin:8px 0"><code>${r.id}</code> ${badge(r.severity)} ${esc(r.title)}<div class="dqi-note">${ruleHelp(r)}</div></div>`).join('')}</div>`;$('save').onclick=saveSettings;$('publish').onclick=publishSettings}
function saveSettings(){root.querySelectorAll('.setting').forEach(i=>state.settings[i.dataset.k]=Math.max(0,Number(i.value)||0));root.querySelectorAll('.exclusion').forEach(i=>state.settings[i.dataset.k]=i.value.trim());state.settings.terminalLostStatuses=$('terminal-lost').value.trim();state.settings.terminalWithdrawnStatuses=$('terminal-withdrawn').value.trim();state.settings.allowApiDelete=$('allow-delete').checked;localStorage.setItem(CFG.SETTINGS_KEY,JSON.stringify(state.settings));prepareDerived();renderRules();setStatus('Paramètres enregistrés.','ok')}
async function publishSettings(){saveSettings();const m=window.KohaQualityMemory;if(!m)return setStatus('Mémoire Firebase absente.','error');const st=await m.connect(CFG.MODULE);if(st.role!=='admin')return setStatus('Rôle admin Firebase requis.','error');await m.saveSettings(CFG.MODULE,state.settings);setStatus('Seuils publiés.','ok')}
function feedbackContext(r,ruleId){const hit=r._q.hits.find(h=>h.id===ruleId);return{primary_rule:ruleId||'DOSSIER',severity:hit?.severity||r._q.severity,nature:ruleId==='DOSSIER'?'case':'item_quality',certainty:window.KohaQualityMemory?.isInvariantRule?.(ruleId)?'certain':'context_dependent',priority:r._q.severity,home_library_id:r.home||'none',holding_library_id:r.holding||'none',item_type_id:r.item_type||'none',collection_code:r.collection||'none',location:r.location||'none',last_seen_bucket:bucket(days(r.last_seen)),last_checkout_bucket:bucket(days(r.last_checkout)),item_lost:r.lost>0,item_damaged:r.damaged>0,item_withdrawn:r.withdrawn>0,item_not_for_loan:r.nfl!==0,holding_mismatch:!!(r.home&&r.holding&&r.home!==r.holding),has_transfer:!!r._deep?.transfer,checkout_state:r._deep?.checkout?'active':'none',has_hold:!!r._deep?.first_hold,has_return_claim:(r._deep?.return_claims?.length||0)>0}}
async function sendFeedback(id,ruleId,decision){const r=classified().find(x=>String(x.id)===String(id)),m=window.KohaQualityMemory;if(!r||!m)return setStatus('Mémoire Firebase non disponible.','error');try{const z=await m.submitFeedback({module:CFG.MODULE,ruleId:ruleId||'DOSSIER',decision,context:feedbackContext(r,ruleId)});setStatus(z.queued?'Retour mis en file locale.':`Retour enregistré pour ${ruleId||'le dossier'}.`,'ok')}catch(e){setStatus(e.message,'error')}}
function renderMemory(){const st=window.KohaQualityMemory?.getStatus?.()||state.memoryStatus||{status:'absent'};$('dqi-content').innerHTML=`<div class="dqi-head"><div><h3>6 · Mémoire Firebase du module</h3><p>Firebase ne reçoit jamais code-barres, titre, cote, ItemID ou BiblioID. Uniquement états abstraits et codes de configuration non personnels.</p></div></div><div class="dqi-grid"><div class="dqi-card"><strong>État</strong><div>${esc(st.status||'absent')}</div></div><div class="dqi-card"><strong>Autorisé</strong><div>${st.approved?'Oui':'Non'}</div></div><div class="dqi-card"><strong>Rôle</strong><div>${esc(st.role||'—')}</div></div></div>`}
async function loadMemory(){if(!window.KohaQualityMemory){try{await new Promise((ok,ko)=>{const s=document.createElement('script');s.src=CFG.MEMORY;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}catch(_){return}}try{const m=window.KohaQualityMemory,st=await m.connect(CFG.MODULE);state.memoryStatus=st;if(st.approved){const remote=await m.getSettings(CFG.MODULE);if(remote&&Object.keys(remote).length){state.settings={...state.settings,...remote};localStorage.setItem(CFG.SETTINGS_KEY,JSON.stringify(state.settings))}}}catch(_){}}
async function loadAll(silent=false){if(state.loading)return;state.loading=true;state.stop=false;if(!silent)setStatus('Lecture des exemplaires via API Koha…','loading');const rows=[];let page=1;try{while(!state.stop){const u=new URL(CFG.ITEMS,location.origin);u.searchParams.set('_page',page);u.searchParams.set('_per_page',CFG.PER_PAGE);u.searchParams.set('_order_by','item_id');const resp=await kfetch(u,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json','x-koha-embed':'biblio'}});if(!resp.ok)throw new Error(`API items HTTP ${resp.status}`);const arr=await resp.json();rows.push(...arr.map(nitem));if(!silent)setStatus(`Exemplaires reçus : ${fmt(rows.length)} · page ${page}…`,'loading');if(arr.length<CFG.PER_PAGE)break;page++}state.rows=rows;prepareDerived();populate();render();if(!silent)setStatus(`${fmt(rows.length)} exemplaires chargés${state.stop?' (arrêt demandé)':''}.`,'ok')}catch(e){console.error(e);setStatus(e.message,'error')}finally{state.loading=false}}
function populate(){/* Les listes sont recalculées directement depuis state.rows. */}
function exportCsv(custom){const rows=custom||filtered(),head=['item_id','biblio_id','barcode','title','home','holding','item_type','collection','location','callnumber','last_seen','last_checkout','lost','damaged','withdrawn','not_for_loan','severity','rules'];const out=[head.join(';')];for(const r of rows){const q=evaluate(r),vals=[r.id,r.biblio_id,r.barcode,r.title,r.home,r.holding,r.item_type,r.collection,r.location,r.callnumber,r.last_seen,r.last_checkout,r.lost,r.damaged,r.withdrawn,r.nfl,q.severity,q.hits.map(x=>x.id).join(',')];out.push(vals.map(csv).join(';'))}download(out.join('\r\n'),'qualite-exemplaires.csv')}
function csv(v){const s=String(v??'');return/[;"\r\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s}function download(text,name){const a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',e=>{if(e.target?.id==='apply-del')applyDelete();if(e.target?.id==='clear-sim'){state.simulation=null;renderBatch()}});shell();loadMemory();
})();
</script>
