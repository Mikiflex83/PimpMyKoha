<script>
(function(){

if(window.__dracQualityBibliosV1)return;window.__dracQualityBibliosV1=true;
const CFG={MODULE:'biblios',VERSION:'1.5.0',API:'/api/v1/biblios',SVC:'/cgi-bin/koha/svc/report',MEMORY:'__KOHATOOLS_ASSET_ROOT__apps/quality/shared/quality-memory-firebase.js?ktv=3.44.0',SETTINGS_KEY:'dq_biblios_settings_v1',PAGE:50,PER_PAGE:500,MIN_GAP:250,AUDIT_MAX:500,BNF_MAX:50,DEFAULTS:{duplicateTitleThreshold:100,signatureReportId:Number(window.KohaTools?.Config?.getCanonical?.('quality-biblios')?.installation?.reports?.signaturesId||0),allowMerge:false,enableBnf:true}};
const root=document.getElementById('dqb-app');if(!root)return;const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),fmt=v=>new Intl.NumberFormat('fr-FR').format(Number(v)||0),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tail=Promise.resolve(),lastEnd=0;function kfetch(url,opt={}){const job=tail.catch(()=>{}).then(async()=>{const w=Math.max(0,CFG.MIN_GAP-(Date.now()-lastEnd));if(w)await sleep(w);try{return await fetch(url,opt)}finally{lastEnd=Date.now()}});tail=job.catch(()=>{});return job}
function loadSettings(){try{return {...CFG.DEFAULTS,...JSON.parse(localStorage.getItem(CFG.SETTINGS_KEY)||'{}')}}catch(_){return {...CFG.DEFAULTS}}}const state={rows:[],tab:'overview',page:1,search:'',severity:'',duplicate:'',selected:new Set(),settings:loadSettings(),loading:false,stop:false,audits:new Map(),duplicates:new Map(),simulation:null,bnf:new Map(),memoryStatus:null};const RANK={ok:0,atypical:1,review:2,critical:3};
function fold(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim()}function cleanIdentifier(s){return String(s||'').toUpperCase().replace(/[^0-9X]/g,'')}function splitIds(v){return String(v||'').split(/[;,|]/).map(x=>x.trim()).filter(Boolean)}function normBasic(o){return{id:Number(o.biblio_id),title:o.title||'',author:o.author||'',isbn:o.isbn||'',issn:o.issn||'',year:o.publication_year||o.copyright_date||'',framework:o.framework_id||o.framework_code||'',timestamp:o.timestamp||null,raw:o}}
function normSignature(o){const g=(...ks)=>{for(const k of ks)if(o[k]!==undefined&&o[k]!==null)return o[k];return''};return{id:Number(g('Biblio_ID','biblio_id','biblionumber')),title:g('Title','title'),author:g('Author','author'),isbn:g('ISBN','isbn'),issn:g('ISSN','issn'),year:g('Publication_Year','publication_year','copyright_date'),framework:g('Framework','framework_id','framework_code'),timestamp:g('Modified','timestamp'),raw:o}}
function marcNormalize(data){if(!data||typeof data!=='object')return{leader:'',fields:[]};if(Array.isArray(data.fields))return{leader:data.leader||'',fields:data.fields};if(data.record&&Array.isArray(data.record.fields))return{leader:data.record.leader||'',fields:data.record.fields};return{leader:data.leader||'',fields:[]}}
function marcFields(m,tag){return(m.fields||[]).flatMap(f=>Object.prototype.hasOwnProperty.call(f,tag)?[f[tag]]:[])}function subvals(field,code){if(field==null)return[];if(typeof field==='string')return[];return(field.subfields||[]).flatMap(s=>Object.prototype.hasOwnProperty.call(s,code)?[String(s[code]??'')]:[])}function values(m,tag,code){return marcFields(m,tag).flatMap(f=>subvals(f,code))}function control(m,tag){const f=marcFields(m,tag)[0];return typeof f==='string'?f:''}function has(m,tag){return marcFields(m,tag).length>0}
function isbnValid(s){const x=cleanIdentifier(s);if(x.length===10){let sum=0;for(let i=0;i<10;i++){const d=x[i]==='X'?10:Number(x[i]);if(!Number.isFinite(d))return false;sum+=(10-i)*d}return sum%11===0}if(x.length===13){let sum=0;for(let i=0;i<13;i++){const d=Number(x[i]);if(!Number.isFinite(d))return false;sum+=d*(i%2?3:1)}return sum%10===0}return false}function issnValid(s){const x=cleanIdentifier(s);if(x.length!==8)return false;let sum=0;for(let i=0;i<8;i++){const d=x[i]==='X'?10:Number(x[i]);if(!Number.isFinite(d))return false;sum+=(8-i)*d}return sum%11===0}
function duplicateFields(m){const seen=new Set(),dups=[];for(const f of m.fields||[]){const k=JSON.stringify(f);if(seen.has(k))dups.push(f);seen.add(k)}return dups.length}function emptySubfields(m){let n=0;for(const f of m.fields||[])for(const v of Object.values(f)){if(v&&typeof v==='object')for(const s of v.subfields||[])for(const x of Object.values(s))if(String(x??'').trim()==='')n++}return n}function linkedNameFieldsMissing3(m){const tags=['700','701','702','710','711','712'];let n=0;for(const t of tags)for(const f of marcFields(m,t))if(subvals(f,'a').some(Boolean)&&!subvals(f,'3').some(Boolean))n++;return n}function links4xxMissing3(m){let n=0;for(const fObj of m.fields||[])for(const [tag,f] of Object.entries(fObj)){if(/^4\d\d$/.test(tag)&&f&&typeof f==='object'&&subvals(f,'t').some(Boolean)&&!subvals(f,'3').some(Boolean))n++}return n}function invalidUrls(m){return values(m,'856','u').filter(u=>{try{const x=new URL(u);return !['http:','https:'].includes(x.protocol)}catch(_){return true}}).length}
function normSet(a,clean=fold){return[...new Set(a.map(clean).filter(Boolean))].sort()}function overlap(a,b){return a.some(x=>b.includes(x))}function marcShape(m){const leader=String(m.leader||''),hierarchy=['461','462','463','464','481','482'].some(t=>has(m,t));return{recordType:leader[6]||'',level:leader[7]||'',title:normSet([...values(m,'200','a'),...values(m,'200','e'),...values(m,'200','h'),...values(m,'200','i')]),edition:normSet(values(m,'205','a')),publication:normSet([...values(m,'210','a'),...values(m,'210','c'),...values(m,'210','d'),...values(m,'214','a'),...values(m,'214','c'),...values(m,'214','d')]),physical:normSet([...values(m,'215','a'),...values(m,'215','c'),...values(m,'215','d'),...values(m,'215','e')]),language:normSet(values(m,'101','a')),support:normSet(values(m,'200','b')),isbn:normSet(values(m,'010','a'),cleanIdentifier),issn:normSet(values(m,'011','a'),cleanIdentifier),local:normSet([...marcFields(m,'099'),...marcFields(m,'999')].map(x=>JSON.stringify(x)),x=>x),electronic:has(m,'856'),hierarchy,serial:leader[7]==='s'}}
function mergeCompatibility(master,source){const a=marcShape(master),b=marcShape(source),why=[];if(!a.recordType||!a.level||!b.recordType||!b.level)why.push('leader incomplet');if(a.recordType!==b.recordType)why.push('type de notice différent');if(a.level!==b.level)why.push('niveau bibliographique différent');if(a.serial||b.serial)why.push('publication en série exclue');if(a.hierarchy||b.hierarchy)why.push('notice hiérarchique/multipartie exclue');if(a.electronic||b.electronic)why.push('ressource électronique exclue');if(!a.title.length||!b.title.length)why.push('titre MARC absent');for(const [k,label] of [['title','titre'],['edition','édition'],['publication','publication/année'],['physical','description matérielle'],['language','langue'],['support','support']])if(a[k].length&&b[k].length&&!overlap(a[k],b[k]))why.push(`${label} contradictoire`);if(JSON.stringify(a.local)!==JSON.stringify(b.local))why.push('champs locaux différents');if(a.isbn.length&&b.isbn.length&&!overlap(a.isbn,b.isbn))why.push('ISBN contradictoire');if(a.issn.length&&b.issn.length&&!overlap(a.issn,b.issn))why.push('ISSN contradictoire');return{ok:why.length===0,reasons:why}}
const AUDIT_RULES=[
{id:'BIB-001',title:'001 identifiant de notice absent',severity:'review',test:a=>!control(a.marc,'001')},{id:'BIB-002',title:'100 données générales absentes',severity:'review',test:a=>!has(a.marc,'100')},{id:'BIB-003',title:'200$a titre propre absent',severity:'critical',test:a=>!values(a.marc,'200','a').some(x=>x.trim())},{id:'BIB-004',title:"801 source d'origine absente",severity:'review',test:a=>!has(a.marc,'801')},{id:'BIB-005',title:'210/214 publication absente',severity:'atypical',test:a=>!has(a.marc,'210')&&!has(a.marc,'214')},{id:'BIB-006',title:'ISBN invalide',severity:'review',test:a=>values(a.marc,'010','a').some(x=>!isbnValid(x))},{id:'BIB-007',title:'ISSN invalide',severity:'review',test:a=>values(a.marc,'011','a').some(x=>!issnValid(x))},{id:'BIB-008',title:'Sous-zone vide',severity:'review',test:a=>emptySubfields(a.marc)>0},{id:'BIB-009',title:'Champ MARC strictement dupliqué',severity:'atypical',test:a=>duplicateFields(a.marc)>0},{id:'BIB-010',title:'Auteur/collectivité sans lien $3',severity:'atypical',test:a=>linkedNameFieldsMissing3(a.marc)>0},{id:'BIB-011',title:'Opportunité : lien 4XX sans $3',severity:'atypical',test:a=>links4xxMissing3(a.marc)>0},{id:'BIB-012',title:'URL 856 invalide',severity:'review',test:a=>invalidUrls(a.marc)>0},{id:'BIB-013',title:'Leader absent ou trop court',severity:'critical',test:a=>String(a.marc.leader||'').length<24},{id:'BIB-014',title:'Notice sans exemplaire',severity:'atypical',test:a=>a.item_count===0},{id:'BIB-015',title:'ISBN dupliqué dans la notice',severity:'review',test:a=>{const z=values(a.marc,'010','a').map(cleanIdentifier).filter(Boolean);return new Set(z).size<z.length}},{id:'BIB-016',title:'ISSN dupliqué dans la notice',severity:'review',test:a=>{const z=values(a.marc,'011','a').map(cleanIdentifier).filter(Boolean);return new Set(z).size<z.length}},{id:'BIB-017',title:'Opportunité : résumé 330 absent',severity:'atypical',test:a=>!has(a.marc,'330')},{id:'BIB-018',title:'Opportunité : aucune responsabilité 7XX',severity:'atypical',test:a=>!['700','701','702','710','711','712'].some(t=>has(a.marc,t))}
];
function evalAudit(a){let hits=[];for(const r of AUDIT_RULES){try{if(r.test(a))hits.push(r)}catch(_){}}let severity='ok';for(const h of hits)if(RANK[h.severity]>RANK[severity])severity=h.severity;return{hits,severity}}
function primaryIsbn(r){return splitIds(r.isbn).map(cleanIdentifier).find(x=>isbnValid(x))||''}function dupKey(r){const isbn=primaryIsbn(r);if(isbn)return`isbn:${isbn}`;const t=fold(r.title),a=fold(r.author),y=String(r.year||'').match(/\d{4}/)?.[0]||'';return t&&a&&y?`tay:${t}|${a}|${y}`:''}
function buildDuplicates(){state.duplicates.clear();const m=new Map();for(const r of state.rows){const k=dupKey(r);r._dupKey=k;r._dup=false;if(!k)continue;const a=m.get(k)||[];a.push(r);m.set(k,a)}for(const [k,a] of m)if(a.length>1){state.duplicates.set(k,a);a.forEach(r=>r._dup=true)}}
function qOf(r){const a=state.audits.get(r.id);if(a)return a.q;return r._dup?{severity:'review',hits:[{id:'BIB-DUP',title:'Doublon bibliographique candidat'}]}:{severity:'ok',hits:[]}}
function classified(){return state.rows.map(r=>Object.assign(r,{_q:qOf(r)}))}function filtered(){let a=classified();const q=state.search.trim().toLowerCase();if(q)a=a.filter(r=>[r.id,r.title,r.author,r.isbn,r.issn].some(v=>String(v??'').toLowerCase().includes(q)));if(state.severity)a=a.filter(r=>r._q.severity===state.severity);if(state.duplicate==='yes')a=a.filter(r=>r._dup);if(state.duplicate==='no')a=a.filter(r=>!r._dup);return a}
function setStatus(t,c=''){const e=$('dqb-status');if(!e)return;e.className='dqb-status visible '+c;e.textContent=t}function badge(s){return`<span class="dqb-badge ${s}">${s==='critical'?'Critique':s==='review'?'À vérifier':s==='atypical'?'Atypique':'Conforme'}</span>`}
function shell(){root.innerHTML=`<div class="dqb-hero"><div><small>QUALITÉ KOHA · NOTICES</small><h2>Qualité du catalogue bibliographique</h2><p>Doublons, audit UNIMARC/B, notices fantômes, enrichissement assisté et traitements contrôlés.</p></div><div class="dqb-actions"><button id="load" class="btn btn-primary">Charger les notices</button><button id="stop" class="btn btn-default">Arrêter</button></div></div><div id="dqb-status" class="dqb-status"></div><div class="dqb-steps">${[['overview','1','Vue générale'],['duplicates','2','Doublons'],['audit','3','Audit MARC'],['ghosts','4','Fantômes'],['enrich','5','Enrichissement'],['batch','6','Traitements'],['rules','7','Règles']].map(x=>`<button class="dqb-step" data-tab="${x[0]}"><strong>${x[1]} · ${x[2]}</strong><small>${x[0]==='batch'?'simulation obligatoire':'analyse'}</small></button>`).join('')}</div><div id="dqb-content"></div>`;root.querySelectorAll('.dqb-step').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.page=1;render()});$('load').onclick=()=>loadAll();$('stop').onclick=()=>{state.stop=true;setStatus('Arrêt demandé après la requête en cours.','ok')};render()}
function stats(){const a=classified(),n=s=>a.filter(r=>r._q.severity===s).length;return`<div class="dqb-stats"><div class="dqb-stat"><span>Notices</span><strong>${fmt(a.length)}</strong></div><div class="dqb-stat"><span>Groupes doublons</span><strong>${fmt(state.duplicates.size)}</strong></div><div class="dqb-stat"><span>Auditées MARC</span><strong>${fmt(state.audits.size)}</strong></div><div class="dqb-stat"><span>Critiques</span><strong>${fmt(n('critical'))}</strong></div><div class="dqb-stat"><span>À vérifier</span><strong>${fmt(n('review'))}</strong></div></div>`}
function toolbar(){return`<div class="dqb-toolbar"><input id="fq" placeholder="Titre, auteur, ISBN, BiblioID…" value="${esc(state.search)}"><select id="fs"><option value="">Toutes sévérités</option>${['critical','review','atypical','ok'].map(x=>`<option value="${x}" ${state.severity===x?'selected':''}>${x}</option>`).join('')}</select><select id="fd"><option value="">Doublons et uniques</option><option value="yes" ${state.duplicate==='yes'?'selected':''}>Doublons candidats</option><option value="no" ${state.duplicate==='no'?'selected':''}>Hors doublons</option></select><button id="audit-filter" class="btn btn-default">Auditer résultats</button></div>`}
function bindToolbar(){$('fq').oninput=e=>{state.search=e.target.value;state.page=1;render()};$('fs').onchange=e=>{state.severity=e.target.value;state.page=1;render()};$('fd').onchange=e=>{state.duplicate=e.target.value;state.page=1;render()};$('audit-filter').onclick=()=>{const todo=filtered().filter(r=>!state.audits.has(r.id)).slice(0,CFG.AUDIT_MAX);if(!todo.length)return setStatus('Toutes les notices du filtre actuel ont déjà été auditées dans cette session.','ok');auditRows(todo)}}
function table(rows){return`<div class="dqb-table-wrap"><table class="dqb-table"><thead><tr><th></th><th>Notice</th><th>Identifiants</th><th>Diagnostic</th><th>Audit</th><th></th></tr></thead><tbody>${rows.map(r=>{const a=state.audits.get(r.id),q=r._q;return`<tr><td><input class="sel" type="checkbox" value="${r.id}" ${state.selected.has(String(r.id))?'checked':''}></td><td><strong>${esc(r.title||'(sans titre)')}</strong><br>${esc(r.author||'—')} <span class="dqb-note">· #${r.id} ${esc(r.year||'')}</span></td><td>${r.isbn?`ISBN ${esc(r.isbn)}`:''}${r.issn?`<br>ISSN ${esc(r.issn)}`:''}${r._dup?'<br><span class="dqb-badge review">groupe doublon</span>':''}</td><td>${badge(q.severity)}<br>${q.hits.slice(0,4).map(h=>`<div><code>${h.id}</code> ${esc(h.title)} <button class="btn btn-default btn-xs fb" data-id="${r.id}" data-rule="${h.id}" data-d="anomaly">A</button><button class="btn btn-default btn-xs fb" data-id="${r.id}" data-rule="${h.id}" data-d="normal">N</button></div>`).join('')||'—'}</td><td>${a?`${a.item_count} exemplaire(s)<br><span class="dqb-note">${a.q.hits.length} règle(s)</span>`:'<span class="dqb-note">non audité MARC</span>'}</td><td><a target="_blank" class="btn btn-default btn-xs" href="/cgi-bin/koha/catalogue/detail.pl?biblionumber=${r.id}">Voir</a> <button class="btn btn-default btn-xs one-audit" data-id="${r.id}">Auditer</button><div class="dqb-actions" style="margin-top:3px"><button class="btn btn-default btn-xs fb" data-id="${r.id}" data-rule="DOSSIER" data-d="anomaly">Dossier anomal</button><button class="btn btn-default btn-xs fb" data-id="${r.id}" data-rule="DOSSIER" data-d="normal">Dossier normal</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function bindRows(){root.querySelectorAll('.sel').forEach(x=>x.onchange=()=>{x.checked?state.selected.add(x.value):state.selected.delete(x.value)});root.querySelectorAll('.one-audit').forEach(b=>b.onclick=()=>{const r=state.rows.find(x=>String(x.id)===b.dataset.id);if(r)auditRows([r])});root.querySelectorAll('.fb').forEach(b=>b.onclick=()=>sendFeedback(b.dataset.id,b.dataset.d,b.dataset.rule))}
function paginate(a){const pages=Math.max(1,Math.ceil(a.length/CFG.PAGE));state.page=Math.min(state.page,pages);const start=(state.page-1)*CFG.PAGE;return{rows:a.slice(start,start+CFG.PAGE),pages}}function pager(p){return`<div class="dqb-pager"><button id="prev" class="btn btn-default btn-sm" ${state.page<=1?'disabled':''}>Précédent</button><span>Page ${state.page}/${p.pages}</span><button id="next" class="btn btn-default btn-sm" ${state.page>=p.pages?'disabled':''}>Suivant</button></div>`}
function render(){root.querySelectorAll('.dqb-step').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab));if(state.tab==='overview')renderOverview();else if(state.tab==='duplicates')renderDuplicates();else if(state.tab==='audit')renderAudit();else if(state.tab==='ghosts')renderGhosts();else if(state.tab==='enrich')renderEnrich();else if(state.tab==='batch')renderBatch();else renderRules()}
function renderOverview(){$('dqb-content').innerHTML=`${stats()}<div class="dqb-info"><strong>UNIMARC/B :</strong> l'audit traite 001, 100, 200$a et 801 comme éléments obligatoires du format d'échange ; les contrôles plus dépendants du type de document restent volontairement en classe « atypique » ou « à vérifier ».</div><div class="dqb-grid"><div class="dqb-card"><strong>Doublons par ISBN / signature</strong><div>${fmt([...state.duplicates.values()].reduce((n,a)=>n+a.length,0))}</div></div><div class="dqb-card"><strong>Notices sans exemplaire auditées</strong><div>${fmt([...state.audits.values()].filter(a=>a.item_count===0).length)}</div></div><div class="dqb-card"><strong>ISBN invalides audités</strong><div>${fmt([...state.audits.values()].filter(a=>a.q.hits.some(h=>h.id==='BIB-006')).length)}</div></div><div class="dqb-card"><strong>Liens auteurs à améliorer</strong><div>${fmt([...state.audits.values()].filter(a=>a.q.hits.some(h=>h.id==='BIB-010')).length)}</div></div><div class="dqb-card"><strong>Résumé absent</strong><div>${fmt([...state.audits.values()].filter(a=>a.q.hits.some(h=>h.id==='BIB-017')).length)}</div></div></div>`}
function renderAudit(){const a=filtered(),p=paginate(a);$('dqb-content').innerHTML=`${toolbar()}${stats()}<div class="dqb-selection"><div><button id="sel-page" class="btn btn-default btn-sm">Sélectionner page</button> <button id="sel-filter" class="btn btn-default btn-sm">Sélectionner résultats</button> <button id="clear" class="btn btn-default btn-sm">Vider</button></div><strong>${fmt(state.selected.size)} sélectionné(s)</strong></div>${table(p.rows)}${pager(p)}`;bindToolbar();bindRows();$('prev').onclick=()=>{state.page--;renderAudit()};$('next').onclick=()=>{state.page++;renderAudit()};$('sel-page').onclick=()=>{p.rows.forEach(r=>state.selected.add(String(r.id)));renderAudit()};$('sel-filter').onclick=()=>{a.forEach(r=>state.selected.add(String(r.id)));renderAudit()};$('clear').onclick=()=>{state.selected.clear();renderAudit()}}
function renderDuplicates(){const groups=[...state.duplicates.entries()];$('dqb-content').innerHTML=`<div class="dqb-head"><div><h3>2 · Doublons bibliographiques</h3><p>Groupes construits par ISBN valide exact ; à défaut, titre + auteur + année normalisés. Aucun groupe n'est fusionné automatiquement.</p></div></div>${groups.length?groups.slice(0,500).map(([k,a])=>`<div class="dqb-card" style="margin-bottom:8px"><div class="dqb-head"><div><code>${esc(k.slice(0,120))}</code><br><strong>${a.length} notices</strong></div><button class="btn btn-default btn-sm select-group" data-k="${esc(k)}">Sélectionner groupe</button></div>${a.map(r=>`#${r.id} · ${esc(r.title)} · ${esc(r.author||'—')} · ${esc(r.isbn||r.issn||'sans identifiant')}`).join('<br>')}</div>`).join(''):'<div class="dqb-info">Aucun groupe candidat dans les notices chargées.</div>'}`;root.querySelectorAll('.select-group').forEach(b=>b.onclick=()=>{const a=state.duplicates.get(b.dataset.k)||[];a.forEach(r=>state.selected.add(String(r.id)));state.tab='batch';render()})}
function renderGhosts(){const rows=classified().filter(r=>state.audits.get(r.id)?.item_count===0);$('dqb-content').innerHTML=`<div class="dqb-head"><div><h3>4 · Notices sans exemplaire</h3><p>Une notice sans exemplaire n'est pas automatiquement inutile : périodique, ressource électronique, commande, réservation ou usage local peuvent la justifier. Aucune suppression automatique dans cette vue.</p></div></div>${table(rows.slice(0,500))}`;bindRows()}
async function fetchMarc(id){const r=await kfetch(`${CFG.API}/${id}`,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/marc-in-json'}});if(!r.ok)throw new Error(`MARC #${id} HTTP ${r.status}`);return marcNormalize(await r.json())}async function itemCount(id){const u=new URL(`${CFG.API}/${id}/items`,location.origin);u.searchParams.set('_page','1');u.searchParams.set('_per_page','1');const r=await kfetch(u,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)return null;const total=r.headers.get('x-total-count');if(total!==null)return Number(total);const a=await r.json();return a.length}
async function auditRows(rows){if(!rows.length)return;if(rows.length>CFG.AUDIT_MAX)rows=rows.slice(0,CFG.AUDIT_MAX);let done=0;for(const b of rows){try{const marc=await fetchMarc(b.id),cnt=await itemCount(b.id),a={marc,item_count:Number.isFinite(cnt)?cnt:null};a.q=evalAudit(a);state.audits.set(b.id,a);done++;setStatus(`Audit UNIMARC/B : ${done}/${rows.length}…`,'loading')}catch(e){console.error(e)}}render();setStatus(`Audit terminé : ${done} notice(s).`,'ok')}
function renderEnrich(){const selected=state.rows.filter(r=>state.selected.has(String(r.id))),cand=selected.length?selected:filtered().filter(r=>primaryIsbn(r)).slice(0,CFG.BNF_MAX);$('dqb-content').innerHTML=`<div class="dqb-head"><div><h3>5 · Enrichissement assisté BnF</h3><p>Recherche SRU BnF uniquement sur ISBN valide. Le module compare et propose ; aucune donnée externe n'est écrite automatiquement dans Koha.</p></div><button id="bnf-run" class="btn btn-primary">Analyser ${Math.min(cand.length,CFG.BNF_MAX)} notice(s)</button></div><div class="dqb-info">Référentiel externe utilisé : SRU Catalogue général BnF, recherche par ISBN. En cas de blocage CORS/CSP du navigateur, l'audit local continue normalement.</div>${cand.map(r=>{const x=state.bnf.get(r.id);return`<div class="dqb-card" style="margin-bottom:8px"><strong>#${r.id} · ${esc(r.title)}</strong><br>ISBN ${esc(primaryIsbn(r)||'—')}<br>${!x?'<span class="dqb-note">non analysé</span>':x.error?`<span class="dqb-badge review">${esc(x.error)}</span>`:`<span class="dqb-badge ${x.count===1?'ok':'review'}">${x.count} résultat(s) BnF</span><br>${esc(x.title||'')}<br><span class="dqb-note">Champs disponibles : ${esc(x.fields.join(', ')||'—')}</span>`}</div>`}).join('')}`;$('bnf-run').onclick=()=>bnfRun(cand.slice(0,CFG.BNF_MAX))}
async function bnfRun(rows){let n=0;for(const r of rows){const isbn=primaryIsbn(r);if(!isbn)continue;try{const q=`bib.isbn all "${isbn}"`,u=`https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve&query=${encodeURIComponent(q)}&recordSchema=unimarcxchange&maximumRecords=2`;const resp=await fetch(u,{cache:'no-store'});if(!resp.ok)throw new Error(`HTTP ${resp.status}`);const xml=new DOMParser().parseFromString(await resp.text(),'application/xml'),num=Number(xml.getElementsByTagNameNS('*','numberOfRecords')[0]?.textContent||0),record=xml.getElementsByTagNameNS('*','recordData')[0],fields=record?[...record.getElementsByTagNameNS('*','datafield')].map(x=>x.getAttribute('tag')).filter(Boolean):[],title=[...record?.getElementsByTagNameNS('*','datafield')||[]].find(x=>x.getAttribute('tag')==='200')?.textContent?.trim()||'';state.bnf.set(r.id,{count:num,fields:[...new Set(fields)],title})}catch(e){state.bnf.set(r.id,{error:'Recherche externe indisponible : '+String(e.message||e),count:0,fields:[]})}n++;setStatus(`BnF : ${n}/${rows.length}…`,'loading')}renderEnrich();setStatus('Analyse BnF terminée.','ok')}
function renderBatch(){const rows=state.rows.filter(r=>state.selected.has(String(r.id)));$('dqb-content').innerHTML=`<div class="dqb-head"><div><h3>6 · Traitements par lot</h3><p>Audit, export, préparation de suppression native et fusion contrôlée des doublons.</p></div></div><div class="dqb-actions"><button id="audit-selected" class="btn btn-primary">Auditer sélection</button><button id="export" class="btn btn-default">Exporter</button><button id="native-delete" class="btn btn-default">Préparer suppression native</button></div><div class="dqb-card"><h4>Fusion de doublons</h4><p>Renseigne le BiblioID maître. La simulation exige qu'il soit dans la sélection et que chaque autre notice partage le même groupe de doublon fort.</p><div class="dqb-actions"><input id="master" style="max-width:180px" type="number" placeholder="BiblioID maître"><button id="sim-merge" class="btn btn-danger" ${state.settings.allowMerge?'':'disabled'}>Simuler fusion</button></div>${!state.settings.allowMerge?'<div class="dqb-info">Fusion API désactivée par défaut dans Règles.</div>':''}</div>${state.simulation?renderSimulation():''}${table(rows.slice(0,100))}`;bindRows();$('audit-selected').onclick=()=>auditRows(rows);$('export').onclick=()=>exportCsv(rows);$('native-delete').onclick=()=>prepareNativeDelete(rows);$('sim-merge').onclick=simulateMerge}
function prepareNativeDelete(rows){if(!rows.length)return;const ids=rows.map(r=>r.id).join('\n');navigator.clipboard.writeText(ids).then(()=>{window.open('/cgi-bin/koha/tools/batch_delete_records.pl?recordtype=biblio','_blank');setStatus(`${rows.length} BiblioID copiés. Utilise le contrôle natif Koha avant suppression.`, 'ok')})}
async function simulateMerge(){const ids=[...state.selected].map(Number),master=Number($('master').value);if(ids.length<2||!ids.includes(master))return alert('Sélectionne au moins 2 notices et indique un maître appartenant à la sélection.');const mrow=state.rows.find(r=>r.id===master),key=mrow?._dupKey;if(!key)return alert("Le maître n'appartient pas à un groupe de doublon fort.");const bad=ids.filter(id=>state.rows.find(r=>r.id===id)?._dupKey!==key);if(bad.length)return alert('Certaines notices ne partagent pas le même groupe de doublon fort.');const current=[];for(const id of ids){try{const marc=await fetchMarc(id);current.push({id,marc})}catch(e){return setStatus(`Simulation impossible pour #${id}: ${e.message}`,'error')}}const mm=current.find(x=>x.id===master)?.marc,blocked=[];for(const x of current)if(x.id!==master){const c=mergeCompatibility(mm,x.marc);if(!c.ok)blocked.push({id:x.id,reasons:c.reasons})}state.simulation={type:'merge',master,others:ids.filter(x=>x!==master),key,current,blocked};renderBatch()}
function renderSimulation(){const s=state.simulation;if(s.type!=='merge')return'';return`<div class="dqb-card"><h4>Simulation fusion</h4><p>Maître #${s.master} · ${s.others.length} notice(s) comparées champ par champ.</p>${s.blocked.length?`<div class="dqb-danger"><strong>Fusion bloquée.</strong><br>${s.blocked.map(x=>`#${x.id} : ${esc(x.reasons.join(', '))}`).join('<br>')}</div>`:'<div class="dqb-info">Compatibilité MARC vérifiée : leader, niveau, édition, publication, description matérielle, langue, support, identifiants et champs locaux. Séries, notices hiérarchiques/multiparties et ressources électroniques sont exclues.</div>'}<div class="dqb-actions"><button id="apply-merge" class="btn btn-danger" ${s.blocked.length?'disabled':''}>Appliquer les ${s.others.length} fusion(s)</button><button id="clear-sim" class="btn btn-default">Effacer</button></div></div>`}
async function applyMerge(){const s=state.simulation;if(!s?.others?.length||s.blocked?.length)return;if(!confirm(`Fusionner réellement ${s.others.length} notice(s) vers #${s.master} ?`))return;let ok=0,skip=0,err=0;for(const id of s.others){try{const masterMarc=await fetchMarc(s.master),sourceMarc=await fetchMarc(id),c=mergeCompatibility(masterMarc,sourceMarc);if(!c.ok){skip++;continue}const r=await kfetch(`${CFG.API}/${s.master}/merge`,{method:'POST',credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({biblio_id_to_merge:id,rules:'override'})});if(r.ok)ok++;else throw new Error(`HTTP ${r.status}`)}catch(e){console.error(e);err++}setStatus(`Fusion notices : ${ok} OK · ${skip} ignorée(s) · ${err} erreur(s)…`,'loading')}state.simulation=null;state.selected.clear();await loadAll(true);setStatus(`Fusions terminées : ${ok} OK · ${skip} ignorée(s) · ${err} erreur(s).`,err?'error':'ok')}
function ruleHelp(r){return `<strong>Détecte :</strong> ${esc(r.title)}. <strong>Ce que cela ne prouve pas :</strong> ce signal seul ne démontre ni une erreur ni l’action à effectuer. <strong>Contrôle attendu :</strong> contrôler le MARC complet, le type de document et les pratiques locales avant correction ou fusion.${r.deep?' Cette règle ne s’active qu’après l’analyse approfondie.':''}`}
function renderRules(){const s=state.settings;$('dqb-content').innerHTML=`<div class="dqb-head"><div><h3>7 · Règles, source et sécurité</h3><p>Les contrôles UNIMARC/B génériques n'imposent pas vos zones locales 099/999 : elles seront apprises/configurées séparément pour éviter les faux positifs.</p></div></div><div class="dqb-card"><label>ID rapport SQL « signatures notices » (recommandé pour ISBN/ISSN) <input id="sig-report" type="number" min="0" value="${Number(s.signatureReportId)||''}" placeholder="0 = API seule"></label><p class="dqb-note">Le rapport fourni avec la suite lit uniquement biblio/biblioitems par lots. Sans lui, le module utilise l'API globale et les signatures disponibles dans sa réponse.</p><label><input id="allow-merge" type="checkbox" style="width:auto" ${s.allowMerge?'checked':''}> Autoriser la fusion API après simulation forte</label><br><label><input id="bnf" type="checkbox" style="width:auto" ${s.enableBnf?'checked':''}> Activer la recherche BnF assistée</label><div class="dqb-actions"><button id="save" class="btn btn-primary">Enregistrer</button><button id="publish" class="btn btn-default">Publier Firebase</button></div></div><div class="dqb-card"><h4>${AUDIT_RULES.length} règles d'audit</h4>${AUDIT_RULES.map(r=>`<div style="margin:8px 0"><code>${r.id}</code> ${badge(r.severity)} ${esc(r.title)}<div class="dqb-note">${ruleHelp(r)}</div></div>`).join('')}</div>`;$('save').onclick=saveSettings;$('publish').onclick=publishSettings}
function saveSettings(){state.settings.signatureReportId=Math.max(0,Number($('sig-report').value)||0);state.settings.allowMerge=$('allow-merge').checked;state.settings.enableBnf=$('bnf').checked;localStorage.setItem(CFG.SETTINGS_KEY,JSON.stringify(state.settings));renderRules();setStatus('Paramètres enregistrés.','ok')}async function publishSettings(){saveSettings();const m=window.KohaQualityMemory;if(!m)return setStatus('Mémoire Firebase absente.','error');const st=await m.connect(CFG.MODULE);if(st.role!=='admin')return setStatus('Rôle admin requis.','error');await m.saveSettings(CFG.MODULE,state.settings);setStatus('Paramètres publiés.','ok')}
function feedbackContext(r,ruleId){const a=state.audits.get(r.id),q=r._q,rule=ruleId||'DOSSIER';return{primary_rule:rule,severity:q.severity,nature:rule==='DOSSIER'?'case_assessment':(rule==='BIB-DUP'?'duplicate_candidate':'metadata_rule'),certainty:rule==='DOSSIER'?'human_global':(a?'marc_audited':'basic'),priority:q.severity,rule_scope:rule,record_type:'bibliographic',duplicate_state:r._dup?'candidate':'unique',duplicate_confidence:r._dup?(r._dupKey?.startsWith('isbn:')?'identifier':'title_author_year'):'none',has_items:a?Number(a.item_count)>0:null,format_block:a?'audited':'basic',identifier_state:primaryIsbn(r)?'isbn_valid_present':(r.isbn?'isbn_invalid_or_unparsed':'isbn_absent'),framework_code:r.framework||'default',ghost_state:a?.item_count===0?'no_items':'not_known_or_has_items',link_state:a?.q.hits.some(h=>h.id==='BIB-010')?'missing_authority_links':'not_flagged'}}
async function sendFeedback(id,decision,ruleId){const r=classified().find(x=>String(x.id)===String(id)),m=window.KohaQualityMemory;if(!r||!m)return setStatus('Mémoire Firebase indisponible.','error');const rule=ruleId||'DOSSIER';try{const z=await m.submitFeedback({module:CFG.MODULE,ruleId:rule,decision,context:feedbackContext(r,rule)});setStatus(z.queued?'Retour en file locale.':'Retour enregistré.','ok')}catch(e){setStatus(e.message,'error')}}
async function loadMemory(){if(!window.KohaQualityMemory){try{await new Promise((ok,ko)=>{const s=document.createElement('script');s.src=CFG.MEMORY;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}catch(_){return}}try{const m=window.KohaQualityMemory,st=await m.connect(CFG.MODULE);state.memoryStatus=st;if(st.approved){const remote=await m.getSettings(CFG.MODULE);if(remote&&Object.keys(remote).length){state.settings={...state.settings,...remote};localStorage.setItem(CFG.SETTINGS_KEY,JSON.stringify(state.settings))}}}catch(_){}}
async function loadAll(silent=false){if(state.loading)return;state.loading=true;state.stop=false;try{const report=Number(state.settings.signatureReportId)||0;let rows=[];if(report){try{rows=await loadSignatureReport(report,silent)}catch(e){console.warn('Rapport signatures indisponible, repli API',e);if(!silent)setStatus(`Rapport signatures indisponible (${e.message}). Repli sur l’API Koha…`,'loading');rows=await loadBiblioApi(silent)}}else rows=await loadBiblioApi(silent);state.rows=rows;buildDuplicates();render();if(!silent)setStatus(`${fmt(rows.length)} notices chargées${state.stop?' (arrêt demandé)':''}${report?' · signatures SQL si disponibles':''}.`,'ok')}catch(e){console.error(e);setStatus(e.message,'error')}finally{state.loading=false}}
async function loadBiblioApi(silent=false){const rows=[];let page=1;while(!state.stop){const u=new URL(CFG.API,location.origin);u.searchParams.set('_page',page);u.searchParams.set('_per_page',CFG.PER_PAGE);u.searchParams.set('_order_by','biblio_id');const r=await kfetch(u,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`API biblios HTTP ${r.status}`);const a=await r.json();rows.push(...a.map(normBasic));if(!silent)setStatus(`Notices reçues via API : ${fmt(rows.length)} · page ${page}…`,'loading');if(a.length<CFG.PER_PAGE)break;page++}return rows}
async function loadSignatureReport(report,silent=false){const rows=[];let after=0,loops=0;while(!state.stop){loops++;const u=new URL(CFG.SVC,location.origin);u.searchParams.set('id',String(report));u.searchParams.set('annotated','1');u.searchParams.append('sql_params',String(after));u.searchParams.set('_',String(Date.now()));const r=await kfetch(u,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`rapport HTTP ${r.status}`);const a=await r.json();if(!Array.isArray(a))throw new Error('réponse rapport inattendue');const batch=a.map(normSignature).filter(x=>x.id);rows.push(...batch);if(!silent)setStatus(`Signatures notices : ${fmt(rows.length)} reçues…`,'loading');if(!batch.length||batch.length<1000)break;const next=Math.max(...batch.map(x=>x.id));if(next<=after)break;after=next;if(loops>5000)throw new Error('sécurité pagination signatures atteinte')}return rows}
function exportCsv(custom){const rows=custom||filtered(),out=[['biblio_id','title','author','isbn','issn','year','duplicate_key','severity','rules'].join(';')];for(const r of rows){const q=qOf(r);out.push([r.id,r.title,r.author,r.isbn,r.issn,r.year,r._dupKey,q.severity,q.hits.map(x=>x.id).join(',')].map(csv).join(';'))}download(out.join('\r\n'),'qualite-notices.csv')}function csv(v){const s=String(v??'');return/[;"\r\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s}function download(t,n){const a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',e=>{if(e.target?.id==='apply-merge')applyMerge();if(e.target?.id==='clear-sim'){state.simulation=null;renderBatch()}});shell();loadMemory();
})();
</script>
