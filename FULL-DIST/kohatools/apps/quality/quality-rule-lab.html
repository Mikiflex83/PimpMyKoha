<div id="dqlab-app"><div style="padding:28px;text-align:center;color:#66727c">Initialisation du laboratoire des règles…</div></div>
<style>
#dqlab-app{--g:#6f8f32;--gd:#526d22;--b:#d8dee3;--m:#697680;--bg:#f6f7f8;--warn:#fff8e8;--danger:#fff1f1;max-width:1500px;margin:0 auto 40px;color:#28343d}#dqlab-app *{box-sizing:border-box}.lab-hero{padding:20px 24px;border:1px solid #cedbbd;border-left:5px solid var(--g);border-radius:8px;background:linear-gradient(135deg,#fff,#f5f9ef);margin-bottom:13px}.lab-hero h2{margin:2px 0;color:var(--gd)}.lab-hero p{margin:4px 0 0;color:var(--m)}.lab-status{display:none;padding:10px 12px;margin-bottom:12px;border:1px solid var(--b);border-radius:6px}.lab-status.visible{display:block}.lab-status.ok{background:#f2f8eb;border-color:#cadcb2}.lab-status.loading{background:#f3f8fb;border-color:#c7d8e3}.lab-status.error{background:var(--danger);border-color:#e1b5b5;color:#822929}.lab-toolbar,.lab-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.lab-toolbar{padding:12px;border:1px solid var(--b);border-radius:7px;background:var(--bg);margin-bottom:12px}.lab-toolbar select,.lab-toolbar input,.lab-card input,.lab-card select,.lab-card textarea{height:34px;border:1px solid #bcc6cd;border-radius:5px;padding:5px 8px;background:#fff}.lab-card textarea{height:90px;width:100%;font-family:monospace}.lab-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.lab-stat,.lab-card{padding:13px;border:1px solid var(--b);border-radius:7px;background:#fff}.lab-stat span{display:block;color:var(--m);font-size:11px;text-transform:uppercase;font-weight:700}.lab-stat strong{display:block;font-size:24px;color:var(--gd);margin-top:3px}.lab-card{margin-bottom:12px}.lab-card h3,.lab-card h4{margin:0 0 8px}.lab-table-wrap{overflow:auto;border:1px solid var(--b);border-radius:7px;background:#fff}.lab-table{width:100%;border-collapse:collapse}.lab-table th,.lab-table td{padding:8px 9px;border-bottom:1px solid #e8ecef;text-align:left;vertical-align:top}.lab-table th{background:#f7f8f9;font-size:12px;white-space:nowrap}.lab-badge{display:inline-block;padding:2px 7px;border-radius:11px;background:#e8edf0;color:#52606a;font-size:11px;font-weight:700}.lab-badge.ok{background:#e6f1d8;color:#4d6a20}.lab-badge.warn{background:#fff0c9;color:#725c22}.lab-badge.bad{background:#f9dddd;color:#8a2b2b}.lab-info,.lab-warn,.lab-danger{padding:10px 12px;margin:10px 0;border-radius:6px;font-size:13px}.lab-info{background:#f3f8fb;border:1px solid #c7d8e3}.lab-warn{background:var(--warn);border:1px solid #e4cf96;color:#725c22}.lab-danger{background:var(--danger);border:1px solid #e1b5b5;color:#822929}.lab-context{font-family:monospace;font-size:11px;max-width:440px;white-space:normal;word-break:break-word}.lab-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.lab-tabs button.active{background:var(--g);border-color:var(--g);color:#fff}.lab-form{display:grid;grid-template-columns:1fr 160px 160px;gap:8px}.lab-form .wide{grid-column:1/-1}.lab-note{font-size:12px;color:var(--m)}@media(max-width:900px){.lab-grid{grid-template-columns:repeat(2,1fr)}.lab-form{grid-template-columns:1fr}}@media(max-width:600px){.lab-grid{grid-template-columns:1fr}}
</style>
<script>
(function(){
'use strict';
const root=document.getElementById('dqlab-app');if(!root||root.dataset.ready)return;root.dataset.ready='1';
const CFG={VERSION:'1.5.0',MEMORY:'__KOHATOOLS_ASSET_ROOT__apps/quality/shared/quality-memory-firebase.js?ktv=3.44.0',SETTINGS_KEY:'dq_rule_lab_v1'};
const MODULES=[['authorities','Autorités'],['reservations','Réservations'],['loans','Prêts & litiges'],['transfers','Transferts'],['items','Exemplaires'],['biblios','Notices'],['serials','Périodiques'],['patrons','Lecteurs']];
const state={module:'reservations',tab:'feedback',feedback:[],candidates:[],rules:[],memory:null,settings:loadSettings(),selectedFeedback:null};
function loadSettings(){try{return{minSamples:10,minDays:3,confirmPct:90,falsePositivePct:30,...JSON.parse(localStorage.getItem(CFG.SETTINGS_KEY)||'{}')}}catch(_){return{minSamples:10,minDays:3,confirmPct:90,falsePositivePct:30}}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){return new Intl.NumberFormat('fr-FR').format(Number(v)||0)}function pct(a,b){return b?Math.round(100*Number(a||0)/Number(b||1)):0}function status(t,c='loading'){const e=document.getElementById('lab-status');if(!e)return;e.className='lab-status visible '+c;e.textContent=t}
function shell(){root.innerHTML=`<div class="lab-hero"><div style="font-size:11px;font-weight:700;letter-spacing:.12em;color:#526d22">QUALITÉ KOHA · MÉMOIRE SUPERVISÉE</div><h2>Laboratoire des règles</h2><p>Transforme les validations humaines agrégées en règles candidates puis validées, sans jamais charger de donnée métier Koha.</p></div><div id="lab-status" class="lab-status"></div><div class="lab-toolbar"><label>Module <select id="lab-module">${MODULES.map(([id,n])=>`<option value="${id}" ${id===state.module?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label>Échantillon min. <input id="lab-min" type="number" min="1" max="10000" value="${state.settings.minSamples}"></label><label>Jours distincts min. <input id="lab-days" type="number" min="2" max="365" value="${state.settings.minDays}"></label><label>Confirmation forte ≥ <input id="lab-confirm" type="number" min="50" max="100" value="${state.settings.confirmPct}"> %</label><label>Faux positifs ≥ <input id="lab-fp" type="number" min="1" max="100" value="${state.settings.falsePositivePct}"> %</label><button id="lab-refresh" class="btn btn-primary">Actualiser</button></div><div class="lab-tabs"><button class="btn btn-default ${state.tab==='feedback'?'active':''}" data-tab="feedback">Retours humains</button><button class="btn btn-default ${state.tab==='candidates'?'active':''}" data-tab="candidates">Règles candidates</button><button class="btn btn-default ${state.tab==='rules'?'active':''}" data-tab="rules">Règles validées</button><button class="btn btn-default ${state.tab==='privacy'?'active':''}" data-tab="privacy">Confidentialité</button></div><div id="lab-content"></div>`;bindShell();render()}
function bindShell(){document.getElementById('lab-module').onchange=e=>{state.module=e.target.value;state.feedback=[];state.candidates=[];state.rules=[];state.selectedFeedback=null;shell()};for(const b of root.querySelectorAll('[data-tab]'))b.onclick=()=>{state.tab=b.dataset.tab;shell()};document.getElementById('lab-refresh').onclick=()=>{state.settings.minSamples=Math.max(1,Number(document.getElementById('lab-min').value)||10);state.settings.minDays=Math.max(2,Number(document.getElementById('lab-days').value)||3);state.settings.confirmPct=Math.max(50,Math.min(100,Number(document.getElementById('lab-confirm').value)||90));state.settings.falsePositivePct=Math.max(1,Math.min(100,Number(document.getElementById('lab-fp').value)||30));localStorage.setItem(CFG.SETTINGS_KEY,JSON.stringify(state.settings));loadData()}}
function render(){const c=document.getElementById('lab-content');if(!c)return;if(state.tab==='feedback')c.innerHTML=feedbackHtml();else if(state.tab==='candidates')c.innerHTML=candidatesHtml();else if(state.tab==='rules')c.innerHTML=rulesHtml();else c.innerHTML=privacyHtml();bindContent()}
function stableEnough(x){return Number(x.total)>=state.settings.minSamples&&Number(x.day_count)>=state.settings.minDays}function stats(){const totals=state.feedback.reduce((a,x)=>{a.t+=Number(x.total)||0;a.a+=Number(x.count_anomaly)||0;a.n+=Number(x.count_normal)||0;a.w+=Number(x.count_watch)||0;return a},{t:0,a:0,n:0,w:0});const strong=state.feedback.filter(x=>stableEnough(x)&&pct(x.count_anomaly,x.total)>=state.settings.confirmPct).length,fp=state.feedback.filter(x=>stableEnough(x)&&pct(x.count_normal,x.total)>=state.settings.falsePositivePct).length;return`<div class="lab-grid"><div class="lab-stat"><span>Décisions</span><strong>${fmt(totals.t)}</strong></div><div class="lab-stat"><span>Motifs</span><strong>${fmt(state.feedback.length)}</strong></div><div class="lab-stat"><span>Stables dans le temps</span><strong>${fmt(state.feedback.filter(stableEnough).length)}</strong></div><div class="lab-stat"><span>Faux positifs à étudier</span><strong>${fmt(fp)}</strong></div></div>`}
function feedbackHtml(){const rows=[...state.feedback].sort((a,b)=>(Number(b.total)||0)-(Number(a.total)||0));return`${stats()}<div class="lab-info"><strong>Lecture :</strong> aucune règle n’est proposée avant ${state.settings.minSamples} décisions réparties sur au moins ${state.settings.minDays} jours distincts. Les invariants système ne peuvent jamais être neutralisés par apprentissage.</div><div class="lab-table-wrap"><table class="lab-table"><thead><tr><th>Règle / motif</th><th>Échantillon</th><th>Jours</th><th>Anomalie</th><th>Normal</th><th>Surveiller</th><th>Diagnostic</th><th>Contexte abstrait</th><th></th></tr></thead><tbody>${rows.map((x,i)=>{const total=Number(x.total)||0,a=pct(x.count_anomaly,total),n=pct(x.count_normal,total),stable=stableEnough(x),locked=window.KohaQualityMemory?.isInvariantRule?.(x.rule_id);const diag=!stable?'<span class="lab-badge">à stabiliser</span>':a>=state.settings.confirmPct?'<span class="lab-badge ok">fortement confirmé</span>':n>=state.settings.falsePositivePct?'<span class="lab-badge bad">faux positifs</span>':'<span class="lab-badge warn">à étudier</span>';return`<tr><td><code>${esc(x.rule_id||'PATTERN')}</code>${locked?' <span class="lab-badge bad">invariant</span>':''}<br><span class="lab-note">${esc(x.pattern_key||'')}</span></td><td>${fmt(total)}</td><td>${fmt(x.day_count)}</td><td>${fmt(x.count_anomaly)} · ${a}%</td><td>${fmt(x.count_normal)} · ${n}%</td><td>${fmt(x.count_watch)}</td><td>${diag}</td><td class="lab-context">${esc(contextText(x.last_context))}</td><td><button class="btn btn-default btn-xs propose" data-i="${i}" ${!stable||locked?'disabled':''}>Proposer</button></td></tr>`}).join('')||'<tr><td colspan="9">Aucun feedback pour ce module.</td></tr>'}</tbody></table></div>${state.selectedFeedback?proposalForm(state.selectedFeedback):''}`}
function contextText(c){return Object.entries(c||{}).map(([k,v])=>`${k}=${v}`).join(' · ')}
function proposalForm(x){const ctx={...(x.last_context||{})};delete ctx.severity;const generatedTitle=`Règle ${x.rule_id||'PATTERN'} · ${ctx.primary_rule||'motif agrégé'}`,generatedDesc=`Règle candidate issue de ${Number(x.total||0)} validation(s) humaine(s) agrégée(s).`;return`<div class="lab-card"><h3>Créer une règle candidate</h3><div class="lab-form"><div class="wide lab-info"><strong>${esc(generatedTitle)}</strong><br>${esc(generatedDesc)}<br><span class="lab-note">Titre et description sont générés automatiquement : aucune saisie libre n'est envoyée dans Firebase.</span></div><select id="cand-level"><option value="C">C · observation</option><option value="B">B · à vérifier</option><option value="A">A · forte confiance</option></select><select id="cand-action"><option value="review">Revoir</option><option value="ignore">Exception / ignorer</option><option value="flag">Signaler</option></select><textarea id="cand-context" class="wide" readonly>${esc(JSON.stringify(ctx,null,2))}</textarea></div><div class="lab-actions" style="margin-top:8px"><button id="cand-save" class="btn btn-primary">Enregistrer comme candidate</button><button id="cand-cancel" class="btn btn-default">Annuler</button></div><div class="lab-note">Les conditions sont limitées aux dimensions abstraites déjà autorisées par le pare-feu RGPD.</div></div>`}
function candidatesHtml(){return`<div class="lab-card"><h3>Règles candidates · ${esc(state.module)}</h3><p class="lab-note">Une candidate n’agit sur aucun objet Koha. Elle doit respecter les seuils temporels, puis être relue et promue explicitement par un administrateur Firebase.</p></div><div class="lab-table-wrap"><table class="lab-table"><thead><tr><th>Code</th><th>Motif</th><th>Niveau</th><th>Échantillon</th><th>Jours</th><th>Conditions</th><th>Action proposée</th><th></th></tr></thead><tbody>${state.candidates.map((x,i)=>{const stable=Number(x.sample_count)>=state.settings.minSamples&&Number(x.day_count)>=state.settings.minDays,locked=window.KohaQualityMemory?.isInvariantRule?.(x.source_rule||x.code);return`<tr><td><code>${esc(x.code||x.id)}</code>${locked?' <span class="lab-badge bad">invariant</span>':''}</td><td>${esc('Règle '+(x.code||x.id||''))}</td><td>${esc(x.level||'C')}</td><td>${fmt(x.sample_count)}</td><td>${fmt(x.day_count)}</td><td class="lab-context">${esc(contextText(x.conditions))}</td><td>${esc(x.proposed_action||'review')}</td><td><button class="btn btn-primary btn-xs promote" data-i="${i}" ${!stable||locked?'disabled':''}>Promouvoir</button></td></tr>`}).join('')||'<tr><td colspan="8">Aucune règle candidate.</td></tr>'}</tbody></table></div>`}
function rulesHtml(){return`<div class="lab-card"><h3>Référentiel de règles validées · ${esc(state.module)}</h3><div class="lab-warn">Dans la V1, ces règles servent de référentiel partagé et d’exceptions documentées. Elles ne déclenchent jamais à elles seules une écriture destructive dans Koha : les traitements par lot restent régis par les garde-fous propres à chaque module.</div></div><div class="lab-table-wrap"><table class="lab-table"><thead><tr><th>Code</th><th>Motif</th><th>Niveau</th><th>Sévérité</th><th>Conditions</th><th>Action</th><th>Version</th></tr></thead><tbody>${state.rules.map(x=>`<tr><td><code>${esc(x.code||x.id)}</code></td><td>${esc('Règle '+(x.code||x.id||''))}</td><td>${esc(x.level||'')}</td><td>${esc(x.severity||'')}</td><td class="lab-context">${esc(contextText(x.conditions))}</td><td>${esc(x.action||'')}</td><td>${fmt(x.version||1)}</td></tr>`).join('')||'<tr><td colspan="7">Aucune règle validée.</td></tr>'}</tbody></table></div>`}
function privacyHtml(){return`<div class="lab-danger"><strong>Aucune donnée Koha n’est lue par cette page.</strong> Le laboratoire dialogue exclusivement avec les collections Firebase de mémoire qualité.</div><div class="lab-card"><h3>Ce qui peut exister dans une condition</h3><p>Des catégories abstraites telles que <code>age_bucket</code>, <code>severity</code>, <code>library_id</code>, <code>item_type_id</code>, <code>transfer_state</code>, <code>expiry_bucket</code> ou des drapeaux booléens.</p><h3>Ce qui est techniquement interdit</h3><p>PatronID, BiblioID, ItemID, HoldID, CheckoutID, AuthID, code-barres, nom, prénom, carte, email, téléphone, adresse, titre, auteur, notes, commentaires ou identifiants numériques longs.</p></div>`}
function bindContent(){root.querySelectorAll('.propose').forEach(b=>b.onclick=()=>{const rows=[...state.feedback].sort((a,b)=>(Number(b.total)||0)-(Number(a.total)||0));state.selectedFeedback=rows[Number(b.dataset.i)];render()});document.getElementById('cand-cancel')?.addEventListener('click',()=>{state.selectedFeedback=null;render()});document.getElementById('cand-save')?.addEventListener('click',saveCandidate);root.querySelectorAll('.promote').forEach(b=>b.onclick=()=>promote(Number(b.dataset.i)))}
async function saveCandidate(){const m=window.KohaQualityMemory;if(!m)return;const x=state.selectedFeedback;if(!stableEnough(x))return status('Motif encore insuffisamment stable dans le temps.','error');if(m.isInvariantRule?.(x.rule_id))return status('Une règle invariante ne peut pas devenir une exception apprise.','error');const conditions={...(x.last_context||{})};delete conditions.severity;const code=`${x.rule_id||'PATTERN'}_${String(x.pattern_key||Date.now()).slice(0,16)}`;try{await m.proposeRule({module:state.module,code,sourceRule:x.rule_id||'PATTERN',level:document.getElementById('cand-level').value,conditions,proposedAction:document.getElementById('cand-action').value,sampleCount:Number(x.total)||0,dayCount:Number(x.day_count)||0});state.selectedFeedback=null;await loadData();status('Règle candidate enregistrée.','ok')}catch(e){status(e.message||e,'error')}}
async function promote(i){const m=window.KohaQualityMemory,x=state.candidates[i];if(!m||!x)return;if(Number(x.sample_count)<state.settings.minSamples||Number(x.day_count)<state.settings.minDays)return status('Promotion refusée : échantillon ou durée insuffisants.','error');const st=m.getStatus();if(st.role!=='admin')return status('Rôle admin requis pour valider une règle.','error');if(m.isInvariantRule?.(x.source_rule||x.code))return status('Promotion refusée : règle système invariante.','error');const severity=prompt('Sévérité de classification : critical, review, atypical ou ok',x.proposed_action==='ignore'?'ok':(x.level==='A'?'critical':x.level==='B'?'review':'atypical'));if(!severity)return;if(!['critical','review','atypical','ok'].includes(severity))return status('Sévérité invalide.','error');const action=x.proposed_action==='ignore'?'ignore':'review';if(!confirm(`Valider ${x.code} comme règle partagée ?\n\nSévérité : ${severity}\nAction : ${action}`))return;try{await m.saveRule({module:state.module,code:x.code,sourceRule:x.source_rule||x.code,enabled:true,level:x.level,severity,conditions:x.conditions||{},exceptions:{},action,version:1});await loadData();status('Règle validée et versionnée.','ok')}catch(e){status(e.message||e,'error')}}
async function ensureMemory(){if(window.KohaQualityMemory)return true;return new Promise(resolve=>{const s=document.createElement('script');s.src=CFG.MEMORY;s.async=true;s.onload=()=>resolve(!!window.KohaQualityMemory);s.onerror=()=>resolve(false);document.head.appendChild(s)})}
async function loadData(){status('Lecture de la mémoire Firebase…','loading');try{if(!await ensureMemory())throw new Error('Client mémoire commun introuvable.');const m=window.KohaQualityMemory,st=await m.connect(state.module);state.memory=st;if(!st.approved)throw new Error(`Poste à approuver dans Firebase : ${st.uid||'UID indisponible'}`);state.feedback=await m.aggregateFeedback(state.module);state.candidates=await m.getCandidates(state.module);state.rules=await m.getRules(state.module,{force:true});shell();status(`${fmt(state.feedback.length)} motif(s), ${fmt(state.candidates.length)} candidate(s), ${fmt(state.rules.length)} règle(s) validée(s).`,'ok')}catch(e){state.feedback=[];state.candidates=[];state.rules=[];shell();status(e.message||e,'error')}}
shell();
})();
</script>
