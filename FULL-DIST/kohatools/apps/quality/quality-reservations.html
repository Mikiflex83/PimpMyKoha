<style>
#dqr-app{--g:#6f8f32;--gd:#526d22;--gl:#f2f7e9;--b:#d8dee3;--m:#697680;--bg:#f6f7f8;--warn:#fff8e8;--danger:#fff1f1;--blue:#eef6fb;max-width:1650px;margin:0 auto 40px;color:#28343d}#dqr-app *{box-sizing:border-box}.dqr-loading{padding:35px;text-align:center;color:#66727c}.dqr-hero{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:20px 24px;border:1px solid #cedbbd;border-left:5px solid var(--g);border-radius:7px;background:linear-gradient(135deg,#fff,#f5f9ef);margin-bottom:14px}.dqr-kicker{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--gd)}.dqr-hero h2{margin:3px 0;color:var(--gd);font-size:25px}.dqr-hero p{margin:3px 0;color:var(--m)}.dqr-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.dqr-status{display:none;padding:10px 13px;margin-bottom:12px;border:1px solid var(--b);border-radius:5px}.dqr-status.visible{display:block}.dqr-status.loading{background:#f2f7fa}.dqr-status.ok{background:#f2f8eb;border-color:#cadcb2}.dqr-status.error{background:var(--danger);border-color:#e1b5b5;color:#822929}.dqr-flow{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:7px;margin-bottom:13px}.dqr-step{padding:10px;border:1px solid var(--b);border-radius:7px;background:#fff;text-align:left}.dqr-step:hover,.dqr-step.active{border-color:#9fb878;background:#fbfdf8}.dqr-step.active{box-shadow:inset 0 -3px 0 var(--g)}.dqr-step-num{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;border-radius:50%;background:#e9edf0;font-weight:700}.dqr-step strong{display:block;margin-top:4px}.dqr-step small{display:block;color:var(--m)}.dqr-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-bottom:12px}.dqr-stat{padding:12px 14px;border:1px solid var(--b);border-radius:7px;background:#fff}.dqr-stat span{display:block;color:var(--m);font-size:10px;font-weight:700;text-transform:uppercase}.dqr-stat strong{display:block;margin-top:3px;color:var(--gd);font-size:23px}.dqr-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;margin-bottom:12px;border:1px solid var(--b);border-radius:6px;background:var(--bg)}.dqr-search{flex:1;min-width:240px;max-width:600px}.dqr-search input,.dqr-toolbar select,.dqr-toolbar input[type=number],.dqr-input{height:35px;border:1px solid #bcc6cd;border-radius:5px;background:#fff;padding:5px 8px}.dqr-search input{width:100%}.dqr-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin:4px 0 11px}.dqr-head h3{margin:0;color:#39444d}.dqr-head p{margin:3px 0;color:var(--m)}.dqr-info,.dqr-warning,.dqr-danger{padding:10px 12px;margin-bottom:11px;border-radius:5px;font-size:13px}.dqr-info{background:#f3f8fb;border:1px solid #c7d8e3}.dqr-warning{background:var(--warn);border:1px solid #e4cf96;color:#725c22}.dqr-danger{background:var(--danger);border:1px solid #e1b5b5;color:#822929}.dqr-quality{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.dqr-card{padding:13px;border:1px solid var(--b);border-radius:7px;background:#fff}.dqr-card h4{margin:0 0 8px}.dqr-card .value{display:block;font-size:25px;font-weight:700;color:var(--gd)}.dqr-card small,.dqr-note{color:var(--m);font-size:12px}.dqr-table-wrap{overflow-x:auto;border:1px solid var(--b);border-radius:7px}.dqr-table{width:100%;margin:0!important}.dqr-table th{white-space:nowrap;background:#f5f6f7;color:#52606a}.dqr-table td,.dqr-table th{vertical-align:middle!important}.dqr-table tr.selected{background:#f5f9ef}.dqr-badge{display:inline-block;padding:2px 7px;margin:1px 2px 1px 0;border-radius:11px;background:#e8edf0;color:#52606a;font-size:11px;font-weight:650}.dqr-badge.critical{background:#f9dddd;color:#8a2b2b}.dqr-badge.review{background:#fff0c9;color:#725c22}.dqr-badge.atypical{background:#e9f3fb;color:#37617a}.dqr-badge.ok{background:#e6f1d8;color:#4d6a20}.dqr-rulehit{display:block;margin:2px 0}.dqr-selection{display:flex;justify-content:space-between;gap:9px;align-items:center;padding:8px 10px;margin-bottom:9px;border:1px solid var(--b);border-radius:5px;background:#f8f9fa}.dqr-pagination{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;color:#6f7a82;font-size:12px}.dqr-progress{height:8px;overflow:hidden;border-radius:20px;background:#e6eaed}.dqr-progress span{display:block;height:100%;background:var(--g)}.dqr-progress-box{margin:9px 0 12px;padding:10px;border:1px solid var(--b);border-radius:6px;background:#fff}.dqr-progress-info{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px;color:var(--m)}.dqr-empty{padding:35px;border:1px dashed #c7cfd5;border-radius:7px;text-align:center;color:#78848c;background:#fafbfb}.dqr-fingerprint{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-bottom:1px solid #edf0f2}.dqr-fingerprint:last-child{border:0}.dqr-mono{font-family:monospace;font-size:12px}.dqr-settings{width:100%;border-collapse:collapse}.dqr-settings td,.dqr-settings th{padding:7px;border-bottom:1px solid #edf0f2;text-align:left}.dqr-config{width:100%;min-height:150px;padding:8px;border:1px solid #bcc6cd;border-radius:5px;font-family:monospace;font-size:12px}.dqr-feedback{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}.dqr-feedback button{font-size:10px;padding:2px 5px}.dqr-sim{padding:12px;border:1px solid #c7d8e3;border-radius:7px;background:#f7fbfd;margin-bottom:12px}.dqr-sim-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.dqr-sim-cell{padding:8px;border:1px solid #dbe5eb;border-radius:5px;background:#fff}.dqr-sim-cell strong{display:block;font-size:20px;color:var(--gd)}.dqr-checkbox{width:18px;height:18px}.dqr-hidden{display:none!important}
@media(max-width:1100px){.dqr-flow{grid-template-columns:repeat(3,1fr)}.dqr-stats,.dqr-quality,.dqr-sim-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.dqr-flow,.dqr-stats,.dqr-quality,.dqr-sim-grid{grid-template-columns:1fr}.dqr-hero,.dqr-head,.dqr-selection{flex-direction:column;align-items:stretch}}
.dqr-feedback-details{margin-top:4px}.dqr-feedback-details summary{cursor:pointer;color:#526d22;font-size:11px;font-weight:700}.dqr-item-info{margin-top:5px;padding:6px 7px;border-left:3px solid #9fb878;background:#f7faf3;font-size:11px;line-height:1.45}.dqr-item-info strong{color:#3f5520}
</style>
<script>
(function(){
'use strict';
if(window.__dracQualityReservationsV1)return;window.__dracQualityReservationsV1=true;

const CFG={
  MODULE:'reservations',VERSION:'1.5.0',API:'/api/v1',ROWS:50,API_PAGE:100,MIN_GAP:250,DEEP_DELAY:120,
  SETTINGS_KEY:'drac_quality_reservations_settings_v1',MEMORY_SCRIPT:'__KOHATOOLS_ASSET_ROOT__apps/quality/shared/quality-memory-firebase.js?ktv=3.43.1',
  DEFAULTS:{oldDays:365,veryOldDays:730,idleDays:180,waitingDays:21,waitingCriticalDays:45,transitDays:14,processingDays:7,cancelRequestDays:7,suspendIndefiniteDays:365,suspendOverdueDays:7}
};
const SEVERITY_RANK={ok:0,atypical:1,review:2,critical:3};
const root=document.getElementById('dqr-app');if(!root)return;

function loadSettings(){try{return {...CFG.DEFAULTS,...JSON.parse(localStorage.getItem(CFG.SETTINGS_KEY)||'{}')}}catch(_){return {...CFG.DEFAULTS}}}
const state={tab:'overview',holds:[],loading:false,stop:false,settings:loadSettings(),search:'',severity:'',status:'',pickup:'',minAge:0,page:1,selected:new Set(),deep:new Map(),deepRunning:false,simulation:null,cancelReasons:[],memoryStatus:null,remoteFeedback:[],exploreFilter:null,writeUnlocked:false};

let qTail=Promise.resolve(),lastEnd=0;
function queue(task){const job=qTail.catch(()=>{}).then(async()=>{const wait=Math.max(0,CFG.MIN_GAP-(Date.now()-lastEnd));if(wait)await sleep(wait);try{return await task()}finally{lastEnd=Date.now()}});qTail=job.catch(()=>{});return job}
const kfetch=(url,opt={})=>queue(()=>fetch(url,{credentials:'same-origin',cache:'no-store',...opt}));

renderShell();bindGlobal();loadMemoryClient();

function renderShell(){root.innerHTML=`
<div class="dqr-hero"><div><div class="dqr-kicker">KOHA · QUALITÉ DU CATALOGUE</div><h2>Maintenance des réservations</h2><p>Repérer les réservations anciennes ou figées, comprendre les cas atypiques, simuler puis traiter par lot via les mécanismes natifs Koha.</p></div><div class="dqr-actions"><button id="dqr-refresh" class="btn btn-primary"><i class="fa fa-play"></i> Charger les réservations</button><button id="dqr-stop" class="btn btn-default"><i class="fa fa-stop"></i> Arrêter</button><button id="dqr-export" class="btn btn-default"><i class="fa fa-download"></i> Export CSV</button></div></div>
<div id="dqr-status" class="dqr-status"></div>
<div class="dqr-flow">${step('overview',1,'Vue d’ensemble','État du stock')}${step('anomalies',2,'Anomalies','Priorités')}${step('explore',3,'Exploration','Cas atypiques')}${step('batch',4,'Traitements par lot','Simulation')}${step('rules',5,'Règles','Seuils & apprentissage')}${step('memory',6,'Mémoire Firebase','Partage réseau')}</div>
<div class="dqr-stats"><div class="dqr-stat"><span>Réservations actives</span><strong id="st-total">—</strong></div><div class="dqr-stat"><span>Critiques</span><strong id="st-critical">—</strong></div><div class="dqr-stat"><span>À vérifier</span><strong id="st-review">—</strong></div><div class="dqr-stat"><span>Atypiques</span><strong id="st-atypical">—</strong></div><div class="dqr-stat"><span>Sélection</span><strong id="st-selected">0</strong></div></div>
<div id="dqr-toolbar" class="dqr-toolbar"><div class="dqr-search"><input id="dqr-search" type="search" placeholder="ID réservation, notice, titre, site…"></div><select id="dqr-severity"><option value="">Toutes classes</option><option value="critical">Critiques</option><option value="review">À vérifier</option><option value="atypical">Atypiques</option><option value="ok">Sans alerte</option></select><select id="dqr-status-filter"><option value="">Tous statuts</option><option value="NORMAL">Normale</option><option value="W">W · Attente</option><option value="T">T · Transit</option><option value="P">P · Traitement</option><option value="SUSP">Suspendue</option></select><select id="dqr-pickup"><option value="">Tous sites de retrait</option></select><select id="dqr-age"><option value="0">Tout âge</option><option value="90">≥ 90 j</option><option value="180">≥ 180 j</option><option value="365">≥ 1 an</option><option value="730">≥ 2 ans</option></select><button id="dqr-reset" class="btn btn-default">Réinitialiser</button></div>
<div id="dqr-content"><div class="dqr-info"><strong>Aucun chargement automatique.</strong> Clique sur « Charger les réservations » pour commencer.</div></div>`}
function step(tab,n,t,s){return `<button class="dqr-step ${tab==='overview'?'active':''}" data-tab="${tab}"><span class="dqr-step-num">${n}</span><strong>${t}</strong><small>${s}</small></button>`}
function bindGlobal(){root.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));$('dqr-refresh').addEventListener('click',()=>loadHolds(true));$('dqr-stop').addEventListener('click',()=>{state.stop=true;setStatus('Arrêt demandé après la requête en cours.','ok')});$('dqr-export').addEventListener('click',exportCsv);let t;$('dqr-search').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{state.search=e.target.value.trim().toLowerCase();state.page=1;renderCurrent()},150)});$('dqr-severity').addEventListener('change',e=>{state.severity=e.target.value;state.page=1;renderCurrent()});$('dqr-status-filter').addEventListener('change',e=>{state.status=e.target.value;state.page=1;renderCurrent()});$('dqr-pickup').addEventListener('change',e=>{state.pickup=e.target.value;state.page=1;renderCurrent()});$('dqr-age').addEventListener('change',e=>{state.minAge=Number(e.target.value)||0;state.page=1;renderCurrent()});$('dqr-reset').addEventListener('click',()=>{state.search=state.severity=state.status=state.pickup='';state.minAge=0;state.exploreFilter=null;$('dqr-search').value='';$('dqr-severity').value='';$('dqr-status-filter').value='';$('dqr-pickup').value='';$('dqr-age').value='0';state.page=1;renderCurrent()})}
function switchTab(tab){state.tab=tab;root.querySelectorAll('.dqr-step').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('dqr-toolbar').classList.toggle('dqr-hidden',['rules','memory'].includes(tab));state.page=1;renderCurrent()}
function $(id){return document.getElementById(id)}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function fmt(v){return new Intl.NumberFormat('fr-FR').format(Number(v)||0)}
function setStatus(msg,type=''){const b=$('dqr-status');b.className=`dqr-status visible ${type}`;b.innerHTML=(type==='loading'?'<i class="fa fa-spinner fa-spin"></i> ':'')+esc(msg)}
function daysSince(v){if(!v)return null;const t=Date.parse(v);return Number.isFinite(t)?Math.floor((Date.now()-t)/86400000):null}function dateFr(v){if(!v)return '—';const t=Date.parse(v);return Number.isFinite(t)?new Intl.DateTimeFormat('fr-FR').format(new Date(t)):String(v)}
function ageBucket(n){if(n==null)return 'unknown';if(n<30)return '<30';if(n<90)return '30-89';if(n<180)return '90-179';if(n<365)return '180-364';if(n<730)return '365-729';return '730+'}
function statusLabel(h){if(h.suspended)return 'Suspendue';return h.status==='W'?'Attente':h.status==='T'?'Transit':h.status==='P'?'Traitement':'Normale'}

const RULES=[
 {id:'RES-001',title:'Expiration antérieure à la réservation',severity:'critical',test:h=>h.expiration_date&&h.hold_date&&Date.parse(h.expiration_date)<Date.parse(h.hold_date),detail:h=>`Expiration ${dateFr(h.expiration_date)} < réservation ${dateFr(h.hold_date)}`},
 {id:'RES-002',title:'Réservation sans notice',severity:'critical',test:h=>!h.biblio_id&&!h.deleted_biblio_id,detail:()=>`Aucun biblio_id exploitable`},
 {id:'RES-003',title:'Site de retrait absent',severity:'critical',test:h=>!h.pickup_library_id,detail:()=>`pickup_library_id absent`},
 {id:'RES-004',title:'Attente expirée depuis très longtemps',severity:'review',test:(h,s)=>h.status==='W'&&daysSince(h.waiting_date)>=s.waitingCriticalDays&&h.expiration_date&&Date.parse(h.expiration_date)<Date.now(),detail:(h,s)=>`En attente ${daysSince(h.waiting_date)} j · vérifier politique d’expiration et cron`},
 {id:'RES-005',title:'Demande d’annulation non traitée',severity:'review',test:(h,s)=>h.cancellation_requested&&daysSince(h.timestamp)>=s.cancelRequestDays,detail:h=>`Demande d’annulation · dernière mise à jour il y a ${daysSince(h.timestamp)} j`},
 {id:'RES-006',title:'Attente de retrait longue',severity:'atypical',test:(h,s)=>h.status==='W'&&daysSince(h.waiting_date)>=s.waitingDays,detail:h=>`En attente depuis ${daysSince(h.waiting_date)} j · délai à comparer à la politique Koha`},
 {id:'RES-007',title:'Transit à contrôler',severity:'atypical',test:(h,s)=>h.status==='T'&&daysSince(h.timestamp)>=s.transitDays,detail:h=>`Dernière mise à jour il y a ${daysSince(h.timestamp)} j · confirmer avec le transfert réel`},
 {id:'RES-008',title:'Traitement P à contrôler',severity:'atypical',test:(h,s)=>h.status==='P'&&daysSince(h.timestamp)>=s.processingDays,detail:h=>`État P sans mise à jour depuis ${daysSince(h.timestamp)} j · comportement SIP à contextualiser`},
 {id:'RES-009',title:'Réservation expirée toujours active',severity:'review',test:h=>h.expiration_date&&Date.parse(h.expiration_date)<Date.now()&&!h.cancellation_date,detail:h=>`Expiration ${dateFr(h.expiration_date)}`},
 {id:'RES-010',title:'Suspension échue toujours active',severity:'review',test:(h,s)=>h.suspended&&h.suspended_until&&daysSince(h.suspended_until)>=s.suspendOverdueDays,detail:h=>`Fin de suspension dépassée de ${daysSince(h.suspended_until)} j`},
 {id:'RES-011',title:'Très ancienne réservation',severity:'review',test:(h,s)=>daysSince(h.hold_date)>=s.veryOldDays,detail:h=>`${daysSince(h.hold_date)} jours depuis la demande`},
 {id:'RES-012',title:'Ancienne et sans activité récente',severity:'review',test:(h,s)=>daysSince(h.hold_date)>=s.oldDays&&daysSince(h.timestamp)>=s.idleDays,detail:h=>`${daysSince(h.hold_date)} j d’âge · dernière mise à jour ${daysSince(h.timestamp)} j`},
 {id:'RES-013',title:'Suspension indéfinie très ancienne',severity:'atypical',test:(h,s)=>h.suspended&&!h.suspended_until&&daysSince(h.hold_date)>=s.suspendIndefiniteDays,detail:h=>`Suspendue sans date depuis une réservation de ${daysSince(h.hold_date)} j`},
 {id:'RES-014',title:'Réservation au niveau exemplaire ancienne',severity:'atypical',test:h=>!!h.item_id&&daysSince(h.hold_date)>=180,detail:h=>`Exemplaire #${h.item_id} réservé depuis ${daysSince(h.hold_date)} j`}
];
function evaluate(h){const hits=[];let sev='ok';for(const r of RULES){let yes=false;try{yes=!!r.test(h,state.settings)}catch(_){}if(yes){hits.push({id:r.id,title:r.title,severity:r.severity,detail:r.detail?r.detail(h,state.settings):''});if(SEVERITY_RANK[r.severity]>SEVERITY_RANK[sev])sev=r.severity}}const deep=state.deep.get(String(h.hold_id));if(deep?.issues){for(const i of deep.issues){hits.push(i);if(SEVERITY_RANK[i.severity]>SEVERITY_RANK[sev])sev=i.severity}}return {severity:sev,hits}}
function normalizeHold(x){return {...x,hold_id:Number(x.hold_id),patron_id:Number(x.patron_id),biblio_id:x.biblio_id==null?null:Number(x.biblio_id),item_id:x.item_id==null?null:Number(x.item_id),title:x.biblio?.title||x.biblio?.plain_text||'',pickup_name:x.pickup_library?.name||x._strings?.pickup_library_id?.str||x.pickup_library_id||''}}

async function loadHolds(force=false){if(state.loading)return;state.loading=true;state.stop=false;state.simulation=null;setStatus('Lecture paginée des réservations actives via l’API Koha…','loading');try{const rows=[];let page=1,total=null;while(!state.stop){const u=new URL(`${CFG.API}/holds`,location.origin);u.searchParams.set('_page',page);u.searchParams.set('_per_page',CFG.API_PAGE);u.searchParams.set('_order_by','hold_id');const r=await kfetch(u,{headers:{Accept:'application/json','x-koha-embed':'biblio,pickup_library,+strings'}});if(!r.ok)throw new Error(`API réservations HTTP ${r.status}`);const data=await r.json();if(!Array.isArray(data))throw new Error('Réponse API réservations inattendue.');rows.push(...data.map(normalizeHold));const hTotal=Number(r.headers.get('X-Total-Count'));if(Number.isFinite(hTotal))total=hTotal;setStatus(`Réservations : ${fmt(rows.length)}${total!=null?` / ${fmt(total)}`:''} reçues…`,'loading');if(!data.length||data.length<CFG.API_PAGE||(total!=null&&rows.length>=total))break;page++}state.holds=rows;state.deep.clear();state.selected=new Set([...state.selected].filter(id=>rows.some(h=>String(h.hold_id)===String(id))));populatePickups();updateStats();renderCurrent();if(!state.stop)loadCancellationReasons();setStatus(`${fmt(rows.length)} réservation(s) chargée(s)${state.stop?' avant l’arrêt demandé':' directement depuis Koha'}.`,'ok')}catch(e){console.error(e);setStatus(`Chargement impossible : ${e.message}`,'error');renderCurrent()}finally{state.loading=false}}
function populatePickups(){const sel=$('dqr-pickup'),current=state.pickup,names=new Map();for(const h of state.holds)if(h.pickup_library_id)names.set(h.pickup_library_id,h.pickup_name||h.pickup_library_id);sel.innerHTML='<option value="">Tous sites de retrait</option>'+[...names].sort((a,b)=>a[1].localeCompare(b[1],'fr')).map(([id,n])=>`<option value="${esc(id)}">${esc(n)} (${esc(id)})</option>`).join('');sel.value=current}
function classified(){return state.holds.map(h=>({...h,_q:evaluate(h),_age:daysSince(h.hold_date)}))}
function filtered(){return classified().filter(h=>{if(state.search){const hay=[h.hold_id,h.biblio_id,h.title,h.pickup_library_id,h.pickup_name,h.item_id].join(' ').toLowerCase();if(!hay.includes(state.search))return false}if(state.severity&&h._q.severity!==state.severity)return false;if(state.status){const s=h.suspended?'SUSP':(h.status||'NORMAL');if(s!==state.status)return false}if(state.pickup&&h.pickup_library_id!==state.pickup)return false;if(state.minAge&&Number(h._age||0)<state.minAge)return false;if(state.exploreFilter&&fingerprint(h)!==state.exploreFilter)return false;return true})}
function updateStats(){const all=classified(),count=s=>all.filter(x=>x._q.severity===s).length;$('st-total').textContent=fmt(all.length);$('st-critical').textContent=fmt(count('critical'));$('st-review').textContent=fmt(count('review'));$('st-atypical').textContent=fmt(count('atypical'));$('st-selected').textContent=fmt(state.selected.size)}
function renderCurrent(){updateStats();if(state.tab==='overview')renderOverview();else if(state.tab==='anomalies')renderAnomalies();else if(state.tab==='explore')renderExplore();else if(state.tab==='batch')renderBatch();else if(state.tab==='rules')renderRules();else if(state.tab==='memory')renderMemory()}
function severityBadge(s){const lab={critical:'Critique',review:'À vérifier',atypical:'Atypique',ok:'Sans alerte'}[s]||s;return `<span class="dqr-badge ${s}">${lab}</span>`}
function renderOverview(){const all=classified(),shown=filtered().slice(0,CFG.ROWS),byStatus={};for(const h of all){const s=statusLabel(h);byStatus[s]=(byStatus[s]||0)+1}const old=all.filter(h=>h._age>=state.settings.oldDays).length,very=all.filter(h=>h._age>=state.settings.veryOldDays).length,expired=all.filter(h=>h.expiration_date&&Date.parse(h.expiration_date)<Date.now()).length;$('dqr-content').innerHTML=`<div class="dqr-head"><div><h3>1 · Vue d’ensemble</h3><p>Ancienneté n’est pas synonyme d’erreur : les cartes servent à orienter l’exploration.</p></div></div><div class="dqr-quality"><div class="dqr-card"><strong>≥ ${state.settings.oldDays} jours</strong><span class="value">${fmt(old)}</span><small>réservations anciennes</small></div><div class="dqr-card"><strong>≥ ${state.settings.veryOldDays} jours</strong><span class="value">${fmt(very)}</span><small>très anciennes</small></div><div class="dqr-card"><strong>Expiration dépassée</strong><span class="value">${fmt(expired)}</span><small>à contextualiser selon les règles/cron</small></div><div class="dqr-card"><strong>Sélection actuelle</strong><span class="value">${fmt(state.selected.size)}</span><small>prête pour analyse approfondie ou simulation</small></div></div><div class="dqr-card"><h4>Répartition des états</h4>${Object.entries(byStatus).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="dqr-badge">${esc(k)} : ${fmt(v)}</span>`).join(' ')}</div><div class="dqr-info" style="margin-top:12px"><strong>Comment lire et qualifier :</strong> coche une ligne pour l’analyser ou la préparer à une simulation. « Anomalie / Normal / Surveiller » qualifie uniquement la règle concernée pour l’apprentissage ; aucun de ces boutons ne modifie Koha. L’analyse approfondie charge à la demande les états des exemplaires et du compte lecteur.</div>${selectionBar(shown)}<div style="margin-top:12px">${renderTable(shown,true)}</div>`;bindRows()}
function renderAnomalies(){const rows=filtered().filter(x=>x._q.severity!=='ok'),p=paginate(rows);$('dqr-content').innerHTML=`<div class="dqr-head"><div><h3>2 · Anomalies et situations à vérifier</h3><p>${fmt(rows.length)} résultat(s). Sélectionne les cas intéressants puis lance l’analyse approfondie si nécessaire.</p></div><div class="dqr-actions"><button id="dqr-deep-page" class="btn btn-default"><i class="fa fa-search-plus"></i> Analyser la page</button><button id="dqr-deep-selected" class="btn btn-primary" ${state.selected.size?'':'disabled'}><i class="fa fa-search"></i> Analyser la sélection</button></div></div>${state.deepRunning?progressDeep():''}${selectionBar(p.items)}${p.items.length?renderTable(p.items,true):empty('Aucune anomalie avec les filtres actuels.')}${paginationHtml(p)}`;bindRows();bindPagination();$('dqr-deep-page')?.addEventListener('click',()=>deepAnalyze(p.items.map(x=>x.hold_id)));$('dqr-deep-selected')?.addEventListener('click',()=>deepAnalyze([...state.selected]))}
function paginate(rows){const pages=Math.max(1,Math.ceil(rows.length/CFG.ROWS));state.page=Math.min(Math.max(1,state.page),pages);const start=(state.page-1)*CFG.ROWS;return {items:rows.slice(start,start+CFG.ROWS),page:state.page,pages,total:rows.length}}
function paginationHtml(p){if(p.pages<=1)return '';return `<div class="dqr-pagination"><span>${fmt(p.total)} résultats · page ${p.page}/${p.pages}</span><div class="dqr-actions"><button id="dqr-prev" class="btn btn-default btn-sm" ${p.page<=1?'disabled':''}>Précédent</button><button id="dqr-next" class="btn btn-default btn-sm" ${p.page>=p.pages?'disabled':''}>Suivant</button></div></div>`}
function bindPagination(){$('dqr-prev')?.addEventListener('click',()=>{state.page--;renderCurrent()});$('dqr-next')?.addEventListener('click',()=>{state.page++;renderCurrent()})}
function selectionBar(pageRows){return `<div class="dqr-selection"><div class="dqr-actions"><button id="dqr-select-page" class="btn btn-default btn-sm">Sélectionner la page</button><button id="dqr-select-filter" class="btn btn-default btn-sm">Sélectionner tous les résultats filtrés</button><button id="dqr-clear-select" class="btn btn-default btn-sm">Désélectionner</button></div><div><strong>${fmt(state.selected.size)}</strong> sélectionnée(s)</div></div>`}
function renderTable(rows,withCheckbox=true){return `<div class="dqr-table-wrap"><table class="table table-striped table-hover dqr-table"><thead><tr>${withCheckbox?'<th></th>':''}<th>Réservation</th><th>Notice</th><th>Exemplaire(s)</th><th>Retrait</th><th>État</th><th>Ancienneté</th><th>Diagnostic</th><th></th></tr></thead><tbody>${rows.map(h=>rowHtml(h,withCheckbox)).join('')}</tbody></table></div>`}
function feedbackButtons(id,ruleId){return `<details class="dqr-feedback-details"><summary>Qualifier ${ruleId==='DOSSIER'?'le dossier':'cette règle'}</summary><span class="dqr-feedback"><button class="btn btn-default dqr-fb" data-id="${id}" data-rule="${esc(ruleId)}" data-decision="anomaly">Anomalie</button><button class="btn btn-default dqr-fb" data-id="${id}" data-rule="${esc(ruleId)}" data-decision="normal">Normal</button><button class="btn btn-default dqr-fb" data-id="${id}" data-rule="${esc(ruleId)}" data-decision="watch">Surveiller</button></span></details>`}
function itemSummaryHtml(h,deep){if(!deep)return `<span class="dqr-note">${h.item_id?`Exemplaire ciblé #${h.item_id}`:'Réservation au niveau notice'}<br>Analyse à lancer pour afficher les états.</span>`;const s=deep.itemSummary||{},t=s.target;return `<div class="dqr-item-info"><strong>${fmt(s.total||0)} exemplaire(s) · ${fmt(s.available||0)} disponible(s) estimé(s)</strong><br>Prêtés ${fmt(s.checkedOut||0)} · transfert ${fmt(s.inTransfer||0)} · perdus ${fmt(s.lost||0)} · retirés ${fmt(s.withdrawn||0)} · non-prêtables ${fmt(s.notForLoan||0)}${t?`<br><strong>Ciblé :</strong> ${esc(t.barcode||'#'+t.id)} · ${esc(t.home||'—')} → ${esc(t.holding||'—')} · ${esc(t.itemType||'—')} · ${esc(t.collection||'—')} · ${esc(t.location||'—')} · cote ${esc(t.callnumber||'—')}`:''}</div>`}
function rowHtml(h,withCheckbox){const q=h._q||evaluate(h),checked=state.selected.has(String(h.hold_id)),deep=state.deep.get(String(h.hold_id));return `<tr class="${checked?'selected':''}">${withCheckbox?`<td><input class="dqr-checkbox dqr-row-check" type="checkbox" value="${h.hold_id}" ${checked?'checked':''}></td>`:''}<td><strong>#${h.hold_id}</strong><br><small>${dateFr(h.hold_date)} · priorité ${h.priority??'—'}</small></td><td><a target="_blank" href="/cgi-bin/koha/catalogue/detail.pl?biblionumber=${encodeURIComponent(h.biblio_id||'')}">${esc(h.title||`Notice #${h.biblio_id||'—'}`)}</a></td><td>${itemSummaryHtml(h,deep)}</td><td>${esc(h.pickup_name||h.pickup_library_id||'—')}</td><td><span class="dqr-badge">${esc(statusLabel(h))}</span>${h.expiration_date?`<br><small>Expire ${dateFr(h.expiration_date)}</small>`:''}</td><td><strong>${h._age==null?'—':fmt(h._age)+' j'}</strong><br><small>maj ${daysSince(h.timestamp)==null?'—':fmt(daysSince(h.timestamp))+' j'}</small></td><td>${severityBadge(q.severity)}${q.hits.map(i=>`<span class="dqr-rulehit"><span class="dqr-badge ${i.severity}">${esc(i.id)}</span> ${esc(i.title)} <small>${esc(i.detail||'')}</small>${feedbackButtons(h.hold_id,i.id)}</span>`).join('')}${deep?`<div class="dqr-note">Analyse approfondie : ${fmt(deep.itemsCount||0)} exemplaire(s) · ${deep.patronChecked?'lecteur contrôlé':'lecteur non contrôlé'}</div>`:''}<div class="dqr-note">Appréciation globale indépendante</div>${feedbackButtons(h.hold_id,'DOSSIER')}</td><td><button class="btn btn-default btn-xs dqr-deep-one" data-id="${h.hold_id}">Analyser</button> <a class="btn btn-default btn-xs" target="_blank" href="/cgi-bin/koha/reserve/request.pl?biblionumber=${encodeURIComponent(h.biblio_id||'')}">Ouvrir</a></td></tr>`}
function bindRows(){root.querySelectorAll('.dqr-row-check').forEach(cb=>cb.addEventListener('change',()=>{if(cb.checked)state.selected.add(cb.value);else state.selected.delete(cb.value);updateStats();renderCurrent()}));$('dqr-select-page')?.addEventListener('click',()=>{root.querySelectorAll('.dqr-row-check').forEach(cb=>state.selected.add(cb.value));renderCurrent()});$('dqr-select-filter')?.addEventListener('click',()=>{filtered().forEach(x=>state.selected.add(String(x.hold_id)));renderCurrent()});$('dqr-clear-select')?.addEventListener('click',()=>{state.selected.clear();state.simulation=null;renderCurrent()});root.querySelectorAll('.dqr-deep-one').forEach(b=>b.addEventListener('click',()=>deepAnalyze([b.dataset.id])));root.querySelectorAll('.dqr-fb').forEach(b=>b.addEventListener('click',()=>sendFeedback(b.dataset.id,b.dataset.rule,b.dataset.decision)))}
function empty(msg){return `<div class="dqr-empty"><i class="fa fa-inbox"></i><br>${esc(msg)}</div>`}
function progressDeep(){return `<div class="dqr-progress-box"><div class="dqr-progress-info"><span>Analyse approfondie séquentielle</span><strong>en cours</strong></div><div class="dqr-progress"><span style="width:100%"></span></div></div>`}

async function fetchBiblioItems(biblioId){const all=[];let page=1;while(true){const u=new URL(`${CFG.API}/biblios/${encodeURIComponent(biblioId)}/items`,location.origin);u.searchParams.set('_page',page);u.searchParams.set('_per_page',100);const r=await kfetch(u,{headers:{Accept:'application/json','x-koha-embed':'checkout,transfer,+strings'}});if(!r.ok){if(r.status===404)return [];throw new Error(`Items notice ${biblioId}: HTTP ${r.status}`)}const data=await r.json();all.push(...data);if(data.length<100)break;page++}return all}
async function fetchPatron(patronId){const r=await kfetch(`${CFG.API}/patrons/${encodeURIComponent(patronId)}`,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`Lecteur ${patronId}: HTTP ${r.status}`);return r.json()}
function summarizeItems(h,items){const flag=(i,k)=>Number(i[k]||0)!==0,target=items.find(i=>Number(i.item_id)===Number(h.item_id)),brief=i=>i?{id:i.item_id,barcode:i.external_id||i.barcode||'',home:i.home_library_id||i.homebranch||'',holding:i.holding_library_id||i.holdingbranch||'',itemType:i.item_type_id||i.itype||'',collection:i.collection_code||i.ccode||'',location:i.location||'',callnumber:i.callnumber||i.itemcallnumber||''}:null;return{total:items.length,available:items.filter(i=>!flag(i,'lost_status')&&!flag(i,'withdrawn')&&!flag(i,'not_for_loan_status')&&!flag(i,'effective_not_for_loan_status')&&!i.checkout&&!i.transfer).length,checkedOut:items.filter(i=>!!i.checkout).length,inTransfer:items.filter(i=>!!i.transfer).length,lost:items.filter(i=>flag(i,'lost_status')).length,withdrawn:items.filter(i=>flag(i,'withdrawn')).length,notForLoan:items.filter(i=>flag(i,'not_for_loan_status')||flag(i,'effective_not_for_loan_status')).length,target:brief(target)}}
function deepIssues(h,items,patron){const issues=[];const add=(severity,id,title,detail)=>issues.push({severity,id,title,detail});if(!items.length)add('review','RES-D001','Notice sans exemplaire','Aucun exemplaire actif retourné par Koha pour cette notice.');if(h.item_id){const target=items.find(i=>Number(i.item_id)===Number(h.item_id));if(!target)add('critical','RES-D002','Exemplaire réservé introuvable',`L’exemplaire #${h.item_id} n’est plus présent dans les exemplaires actifs de la notice.`);else if(Number(target.lost_status||0)!==0||Number(target.withdrawn||0)!==0)add('critical','RES-D003','Exemplaire réservé perdu ou retiré',`lost=${target.lost_status||0} · withdrawn=${target.withdrawn||0}`)}if(items.length&&items.every(i=>Number(i.lost_status||0)!==0||Number(i.withdrawn||0)!==0))add('review','RES-D004','Tous les exemplaires sont perdus ou retirés','La réservation paraît matériellement difficile/impossible à satisfaire ; contrôle humain avant annulation.');if(items.length&&items.every(i=>Number(i.lost_status||0)!==0||Number(i.withdrawn||0)!==0||Number(i.effective_not_for_loan_status||0)!==0))add('atypical','RES-D005','Aucun exemplaire apparemment disponible','Tous les exemplaires ont un état perdu/retiré/non-prêtable ; les règles de circulation peuvent toutefois créer des exceptions.');if(patron){const exp=patron.expiry_date||patron.expiration_date;if(exp&&Date.parse(exp)<Date.now())add('review','RES-D006','Compte lecteur expiré',`Expiration du compte : ${dateFr(exp)}`)}return issues}
async function deepAnalyze(ids){if(state.deepRunning)return;const list=[...new Set(ids.map(String))].map(id=>state.holds.find(h=>String(h.hold_id)===id)).filter(Boolean);if(!list.length)return;state.stop=false;state.deepRunning=true;renderCurrent();setStatus(`Analyse approfondie de ${fmt(list.length)} réservation(s)…`,'loading');const itemsCache=new Map(),patronCache=new Map();let done=0;for(const h of list){if(state.stop)break;try{let items=itemsCache.get(h.biblio_id);if(!items){items=await fetchBiblioItems(h.biblio_id);itemsCache.set(h.biblio_id,items)}let patron=null,patronChecked=false;if(h.patron_id){if(patronCache.has(h.patron_id)){patron=patronCache.get(h.patron_id);patronChecked=true}else{try{patron=await fetchPatron(h.patron_id);patronCache.set(h.patron_id,patron);patronChecked=true}catch(_){}}}state.deep.set(String(h.hold_id),{issues:deepIssues(h,items,patron),itemsCount:items.length,itemSummary:summarizeItems(h,items),patronChecked,analyzedAt:Date.now()})}catch(e){state.deep.set(String(h.hold_id),{issues:[{severity:'review',id:'RES-DERR',title:'Analyse approfondie incomplète',detail:e.message}],itemsCount:0,itemSummary:{total:0},patronChecked:false,error:e.message})}done++;if(done%3===0){setStatus(`Analyse approfondie : ${done}/${list.length}`,'loading');renderCurrent()}await sleep(CFG.DEEP_DELAY)}state.deepRunning=false;setStatus(`${state.stop?'Analyse arrêtée':'Analyse approfondie terminée'} : ${fmt(done)} / ${fmt(list.length)} réservation(s).`,'ok');renderCurrent()}

function fingerprint(h){const expired=h.expiration_date&&Date.parse(h.expiration_date)<Date.now()?'expired':'not_expired';const status=h.suspended?'SUSP':(h.status||'NORMAL');const deep=state.deep.get(String(h.hold_id));const impossible=deep?.issues?.some(i=>['RES-D002','RES-D003','RES-D004'].includes(i.id))?'deep_problem':'deep_unknown';return [status,`age:${ageBucket(h._age??daysSince(h.hold_date))}`,`item:${h.item_id?'yes':'no'}`,`exp:${expired}`,`pickup:${h.pickup_library_id||'none'}`,impossible].join('|')}
function renderExplore(){const rows=classified(),map=new Map();for(const h of rows){const f=fingerprint(h),x=map.get(f)||{fingerprint:f,count:0,severity:'ok',sample:h};x.count++;if(SEVERITY_RANK[h._q.severity]>SEVERITY_RANK[x.severity])x.severity=h._q.severity;map.set(f,x)}const groups=[...map.values()].sort((a,b)=>a.count-b.count||SEVERITY_RANK[b.severity]-SEVERITY_RANK[a.severity]);$('dqr-content').innerHTML=`<div class="dqr-head"><div><h3>3 · Exploration des situations atypiques</h3><p>Les combinaisons rares sont montrées même sans règle métier dédiée. C’est ici que l’on découvre de nouveaux cas à intégrer.</p></div></div><div class="dqr-info">Une combinaison rare n’est pas une erreur. Clique sur un motif pour filtrer les réservations correspondantes, puis qualifie les cas avec les boutons de feedback.</div><div class="dqr-card">${groups.slice(0,150).map(g=>`<div class="dqr-fingerprint"><div><strong>${fmt(g.count)} cas</strong> ${severityBadge(g.severity)}<br><span class="dqr-mono">${esc(g.fingerprint)}</span></div><button class="btn btn-default btn-sm dqr-use-fp" data-fp="${esc(g.fingerprint)}">Voir les cas</button></div>`).join('')}</div>${state.exploreFilter?`<div style="margin-top:12px"><div class="dqr-actions"><button id="dqr-clear-fp" class="btn btn-default">Retirer le filtre atypique</button></div>${renderTable(filtered().slice(0,CFG.ROWS),true)}</div>`:''}`;root.querySelectorAll('.dqr-use-fp').forEach(b=>b.addEventListener('click',()=>{state.exploreFilter=b.dataset.fp;renderExplore()}));$('dqr-clear-fp')?.addEventListener('click',()=>{state.exploreFilter=null;renderExplore()});bindRows()}

async function loadCancellationReasons(){try{const r=await kfetch(`${CFG.API}/authorised_value_categories/HOLD_CANCELLATION/authorised_values?_per_page=100`,{headers:{Accept:'application/json'}});if(r.ok)state.cancelReasons=await r.json()}catch(_){state.cancelReasons=[]}if(state.tab==='batch')renderBatch()}
function selectedHolds(){return [...state.selected].map(id=>state.holds.find(h=>String(h.hold_id)===String(id))).filter(Boolean)}
function renderBatch(){const selected=selectedHolds(),sim=state.simulation;$('dqr-content').innerHTML=`<div class="dqr-head"><div><h3>4 · Traitements par lot</h3><p>Les actions destructives passent obligatoirement par simulation puis relecture de l’état Koha.</p></div></div><div class="dqr-danger"><strong>Principe :</strong> aucune réservation n’est annulée parce qu’elle est simplement ancienne. Tu sélectionnes les cas, la simulation relit les réservations actives, puis Koha reçoit uniquement les IDs encore présents.</div>${state.writeUnlocked?'<div class="dqr-warning"><strong>Écritures déverrouillées pour cette session.</strong> Le verrou reviendra automatiquement au prochain rechargement de la page.</div>':'<div class="dqr-info"><strong>Mode observation :</strong> les annulations sont verrouillées. Tu peux charger, analyser, sélectionner et simuler sans risque. <button id="dqr-unlock-writes" class="btn btn-default btn-xs" type="button">Déverrouiller les annulations</button></div>'}${selectionBar(selected)}<div class="dqr-card"><h4>Annulation en masse</h4><div class="dqr-actions"><select id="dqr-cancel-reason" class="dqr-input"><option value="">Sans motif</option>${state.cancelReasons.map(x=>`<option value="${esc(x.value)}">${esc(x.description||x.value)} (${esc(x.value)})</option>`).join('')}</select><button id="dqr-simulate" class="btn btn-primary" ${selected.length?'':'disabled'}><i class="fa fa-check"></i> Simuler l’annulation (${fmt(selected.length)})</button>${sim&&sim.eligible.length?`<button id="dqr-run-cancel" class="btn btn-danger" ${state.writeUnlocked?'':'disabled title="Déverrouille d’abord les écritures"'}><i class="fa fa-trash"></i> Annuler ${fmt(sim.eligible.length)} réservation(s)</button>`:''}</div><p class="dqr-note"><strong>Ce que fait la simulation :</strong> elle recharge les réservations actives sans rien annuler, compare leur dernière modification et exclut automatiquement les dossiers disparus ou modifiés. Le motif utilise les valeurs autorisées HOLD_CANCELLATION lorsqu’elles sont accessibles par l’API.</p></div>${sim?simulationHtml(sim):''}${selected.length?`<div style="margin-top:12px">${renderTable(selected.map(h=>({...h,_q:evaluate(h),_age:daysSince(h.hold_date)})),true)}</div>`:empty('Aucune réservation sélectionnée.')}`;bindRows();$('dqr-unlock-writes')?.addEventListener('click',()=>{if(confirm('Déverrouiller les annulations pour CETTE SESSION uniquement ?\n\nUne simulation restera obligatoire avant chaque traitement.')){state.writeUnlocked=true;renderBatch()}});$('dqr-simulate')?.addEventListener('click',simulateCancellation);$('dqr-run-cancel')?.addEventListener('click',runCancellation)}
function simulationHtml(s){return `<div class="dqr-sim"><h4>Résultat de la simulation</h4><div class="dqr-sim-grid"><div class="dqr-sim-cell"><strong>${fmt(s.requested)}</strong><small>demandées</small></div><div class="dqr-sim-cell"><strong>${fmt(s.eligible.length)}</strong><small>encore actives et éligibles</small></div><div class="dqr-sim-cell"><strong>${fmt(s.changed.length)}</strong><small>ont changé depuis l’analyse</small></div><div class="dqr-sim-cell"><strong>${fmt(s.missing.length)}</strong><small>déjà absentes</small></div></div>${s.changed.length?`<p class="dqr-warning">Les ${fmt(s.changed.length)} réservation(s) modifiées depuis le chargement sont exclues automatiquement de l’action.</p>`:''}</div>`}
async function fetchAllHoldsForRecheck(){const rows=[];let page=1;while(true){const u=new URL(`${CFG.API}/holds`,location.origin);u.searchParams.set('_page',page);u.searchParams.set('_per_page',CFG.API_PAGE);u.searchParams.set('_order_by','hold_id');const r=await kfetch(u,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`Relecture réservations HTTP ${r.status}`);const data=await r.json();rows.push(...data.map(normalizeHold));if(data.length<CFG.API_PAGE)break;page++}return rows}
async function simulateCancellation(){const selected=selectedHolds();if(!selected.length)return;setStatus('Simulation : relecture de toutes les réservations actives…','loading');try{const fresh=await fetchAllHoldsForRecheck(),map=new Map(fresh.map(h=>[String(h.hold_id),h])),eligible=[],changed=[],missing=[];for(const old of selected){const now=map.get(String(old.hold_id));if(!now){missing.push(old);continue}const oldStamp=String(old.timestamp||''),newStamp=String(now.timestamp||'');if(oldStamp&&newStamp&&oldStamp!==newStamp){changed.push({old,now});continue}eligible.push(now)}state.simulation={requested:selected.length,eligible,changed,missing,createdAt:Date.now()};setStatus(`Simulation terminée : ${fmt(eligible.length)} encore éligible(s), ${fmt(changed.length)} modifiée(s), ${fmt(missing.length)} déjà absente(s).`,'ok');renderBatch()}catch(e){setStatus(`Simulation impossible : ${e.message}`,'error')}}
async function runCancellation(){if(!state.writeUnlocked)return alert('Les annulations sont verrouillées pour cette session.');const s=state.simulation;if(!s?.eligible?.length)return;const reason=$('dqr-cancel-reason')?.value||'';if(!confirm(`ANNULATION DE MASSE\n\n${s.eligible.length} réservation(s) seront envoyées au mécanisme natif Koha.\nMotif : ${reason||'aucun'}\n\nContinuer ?`))return;setStatus(`Envoi de ${fmt(s.eligible.length)} annulation(s) à Koha…`,'loading');try{const body={hold_ids:s.eligible.map(h=>Number(h.hold_id))};if(reason)body.cancellation_reason=reason;const r=await kfetch(`${CFG.API}/holds/cancellation_bulk`,{method:'DELETE',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify(body)});if(![200,201,202,204].includes(r.status)){let detail='';try{detail=(await r.json()).error||''}catch(_){}throw new Error(`HTTP ${r.status}${detail?` · ${detail}`:''}`)}let responseData=null;try{responseData=await r.json()}catch(_){}setStatus(responseData?.job_id?`Annulation confiée au job Koha #${responseData.job_id}. Relecture en cours…`:'Annulation acceptée par Koha. Relecture en cours…','loading');await sleep(1800);const fresh=await fetchAllHoldsForRecheck(),alive=new Set(fresh.map(h=>String(h.hold_id))),remaining=s.eligible.filter(h=>alive.has(String(h.hold_id))),gone=s.eligible.filter(h=>!alive.has(String(h.hold_id)));for(const h of gone)state.selected.delete(String(h.hold_id));state.holds=fresh;state.simulation=null;updateStats();renderBatch();if(remaining.length)setStatus(`${fmt(gone.length)} réservation(s) déjà absente(s) après traitement · ${fmt(remaining.length)} encore active(s), probablement en traitement de fond : ne pas les renvoyer immédiatement.`,'loading');else setStatus(`${fmt(gone.length)} réservation(s) annulée(s) et vérifiée(s).`,'ok')}catch(e){setStatus(`Annulation interrompue : ${e.message}`,'error')}}

function ruleHelp(r){return `<strong>Détecte :</strong> ${esc(r.title)}. <strong>Ce que cela ne prouve pas :</strong> ce signal seul ne démontre ni une erreur ni l’action à effectuer. <strong>Contrôle attendu :</strong> contrôler les dates, le statut actif, le site de retrait et l’historique avant toute annulation.${r.deep?' Cette règle ne s’active qu’après l’analyse approfondie.':''}`}
function renderRules(){const s=state.settings;$('dqr-content').innerHTML=`<div class="dqr-head"><div><h3>5 · Règles et source</h3><p><strong>Source :</strong> API REST Koha des réservations, chargée uniquement sur demande. Les seuils servent à détecter ; ils ne déclenchent jamais seuls une annulation.</p></div><div class="dqr-actions"><button id="dqr-save-settings" class="btn btn-primary">Enregistrer localement</button><button id="dqr-publish-settings" class="btn btn-default">Publier sur Firebase</button><button id="dqr-load-learning" class="btn btn-default">Charger l’apprentissage</button></div></div><div class="dqr-card"><h4>Seuils du module</h4><table class="dqr-settings"><tbody>${settingRow('oldDays','Réservation ancienne (jours)',s.oldDays)}${settingRow('veryOldDays','Très ancienne (jours)',s.veryOldDays)}${settingRow('idleDays','Sans mise à jour (jours)',s.idleDays)}${settingRow('waitingDays','Attente longue W (jours)',s.waitingDays)}${settingRow('waitingCriticalDays','Attente critique + expirée (jours)',s.waitingCriticalDays)}${settingRow('transitDays','Transit long T (jours)',s.transitDays)}${settingRow('processingDays','Traitement P figé (jours)',s.processingDays)}${settingRow('cancelRequestDays','Demande annulation non traitée (jours)',s.cancelRequestDays)}${settingRow('suspendIndefiniteDays','Suspension indéfinie ancienne (jours)',s.suspendIndefiniteDays)}${settingRow('suspendOverdueDays','Suspension échue (jours)',s.suspendOverdueDays)}</tbody></table></div><div class="dqr-card" style="margin-top:12px"><h4>Règles système actuelles</h4><table class="dqr-settings"><thead><tr><th>ID</th><th>Règle</th><th>Classe</th><th>Explication</th></tr></thead><tbody>${RULES.map(r=>`<tr><td><code>${r.id}</code></td><td>${esc(r.title)}</td><td>${severityBadge(r.severity)}</td><td class="dqr-note">${ruleHelp(r)}</td></tr>`).join('')}</tbody></table></div><div id="dqr-learning" style="margin-top:12px">${renderLearning()}</div>`;$('dqr-save-settings').addEventListener('click',saveSettingsFromForm);$('dqr-publish-settings').addEventListener('click',publishSettings);$('dqr-load-learning').addEventListener('click',loadLearning)}
function settingRow(k,label,v){return `<tr><td>${esc(label)}</td><td><input class="dqr-rule-setting dqr-input" type="number" min="1" max="5000" data-key="${k}" value="${Number(v)||0}"></td></tr>`}
function saveSettingsFromForm(){root.querySelectorAll('.dqr-rule-setting').forEach(i=>state.settings[i.dataset.key]=Math.max(1,Number(i.value)||1));try{localStorage.setItem(CFG.SETTINGS_KEY,JSON.stringify(state.settings))}catch(_){}setStatus('Seuils enregistrés localement.','ok');updateStats();renderRules()}
async function publishSettings(){saveSettingsFromForm();const mem=window.KohaQualityMemory;if(!mem)return setStatus('Client mémoire Firebase non chargé.','error');const st=await mem.connect(CFG.MODULE);if(!st.approved)return setStatus(`Poste Firebase non approuvé. UID : ${st.uid||'—'}`,'error');if(st.role!=='admin')return setStatus('Le poste doit avoir le rôle admin pour publier les seuils.','error');try{await mem.saveSettings(CFG.MODULE,state.settings);setStatus('Seuils publiés dans la mémoire Firebase du module.','ok')}catch(e){setStatus(e.message,'error')}}
function renderLearning(){if(!state.remoteFeedback.length)return '<div class="dqr-info">Charge les retours enregistrés dans Firebase pour voir quelles règles produisent le plus de validations ou de faux positifs.</div>';const grouped=new Map();for(const f of state.remoteFeedback){const k=f.rule_id||'pattern',g=grouped.get(k)||{id:k,total:0,a:0,n:0,w:0,i:0};g.total+=Number(f.total||0);g.a+=Number(f.count_anomaly||0);g.n+=Number(f.count_normal||0);g.w+=Number(f.count_watch||0);g.i+=Number(f.count_ignore||0);grouped.set(k,g)}return `<div class="dqr-card"><h4>Retours humains agrégés</h4><table class="dqr-settings"><thead><tr><th>Règle</th><th>Total</th><th>Anomalie</th><th>Normal</th><th>Surveiller</th><th>Lecture</th></tr></thead><tbody>${[...grouped.values()].sort((a,b)=>b.total-a.total).map(g=>{const rate=g.total?Math.round(g.a/g.total*100):0;return `<tr><td><code>${esc(g.id)}</code></td><td>${fmt(g.total)}</td><td>${fmt(g.a)}</td><td>${fmt(g.n)}</td><td>${fmt(g.w)}</td><td>${g.total>=10&&rate>=90?'<span class="dqr-badge ok">Très confirmé</span>':g.total>=10&&g.n/g.total>=.3?'<span class="dqr-badge review">Faux positifs à étudier</span>':'<span class="dqr-badge">Échantillon insuffisant</span>'}</td></tr>`}).join('')}</tbody></table></div>`}
async function loadLearning(){const mem=window.KohaQualityMemory;if(!mem)return setStatus('Client mémoire Firebase non chargé.','error');const st=await mem.connect(CFG.MODULE);if(!st.approved)return setStatus(`Poste non approuvé. UID : ${st.uid||'—'}`,'error');try{state.remoteFeedback=await mem.aggregateFeedback(CFG.MODULE);renderRules();setStatus(`${fmt(state.remoteFeedback.length)} motif(s) de feedback chargé(s).`,'ok')}catch(e){setStatus(e.message,'error')}}

async function loadMemoryClient(){if(window.KohaQualityMemory){initMemory();return}try{await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=CFG.MEMORY_SCRIPT;s.async=true;s.onload=resolve;s.onerror=()=>reject(new Error('script mémoire introuvable'));document.head.appendChild(s)});initMemory()}catch(_){state.memoryStatus={status:'missing',approved:false};if(state.tab==='memory')renderMemory()}}
async function initMemory(){try{const mem=window.KohaQualityMemory;if(!mem)return;mem.onStatus(s=>{state.memoryStatus=s;if(state.tab==='memory')renderMemory()});const st=await mem.connect(CFG.MODULE);state.memoryStatus=st;if(st.approved){const remote=await mem.getSettings(CFG.MODULE);if(remote&&Object.keys(remote).length){state.settings={...state.settings,...remote};try{localStorage.setItem(CFG.SETTINGS_KEY,JSON.stringify(state.settings))}catch(_){}updateStats();renderCurrent()}}}catch(_){} }
function renderMemory(){const mem=window.KohaQualityMemory,st=mem?mem.getStatus():(state.memoryStatus||{status:'missing'}),cfg=mem?.loadConfig?.();$('dqr-content').innerHTML=`<div class="dqr-head"><div><h3>6 · Mémoire Firebase du module</h3><p>Uniquement règles, seuils, motifs abstraits et retours humains. Aucune donnée nominative de lecteur n’est envoyée.</p></div></div><div class="dqr-quality"><div class="dqr-card"><strong>Client</strong><span class="value">${esc(st.status||'absent')}</span><small>version ${esc(st.version||'—')}</small></div><div class="dqr-card"><strong>Autorisation</strong><span class="value">${st.approved?'OK':'NON'}</span><small>rôle ${esc(st.role||'—')}</small></div><div class="dqr-card"><strong>UID du poste</strong><span class="value" style="font-size:14px">${esc(st.uid||'—')}</span><small>à approuver une seule fois dans Firestore</small></div><div class="dqr-card"><strong>Mode secours</strong><span class="value">LOCAL</span><small>les analyses continuent si Firebase est indisponible</small></div></div>${!mem?`<div class="dqr-danger">Le fichier commun <code>quality-memory-firebase.js</code> n’est pas chargé depuis ${esc(CFG.MEMORY_SCRIPT)}.</div>`:`<div class="dqr-card"><h4>Configuration Firebase Web</h4><textarea id="dqr-firebase-config" class="dqr-config" placeholder='{"apiKey":"…","authDomain":"…","projectId":"…","appId":"…"}'>${esc(cfg?JSON.stringify(cfg,null,2):'')}</textarea><div class="dqr-actions" style="margin-top:8px"><button id="dqr-fb-save" class="btn btn-primary">Enregistrer et connecter</button><button id="dqr-fb-connect" class="btn btn-default">Reconnecter</button><button id="dqr-fb-clear" class="btn btn-default">Effacer la configuration locale</button></div></div>`}`;if(mem){$('dqr-fb-save')?.addEventListener('click',async()=>{try{mem.saveConfig($('dqr-firebase-config').value,CFG.MODULE);const s=await mem.connect(CFG.MODULE);state.memoryStatus=s;renderMemory();setStatus(s.approved?'Firebase connecté et poste approuvé.':`Demande créée. UID à approuver : ${s.uid}` ,s.approved?'ok':'loading')}catch(e){setStatus(e.message,'error')}});$('dqr-fb-connect')?.addEventListener('click',async()=>{const s=await mem.connect(CFG.MODULE);state.memoryStatus=s;renderMemory()});$('dqr-fb-clear')?.addEventListener('click',()=>{if(confirm('Effacer uniquement la configuration Firebase de ce navigateur ?')){mem.clearConfig(CFG.MODULE);renderMemory()}})}}

function feedbackContext(h,ruleId){const q=evaluate(h),hit=q.hits.find(x=>x.id===ruleId);return {primary_rule:ruleId||'DOSSIER',severity:hit?.severity||q.severity,nature:ruleId==='DOSSIER'?'case':'rule',certainty:ruleId&&ruleId!=='DOSSIER'?'rule_level':'global_judgement',priority:q.severity,status:h.suspended?'SUSP':(h.status||'NORMAL'),age_bucket:ageBucket(daysSince(h.hold_date)),last_update_bucket:ageBucket(daysSince(h.timestamp)),item_level:!!h.item_id,expired:!!(h.expiration_date&&Date.parse(h.expiration_date)<Date.now()),pickup_library_id:h.pickup_library_id||'none',cancellation_requested:!!h.cancellation_requested}}
async function sendFeedback(id,ruleId,decision){const h=state.holds.find(x=>String(x.hold_id)===String(id));if(!h)return;const mem=window.KohaQualityMemory;if(!mem)return setStatus('Feedback non enregistré : mémoire Firebase non chargée.','error');try{const r=await mem.submitFeedback({module:CFG.MODULE,ruleId:ruleId||'DOSSIER',decision,context:feedbackContext(h,ruleId)});setStatus(r.queued?'Retour mis en file locale ; il sera envoyé quand Firebase sera disponible.':`Retour enregistré pour ${ruleId||'le dossier'}.`,'ok')}catch(e){setStatus(`Feedback : ${e.message}`,'error')}}

function exportCsv(){const rows=filtered();const headers=['hold_id','biblio_id','titre','item_id','pickup','status','hold_date','age_days','timestamp','expiration_date','suspended','severity','rules'];const csv=[headers.join(';')];for(const h of rows){const q=evaluate(h);const vals=[h.hold_id,h.biblio_id,h.title,h.item_id,h.pickup_library_id,statusLabel(h),h.hold_date,daysSince(h.hold_date),h.timestamp,h.expiration_date,h.suspended,q.severity,q.hits.map(x=>x.id).join(',')].map(csvCell);csv.push(vals.join(';'))}const blob=new Blob(['\ufeff'+csv.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`qualite-reservations-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csvCell(v){const s=String(v??'');return /[;"\r\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s}

})();
</script>
