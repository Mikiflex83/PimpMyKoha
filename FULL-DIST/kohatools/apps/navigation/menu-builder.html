<div id="kt-menu-builder"><div class="ktmb-loading">Chargement de l’éditeur…</div></div>
<style>
#kt-menu-builder{font-family:Arial,Helvetica,sans-serif;max-width:1150px;margin:0 auto;color:#26313a}#kt-menu-builder *{box-sizing:border-box}.ktmb-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:16px}.ktmb-head h2{margin:0 0 4px}.ktmb-card{background:#fff;border:1px solid #d8dee3;border-radius:8px;padding:16px;margin-bottom:14px}.ktmb-help{background:#f3f8fb;border:1px solid #c7d8e3;padding:11px;border-radius:6px;margin-bottom:12px}.ktmb-tree{list-style:none;margin:0;padding:0}.ktmb-row{display:flex;align-items:center;gap:8px;padding:9px;margin:6px 0;border:1px solid #dfe4e8;border-radius:6px;background:#fafbfc}.ktmb-label{flex:1;font-weight:600}.ktmb-kind{font-size:11px;color:#66727c;background:#eef1f3;padding:2px 6px;border-radius:10px}.ktmb-children{list-style:none;margin:4px 0 4px 28px;padding-left:12px;border-left:2px solid #e3e7ea}.ktmb-btn{border:1px solid #aeb8c4;background:#fff;border-radius:5px;padding:5px 8px;cursor:pointer}.ktmb-btn.primary{background:#1f6fb2;border-color:#1f6fb2;color:#fff}.ktmb-btn.danger{color:#a32a22;border-color:#d9aaa6}.ktmb-actions{display:flex;gap:7px;flex-wrap:wrap}.ktmb-form{display:grid;grid-template-columns:180px 1fr;gap:10px 14px;align-items:center}.ktmb-form input,.ktmb-form select{width:100%;padding:7px;border:1px solid #b9c2ca;border-radius:5px}.ktmb-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10050;display:flex;align-items:center;justify-content:center}.ktmb-modal-box{background:#fff;width:min(680px,94vw);max-height:90vh;overflow:auto;border-radius:9px;padding:20px}.ktmb-note{font-size:12px;color:#66727c}.ktmb-status{padding:9px 11px;border-radius:5px;margin-top:10px}.ktmb-status.ok{background:#edf8e7;color:#355d23}.ktmb-status.err{background:#fff0f0;color:#8a2626}@media(max-width:700px){.ktmb-form{grid-template-columns:1fr}.ktmb-row{flex-wrap:wrap}}
</style>
<script>
(function(){"use strict";const KT=window.KohaTools,root=document.getElementById('kt-menu-builder');if(!KT||!root)return;const cid=window.__KohaToolsCurrentModuleId||'user-menu-manager',isUser=cid==='user-menu-manager',remote=KT.getService('remote-config'),host=KT.getService('module-host');let cfg=JSON.parse(JSON.stringify(KT.Config.getCanonicalPersistent(cid,true)||{}));cfg.menu=cfg.menu||{};cfg.menu.items=Array.isArray(cfg.menu.items)?cfg.menu.items:[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function modules(){return (host?.list?.()||[]).filter(x=>![cid].includes(x.id)).sort((a,b)=>String(a.title).localeCompare(String(b.title),'fr'))}
function kind(n){return({submenu:'Sous-menu',module:'Module KohaTools',koha:'Page Koha',page:'Ancienne page Koha',external:'Lien externe',separator:'Séparateur',action:'Action'})[n.type]||n.type||'Lien'}
function getAt(path){let arr=cfg.menu.items,node=null;for(let i=0;i<path.length;i++){node=arr[path[i]];if(i<path.length-1)arr=node.children||(node.children=[])}return node}
function arrAt(parent){let arr=cfg.menu.items;for(const i of parent){const n=arr[i];arr=n.children||(n.children=[])}return arr}
function tree(items,path=[]){return `<ul class="${path.length?'ktmb-children':'ktmb-tree'}">${items.map((n,i)=>{const p=[...path,i],ps=p.join('.');return `<li><div class="ktmb-row"><span class="ktmb-kind">${esc(kind(n))}</span><span class="ktmb-label">${esc(n.label||n.module||n.url||(n.type==='separator'?'— Séparateur —':'Sans titre'))}</span><button class="ktmb-btn" data-up="${ps}" title="Monter">↑</button><button class="ktmb-btn" data-down="${ps}" title="Descendre">↓</button>${n.type==='submenu'?`<button class="ktmb-btn" data-add-child="${ps}">+ Sous-menu</button>`:''}<button class="ktmb-btn" data-edit="${ps}">Modifier</button><button class="ktmb-btn danger" data-del="${ps}">Supprimer</button></div>${n.children?.length?tree(n.children,p):''}</li>`}).join('')}</ul>`}
function render(){root.innerHTML=`<div class="ktmb-head"><div><h2>${isUser?'Menu utilisateur Koha':'Menu IntranetNav'}</h2><p>${isUser?'Construit « Mes outils » directement dans le menu utilisateur natif, en haut à droite.':'Construit les menus et sous-menus de la barre IntranetNav sans écrire de HTML.'}</p></div></div><div class="ktmb-help"><strong>Aucun code à saisir.</strong> Ajoutez un module KohaTools, une page Koha, un lien externe, un sous-menu ou un séparateur. Les modules KohaTools sont reliés automatiquement à leur page virtuelle.</div><div class="ktmb-card">${isUser?`<div class="ktmb-form"><label>Nom du menu racine</label><input id="ktmb-root-label" value="${esc(cfg.menu.rootLabel||'Mes outils')}"><label>Visibilité</label><select id="ktmb-audience"><option value="all" ${(cfg.menu.audience||'all')==='all'?'selected':''}>Tous les utilisateurs</option><option value="users" ${(cfg.menu.audience||'all')!=='all'?'selected':''}>Utilisateurs précis</option></select><label>Utilisateurs (séparés par virgules)</label><input id="ktmb-users" value="${esc((cfg.menu.audience?.usernames||[]).join(', '))}" placeholder="prenom.nom, autre.compte"></div>`:''}<div class="ktmb-actions" style="margin-top:12px"><button class="ktmb-btn primary" data-add-root>+ Ajouter une entrée</button></div></div><div class="ktmb-card"><h3>Structure du menu</h3>${tree(cfg.menu.items)}</div><div class="ktmb-actions"><button class="ktmb-btn primary" id="ktmb-save">Enregistrer pour tous les postes</button><button class="ktmb-btn" id="ktmb-preview">Actualiser l’aperçu dans Koha</button></div><div id="ktmb-status"></div>`;bind()}
function path(s){return s===''?[]:String(s).split('.').map(Number)}
function move(p,dir){const parent=p.slice(0,-1),arr=arrAt(parent),i=p[p.length-1],j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];render()}
function editor(parentPath,editPath=null){const old=editPath?getAt(editPath):null,n=old?JSON.parse(JSON.stringify(old)):{type:'module',label:'',module:'',url:'',pageId:'',newTab:false,children:[]};const overlay=document.createElement('div');overlay.className='ktmb-modal';overlay.innerHTML=`<div class="ktmb-modal-box"><h3>${old?'Modifier':'Ajouter'} une entrée</h3><div class="ktmb-form"><label>Type</label><select id="e-type">${[['module','Module KohaTools'],['submenu','Sous-menu'],['koha','Page / URL Koha'],['external','Lien externe'],['page','Ancienne page Koha'],['separator','Séparateur'],['action','Action intégrée']].map(([v,l])=>`<option value="${v}" ${n.type===v?'selected':''}>${l}</option>`).join('')}</select><label>Libellé</label><input id="e-label" value="${esc(n.label||'')}"><label>Module</label><select id="e-module"><option value="">— choisir —</option>${modules().map(m=>`<option value="${esc(m.id)}" ${n.module===m.id?'selected':''}>${esc(m.title||m.id)}</option>`).join('')}</select><label>URL</label><input id="e-url" value="${esc(n.url||'')}" placeholder="/cgi-bin/koha/... ou https://..."><label>ID de page Koha</label><input id="e-page" type="number" value="${esc(n.pageId||'')}"><label>Action</label><select id="e-action"><option value="dashboard" ${n.action==='dashboard'?'selected':''}>Ouvrir le tableau de bord</option></select><label>Icône Font Awesome (optionnel)</label><input id="e-icon" value="${esc(n.icon||'')}" placeholder="fa fa-calendar"><label>Ouverture</label><label><input id="e-new" type="checkbox" ${n.newTab?'checked':''}> Nouvel onglet</label></div><p class="ktmb-note">Les champs inutiles pour le type choisi sont simplement ignorés.</p><div class="ktmb-actions"><button class="ktmb-btn primary" id="e-ok">Valider</button><button class="ktmb-btn" id="e-cancel">Annuler</button></div></div>`;document.body.appendChild(overlay);overlay.querySelector('#e-cancel').onclick=()=>overlay.remove();overlay.querySelector('#e-ok').onclick=()=>{const type=overlay.querySelector('#e-type').value,item={type};if(type!=='separator'){item.label=overlay.querySelector('#e-label').value.trim()}if(type==='module')item.module=overlay.querySelector('#e-module').value;if(type==='koha'||type==='external')item.url=overlay.querySelector('#e-url').value.trim();if(type==='page')item.pageId=Number(overlay.querySelector('#e-page').value||0);if(type==='action')item.action=overlay.querySelector('#e-action').value;item.icon=overlay.querySelector('#e-icon').value.trim();item.newTab=overlay.querySelector('#e-new').checked;if(type==='submenu')item.children=old?.children||[];if(editPath){const a=arrAt(editPath.slice(0,-1));a[editPath.at(-1)]=item}else arrAt(parentPath).push(item);overlay.remove();render()}}
function bind(){root.querySelector('[data-add-root]')?.addEventListener('click',()=>editor([]));root.querySelectorAll('[data-add-child]').forEach(b=>b.onclick=()=>editor(path(b.dataset.addChild)));root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editor(path(b.dataset.edit).slice(0,-1),path(b.dataset.edit)));root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const p=path(b.dataset.del),a=arrAt(p.slice(0,-1));if(confirm('Supprimer cette entrée et ses sous-menus éventuels ?')){a.splice(p.at(-1),1);render()}});root.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(path(b.dataset.up),-1));root.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(path(b.dataset.down),1));document.getElementById('ktmb-preview').onclick=()=>KT.getService('navigation')?.refresh?.();document.getElementById('ktmb-save').onclick=save}
async function save(){if(isUser){cfg.menu.rootLabel=document.getElementById('ktmb-root-label').value.trim()||'Mes outils';const mode=document.getElementById('ktmb-audience').value;cfg.menu.audience=mode==='all'?'all':{mode:'users',usernames:document.getElementById('ktmb-users').value.split(',').map(x=>x.trim()).filter(Boolean)}}const s=document.getElementById('ktmb-status');s.className='ktmb-status';s.textContent='Enregistrement…';const r=await remote?.saveCanonical?.(cid,cfg);if(r?.ok){s.className='ktmb-status ok';s.textContent='Menu enregistré pour l’installation.';KT.getService('navigation')?.refresh?.()}else{s.className='ktmb-status err';s.textContent='Impossible d’enregistrer globalement : '+(r?.error||'écriture désactivée')+'. Les modifications restent dans cette page tant qu’elles ne sont pas enregistrées.'}}
render();})();
</script>
