<style>#kt-preflight{font-family:system-ui,sans-serif}.ktp-grid{display:grid;gap:12px}.ktp-card{border:1px solid #ddd;border-radius:10px;padding:14px;background:#fff}.ktp-ok{border-left:5px solid #2e7d32}.ktp-bad{border-left:5px solid #c62828}.ktp-row{display:flex;justify-content:space-between;gap:12px;align-items:start}.ktp-code{white-space:pre-wrap;background:#f6f6f6;padding:10px;max-height:280px;overflow:auto}.ktp-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.ktp-stat{border:1px solid #ddd;border-radius:8px;padding:10px;text-align:center}.ktp-actions{display:flex;gap:7px;flex-wrap:wrap}.ktp-result{font-size:.9em;margin-top:5px}.ktp-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.ktp-step{border:1px solid #ddd;border-radius:9px;padding:10px;background:#fafbfc}.ktp-step b{display:block}.ktp-step small{color:#667}.ktp-step.ok{border-left:4px solid #2e7d32}.ktp-step.warn{border-left:4px solid #d78b00}@media(max-width:750px){.ktp-steps{grid-template-columns:1fr}}</style>
<div id="kt-preflight"><h2>Assistant de première installation</h2><p>Pimp My Koha vérifie d’abord l’installation, puis vous guide uniquement sur les raccordements locaux indispensables. Les modules restent indépendants.</p><div id="ktp-steps" class="ktp-steps"></div><div id="ktp-summary"></div><div class="ktp-actions"><button id="ktp-detect" type="button">Détecter mon Koha</button><button id="ktp-export" type="button" hidden>Exporter le profil détecté</button></div><pre id="ktp-profile" class="ktp-code" hidden></pre><div id="ktp-list" class="ktp-grid"></div></div>
<script>(function(){const KT=window.KohaTools,P=KT?.getService?.('prerequisites'),root=document.getElementById('ktp-list'),sum=document.getElementById('ktp-summary');if(!P||!root)return;const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const rows=P.all().filter(x=>x.list.length),blocked=rows.filter(x=>!x.ok),ready=rows.length-blocked.length,health=KT.getService('health'),updates=KT.getService('updates'),remote=KT.getService('remote-config'),canon=Object.keys(KT.Config?.effective?.canonicalModules||{}),usable=canon.filter(id=>KT.Config?.getCanonicalPersistent?.(id,true)?.enabled!==false&&P.status(id).ok).length;const koha=health?.kohaVersion?.()||'non détectée',mode=updates?.status?.().installationMode||KT.deploymentMode||'inconnu',remoteOn=remote?.status?.().enabled===true;document.getElementById('ktp-steps').innerHTML=[['1','Installation détectée',KT.version?'ok':'warn',`Pimp My Koha ${KT.version||'?'}`],['2','Version Koha',koha!=='non détectée'?'ok':'warn',koha],['3','Mode de distribution','ok',mode],['4','Services facultatifs',remoteOn?'ok':'warn',remoteOn?'Configuration partagée active':'Fonctionnement local possible'],['5','Vérification',blocked.length?'warn':'ok',blocked.length?`${blocked.length} module(s) à compléter`:'Prérequis essentiels résolus'],['6','Modules disponibles',usable?'ok':'warn',`${usable}/${canon.length} utilisables selon la configuration`]].map(x=>`<div class="ktp-step ${x[2]}"><b>${x[0]} · ${x[1]}</b><small>${esc(x[3])}</small></div>`).join('');sum.innerHTML=`<div class="ktp-summary"><div class="ktp-stat"><b>${ready}</b><br>modules prêts</div><div class="ktp-stat"><b>${blocked.length}</b><br>à configurer</div><div class="ktp-stat"><b>${rows.reduce((n,x)=>n+x.blocking.length,0)}</b><br>actions obligatoires</div></div>`;root.innerHTML=rows.map(x=>`<section class="ktp-card ${x.ok?'ktp-ok':'ktp-bad'}"><div class="ktp-row"><div><b>${esc(x.moduleId)}</b><div>${x.ok?'Prêt':'Configuration requise'}</div></div><span>${x.blocking.length} bloquant(s)</span></div>${x.list.map(p=>`<details ${p.blocking?'open':''}><summary>${p.resolved?'✓':'○'} ${esc(p.label||p.id)} ${p.required?'(obligatoire)':'(optionnel)'}</summary><p>${esc(p.instructions||'')}</p><div class="ktp-actions">${P.sourcePath(p)?`<button type="button" data-copy="${esc(x.moduleId)}" data-pid="${esc(p.id)}">Copier le contenu à installer</button>`:''}${p.resolved?`<button type="button" data-test="${esc(x.moduleId)}" data-pid="${esc(p.id)}">Tester</button>`:''}<button type="button" data-config="${esc(x.moduleId)}">Configurer le module</button></div><div><code>${esc(p.configPath||'')}</code> : ${esc(p.value??'non renseigné')}</div><div class="ktp-result" data-result="${esc(x.moduleId)}:${esc(p.id)}"></div><pre class="ktp-code" data-source="${esc(x.moduleId)}:${esc(p.id)}" hidden></pre></details>`).join('')}</section>`).join('');root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const p=P.status(b.dataset.copy).list.find(x=>x.id===b.dataset.pid);try{const text=await P.copy(p);const pre=root.querySelector(`[data-source="${CSS.escape(b.dataset.copy+':'+b.dataset.pid)}"]`);if(pre){pre.textContent=text;pre.hidden=false}b.textContent='Copié ✓'}catch(e){alert('Impossible de charger la source : '+e.message)}});root.querySelectorAll('[data-test]').forEach(b=>b.onclick=async()=>{const r=await P.test(b.dataset.test,b.dataset.pid),el=root.querySelector(`[data-result="${CSS.escape(b.dataset.test+':'+b.dataset.pid)}"]`);if(el)el.textContent=(r.ok?'✓ ':'✕ ')+(r.label||r.reason||'test')+(r.detail?' — '+r.detail:'')});root.querySelectorAll('[data-config]').forEach(b=>b.onclick=()=>KT.getService('admin-ui')?.openConfig?.(b.dataset.config,true));let detected=null;document.getElementById('ktp-detect').onclick=async e=>{e.target.disabled=true;e.target.textContent='Détection…';const r=await KT.getService('installation-profile')?.detect?.();e.target.disabled=false;e.target.textContent='Détecter mon Koha';if(!r)return;detected=r.profile;const pre=document.getElementById('ktp-profile');pre.hidden=false;pre.textContent=JSON.stringify(r.profile,null,2);document.getElementById('ktp-export').hidden=false};document.getElementById('ktp-export').onclick=()=>detected&&KT.getService('installation-profile')?.download?.(detected)})();</script>
