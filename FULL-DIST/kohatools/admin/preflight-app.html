<style>#kt-preflight{font-family:system-ui,sans-serif}.ktp-grid{display:grid;gap:12px}.ktp-card{border:1px solid #ddd;border-radius:10px;padding:14px;background:#fff}.ktp-ok{border-left:5px solid #2e7d32}.ktp-bad{border-left:5px solid #c47b00}.ktp-row{display:flex;justify-content:space-between;gap:12px;align-items:start}.ktp-code{white-space:pre-wrap;background:#f6f6f6;padding:10px;max-height:280px;overflow:auto}.ktp-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.ktp-stat{border:1px solid #ddd;border-radius:8px;padding:10px;text-align:center}.ktp-actions{display:flex;gap:7px;flex-wrap:wrap}.ktp-result{font-size:.9em;margin-top:5px}.ktp-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.ktp-step{border:1px solid #ddd;border-radius:9px;padding:10px;background:#fafbfc}.ktp-step b{display:block}.ktp-step small{color:#667}.ktp-step.ok{border-left:4px solid #2e7d32}.ktp-step.warn{border-left:4px solid #d78b00}.ktp-help{padding:10px 12px;border-radius:8px;background:#f6f8fa;margin:10px 0}.ktp-tech{margin-top:8px;color:#667}@media(max-width:750px){.ktp-steps,.ktp-summary{grid-template-columns:1fr}}</style>
<div id="kt-preflight"><h2>Préparer l’installation</h2><p>Cette vérification vous indique uniquement ce qui manque pour utiliser les modules choisis. Rien n’est modifié automatiquement dans Koha.</p><div id="ktp-steps" class="ktp-steps"></div><div id="ktp-summary"></div><div class="ktp-actions"><button id="ktp-detect" type="button">Vérifier mon Koha</button><button id="ktp-export" type="button" hidden>Exporter les informations détectées</button></div><div id="ktp-detect-result" class="ktp-help" hidden></div><details id="ktp-profile-details" class="ktp-tech" hidden><summary>Détails techniques détectés</summary><pre id="ktp-profile" class="ktp-code"></pre></details><div id="ktp-list" class="ktp-grid"></div></div>
<script>(function(){const KT=window.KohaTools,P=KT?.getService?.('prerequisites'),A=KT?.getService?.('access-control'),root=document.getElementById('ktp-list'),sum=document.getElementById('ktp-summary');if(!P||!root)return;const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const isDev=!!A?.can?.('developer'),ui=KT.Config?.effective?.moduleUi?.modules||{},title=id=>ui?.[id]?.title||String(id||'Module').replace(/[-_]+/g,' ');const rows=P.all().filter(x=>x.list.length),blocked=rows.filter(x=>!x.ok),ready=rows.length-blocked.length,health=KT.getService('health');const koha=health?.kohaVersion?.()||'non détectée';document.getElementById('ktp-steps').innerHTML=[['1','Pimp My Koha','ok',KT.version?`Version ${KT.version}`:'Installé'],['2','Koha',koha!=='non détectée'?'ok':'warn',koha],['3','Éléments à préparer',blocked.length?'warn':'ok',blocked.length?`${blocked.length} module(s) à compléter`:'Rien de bloquant'],['4','Prêt à utiliser',blocked.length?'warn':'ok',blocked.length?'Terminez les éléments signalés':'Installation prête']].map(x=>`<div class="ktp-step ${x[2]}"><b>${x[0]} · ${x[1]}</b><small>${esc(x[3])}</small></div>`).join('');sum.innerHTML=`<div class="ktp-summary"><div class="ktp-stat"><b>${ready}</b><br>module(s) préparé(s)</div><div class="ktp-stat"><b>${blocked.length}</b><br>à compléter</div><div class="ktp-stat"><b>${rows.reduce((n,x)=>n+x.blocking.length,0)}</b><br>action(s) obligatoire(s)</div></div>`;root.innerHTML=rows.map(x=>`<section class="ktp-card ${x.ok?'ktp-ok':'ktp-bad'}"><div class="ktp-row"><div><b>${esc(title(x.moduleId))}</b><div>${x.ok?'Prêt':'À préparer'}</div></div><span>${x.blocking.length?`${x.blocking.length} action(s) obligatoire(s)`:'OK'}</span></div>${x.list.map(p=>`<details ${p.blocking?'open':''}><summary>${p.resolved?'✓':'○'} ${esc(p.label||p.id)} ${p.required?'(obligatoire)':'(facultatif)'}</summary><p>${esc(p.instructions||'')}</p><div class="ktp-actions">${P.sourcePath(p)?`<button type="button" data-copy="${esc(x.moduleId)}" data-pid="${esc(p.id)}">Copier ce qu’il faut créer</button>`:''}${p.resolved?`<button type="button" data-test="${esc(x.moduleId)}" data-pid="${esc(p.id)}">Tester</button>`:''}<button type="button" data-config="${esc(x.moduleId)}">Ouvrir les réglages</button></div>${isDev?`<div class="ktp-tech"><code>${esc(p.configPath||'')}</code> : ${esc(p.value??'non renseigné')}</div>`:''}<div class="ktp-result" data-result="${esc(x.moduleId)}:${esc(p.id)}"></div><pre class="ktp-code" data-source="${esc(x.moduleId)}:${esc(p.id)}" hidden></pre></details>`).join('')}</section>`).join('')||'<div class="ktp-help"><b>Aucune préparation particulière n’est nécessaire.</b> Vous pouvez revenir aux modules et activer ceux dont vous avez besoin.</div>';root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const p=P.status(b.dataset.copy).list.find(x=>x.id===b.dataset.pid);try{const text=await P.copy(p);const pre=root.querySelector(`[data-source="${CSS.escape(b.dataset.copy+':'+b.dataset.pid)}"]`);if(pre){pre.textContent=text;pre.hidden=false}b.textContent='Copié ✓'}catch(e){alert('Impossible de charger le contenu : '+e.message)}});root.querySelectorAll('[data-test]').forEach(b=>b.onclick=async()=>{const r=await P.test(b.dataset.test,b.dataset.pid),el=root.querySelector(`[data-result="${CSS.escape(b.dataset.test+':'+b.dataset.pid)}"]`);if(el)el.textContent=(r.ok?'✓ ':'✕ ')+(r.label||r.reason||'test')+(r.detail?' — '+r.detail:'')});root.querySelectorAll('[data-config]').forEach(b=>b.onclick=()=>KT.getService('admin-ui')?.openConfig?.(b.dataset.config,true));let detected=null;document.getElementById('ktp-detect').onclick=async e=>{e.target.disabled=true;e.target.textContent='Vérification…';const r=await KT.getService('installation-profile')?.detect?.();e.target.disabled=false;e.target.textContent='Vérifier mon Koha';if(!r)return;detected=r.profile;const i=r.profile?.installation||{},el=document.getElementById('ktp-detect-result');el.hidden=false;el.innerHTML=`<b>Vérification terminée.</b> ${Number(i.branches?.length||0)} bibliothèque(s), ${Number(i.itemtypes?.length||0)} type(s) de document et ${Number(i.patronCategories?.length||0)} catégorie(s) de lecteur détectés.${r.errors?.length?' Certaines informations n’ont pas pu être lues. Cela ne bloque pas les autres modules.':''}`;if(isDev){const det=document.getElementById('ktp-profile-details'),pre=document.getElementById('ktp-profile');det.hidden=false;pre.textContent=JSON.stringify(r.profile,null,2);document.getElementById('ktp-export').hidden=false}};document.getElementById('ktp-export').onclick=()=>detected&&KT.getService('installation-profile')?.download?.(detected)})();</script>
