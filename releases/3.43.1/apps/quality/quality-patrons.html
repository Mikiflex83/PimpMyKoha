<style>
#dqp-app{--g:#6f8f32;--gd:#526d22;--b:#d8dee3;--m:#697680;--crit:#8a2525;--rev:#9a6415;--at:#315f88;max-width:1700px;margin:0 auto 40px;color:#28343d}#dqp-app *{box-sizing:border-box}.dqp-loading{padding:35px;text-align:center}.dqp-hero{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 22px;border:1px solid #cedbbd;border-left:5px solid var(--g);border-radius:7px;background:linear-gradient(135deg,#fff,#f5f9ef);margin-bottom:12px}.dqp-hero h2{margin:2px 0;color:var(--gd)}.dqp-hero p,.dqp-note{margin:3px 0;color:var(--m)}.dqp-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.dqp-status{display:none;padding:10px 13px;border:1px solid var(--b);border-radius:6px;margin:10px 0}.dqp-status.visible{display:block}.dqp-status.loading{background:#f3f8fb}.dqp-status.ok{background:#f2f8eb;border-color:#cadcb2}.dqp-status.error{background:#fff1f1;border-color:#e1b5b5;color:#822929}.dqp-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:12px 0}.dqp-step{border:1px solid var(--b);background:#fff;border-radius:7px;padding:9px;text-align:left}.dqp-step.active{border-color:var(--g);box-shadow:inset 0 -3px 0 var(--g)}.dqp-step strong,.dqp-step small{display:block}.dqp-step small{color:var(--m)}.dqp-toolbar{display:grid;grid-template-columns:2fr repeat(4,minmax(130px,1fr));gap:7px;padding:10px;border:1px solid var(--b);border-radius:7px;background:#fff;margin-bottom:10px}.dqp-toolbar input,.dqp-toolbar select,.dqp-card input{width:100%;border:1px solid #bcc6cd;border-radius:5px;padding:6px 8px;background:#fff}.dqp-stats,.dqp-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:10px 0}.dqp-stat,.dqp-card{background:#fff;border:1px solid var(--b);border-radius:7px;padding:11px 13px}.dqp-stat span{display:block;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--m)}.dqp-stat strong{display:block;font-size:22px;color:var(--gd)}.dqp-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin:12px 0}.dqp-table-wrap{overflow:auto;border:1px solid var(--b);border-radius:7px;background:#fff}.dqp-table{width:100%;border-collapse:collapse;font-size:12px}.dqp-table th,.dqp-table td{padding:7px 8px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:top}.dqp-table th{background:#f7f8f9;position:sticky;top:0;z-index:1}.dqp-badge{display:inline-block;padding:2px 7px;border-radius:12px;background:#e9eef1;color:#53616b;font-size:10px;font-weight:700}.dqp-badge.critical{background:#fde4e4;color:var(--crit)}.dqp-badge.review{background:#fff0cf;color:var(--rev)}.dqp-badge.atypical{background:#e6f1fb;color:var(--at)}.dqp-badge.ok{background:#e7f2db;color:#4d6a20}.dqp-info,.dqp-warn,.dqp-danger{padding:10px 12px;border-radius:5px;margin:9px 0;font-size:12px}.dqp-info{background:#f3f8fb;border:1px solid #c8d9e4}.dqp-warn{background:#fff8e8;border:1px solid #e2ce98}.dqp-danger{background:#fff1f1;border:1px solid #e1b4b4;color:#812929}.dqp-selection{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 11px;background:#f8faf6;border:1px solid #d7e1c8;border-radius:6px;margin:8px 0}.dqp-pager{display:flex;justify-content:center;gap:6px;margin:10px}@media(max-width:1100px){.dqp-steps{grid-template-columns:repeat(3,1fr)}.dqp-toolbar{grid-template-columns:repeat(3,1fr)}.dqp-stats,.dqp-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.dqp-hero,.dqp-head,.dqp-selection{flex-direction:column;align-items:stretch}.dqp-steps,.dqp-toolbar,.dqp-stats,.dqp-grid{grid-template-columns:1fr}}
</style>
<script>
(function(){
'use strict';if(window.__dracQualityPatronsV1)return;window.__dracQualityPatronsV1=true;
const CFG={MODULE:'patrons',VERSION:'1.5.0',API:'/api/v1/patrons',HOLDS:'/api/v1/holds',MEMORY:'__KOHATOOLS_ASSET_ROOT__apps/quality/shared/quality-memory-firebase.js?ktv=3.43.1',SETTINGS_KEY:'dq_patrons_settings_v1',PAGE:50,PER_PAGE:500,MIN_GAP:250,DEEP_MAX:200,DEFAULTS:{expiredAtypicalDays:365,expiredReviewDays:1095,deleteCandidateDays:1825}};const root=document.getElementById('dqp-app');if(!root)return;const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),fmt=v=>new Intl.NumberFormat('fr-FR').format(Number(v)||0),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tail=Promise.resolve(),lastEnd=0;function kfetch(url,opt={}){const job=tail.catch(()=>{}).then(async()=>{const w=Math.max(0,CFG.MIN_GAP-(Date.now()-lastEnd));if(w)await sleep(w);try{return await fetch(url,opt)}finally{lastEnd=Date.now()}});tail=job.catch(()=>{});return job}function loadSettings(){try{return{...CFG.DEFAULTS,...JSON.parse(localStorage.getItem(CFG.SETTINGS_KEY)||'{}')}}catch(_){return{...CFG.DEFAULTS}}}const state={rows:[],tab:'overview',page:1,search:'',severity:'',library:'',category:'',expired:'',selected:new Set(),settings:loadSettings(),loading:false,stop:false,deep:new Map(),memoryStatus:null};const RANK={ok:0,atypical:1,review:2,critical:3};function days(v){const t=Date.parse(v||'');return Number.isFinite(t)?Math.floor((Date.now()-t)/86400000):null}function bucket(n){if(n==null)return'unknown';if(n<0)return'future';if(n<365)return'<1y';if(n<1095)return'1-3y';if(n<1825)return'3-5y';return'5y+'}function fold(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim()}function emailOk(v){return!v||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v).trim())}
function norm(o){return{id:Number(o.patron_id),card:o.cardnumber||'',surname:o.surname||'',firstname:o.firstname||'',dob:o.date_of_birth||o.dateofbirth||null,enrolled:o.date_enrolled||o.dateenrolled||null,expiry:o.expiry_date||o.dateexpiry||null,category:o.category_id||o.categorycode||'',library:o.library_id||o.branchcode||'',email:o.email||'',phone:o.phone||'',mobile:o.mobile||'',protected:!!(o.protected||o.is_protected),last_seen:o.last_seen||o.lastseen||null,updated:o.updated_on||o.updated_at||null,raw:o}}
const RULES=[{id:'PAT-001',title:'Numéro de carte absent',severity:'review',test:r=>!r.card},{id:'PAT-002',title:'Nom absent',severity:'critical',test:r=>!r.surname},{id:'PAT-003',title:'Catégorie absente',severity:'critical',test:r=>!r.category},{id:'PAT-004',title:"Bibliothèque d'inscription absente",severity:'critical',test:r=>!r.library},{id:'PAT-005',title:'Date de naissance future',severity:'critical',test:r=>r.dob&&Date.parse(r.dob)>Date.now()},{id:'PAT-006',title:"Expiration antérieure à l'inscription",severity:'review',test:r=>r.expiry&&r.enrolled&&Date.parse(r.expiry)<Date.parse(r.enrolled)},{id:'PAT-007',title:'Compte expiré depuis plus d’un an',severity:'atypical',test:r=>days(r.expiry)>=state.settings.expiredAtypicalDays},{id:'PAT-008',title:'Compte expiré depuis plus de trois ans',severity:'review',test:r=>days(r.expiry)>=state.settings.expiredReviewDays},{id:'PAT-009',title:'Adresse email invalide',severity:'review',test:r=>!emailOk(r.email)},{id:'PAT-010',title:'Aucun canal de contact',severity:'atypical',test:r=>!r.email&&!r.phone&&!r.mobile},{id:'PAT-011',title:'Numéro de carte dupliqué',severity:'critical',test:r=>!!r._dupCard},{id:'PAT-012',title:'Identité + date de naissance dupliquées',severity:'review',test:r=>!!r._dupIdentity},{id:'PAT-013',title:'Email partagé par plusieurs comptes',severity:'atypical',test:r=>!!r._dupEmail},{id:'PAT-014',title:'Téléphone partagé par plusieurs comptes',severity:'atypical',test:r=>!!r._dupPhone},{id:'PAT-015',title:'Compte expiré avec prêts encore actifs',severity:'critical',deep:true,test:r=>days(r.expiry)>0&&(r._deep?.checkouts||0)>0},{id:'PAT-016',title:'Compte expiré avec réservations actives',severity:'review',deep:true,test:r=>days(r.expiry)>0&&(r._deep?.holds||0)>0},{id:'PAT-017',title:'Compte très ancien avec dette',severity:'review',deep:true,test:r=>days(r.expiry)>=state.settings.expiredReviewDays&&Number(r._deep?.balance||0)>0}];
function prepareDerived(){for(const r of state.rows){r._dupCard=r._dupIdentity=r._dupEmail=r._dupPhone=false}function mark(keyFn,prop,min=2){const m=new Map();for(const r of state.rows){const k=keyFn(r);if(!k)continue;const a=m.get(k)||[];a.push(r);m.set(k,a)}for(const a of m.values())if(a.length>=min)a.forEach(r=>r[prop]=true)}mark(r=>r.card.trim(),'_dupCard');mark(r=>{const n=fold(`${r.surname} ${r.firstname}`);return n&&r.dob?`${n}|${r.dob}`:''},'_dupIdentity');mark(r=>r.email.trim().toLowerCase(),'_dupEmail');mark(r=>(r.mobile||r.phone).replace(/\D/g,''),'_dupPhone')}
function evaluate(r){r._deep=state.deep.get(r.id)||r._deep;const hits=RULES.filter(x=>{if(x.deep&&!r._deep)return false;try{return x.test(r)}catch(_){return false}});let severity='ok';for(const h of hits)if(RANK[h.severity]>RANK[severity])severity=h.severity;return{hits,severity}}function classified(){return state.rows.map(r=>Object.assign(r,{_q:evaluate(r)}))}function filtered(){let a=classified();const q=state.search.trim().toLowerCase();if(q)a=a.filter(r=>[r.id,r.card,r.surname,r.firstname,r.email].some(v=>String(v??'').toLowerCase().includes(q)));if(state.severity)a=a.filter(r=>r._q.severity===state.severity);if(state.library)a=a.filter(r=>r.library===state.library);if(state.category)a=a.filter(r=>r.category===state.category);if(state.expired==='yes')a=a.filter(r=>days(r.expiry)>0);if(state.expired==='no')a=a.filter(r=>days(r.expiry)<=0);return a}function setStatus(t,c=''){const e=$('dqp-status');if(!e)return;e.className='dqp-status visible '+c;e.textContent=t}function badge(s){return`<span class="dqp-badge ${s}">${s==='critical'?'Critique':s==='review'?'À vérifier':s==='atypical'?'Atypique':'Conforme'}</span>`}
function shell(){root.innerHTML=`<div class="dqp-hero"><div><small>QUALITÉ KOHA · LECTEURS</small><h2>Qualité des comptes lecteurs</h2><p>Doublons, coordonnées, comptes expirés et préparation des traitements de conservation.</p></div><div class="dqp-actions"><button id="load" class="btn btn-primary">Charger les lecteurs</button><button id="stop" class="btn btn-default">Arrêter</button></div></div><div id="dqp-status" class="dqp-status"></div><div class="dqp-steps">${[['overview','1','Vue générale'],['anomalies','2','Anomalies'],['duplicates','3','Doublons'],['batch','4','Traitements'],['rules','5','Règles'],['memory','6','Mémoire']].map(x=>`<button class="dqp-step" data-tab="${x[0]}"><strong>${x[1]} · ${x[2]}</strong><small>${x[0]==='memory'?'zéro donnée personnelle':'local Koha'}</small></button>`).join('')}</div><div id="dqp-content"></div>`;root.querySelectorAll('.dqp-step').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.page=1;render()});$('load').onclick=loadAll;$('stop').onclick=()=>{state.stop=true;setStatus('Arrêt demandé après la requête en cours.','ok')};render()}
function stats(){const a=classified(),n=s=>a.filter(r=>r._q.severity===s).length;return`<div class="dqp-stats"><div class="dqp-stat"><span>Lecteurs</span><strong>${fmt(a.length)}</strong></div><div class="dqp-stat"><span>Critiques</span><strong>${fmt(n('critical'))}</strong></div><div class="dqp-stat"><span>À vérifier</span><strong>${fmt(n('review'))}</strong></div><div class="dqp-stat"><span>Expirés</span><strong>${fmt(a.filter(r=>days(r.expiry)>0).length)}</strong></div><div class="dqp-stat"><span>Doublons identité</span><strong>${fmt(a.filter(r=>r._dupIdentity).length)}</strong></div></div>`}function toolbar(){const libs=[...new Set(state.rows.map(r=>r.library).filter(Boolean))].sort(),cats=[...new Set(state.rows.map(r=>r.category).filter(Boolean))].sort();return`<div class="dqp-toolbar"><input id="fq" placeholder="Nom, carte, email, ID…" value="${esc(state.search)}"><select id="fs"><option value="">Toutes sévérités</option>${['critical','review','atypical','ok'].map(x=>`<option value="${x}" ${state.severity===x?'selected':''}>${x}</option>`).join('')}</select><select id="fl"><option value="">Tous sites</option>${libs.map(x=>`<option ${state.library===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="fc"><option value="">Toutes catégories</option>${cats.map(x=>`<option ${state.category===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="fe"><option value="">Actifs + expirés</option><option value="yes" ${state.expired==='yes'?'selected':''}>Expirés</option><option value="no" ${state.expired==='no'?'selected':''}>Non expirés</option></select></div>`}function bindToolbar(){$('fq').oninput=e=>{state.search=e.target.value;state.page=1;render()};$('fs').onchange=e=>{state.severity=e.target.value;state.page=1;render()};$('fl').onchange=e=>{state.library=e.target.value;state.page=1;render()};$('fc').onchange=e=>{state.category=e.target.value;state.page=1;render()};$('fe').onchange=e=>{state.expired=e.target.value;state.page=1;render()}}
function table(rows){return`<div class="dqp-table-wrap"><table class="dqp-table"><thead><tr><th></th><th>Lecteur</th><th>Compte</th><th>Contact</th><th>Diagnostic</th><th>Contrôle</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><input class="sel" type="checkbox" value="${r.id}" ${state.selected.has(String(r.id))?'checked':''}></td><td><strong>${esc(`${r.firstname} ${r.surname}`.trim()||'(sans nom)')}</strong><br><span class="dqp-note">#${r.id} · carte ${esc(r.card||'—')}</span></td><td>${esc(r.category||'—')} · ${esc(r.library||'—')}<br>expiration ${esc(r.expiry||'—')} ${days(r.expiry)>0?`<span class="dqp-badge review">${days(r.expiry)} j</span>`:''}</td><td>${r.email?esc(r.email):'—'}<br>${esc(r.mobile||r.phone||'—')}</td><td>${badge(r._q.severity)}<br>${r._q.hits.slice(0,4).map(h=>`<div><code>${h.id}</code> ${esc(h.title)} <button class="btn btn-default btn-xs fb" data-id="${r.id}" data-rule="${h.id}" data-d="anomaly">A</button><button class="btn btn-default btn-xs fb" data-id="${r.id}" data-rule="${h.id}" data-d="normal">N</button></div>`).join('')||'—'}</td><td>${r._deep?`${r._deep.checkouts} prêt(s) · ${r._deep.holds} réservation(s)<br>solde ${Number(r._deep.balance||0).toFixed(2)}`:'<span class="dqp-note">non approfondi</span>'}</td><td><a target="_blank" class="btn btn-default btn-xs" href="/cgi-bin/koha/members/moremember.pl?borrowernumber=${r.id}">Voir</a><div class="dqp-actions" style="margin-top:3px"><button class="btn btn-default btn-xs fb" data-id="${r.id}" data-rule="DOSSIER" data-d="anomaly">Dossier anomal</button><button class="btn btn-default btn-xs fb" data-id="${r.id}" data-rule="DOSSIER" data-d="normal">Dossier normal</button></div></td></tr>`).join('')}</tbody></table></div>`}function bindRows(){root.querySelectorAll('.sel').forEach(x=>x.onchange=()=>{x.checked?state.selected.add(x.value):state.selected.delete(x.value)});root.querySelectorAll('.fb').forEach(b=>b.onclick=()=>feedback(b.dataset.id,b.dataset.d,b.dataset.rule))}function paginate(a){const pages=Math.max(1,Math.ceil(a.length/CFG.PAGE));state.page=Math.min(state.page,pages);return{rows:a.slice((state.page-1)*CFG.PAGE,state.page*CFG.PAGE),pages}}function pager(p){return`<div class="dqp-pager"><button id="prev" class="btn btn-default btn-sm" ${state.page<=1?'disabled':''}>Précédent</button><span>Page ${state.page}/${p.pages}</span><button id="next" class="btn btn-default btn-sm" ${state.page>=p.pages?'disabled':''}>Suivant</button></div>`}
function render(){root.querySelectorAll('.dqp-step').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab));if(state.tab==='overview')renderOverview();else if(state.tab==='anomalies')renderAnomalies();else if(state.tab==='duplicates')renderDuplicates();else if(state.tab==='batch')renderBatch();else if(state.tab==='rules')renderRules();else renderMemory()}function renderOverview(){$('dqp-content').innerHTML=`${stats()}<div class="dqp-danger"><strong>RGPD :</strong> toutes les données lecteur restent exclusivement dans Koha et dans le navigateur. Firebase reçoit uniquement des catégories abstraites et des compteurs d'état ; jamais nom, carte, email, téléphone, adresse, date de naissance ou PatronID.</div><div class="dqp-grid"><div class="dqp-card"><strong>Expirés > 3 ans</strong><div>${fmt(classified().filter(r=>days(r.expiry)>=state.settings.expiredReviewDays).length)}</div></div><div class="dqp-card"><strong>Sans contact</strong><div>${fmt(classified().filter(r=>!r.email&&!r.phone&&!r.mobile).length)}</div></div><div class="dqp-card"><strong>Emails invalides</strong><div>${fmt(classified().filter(r=>!emailOk(r.email)).length)}</div></div><div class="dqp-card"><strong>Identités dupliquées</strong><div>${fmt(classified().filter(r=>r._dupIdentity).length)}</div></div><div class="dqp-card"><strong>Approfondis</strong><div>${fmt(state.deep.size)}</div></div></div>`}
function renderAnomalies(){const a=filtered(),p=paginate(a);$('dqp-content').innerHTML=`${toolbar()}${stats()}<div class="dqp-selection"><div><button id="sp" class="btn btn-default btn-sm">Sélection page</button> <button id="sf" class="btn btn-default btn-sm">Sélection filtre</button> <button id="cl" class="btn btn-default btn-sm">Vider</button></div><strong>${fmt(state.selected.size)} sélectionné(s)</strong></div>${table(p.rows)}${pager(p)}`;bindToolbar();bindRows();$('prev').onclick=()=>{state.page--;renderAnomalies()};$('next').onclick=()=>{state.page++;renderAnomalies()};$('sp').onclick=()=>{p.rows.forEach(r=>state.selected.add(String(r.id)));renderAnomalies()};$('sf').onclick=()=>{a.forEach(r=>state.selected.add(String(r.id)));renderAnomalies()};$('cl').onclick=()=>{state.selected.clear();renderAnomalies()}}
function renderDuplicates(){const rows=classified().filter(r=>r._dupIdentity||r._dupCard||r._dupEmail||r._dupPhone);$('dqp-content').innerHTML=`<div class="dqp-head"><div><h3>3 · Doublons et comptes liés</h3><p>Identité + date de naissance est un candidat fort ; email/téléphone partagé reste seulement atypique car il peut s'agir d'une famille.</p></div></div>${table(rows.slice(0,1000))}`;bindRows()}
async function countEndpoint(url){const u=new URL(url,location.origin);u.searchParams.set('_page','1');u.searchParams.set('_per_page','1');const r=await kfetch(u,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)return null;const h=r.headers.get('x-total-count');if(h!==null)return Number(h);const a=await r.json();return Array.isArray(a)?a.length:0}async function deepAnalyze(){const ids=[...state.selected].slice(0,CFG.DEEP_MAX);if(!ids.length)return alert('Sélectionne des lecteurs.');let n=0;for(const id of ids){try{const checkouts=await countEndpoint(`/api/v1/patrons/${id}/checkouts`),hu=new URL(CFG.HOLDS,location.origin);hu.searchParams.set('q',JSON.stringify({patron_id:Number(id)}));hu.searchParams.set('_page','1');hu.searchParams.set('_per_page','1');const holds=await countEndpoint(hu.toString()),acc=await kfetch(`${CFG.API}/${id}/account`,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});let balance=null;if(acc.ok)balance=Number((await acc.json()).balance||0);state.deep.set(Number(id),{checkouts:Number(checkouts||0),holds:Number(holds||0),balance});n++;setStatus(`Contrôle lecteurs : ${n}/${ids.length}…`,'loading')}catch(e){console.error(e)}}render();setStatus(`Contrôle approfondi terminé : ${n} lecteur(s).`,'ok')}
function renderBatch(){const rows=state.rows.filter(r=>state.selected.has(String(r.id)));$('dqp-content').innerHTML=`<div class="dqp-head"><div><h3>4 · Traitements par lot</h3><p>Contrôle des engagements, export local et préparation des outils natifs Koha.</p></div></div><div class="dqp-actions"><button id="deep" class="btn btn-primary">Approfondir sélection</button><button id="export" class="btn btn-default">Exporter CSV local</button><button id="native-mod" class="btn btn-default">Modification par lot Koha</button><button id="native-clean" class="btn btn-default">Nettoyage lecteurs Koha</button></div><div class="dqp-danger"><strong>Aucune suppression directe par API.</strong> Les décisions de conservation et de suppression restent dans l'outil natif Koha, avec ses contrôles et votre politique RGPD.</div><div class="dqp-warn">L'export CSV peut contenir des données personnelles : il est généré uniquement dans ton navigateur et n'est jamais envoyé à Firebase.</div>${table(rows.slice(0,100))}`;bindRows();$('deep').onclick=deepAnalyze;$('export').onclick=()=>exportCsv(rows);$('native-mod').onclick=()=>{navigator.clipboard.writeText(rows.map(r=>r.card).filter(Boolean).join('\n'));window.open('/cgi-bin/koha/tools/modborrowers.pl','_blank')};$('native-clean').onclick=()=>window.open('/cgi-bin/koha/tools/cleanborrowers.pl','_blank')}
function ruleHelp(r){return `<strong>Détecte :</strong> ${esc(r.title)}. <strong>Ce que cela ne prouve pas :</strong> ce signal seul ne démontre ni une erreur ni l’action à effectuer. <strong>Contrôle attendu :</strong> contrôler le compte, sa catégorie et ses opérations actives en respectant la confidentialité.${r.deep?' Cette règle ne s’active qu’après l’analyse approfondie.':''}`}
function renderRules(){const s=state.settings;$('dqp-content').innerHTML=`<div class="dqp-head"><div><h3>5 · Règles et source</h3><p><strong>Source :</strong> API REST Koha des lecteurs, chargée uniquement sur demande.</p></div></div><div class="dqp-card"><table class="dqp-table"><tbody>${[['expiredAtypicalDays','Compte expiré atypique (j)'],['expiredReviewDays','Compte expiré à vérifier (j)'],['deleteCandidateDays','Ancienneté minimale pour la liste de conservation (j)']].map(([k,l])=>`<tr><td>${l}</td><td><input class="setting" data-k="${k}" type="number" min="0" value="${Number(s[k])||0}"></td></tr>`).join('')}</tbody></table><div class="dqp-actions"><button id="save" class="btn btn-primary">Enregistrer</button><button id="publish" class="btn btn-default">Publier Firebase</button></div></div><div class="dqp-card">${RULES.map(r=>`<div style="margin:8px 0"><code>${r.id}</code> ${badge(r.severity)} ${esc(r.title)}<div class="dqp-note">${ruleHelp(r)}</div></div>`).join('')}</div>`;$('save').onclick=saveSettings;$('publish').onclick=publishSettings}function saveSettings(){root.querySelectorAll('.setting').forEach(i=>state.settings[i.dataset.k]=Math.max(0,Number(i.value)||0));localStorage.setItem(CFG.SETTINGS_KEY,JSON.stringify(state.settings));renderRules();setStatus('Paramètres enregistrés.','ok')}async function publishSettings(){saveSettings();const m=window.KohaQualityMemory;if(!m)return;const st=await m.connect(CFG.MODULE);if(st.role!=='admin')return setStatus('Rôle admin requis.','error');await m.saveSettings(CFG.MODULE,state.settings);setStatus('Paramètres publiés.','ok')}
function contactState(r){return r.email&&(r.phone||r.mobile)?'email_phone':r.email?'email_only':(r.phone||r.mobile)?'phone_only':'none'}function duplicateState(r){return r._dupCard?'card':r._dupIdentity?'identity':r._dupEmail?'shared_email':r._dupPhone?'shared_phone':'none'}function feedbackContext(r,ruleId){const d=state.deep.get(r.id),rule=ruleId||'DOSSIER';return{primary_rule:rule,severity:r._q.severity,nature:rule==='DOSSIER'?'case_assessment':'patron_rule',certainty:rule==='DOSSIER'?'human_global':(d?'deep_checked':'basic'),priority:r._q.severity,rule_scope:rule,category_code:r.category||'none',library_id:r.library||'none',expired:days(r.expiry)>0,expiry_bucket:bucket(days(r.expiry)),contact_state:contactState(r),duplicate_state:duplicateState(r),has_checkouts:d?d.checkouts>0:null,has_hold:d?d.holds>0:null,has_debt:d?Number(d.balance||0)>0:null,account_state:r.protected?'protected':'standard',last_activity_bucket:bucket(days(r.last_seen))}}async function feedback(id,d,ruleId){const r=classified().find(x=>String(x.id)===String(id)),m=window.KohaQualityMemory;if(!r||!m)return;const rule=ruleId||'DOSSIER';try{const z=await m.submitFeedback({module:CFG.MODULE,ruleId:rule,decision:d,context:feedbackContext(r,rule)});setStatus(z.queued?'Retour en file locale.':'Retour enregistré.','ok')}catch(e){setStatus(e.message,'error')}}
function renderMemory(){const st=window.KohaQualityMemory?.getStatus?.()||state.memoryStatus||{status:'absent'};$('dqp-content').innerHTML=`<div class="dqp-head"><div><h3>6 · Mémoire RGPD</h3></div></div><div class="dqp-danger">La couche Firebase bloque techniquement patron_id, nom, prénom, email, téléphone, carte, adresse, date de naissance et tout autre identifiant métier. Les feedbacks de ce module ne transmettent que catégorie, site, tranche d'expiration, type de contact, type de doublon et drapeaux booléens d'engagement.</div><div class="dqp-grid"><div class="dqp-card">État<br><strong>${esc(st.status||'absent')}</strong></div><div class="dqp-card">Autorisé<br><strong>${st.approved?'Oui':'Non'}</strong></div><div class="dqp-card">Rôle<br><strong>${esc(st.role||'—')}</strong></div></div>`}async function loadMemory(){if(!window.KohaQualityMemory){try{await new Promise((ok,ko)=>{const s=document.createElement('script');s.src=CFG.MEMORY;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}catch(_){return}}try{const m=window.KohaQualityMemory,st=await m.connect(CFG.MODULE);state.memoryStatus=st;if(st.approved){const remote=await m.getSettings(CFG.MODULE);if(remote&&Object.keys(remote).length){state.settings={...state.settings,...remote};localStorage.setItem(CFG.SETTINGS_KEY,JSON.stringify(state.settings))}}}catch(_){}}
async function loadAll(silent=false){if(state.loading)return;state.loading=true;state.stop=false;const rows=[];let page=1;try{while(!state.stop){const u=new URL(CFG.API,location.origin);u.searchParams.set('_page',page);u.searchParams.set('_per_page',CFG.PER_PAGE);u.searchParams.set('_order_by','patron_id');const r=await kfetch(u,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`API patrons HTTP ${r.status}`);const a=await r.json();rows.push(...a.map(norm));if(!silent)setStatus(`Lecteurs reçus : ${fmt(rows.length)} · page ${page}…`,'loading');if(a.length<CFG.PER_PAGE)break;page++}state.rows=rows;prepareDerived();render();if(!silent)setStatus(`${fmt(rows.length)} lecteurs chargés${state.stop?' (arrêt demandé)':''}.`,'ok')}catch(e){console.error(e);setStatus(e.message,'error')}finally{state.loading=false}}
function exportCsv(rows){rows=rows||filtered();const out=[['patron_id','cardnumber','surname','firstname','category','library','expiry','email','phone','severity','rules'].join(';')];for(const r of rows)out.push([r.id,r.card,r.surname,r.firstname,r.category,r.library,r.expiry,r.email,r.mobile||r.phone,r._q?.severity||evaluate(r).severity,(r._q?.hits||evaluate(r).hits).map(x=>x.id).join(',')].map(csv).join(';'));download(out.join('\r\n'),'qualite-lecteurs-local.csv')}function csv(v){const s=String(v??'');return/[;"\r\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s}function download(t,n){const a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}shell();loadMemory();
})();
</script>
