// Récupère la liste des alertes ignorées localement
function getIgnoredAlerts() {
    const stored = localStorage.getItem(IGNORED_ALERTS_STORAGE_KEY);
    if (stored) {
        try {
            const arr = JSON.parse(stored);
            ignoredAlertsSet = new Set(arr);
        } catch (e) {
            ignoredAlertsSet = new Set();
        }
    } else {
        ignoredAlertsSet = new Set();
    }
    return ignoredAlertsSet;
}

// Ajoute une alerte à la liste des ignorées localement
function addIgnoredAlert(alerteKey) {
    ignoredAlertsSet.add(alerteKey);
    // Convert Set back to Array for storage
    localStorage.setItem(IGNORED_ALERTS_STORAGE_KEY, JSON.stringify(Array.from(ignoredAlertsSet)));
}

/**
 * Affiche un message non bloquant (remplacement de alert())
 * @param {string} message 
 * @param {'info'|'success'|'error'} type 
 */
function showMessageBox(message, type = 'info') {
    const container = document.getElementById('koha-messageBoxContainer');
    if (!container) return;

    const box = document.createElement('div');
    box.className = `koha-message-box ${type}`;
    box.textContent = message;
    
    container.appendChild(box);
    
    // Afficher le message
    setTimeout(() => {
        box.classList.add('show');
    }, 10);

    // Faire disparaître après 5 secondes
    setTimeout(() => {
        box.classList.remove('show');
        // Supprimer après la transition
        setTimeout(() => {
            box.remove();
        }, 300); 
    }, 5000);
}

/**
 * Remplace un <select> par un input de recherche couplé à une liste de suggestions.
 * @param {HTMLElement} containerElement L'élément conteneur pour le nouveau select/input.
 * @param {Array<Object|string>} data Les données de la liste (ex: POSTES_ALERTES ou INTERVENANTS).
 * @param {string|null} valueKey La clé pour la valeur (si data est Array<Object>). Nul si Array<string>.
 * @param {string} initialValue Valeur sélectionnée au départ.
 * @param {function} onSelect Callback quand un élément est sélectionné.
 * @param {string} idPrefix Préfixe pour les IDs générés.
 */
function setupSearchableSelect(containerElement, data, valueKey, initialValue, onSelect, idPrefix) {
    const isObjectArray = typeof data[0] === 'object';
    const options = data.map(item => ({
        value: isObjectArray ? item[valueKey] : item,
        label: isObjectArray ? item.nom : item
    }));
    
    const inputId = `koha-${idPrefix}SearchInput`;
    const listId = `koha-${idPrefix}OptionsList`;
    let selectedValue = initialValue;

    // Structure HTML du Select de Recherche
    containerElement.innerHTML = `
        <input type="text" id="${inputId}" placeholder="Tapez pour rechercher..." autocomplete="off">
        <ul id="${listId}" class="koha-custom-options-list" style="display:none;"></ul>
    `;
    const searchInput = document.getElementById(inputId);
    const optionsList = document.getElementById(listId);

    // Mettre à jour la liste des suggestions
    function updateList(filter = '') {
        optionsList.innerHTML = '';
        const filteredOptions = options.filter(opt => 
            opt.label.toLowerCase().includes(filter.toLowerCase())
        );

        // Afficher seulement si l'utilisateur a tapé quelque chose
        if (filteredOptions.length > 0 && filter.length > 0) {
            filteredOptions.forEach(opt => {
                const li = document.createElement('li');
                li.textContent = opt.label;
                li.dataset.value = opt.value;
                if (opt.value === selectedValue) {
                    li.classList.add('selected');
                }
                li.addEventListener('click', () => {
                    selectOption(opt.value, opt.label);
                });
                optionsList.appendChild(li);
            });
            optionsList.style.display = 'block';
        } else {
            optionsList.style.display = 'none';
        }
    }

    // Sélectionner une option
    function selectOption(value, label) {
        selectedValue = value;
        searchInput.value = label; // Affiche le label sélectionné
        optionsList.style.display = 'none';
        onSelect(value); // Appelle le callback
    }

    // Gestion de l'input
    searchInput.addEventListener('input', (e) => {
        // Si l'utilisateur tape, la sélection est considérée comme perdue jusqu'à la sélection manuelle
        onSelect(''); 
        selectedValue = '';
        updateList(e.target.value);
    });

    // Cacher la liste lors d'un clic extérieur (hors modal)
    document.addEventListener('click', (e) => {
        // Vérifie si le clic est sur l'overlay pour éviter de fermer la liste par erreur lors d'un clic sur le fond de la modale
        if (!containerElement.contains(e.target) && !e.target.closest('.koha-modal-overlay')) {
            optionsList.style.display = 'none';
        }
    });
    
    // Si une valeur initiale existe, la définir
    if (initialValue) {
        const initialOpt = options.find(opt => opt.value === initialValue);
        if (initialOpt) {
            searchInput.value = initialOpt.label;
        }
    }
}


/* =========================================================
    FONCTIONS FIREBASE ET INITIALISATION
    ========================================================= */

async function initialiserFirebase() {
    if (isFirebaseConnected && isFirebaseReady) {
        return firebaseInitPromise || Promise.resolve();
    }

    if (isFirebaseInitializing && firebaseInitPromise) {
        return firebaseInitPromise;
    }

    isFirebaseInitializing = true;
    firebaseInitPromise = (async () => {
        try {
            if (!firebaseConfig) throw new Error(window.KohaTools?.getService?.('firebase-module')?.problem?.(MODULE_ID, MODULE_CFG.firebase) || 'Connexion Firebase Assistance non configurée.');

            getIgnoredAlerts(); // 1. Charger la liste des alertes ignorées au démarrage

            // CORRECTION: Récupérer la clé d'émetteur stockée localement (pour le bouton Clôturer)
            derniereAlerteEnvoyeeKey = localStorage.getItem(EMETTEUR_KEY_STORAGE);

            // Précharger le son d'alerte
            try {
                alertAudio = new Audio(ALERT_SOUND_URL);
                alertAudio.preload = 'auto';
            } catch (audioError) {
            }

            const appName = FIREBASE_APP_NAME;
            let app;

            const existingApp = getApps().find(a => a.name === appName);
            if (existingApp) {
                app = existingApp;
            } else {
                app = initializeApp(firebaseConfig, appName);
            }

            firebaseApp = app;
            db = getDatabase(app);
            const auth = getAuth(app);
            const credential = auth.currentUser ? { user: auth.currentUser } : await signInAnonymously(auth);
            const uid = credential.user.uid;
            const accessRef = ref(db, `assistance_access/${uid}`);
            const accessSnap = await get(accessRef);
            if (!accessSnap.exists()) {
                await set(accessRef, { approved: false, role: 'pending', createdAt: Date.now() });
                throw new Error(`Poste Assistance non approuvé. UID Firebase : ${uid}. Approuvez assistance_access/${uid} dans Firebase.`);
            }
            const access = accessSnap.val() || {};
            if (access.approved !== true || !['member','admin'].includes(String(access.role || ''))) {
                throw new Error(`Poste Assistance en attente d’approbation. UID Firebase : ${uid}.`);
            }
            refAlertes = ref(db, 'koha_urgency_alerts');

            if (!isFirebaseConnected) {
                goOnline(db);
            }

            // Test de connexion rapide avec un seul enregistrement
            try {
                await get(query(refAlertes, orderByChild('heure'), limitToLast(1)));
            } catch (error) {
                if (/index.*heure/i.test(error.message)) {
                    useOrderedAlertsQuery = false;
                    await get(query(refAlertes, limitToLast(1)));
                } else {
                    throw error;
                }
            }

            isFirebaseReady = true;
            isFirebaseConnected = true;

            attachFirebaseListeners();
        } catch (error) {
            throw error;
        } finally {
            isFirebaseInitializing = false;
        }
    })();

    return firebaseInitPromise;
}

function attachFirebaseListeners() {
    if (!isFirebaseReady || firebaseListenersActive) {
        return;
    }
    startSharedAlertListeners();
    firebaseListenersActive = true;
}

function createRecentAlertesQuery() {
    const cutoffTime = Date.now() - FENETRE_ALERTES_MS;
    if (useOrderedAlertsQuery) {
        return query(refAlertes, orderByChild('heure'), startAt(cutoffTime), limitToLast(100));
    }
    return query(refAlertes, limitToLast(UNINDEXED_ALERTS_QUERY_LIMIT));
}

function filterRecentAlertes(snapshot) {
    const data = snapshot.val();
    if (!data || useOrderedAlertsQuery) {
        return data || {};
    }

    const cutoffTime = Date.now() - FENETRE_ALERTES_MS;
    const filtered = {};
    Object.keys(data).forEach((key) => {
        const entry = data[key];
        if (entry && typeof entry.heure === 'number' && entry.heure >= cutoffTime) {
            filtered[key] = entry;
        }
    });
    return filtered;
}

function detachFirebaseListeners() {
    if (sharedAlertQuery && sharedAlertCallbacks) {
        try { off(sharedAlertQuery, 'child_added', sharedAlertCallbacks.added); } catch (_) {}
        try { off(sharedAlertQuery, 'child_changed', sharedAlertCallbacks.changed); } catch (_) {}
        try { off(sharedAlertQuery, 'child_removed', sharedAlertCallbacks.removed); } catch (_) {}
    }
    sharedAlertQuery = null;
    sharedAlertCallbacks = null;
    if (typeof budgetListenerStop === 'function') budgetListenerStop();
    budgetListenerStop = null;
    recentAlertsCache.clear();
    firebaseListenersActive = false;
}

function disconnectFirebase() {
    if (isFirstLoad && Date.now() - pageLoadTime < 3000) {
        return;
    }

    if (isDisconnecting) {
        return;
    }

    const now = Date.now();
    if (now - lastDisconnectTime < DISCONNECT_DEBOUNCE_MS) {
        return;
    }
    lastDisconnectTime = now;
    isDisconnecting = true;

    detachFirebaseListeners();

    if (db && isFirebaseConnected) {
        try {
            goOffline(db);
            isFirebaseConnected = false;
            isFirebaseReady = false;
        } catch (error) {
        }
    }

    isDisconnecting = false;
}

function setupDisconnectHandlers() {
    window.addEventListener('beforeunload', function () {
        isFirstLoad = false;
        disconnectFirebase();
    });

    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            isFirstLoad = false;
            disconnectFirebase();
        } else if (!isFirebaseConnected && !isFirebaseInitializing) {
            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
            }
            reconnectTimeout = setTimeout(async function () {
                reconnectTimeout = null;
                try {
                    await initialiserFirebase();
                } catch (error) {
                }
            }, RECONNECT_DEBOUNCE_MS);
        }
    });

    window.addEventListener('pagehide', function () {
        isFirstLoad = false;
        disconnectFirebase();
    });

    window.addEventListener('unload', function () {
        isFirstLoad = false;
        disconnectFirebase();
    });
}

/**
 * 🔌 Teste la connexion à Firebase sans écrire de données.
 */
async function testerConnexionFirebase() {
    if (!refAlertes) {
        showMessageBox('⚠️ Firebase non initialisé — rechargez la page et réessayez.', 'error');
        return;
    }
    try {
        const debut = Date.now();
        await get(query(refAlertes, limitToLast(1)));
        const duree = Date.now() - debut;
        if (!isFirebaseReady) {
            isFirebaseReady = true;
            ecouterAlertes();
            ecouterStatusBoard();
        }
        showMessageBox(`✅ Connexion Firebase OK (${duree} ms)`, 'success');
    } catch (error) {
        const hint = error.message.includes('PERMISSION_DENIED')
            ? ' — Vérifiez les règles de sécurité dans la console Firebase.'
            : '';
        showMessageBox(`❌ Erreur Firebase : ${error.message}${hint}`, 'error');
    }
}

async function lancerAlerte(poste, motif) {
    if (!isFirebaseReady) {
        showMessageBox(`ALERTE SIMULÉE (Hors ligne)\nPoste: ${poste.nom}\nMotif: ${motif}\nContact: ${poste.tel}`, 'info');
        return;
    }

    try {
        const nouvelleAlerteRef = push(refAlertes);
        const alerteKey = nouvelleAlerteRef.key;
        
        // CORRECTION: Stocker la clé de l'alerte pour la persistance du bouton "Clôturer"
        derniereAlerteEnvoyeeKey = alerteKey;
        localStorage.setItem(EMETTEUR_KEY_STORAGE, alerteKey); 
        
        await set(nouvelleAlerteRef, {
            site_id: poste.id,
            nom_emetteur: poste.nom,
            tel_contact: poste.tel,
            motif: motif || 'Pas de détails fournis', 
            heure: serverTimestamp(),
            etat: 'Lancée', 
            intervenant: '', 
            // Stocke la clé de l'alerte pour identifier l'émetteur
            emetteur_key: alerteKey 
        });

        showMessageBox("Alerte d'urgence envoyée avec succès !", 'success');
        
        setTimeout(() => {
            // Permet à l'utilisateur de recevoir des alertes par la suite, 
            // MAIS MAINTIENT l'identité d'émetteur stockée dans localStorage.
            derniereAlerteEnvoyeeKey = null; 
        }, 3000);
        
    } catch (error) {
        showMessageBox("Erreur lors de l'envoi de l'alerte: " + error.message, 'error');
        derniereAlerteEnvoyeeKey = null;
        localStorage.removeItem(EMETTEUR_KEY_STORAGE); // Nettoyer en cas d'échec
    }
}

async function prendreEnCharge(alerteKey, intervenant) {
    if (!isFirebaseReady) {
        showMessageBox(`Prise en charge simulée par: ${intervenant}`, 'info');
        return;
    }

    try {
        const alertePath = `koha_urgency_alerts/${alerteKey}`;
        
        // Mise à jour de l'état
        await update(ref(db, alertePath), {
            etat: 'Prise en Charge',
            intervenant: intervenant
        });

        showMessageBox(`Alerte ${alerteKey} prise en charge par ${intervenant}.`, 'success');
        
    } catch (error) {
        showMessageBox("Erreur lors de la confirmation de prise en charge: " + error.message, 'error');
    }
}

async function cloturerAlerte(alerteKey) {
    if (!isFirebaseReady) {
        showMessageBox(`Clôture simulée pour l'alerte ${alerteKey}.`, 'info');
        return;
    }
    
    // Remplacement de confirm() par une modale personnalisée
    showConfirmationModal(
        "Clôturer l'Alerte",
        "Êtes-vous sûr de vouloir CLÔTURER cette alerte ? Seul l'émetteur est autorisé à le faire.",
        async () => {
            try {
                const alertePath = `koha_urgency_alerts/${alerteKey}`;
                
                await update(ref(db, alertePath), {
                    etat: 'Clôturée',
                    heure_cloture: serverTimestamp()
                });
                
                // Nettoyage de la clé d'émetteur locale (car l'alerte est finie)
                if (derniereAlerteEnvoyeeKey === alerteKey) {
                    derniereAlerteEnvoyeeKey = null;
                    localStorage.removeItem(EMETTEUR_KEY_STORAGE);
                }
                
                // Si l'alerte était ignorée localement, la retirer de la liste d'ignorance
                if (ignoredAlertsSet.has(alerteKey)) {
                    ignoredAlertsSet.delete(alerteKey);
                    localStorage.setItem(IGNORED_ALERTS_STORAGE_KEY, JSON.stringify(Array.from(ignoredAlertsSet)));
                }

                showMessageBox("Alerte clôturée avec succès.", 'success');

                // --- ÉCONOMIE DE QUOTA : suppression définitive après un court délai de grâce.
                // Sans ça, chaque alerte clôturée reste en base pour toujours et est
                // retéléchargée en entier à chaque nouvelle connexion, sur tous les sites.
                setTimeout(() => {
                    remove(ref(db, alertePath)).catch(() => { /* déjà supprimée, on ignore */ });
                }, DELAI_SUPPRESSION_CLOTURE_MS);

            } catch (error) {
                showMessageBox("Erreur lors de la clôture de l'alerte: " + error.message, 'error');
            }
        }
    );
}

/**
 * Flux RTDB unique : un même cache local alimente la modale et le status board.
 * Évite le doublon historique child_added + value qui retéléchargeait le jeu complet.
 */
function renderStatusBoardFromCache() {
    const board = document.getElementById('koha-alertStatusBoardContent');
    if (!board) return;
    board.innerHTML = '';
    let hasActiveAlerts = false;
    const entries = [...recentAlertsCache.entries()].sort((a,b) => Number(b[1]?.heure||0) - Number(a[1]?.heure||0));
    for (const [alerteKey, alerte] of entries) {
        const estActive = alerte?.etat === 'Lancée' || alerte?.etat === 'Prise en Charge';
        const heureAlerte = typeof alerte?.heure === 'number' ? alerte.heure : 0;
        const estObsolete = heureAlerte > 0 && (Date.now() - heureAlerte) > FENETRE_ALERTES_MS;
        if (estActive && estObsolete) {
            recentAlertsCache.delete(alerteKey);
            remove(ref(db, `koha_urgency_alerts/${alerteKey}`)).catch(() => {});
            continue;
        }
        if (estActive) {
            hasActiveAlerts = true;
            board.appendChild(creerElementAlerteBoard(alerte, alerteKey));
        }
    }
    document.getElementById('koha-alertStatusBoard').style.display = hasActiveAlerts ? 'block' : 'none';
    const receptionModal = document.getElementById('koha-modalAlerteReceptionOverlay');
    if (receptionModal) {
        const key = receptionModal.dataset.alerteKey;
        if (recentAlertsCache.get(key)?.etat !== 'Lancée') receptionModal.remove();
    }
}
function handleSharedAlert(snapshot, isNew) {
    const alerte=snapshot.val(), alerteKey=snapshot.key;
    if (!alerte) return;
    if (!useOrderedAlertsQuery && typeof alerte.heure === 'number' && alerte.heure < Date.now()-FENETRE_ALERTES_MS) return;
    recentAlertsCache.set(alerteKey, alerte);
    if (isNew && alerteKey !== derniereAlerteEnvoyeeKey && !ignoredAlertsSet.has(alerteKey) && alerte.etat === 'Lancée') {
        const receptionModal=document.getElementById('koha-modalAlerteReceptionOverlay');
        if (!(receptionModal && receptionModal.style.display === 'flex')) { playAlertSound(); afficherAlerteBloquante(alerte, alerteKey); }
    }
    renderStatusBoardFromCache();
}
function startSharedAlertListeners() {
    if (!isFirebaseReady || sharedAlertCallbacks) return;
    sharedAlertQuery=createRecentAlertesQuery();
    try { budgetListenerStop = window.KohaTools?.getService?.('firebase-budget')?.listenerStart?.(FIREBASE_META?.projectId||'unconfigured','recent-alerts','rtdb') || null; } catch (_) {}
    sharedAlertCallbacks={
        added:s=>handleSharedAlert(s,true),
        changed:s=>handleSharedAlert(s,false),
        removed:s=>{recentAlertsCache.delete(s.key);renderStatusBoardFromCache();}
    };
    onChildAdded(sharedAlertQuery, sharedAlertCallbacks.added);
    onChildChanged(sharedAlertQuery, sharedAlertCallbacks.changed);
    onChildRemoved(sharedAlertQuery, sharedAlertCallbacks.removed);
}
function ecouterAlertes(){ startSharedAlertListeners(); }
function ecouterStatusBoard(){ startSharedAlertListeners(); }

function creerElementAlerteBoard(alerte, alerteKey) {
    const item = document.createElement('div');
    item.className = 'koha-alert-item';
    
    let statusClass = alerte.etat.toLowerCase().replace(/\s+/g, '-');
    let statusText = alerte.etat;
    const motifAffiche = alerte.motif.length > 30 ? alerte.motif.substring(0, 30) + '...' : alerte.motif;
    let details = `${alerte.nom_emetteur} (${motifAffiche})`;
    let actions = '';
    
    // Vérification de l'émetteur : utilise la clé persistée dans localStorage pour le bouton Clôturer
    const localEmetteurKey = localStorage.getItem(EMETTEUR_KEY_STORAGE);
    const isEmetteur = localEmetteurKey && localEmetteurKey === alerte.emetteur_key;

    // CORRECTION: Afficher le bouton Clôturer pour l'émetteur dans TOUS les états actifs
    // (Lancée ET Prise en Charge)
    if ((alerte.etat === 'Lancée' || alerte.etat === 'Prise en Charge') && isEmetteur) {
        actions = `<button class="koha-btn-cloture" data-key="${alerteKey}">Clôturer</button>`;
    }
    
    // Affichage des informations
    if (alerte.etat === 'Prise en Charge') {
        details = `${alerte.nom_emetteur} (Géré par: ${alerte.intervenant})`;
    }
    
    item.innerHTML = `
        <div style="flex-grow: 1; margin-right: 10px;">
            ${details}
        </div>
        <div>
            <span class="koha-status-badge ${statusClass}">${statusText}</span>
            ${actions}
        </div>
    `;
    
    // Attacher l'événement de clôture
    const btnCloture = item.querySelector('.koha-btn-cloture');
    if (btnCloture) {
        btnCloture.addEventListener('click', () => cloturerAlerte(alerteKey));
    }

    return item;
}
