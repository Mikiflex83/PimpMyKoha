<div class="kt-shortcuts" id="kt-shortcuts-root"></div>
<style>
.kt-shortcuts{background:#fff;border:1px solid #d8dee4;border-radius:8px;overflow:hidden}.kt-shortcuts h3{margin:0;padding:12px 14px;background:#f6f8fa;font-size:16px}.kt-shortcuts nav{display:flex;flex-direction:column}.kt-shortcuts a,.kt-shortcuts .kt-shortcut-group>button{display:flex;align-items:center;gap:8px;padding:9px 14px;border:0;border-top:1px solid #eef1f3;background:#fff;color:inherit;text-align:left;text-decoration:none;width:100%}.kt-shortcuts a:hover,.kt-shortcuts button:hover{background:#f6f8fa}.kt-shortcut-icon{width:18px;height:18px;object-fit:contain}.kt-shortcut-group-items{padding-left:18px}.kt-shortcut-group[open]>button{font-weight:600}.kt-shortcuts-empty{padding:14px;color:#667085}
</style>
<script>
(()=>{const id='home-shortcuts-menu',cfg=window.KohaTools?.Config?.getCanonical?.(id)?.installation||{},root=document.getElementById('kt-shortcuts-root');if(!root)return;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=x=>x?.iconUrl?`<img class="kt-shortcut-icon" src="${esc(x.iconUrl)}" alt="">`:x?.icon?`<span aria-hidden="true">${esc(x.icon)}</span>`:'';
const item=x=>`<a href="${esc(x.url||'#')}"${x.title?` title="${esc(x.title)}"`:''}>${icon(x)}<span>${esc(x.label||'Raccourci')}</span></a>`;
const group=g=>`<details class="kt-shortcut-group" open><summary style="display:none"></summary><button type="button" onclick="this.parentElement.open=!this.parentElement.open">${icon(g)}<span>${esc(g.label||'Groupe')}</span><span style="margin-left:auto">▾</span></button><div class="kt-shortcut-group-items">${(g.items||[]).map(x=>x.items?group(x):item(x)).join('')}</div></details>`;
const data=Array.isArray(cfg.shortcuts)?cfg.shortcuts:[];root.innerHTML=`<h3>${esc(cfg.title||'Raccourcis')}</h3><nav>${data.length?data.map(x=>x.items?group(x):item(x)).join(''):'<div class="kt-shortcuts-empty">Aucun raccourci configuré pour cette installation.</div>'}</nav>`;})();
</script>
