<script>
(function(){
'use strict';
if(window.__dracQualityTransfersV1)return;window.__dracQualityTransfersV1=true;
const CFG={MODULE:'transfers',VERSION:'1.5.0',SVC:'/cgi-bin/koha/svc/report',ITEMS:'/api/v1/items',RETURNS:'/cgi-bin/koha/circ/returns.pl',BATCH_ITEMS:'/cgi-bin/koha/tools/batchMod.pl',MEMORY:'__KOHATOOLS_ASSET_ROOT__apps/quality/shared/quality-memory-firebase.js?ktv=3.43.0',SETTINGS_KEY:'dq_transfers_settings_v1',PAGE:50,REPORT_BATCH:1000,MIN_GAP:250,DEFAULTS:{reportId:Number(window.KohaTools?.Config?.getCanonical?.('quality-transfers')?.installation?.reports?.transfersId||0),requestedWarnDays:7,requestedReviewDays:21,requestedCriticalDays:60,transitReviewDays:7,transitCriticalDays:21,routeLongDays:14,searchedAtApiField:'searched_at',allowNativeCancel:false}};
const PROTECTED_REASONS=new Set(['Reserve','Recall','Stockrotation']);
const root=document.getElementById('dqtr-app');if(!root)return;
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),fmt=v=>new Intl.NumberFormat('fr-FR').format(Number(v)||0),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tail=Promise.resolve(),lastEnd=0;function kfetch(url,opt={}){const job=tail.catch(()=>{}).then(async()=>{const w=Math.max(0,CFG.MIN_GAP-(Date.now()-lastEnd));if(w)await sleep(w);try{return await fetch(url,opt)}finally{lastEnd=Date.now()}});tail=job.catch(()=>{});return job}
function loadSettings(){try{return {...CFG.DEFAULTS,...JSON.parse(localStorage.getItem(CFG.SETTINGS_KEY)||'{}')}}catch(_){return {...CFG.DEFAULTS}}}
const state={rows:[],tab:'overview',page:1,search:'',severity:'',from:'',to:'',reason:'',selected:new Set(),settings:loadSettings(),loading:false,stop:false,simulation:null,itemChecks:new Map(),itemEdits:new Map(),feedback:[],memoryStatus:null};
const RANK={ok:0,atypical:1,review:2,critical:3};
const RULES=[
{id:'TRF-001',title:'Demandé mais non envoyé depuis longtemps',severity:'atypical',test:r=>!r.sent&&r.queue_state!=='queued'&&r.age_requested>=state.settings.requestedWarnDays},
{id:'TRF-002',title:'Demande exécutable apparemment figée',severity:'review',test:r=>!r.sent&&r.queue_state!=='queued'&&r.age_requested>=state.settings.requestedReviewDays},
{id:'TRF-003',title:'Demande exécutable très ancienne',severity:'review',test:r=>!r.sent&&r.queue_state!=='queued'&&r.age_requested>=state.settings.requestedCriticalDays},
{id:'TRF-004',title:'En transit depuis longtemps',severity:'review',test:r=>!!r.sent&&!r.arrived&&r.age_sent>=state.settings.transitReviewDays},
{id:'TRF-005',title:'Transit extrêmement ancien',severity:'critical',test:r=>!!r.sent&&!r.arrived&&r.age_sent>=state.settings.transitCriticalDays},
{id:'TRF-006',title:'Origine et destination identiques',severity:'critical',test:r=>r.from&&r.to&&r.from===r.to},
{id:'TRF-007',title:'Exemplaire encore prêté alors que le transfert est déjà envoyé',severity:'critical',test:r=>!!r.sent&&Number(r.checkout_active)>0},
{id:'TRF-008',title:'Exemplaire perdu pendant le transfert',severity:'review',test:r=>Number(r.lost_status)>0},
{id:'TRF-009',title:'Exemplaire retiré pendant le transfert',severity:'review',test:r=>Number(r.withdrawn)>0},
{id:'TRF-010',title:'Exemplaire endommagé pendant le transfert',severity:'atypical',test:r=>Number(r.damaged_status)>0},
{id:'TRF-011',title:'Document déjà détenu par la destination',severity:'review',test:r=>!!r.sent&&r.holding_library&&r.holding_library===r.to},
{id:'TRF-012',title:'Document revu après son envoi sans arrivée enregistrée',severity:'review',test:r=>!!r.sent&&r.last_seen&&Date.parse(r.last_seen)>Date.parse(r.sent)+3600000},
{id:'TRF-013',title:'Transfert de réservation sans réservation active',severity:'review',test:r=>r.reason==='Reserve'&&Number(r.active_hold_count)===0},
{id:'TRF-014',title:'Transfert actif déclenché par une annulation',severity:'review',test:r=>['CancelReserve','RecallCancellation','TransferCancellation'].includes(r.reason)}
];
function days(v){const t=Date.parse(v||'');return Number.isFinite(t)?Math.floor((Date.now()-t)/86400000):null}function bucket(n){if(n==null)return'unknown';if(n<3)return'<3';if(n<7)return'3-6';if(n<14)return'7-13';if(n<30)return'14-29';if(n<90)return'30-89';return'90+'}
function normalize(o){const g=(...ks)=>{for(const k of ks)if(o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];return null};const r={id:Number(g('Transfer_ID','transfer_id','branchtransfer_id')),item_id:Number(g('Item_ID','item_id','itemnumber')),biblio_id:Number(g('Biblio_ID','biblio_id','biblionumber')),barcode:g('Barcode','barcode')||'',title:g('Title','title')||'',from:g('From_Site','frombranch','from_library')||'',to:g('To_Site','tobranch','to_library')||'',requested:g('Requested','Demande_le','daterequested'),sent:g('Sent','Envoye_le','datesent'),arrived:g('Arrived','Arrive_le','datearrived'),cancelled:g('Cancelled','Annule_le','datecancelled'),reason:g('Reason','Raison','reason')||'',cancellation_reason:g('Cancellation_reason','Raison_annulation','cancellation_reason')||'',home_library:g('Home_Library','homebranch')||'',holding_library:g('Holding_Library','holdingbranch')||'',last_seen:g('Last_Seen','datelastseen'),searched_at:g('Already_Searched_At','Deja_Recherche_A','Déjà_recherché_à','searched_at','already_searched_at'),lost_status:Number(g('Lost_Status','itemlost')||0),damaged_status:Number(g('Damaged_Status','damaged')||0),withdrawn:Number(g('Withdrawn','withdrawn')||0),not_for_loan:Number(g('Not_For_Loan','notforloan')||0),checkout_active:Number(g('Checkout_Active','checkout_active')||0),active_hold_count:Number(g('Active_Hold_Count','active_hold_count')||0)};r.age_requested=days(r.requested);r.age_sent=days(r.sent);return r}
function evaluate(r){const hits=[];let severity='ok';for(const rule of RULES){let yes=false;try{yes=!!rule.test(r)}catch(_){}if(yes){hits.push(rule);if(RANK[rule.severity]>RANK[severity])severity=rule.severity}}return{severity,hits}}
function classified(){const firstByItem=new Map();for(const r of [...state.rows].sort((a,b)=>a.id-b.id))if(!firstByItem.has(r.item_id))firstByItem.set(r.item_id,r.id);return state.rows.map(r=>{const queue_state=r.sent?'sent':firstByItem.get(r.item_id)===r.id?'executable':'queued',x={...r,queue_state};return {...x,_q:evaluate(x)}})}function filtered(){return classified().filter(r=>{if(state.search&&!([r.id,r.item_id,r.barcode,r.title,r.from,r.to,r.reason].join(' ').toLowerCase().includes(state.search)))return false;if(state.severity&&r._q.severity!==state.severity)return false;if(state.from&&r.from!==state.from)return false;if(state.to&&r.to!==state.to)return false;if(state.reason&&r.reason!==state.reason)return false;return true})}
function badge(s){return`<span class="q-badge ${s}">${({critical:'Critique',review:'À vérifier',atypical:'Atypique',ok:'Sans alerte'})[s]||s}</span>`}function dateFr(v){if(!v)return'—';const t=Date.parse(v);return Number.isFinite(t)?new Intl.DateTimeFormat('fr-FR').format(new Date(t)):esc(v)}
function setStatus(msg,type=''){const e=$('dqtr-status');if(!e)return;e.className=`q-status visible ${type}`;e.innerHTML=(type==='loading'?'<i class="fa fa-spinner fa-spin"></i> ':'')+esc(msg)}
function renderShell(){root.innerHTML=`<div class="q-hero"><div><small>QUALITÉ KOHA · MODULE 04</small><h2>Transferts / navette</h2><p>Détecter les transferts demandés, en transit ou incohérents, puis les traiter sans modifier directement la base.</p></div><div class="q-actions"><button id="dqtr-refresh" class="btn btn-primary">Charger les transferts</button><button id="dqtr-stop" class="btn btn-default">Arrêter</button><button id="dqtr-export" class="btn btn-default">CSV</button></div></div><div id="dqtr-status" class="q-status"></div><div class="q-steps">${[['overview',1,'Vue d’ensemble','Volumes et délais'],['anomalies',2,'Anomalies','Cas qualifiés'],['explore',3,'Exploration','Motifs rares'],['batch',4,'Traitements','Simulation et lots'],['rules',5,'Règles','Seuils'],['memory',6,'Mémoire','Apprentissage']].map(x=>`<button class="q-step" data-tab="${x[0]}"><strong>${x[1]} · ${x[2]}</strong><small>${x[3]}</small></button>`).join('')}</div><div class="q-toolbar" id="dqtr-toolbar"><input id="dqtr-search" placeholder="Recherche locale"><select id="dqtr-severity"><option value="">Toutes classes</option><option value="critical">Critiques</option><option value="review">À vérifier</option><option value="atypical">Atypiques</option><option value="ok">Sans alerte</option></select><select id="dqtr-from"><option value="">Toutes origines</option></select><select id="dqtr-to"><option value="">Toutes destinations</option></select><select id="dqtr-reason"><option value="">Toutes raisons</option></select><button id="dqtr-reset" class="btn btn-default">Réinitialiser</button></div><div class="q-stats"><div class="q-stat"><span>Actifs</span><strong id="st-total">0</strong></div><div class="q-stat"><span>Critiques</span><strong id="st-critical">0</strong></div><div class="q-stat"><span>À vérifier</span><strong id="st-review">0</strong></div><div class="q-stat"><span>Atypiques</span><strong id="st-atypical">0</strong></div><div class="q-stat"><span>Sélection</span><strong id="st-selected">0</strong></div></div><div id="dqtr-content"></div>`;bindGlobal();switchTab('overview')}
function bindGlobal(){root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('dqtr-refresh').onclick=()=>loadTransfers();$('dqtr-stop').onclick=()=>{state.stop=true;setStatus('Arrêt demandé après la requête en cours.','ok')};$('dqtr-export').onclick=exportCsv;$('dqtr-search').oninput=e=>{state.search=e.target.value.trim().toLowerCase();state.page=1;render()};$('dqtr-severity').onchange=e=>{state.severity=e.target.value;state.page=1;render()};$('dqtr-from').onchange=e=>{state.from=e.target.value;state.page=1;render()};$('dqtr-to').onchange=e=>{state.to=e.target.value;state.page=1;render()};$('dqtr-reason').onchange=e=>{state.reason=e.target.value;state.page=1;render()};$('dqtr-reset').onclick=()=>{state.search=state.severity=state.from=state.to=state.reason='';['dqtr-search','dqtr-severity','dqtr-from','dqtr-to','dqtr-reason'].forEach(id=>$(id).value='');render()}}
function switchTab(t){state.tab=t;state.page=1;root.querySelectorAll('.q-step').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('dqtr-toolbar').classList.toggle('q-hidden',['rules','memory'].includes(t));render()}
function updateStats(){const a=classified();for(const s of ['critical','review','atypical'])$(`st-${s}`).textContent=fmt(a.filter(x=>x._q.severity===s).length);$('st-total').textContent=fmt(a.length);$('st-selected').textContent=fmt(state.selected.size)}
function populate(){for(const [id,key,label] of [['dqtr-from','from','Toutes origines'],['dqtr-to','to','Toutes destinations'],['dqtr-reason','reason','Toutes raisons']]){const s=$(id),cur=s.value,vals=[...new Set(state.rows.map(r=>r[key]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'fr'));s.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');s.value=cur}}
async function loadTransfers(){if(state.loading)return;const report=Number(state.settings.reportId)||0;if(!report){switchTab('rules');return setStatus('Renseigne d’abord l’ID du rapport SQL Transferts fourni avec la suite.','error')}state.loading=true;state.stop=false;state.rows=[];state.selected.clear();setStatus(`Lecture du rapport ${report} par lots…`,'loading');try{let after=0,loops=0;while(!state.stop){loops++;const u=new URL(CFG.SVC,location.origin);u.searchParams.set('id',report);u.searchParams.set('annotated','1');u.searchParams.append('sql_params',String(after));u.searchParams.set('_',Date.now());const r=await kfetch(u,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`Rapport HTTP ${r.status}`);const data=await r.json();if(!Array.isArray(data))throw new Error('Réponse rapport inattendue');const rows=data.map(normalize).filter(x=>x.id);state.rows.push(...rows);setStatus(`${fmt(state.rows.length)} transfert(s) actif(s) reçus…`,'loading');if(!rows.length||rows.length<CFG.REPORT_BATCH)break;const next=Math.max(...rows.map(x=>x.id));if(next<=after)break;after=next;if(loops>5000)throw new Error('Sécurité pagination atteinte')}populate();render();setStatus(`${fmt(state.rows.length)} transfert(s) analysé(s)${state.stop?' avant l’arrêt demandé':''}.`,'ok');if(!state.stop)observePatterns()}catch(e){console.error(e);setStatus(e.message,'error');render()}finally{state.loading=false}}
function paginate(rows){const pages=Math.max(1,Math.ceil(rows.length/CFG.PAGE));state.page=Math.min(Math.max(1,state.page),pages);const start=(state.page-1)*CFG.PAGE;return{items:rows.slice(start,start+CFG.PAGE),pages,page:state.page,total:rows.length}}
function render(){updateStats();if(state.tab==='overview')renderOverview();else if(state.tab==='anomalies')renderAnomalies();else if(state.tab==='explore')renderExplore();else if(state.tab==='batch')renderBatch();else if(state.tab==='rules')renderRules();else renderMemory()}
function renderOverview(){const a=classified(),req=a.filter(x=>!x.sent),trans=a.filter(x=>x.sent&&!x.arrived);$('dqtr-content').innerHTML=`<div class="q-head"><div><h3>1 · Vue d’ensemble</h3><p>L’ancienneté seule n’est pas une preuve d’erreur ; les contradictions augmentent la priorité.</p></div></div><div class="q-grid"><div class="q-card"><strong>Demandés non envoyés</strong><div style="font-size:25px">${fmt(req.length)}</div></div><div class="q-card"><strong>En transit</strong><div style="font-size:25px">${fmt(trans.length)}</div></div><div class="q-card"><strong>Transit > ${state.settings.transitCriticalDays} j</strong><div style="font-size:25px">${fmt(trans.filter(x=>x.age_sent>=state.settings.transitCriticalDays).length)}</div></div></div><div style="margin-top:10px">${table(filtered().slice(0,CFG.PAGE))}</div>`;bindRows()}
function renderAnomalies(){const p=paginate(filtered().filter(x=>x._q.severity!=='ok'));$('dqtr-content').innerHTML=`<div class="q-head"><div><h3>2 · Anomalies</h3><p>${fmt(p.total)} cas avec les filtres actuels.</p></div></div>${selectionBar(p.items)}${table(p.items)}${pager(p)}`;bindRows();bindPager()}
function fingerprint(r){return [r.sent?'sent':'requested',bucket(r.sent?r.age_sent:r.age_requested),r.reason||'none',r.checkout_active?'checkout':'no_checkout',r.lost_status?'lost':'not_lost',r.withdrawn?'withdrawn':'not_withdrawn',r.from===r.to?'same_route':'normal_route'].join('|')}
function renderExplore(){const m=new Map();for(const r of filtered()){const k=fingerprint(r),g=m.get(k)||{k,n:0,sev:'ok',sample:r};g.n++;if(RANK[r._q.severity]>RANK[g.sev])g.sev=r._q.severity;m.set(k,g)}const groups=[...m.values()].sort((a,b)=>a.n-b.n||RANK[b.sev]-RANK[a.sev]);$('dqtr-content').innerHTML=`<div class="q-head"><div><h3>3 · Situations atypiques</h3><p>Les empreintes rares permettent de découvrir des cas auxquels aucune règle n’avait pensé.</p></div></div><div class="q-card">${groups.slice(0,100).map(g=>`<div class="q-pattern"><div><code>${esc(g.k)}</code><br><span class="q-note">${fmt(g.n)} occurrence(s)</span></div><div>${badge(g.sev)} <button class="btn btn-default btn-xs q-filter-pattern" data-k="${esc(g.k)}">Voir</button></div></div>`).join('')||'Aucune donnée.'}</div>`;root.querySelectorAll('.q-filter-pattern').forEach(b=>b.onclick=()=>{state.search='';const k=b.dataset.k;const ids=classified().filter(r=>fingerprint(r)===k).map(r=>r.id);state.selected=new Set(ids.map(String));switchTab('batch')})}
function selectionBar(rows){return`<div class="q-selection"><div><strong>${fmt(state.selected.size)}</strong> sélectionné(s)</div><div class="q-actions"><button id="sel-page" class="btn btn-default btn-sm">Sélectionner page</button><button id="sel-filter" class="btn btn-default btn-sm">Tous les résultats</button><button id="sel-clear" class="btn btn-default btn-sm">Vider</button></div></div>`}
function fbButtons(id,rule){return `<span class="q-actions"><button class="btn btn-default btn-xs fb" data-id="${id}" data-rule="${rule}" data-d="anomaly">Anomalie</button><button class="btn btn-default btn-xs fb" data-id="${id}" data-rule="${rule}" data-d="normal">Normal</button><button class="btn btn-default btn-xs fb" data-id="${id}" data-rule="${rule}" data-d="watch">Surveiller</button></span>`}function table(rows){return`<div class="q-table-wrap"><table><thead><tr><th></th><th>Transfert</th><th>Document</th><th>Trajet</th><th>État</th><th>Ancienneté</th><th>Diagnostic</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><input type="checkbox" class="rowcheck" data-id="${r.id}" ${state.selected.has(String(r.id))?'checked':''}></td><td><strong>#${r.id}</strong><br><span class="q-note">${esc(r.reason||'—')}</span></td><td>${esc(r.title||'(sans titre)')}<br><span class="q-note">${esc(r.barcode||'')} · item #${r.item_id}</span></td><td>${esc(r.from)} → ${esc(r.to)}<br><span class="q-note">détenteur ${esc(r.holding_library||'—')}</span></td><td>${r.sent?'En transit':r.queue_state==='queued'?'Demandé · en file':'Demandé · exécutable'}<br><span class="q-note">${r.sent?dateFr(r.sent):dateFr(r.requested)}</span></td><td>${r.sent?fmt(r.age_sent):fmt(r.age_requested)} j</td><td>${badge(r._q.severity)}${r._q.hits.map(h=>`<div><span class="q-badge ${h.severity}">${h.id}</span> ${esc(h.title)}${fbButtons(r.id,h.id)}</div>`).join('')||'<span class="q-note">—</span>'}<div class="q-note">Appréciation globale</div>${fbButtons(r.id,'DOSSIER')}</td><td><a class="btn btn-default btn-xs" target="_blank" href="/cgi-bin/koha/catalogue/moredetail.pl?itemnumber=${r.item_id}&biblionumber=${r.biblio_id}">Exemplaire</a></td></tr>`).join('')}</tbody></table></div>`}
function pager(p){return p.pages<=1?'':`<div class="q-pager"><button class="btn btn-default btn-sm pg" data-p="${p.page-1}" ${p.page<=1?'disabled':''}>‹</button><span>Page ${p.page}/${p.pages}</span><button class="btn btn-default btn-sm pg" data-p="${p.page+1}" ${p.page>=p.pages?'disabled':''}>›</button></div>`}
function bindPager(){root.querySelectorAll('.pg').forEach(b=>b.onclick=()=>{state.page=Number(b.dataset.p);render()})}
function bindRows(){root.querySelectorAll('.rowcheck').forEach(c=>c.onchange=()=>{c.checked?state.selected.add(String(c.dataset.id)):state.selected.delete(String(c.dataset.id));updateStats()});$('sel-page')?.addEventListener('click',()=>{root.querySelectorAll('.rowcheck').forEach(c=>state.selected.add(String(c.dataset.id)));render()});$('sel-filter')?.addEventListener('click',()=>{filtered().forEach(r=>state.selected.add(String(r.id)));render()});$('sel-clear')?.addEventListener('click',()=>{state.selected.clear();render()});root.querySelectorAll('.fb').forEach(b=>b.onclick=()=>sendFeedback(b.dataset.id,b.dataset.rule,b.dataset.d))}
function renderBatch(){const rows=classified().filter(r=>state.selected.has(String(r.id)));$('dqtr-content').innerHTML=`<div class="q-head"><div><h3>4 · Traitements par lot</h3><p>Simulation obligatoire. Une annulation n’est proposée que pour les transferts toujours actifs au moment de l’action.</p></div></div>${selectionBar(rows)}<div class="q-card"><h4>Actions</h4><div class="q-actions"><button id="sim-cancel" class="btn btn-primary" ${rows.length?'':'disabled'}>1 · Simuler l’annulation</button><button id="export-selected" class="btn btn-default" ${rows.length?'':'disabled'}>Exporter sélection</button><button id="copy-barcodes" class="btn btn-default" ${rows.length?'':'disabled'}>Copier codes-barres</button></div>${state.settings.allowNativeCancel?'<div class="q-warn"><strong>Annulation réelle autorisée.</strong> Après la simulation, le bouton rouge « 2 · Appliquer réellement » apparaîtra ci-dessous.</div>':'<div class="q-info"><strong>Pourquoi aucun bouton d’application ?</strong> L’annulation réelle est verrouillée. Active « Autoriser l’annulation native » dans Règles, puis relance une simulation.</div>'}</div>${state.simulation?renderSimulation():''}${state.itemChecks.size?renderItemChecks():''}${table(rows.slice(0,100))}`;bindRows();bindItemChecks();$('sim-cancel')?.addEventListener('click',simulateCancel);$('export-selected')?.addEventListener('click',()=>exportCsv(rows));$('copy-barcodes')?.addEventListener('click',()=>navigator.clipboard.writeText(rows.map(r=>r.barcode).filter(Boolean).join('\n')).then(()=>setStatus('Codes-barres copiés.','ok')))}
async function simulateCancel(){const ids=[...state.selected];if(!ids.length)return;setStatus('Relecture du rapport avant simulation…','loading');await loadTransfersSilent();const all=classified().filter(r=>ids.includes(String(r.id))),current=all.filter(r=>!PROTECTED_REASONS.has(r.reason)&&r.queue_state!=='queued'),protectedRows=all.filter(r=>PROTECTED_REASONS.has(r.reason)||r.queue_state==='queued'),missing=ids.length-all.length;state.simulation={ids,current,protectedRows,missing,at:Date.now()};renderBatch();setStatus(`Simulation : ${current.length} annulable(s), ${protectedRows.length} protégé(s)/en file, ${missing} déjà disparu(s).`,'ok')}
function renderSimulation(){const s=state.simulation;return`<div class="q-card" style="margin-top:10px"><h4>Simulation</h4><p>${fmt(s.current.length)} annulable(s) · ${fmt(s.protectedRows?.length||0)} protégé(s) ou en file · ${fmt(s.missing)} déjà terminés/annulés.</p><div class="q-actions"><button id="apply-cancel" class="btn btn-danger" ${state.settings.allowNativeCancel&&s.current.length?'':'disabled'}>2 · Appliquer réellement (${fmt(s.current.length)})</button><button id="clear-sim" class="btn btn-default">Effacer simulation</button></div>${state.settings.allowNativeCancel?'':'<div class="q-info">Bouton désactivé : autorise d’abord l’annulation native dans l’onglet Règles.</div>'}</div>`}
async function loadTransfersSilent(){const report=Number(state.settings.reportId)||0,rows=[];let after=0;while(true){const u=new URL(CFG.SVC,location.origin);u.searchParams.set('id',report);u.searchParams.set('annotated','1');u.searchParams.append('sql_params',String(after));u.searchParams.set('_',Date.now());const r=await kfetch(u,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`Rapport HTTP ${r.status}`);const d=await r.json(),batch=d.map(normalize).filter(x=>x.id);rows.push(...batch);if(!batch.length||batch.length<CFG.REPORT_BATCH)break;const n=Math.max(...batch.map(x=>x.id));if(n<=after)break;after=n}state.rows=rows;populate();return rows}
async function getCsrf(){const r=await kfetch(CFG.RETURNS,{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw new Error(`Page retours HTTP ${r.status}`);const doc=new DOMParser().parseFromString(await r.text(),'text/html'),t=doc.querySelector('input[name="csrf_token"]')?.value;return t||''}
async function fetchItemState(id){const r=await kfetch(`${CFG.ITEMS}/${encodeURIComponent(id)}`,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json','x-koha-embed':'+strings'}});if(!r.ok)throw new Error(`Exemplaire #${id} HTTP ${r.status}`);return r.json()}
function itemField(i,k){return i?.[k]??(k==='withdrawn'?0:'')}
function searchedField(i){const configured=String(state.settings.searchedAtApiField||'').trim(),candidates=[configured,'searched_at','already_searched_at','searched_libraries','search_history'].filter(Boolean);return candidates.find(k=>Object.prototype.hasOwnProperty.call(i||{},k))||''}
function searchedValues(i){const k=searchedField(i),v=k?i[k]:i?._reported_searched_at;if(Array.isArray(v))return v.map(x=>typeof x==='object'?String(x.value??x.code??x.library_id??JSON.stringify(x)):String(x)).filter(Boolean);if(v==null||v==='')return[];return String(v).split(/\s*(?:\||;|\n)\s*/).filter(Boolean)}
function renderSearchedAt(i){const k=searchedField(i),vals=searchedValues(i);if(!vals.length)return'<span class="q-note">aucune valeur</span>';const editable=!!k;return`${vals.map((v,n)=>`<label style="display:block;white-space:nowrap"><input class="searched-remove" type="checkbox" style="width:auto" data-id="${i.item_id}" data-index="${n}" ${editable?'':'disabled'}> ${esc(v)}</label>`).join('')}${editable?'<span class="q-note">Coche les valeurs à supprimer, ou toutes pour vider le champ.</span>':'<span class="q-note">Valeur fournie par le rapport ; utilise la modification par lot si l’API ne l’expose pas.</span>'}`}
function renderItemChecks(){const rows=[...state.itemChecks.values()];return`<div class="q-card" style="margin-top:10px"><h4>3 · État réel des exemplaires après annulation</h4><div class="q-info">Ces valeurs viennent d’une nouvelle lecture de Koha après l’annulation. La colonne « Déjà recherché à » accepte plusieurs valeurs : coche seulement celles à retirer. Modifie uniquement un champ réellement incorrect, simule, puis applique.</div><div class="q-table-wrap"><table><thead><tr><th>Exemplaire</th><th>Détenteur</th><th>Perdu</th><th>Endommagé</th><th>Retiré</th><th>Non-prêtable</th><th>Déjà recherché à</th></tr></thead><tbody>${rows.map(i=>`<tr><td><strong>${esc(i.external_id||i.barcode||'#'+i.item_id)}</strong><br><span class="q-note">item #${i.item_id}</span></td><td><input class="item-edit" data-id="${i.item_id}" data-field="holding_library_id" value="${esc(itemField(i,'holding_library_id'))}"></td>${[['lost_status','Perdu'],['damaged_status','Endommagé'],['withdrawn','Retiré'],['not_for_loan_status','Non-prêtable']].map(([k])=>`<td><input class="item-edit" type="number" data-id="${i.item_id}" data-field="${k}" value="${Number(itemField(i,k))||0}"></td>`).join('')}<td>${renderSearchedAt(i)}</td></tr>`).join('')}</tbody></table></div><div class="q-actions" style="margin-top:8px"><button id="simulate-item-edits" class="btn btn-primary">Simuler les modifications d’état</button><button id="batch-item-editor" class="btn btn-default">Ouvrir ces exemplaires en modification par lot</button>${state.itemEdits.size?`<button id="apply-item-edits" class="btn btn-danger">Appliquer ${fmt(state.itemEdits.size)} modification(s)</button>`:''}</div>${state.itemEdits.size?`<div class="q-warn"><strong>Simulation prête :</strong> ${[...state.itemEdits.values()].map(x=>`#${x.id} · ${Object.entries(x.patch).map(([k,v])=>`${esc(k)}=${esc(Array.isArray(v)?v.join(' | '):v)}`).join(', ')}`).join('<br>')}</div>`:''}</div>`}
function bindItemChecks(){$('simulate-item-edits')?.addEventListener('click',simulateItemEdits);$('apply-item-edits')?.addEventListener('click',applyItemEdits);$('batch-item-editor')?.addEventListener('click',openBatchItemEditor)}
function simulateItemEdits(){state.itemEdits.clear();const grouped=new Map();root.querySelectorAll('.item-edit').forEach(i=>{const id=Number(i.dataset.id),field=i.dataset.field,g=grouped.get(id)||{};g[field]=field==='holding_library_id'?i.value.trim():Number(i.value)||0;grouped.set(id,g)});for(const current of state.itemChecks.values()){const chosen=[...root.querySelectorAll(`.searched-remove[data-id="${current.item_id}"]:checked`)].map(x=>Number(x.dataset.index)),field=searchedField(current);if(field&&chosen.length){const values=searchedValues(current),raw=current[field],remaining=values.filter((_,n)=>!chosen.includes(n)),g=grouped.get(Number(current.item_id))||{};g[field]=Array.isArray(raw)?remaining:remaining.join(String(raw).includes('|')?' | ':String(raw).includes(';')?'; ':String(raw).includes('\n')?'\n':'');grouped.set(Number(current.item_id),g)}}for(const [id,wanted] of grouped){const current=state.itemChecks.get(id),patch={};if(!current)continue;for(const [k,v] of Object.entries(wanted))if(JSON.stringify(itemField(current,k))!==JSON.stringify(v))patch[k]=v;if(Object.keys(patch).length)state.itemEdits.set(id,{id,snapshot:Object.fromEntries(Object.keys(patch).map(k=>[k,itemField(current,k)])),patch})}renderBatch();setStatus(state.itemEdits.size?`${fmt(state.itemEdits.size)} exemplaire(s) à modifier après simulation.`:'Aucune modification détectée.','ok')}
function openBatchItemEditor(){const ids=[...state.itemChecks.keys()];if(!ids.length)return;const form=document.createElement('form');form.method='post';form.action=CFG.BATCH_ITEMS;form.target='_blank';for(const [name,value] of [['op','show'],...ids.map(id=>['itemnumber',String(id)])]){const input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;form.appendChild(input)}document.body.appendChild(form);form.submit();form.remove()}
async function applyItemEdits(){if(!state.itemEdits.size)return;if(!confirm(`Appliquer les modifications d’état sur ${state.itemEdits.size} exemplaire(s) ?\n\nChaque exemplaire sera relu avant et après son écriture.`))return;let ok=0,skip=0,err=0;for(const e of state.itemEdits.values()){try{const fresh=await fetchItemState(e.id);if(Object.entries(e.snapshot).some(([k,v])=>JSON.stringify(itemField(fresh,k))!==JSON.stringify(v))){skip++;continue}const r=await kfetch(`${CFG.ITEMS}/${e.id}`,{method:'PUT',credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify(e.patch)});if(!r.ok)throw new Error(`HTTP ${r.status}`);state.itemChecks.set(e.id,await fetchItemState(e.id));ok++}catch(e){console.error(e);err++}setStatus(`Exemplaires : ${ok} modifié(s) · ${skip} changé(s) entre-temps · ${err} erreur(s)…`,'loading')}state.itemEdits.clear();renderBatch();setStatus(`Modification terminée et relue : ${ok} OK · ${skip} ignoré(s) · ${err} erreur(s).`,err?'error':'ok')}
async function applyCancel(){if(!state.simulation?.current?.length||!state.settings.allowNativeCancel)return;if(!confirm(`Annuler réellement ${state.simulation.current.length} transfert(s) ?\n\nChaque transfert sera relu via le rapport puis annulé un par un par Koha.`))return;let ok=0,skip=0,err=0;const token=await getCsrf();state.itemChecks.clear();state.itemEdits.clear();for(const original of state.simulation.current){try{await loadTransfersSilent();const cur=classified().find(x=>x.id===original.id);if(!cur||PROTECTED_REASONS.has(cur.reason)||cur.queue_state==='queued'){skip++;continue}const body=new URLSearchParams();if(token)body.set('csrf_token',token);body.set('op','cud-transfer');body.set('transit',String(cur.id));body.set('itemnumber',String(cur.item_id));body.set('canceltransfer','1');body.set('dest','ttr');const r=await kfetch(CFG.RETURNS,{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body.toString()});if(!r.ok)throw new Error(`HTTP ${r.status}`);state.itemChecks.set(cur.item_id,{...await fetchItemState(cur.item_id),_reported_searched_at:cur.searched_at});ok++}catch(e){console.error(e);err++}setStatus(`Annulation et contrôle exemplaire : ${ok} OK · ${skip} ignoré(s) · ${err} erreur(s)…`,'loading')}await loadTransfersSilent();state.selected.clear();state.simulation=null;state.tab='batch';render();setStatus(`Annulation terminée : ${ok} OK · ${skip} ignoré(s) · ${err} erreur(s). État des exemplaires relu ci-dessous.`,err?'error':'ok')}

function renderRules(){const s=state.settings;$('dqtr-content').innerHTML=`<div class="q-head"><div><h3>5 · Règles et source</h3><p>Le rapport fourni doit être créé une fois dans Koha ; son ID est ensuite mémorisé.</p></div></div><div class="q-card"><table><tbody>${[['reportId','ID rapport SQL Transferts'],['requestedWarnDays','Demande atypique (jours)'],['requestedReviewDays','Demande à vérifier (jours)'],['requestedCriticalDays','Demande critique (jours)'],['transitReviewDays','Transit à vérifier (jours)'],['transitCriticalDays','Transit critique (jours)']].map(([k,l])=>`<tr><td>${l}</td><td><input class="setting" data-k="${k}" type="number" min="0" value="${Number(s[k])||0}"></td></tr>`).join('')}<tr><td>Nom API de « Déjà recherché à »</td><td><input id="searched-field" value="${esc(s.searchedAtApiField||"searched_at")}" placeholder="searched_at"><div class="q-note">À adapter seulement si votre champ personnalisé porte un autre nom dans l’API.</div></td></tr><tr><td>Autoriser annulation native expérimentale</td><td><input id="allow-cancel" type="checkbox" style="width:auto" ${s.allowNativeCancel?'checked':''}></td></tr></tbody></table><div class="q-actions" style="margin-top:8px"><button id="save-settings" class="btn btn-primary">Enregistrer</button><button id="publish-settings" class="btn btn-default">Publier seuils Firebase</button></div></div><div class="q-card" style="margin-top:10px"><h4>${RULES.length} règles système</h4><table><thead><tr><th>ID</th><th>Règle</th><th>Classe</th><th>Explication</th></tr></thead><tbody>${RULES.map(r=>`<tr><td><code>${r.id}</code></td><td>${r.title}</td><td>${badge(r.severity)}</td><td class="q-note">${ruleHelp(r)}</td></tr>`).join('')}</tbody></table></div>`;$('save-settings').onclick=saveSettings;$('publish-settings').onclick=publishSettings}
function saveSettings(){root.querySelectorAll('.setting').forEach(i=>state.settings[i.dataset.k]=Math.max(0,Number(i.value)||0));state.settings.searchedAtApiField=$('searched-field').value.trim()||'searched_at';state.settings.allowNativeCancel=$('allow-cancel').checked;localStorage.setItem(CFG.SETTINGS_KEY,JSON.stringify(state.settings));setStatus('Paramètres enregistrés localement.','ok');renderRules()}
async function publishSettings(){saveSettings();const m=window.KohaQualityMemory;if(!m)return setStatus('Mémoire Firebase absente.','error');const st=await m.connect(CFG.MODULE);if(st.role!=='admin')return setStatus('Rôle admin Firebase requis.','error');await m.saveSettings(CFG.MODULE,state.settings);setStatus('Seuils publiés.','ok')}
function feedbackContext(r,ruleId){const hit=r._q.hits.find(h=>h.id===ruleId);return{primary_rule:ruleId||'DOSSIER',severity:hit?.severity||r._q.severity,nature:ruleId==='DOSSIER'?'case':'transfer_state',certainty:ruleId==='DOSSIER'?'global_judgement':'rule_level',priority:r._q.severity,queue_state:r.queue_state,transfer_state:r.sent?'sent':'requested',transfer_age_bucket:bucket(r.sent?r.age_sent:r.age_requested),from_library_id:r.from||'none',to_library_id:r.to||'none',reason_code:r.reason||'none',has_hold:r.active_hold_count>0,checkout_state:r.checkout_active?'active':'none',item_lost:r.lost_status>0,item_damaged:r.damaged_status>0,item_withdrawn:r.withdrawn>0,holding_mismatch:!!(r.holding_library&&r.holding_library!==r.to)}}
async function sendFeedback(id,ruleId,decision){const r=classified().find(x=>String(x.id)===String(id)),m=window.KohaQualityMemory;if(!r||!m)return setStatus('Mémoire Firebase non disponible.','error');try{const z=await m.submitFeedback({module:CFG.MODULE,ruleId:ruleId||'DOSSIER',decision,context:feedbackContext(r,ruleId)});setStatus(z.queued?'Retour mis en file locale.':`Retour enregistré pour ${ruleId||'le dossier'}.`,'ok')}catch(e){setStatus(e.message,'error')}}

function renderMemory(){const m=window.KohaQualityMemory,st=m?.getStatus?.()||state.memoryStatus||{status:'absent'};$('dqtr-content').innerHTML=`<div class="q-head"><div><h3>6 · Mémoire Firebase du module</h3><p>Seules des dimensions abstraites sont envoyées : trajet, classe, ancienneté, états booléens. Jamais titre, code-barres ou identifiant Koha.</p></div></div><div class="q-grid"><div class="q-card"><strong>État</strong><div>${esc(st.status||'absent')}</div></div><div class="q-card"><strong>Autorisé</strong><div>${st.approved?'Oui':'Non'}</div></div><div class="q-card"><strong>Rôle</strong><div>${esc(st.role||'—')}</div></div></div>`}

function exportCsv(custom){const rows=custom||filtered(),head=['transfer_id','item_id','barcode','title','from','to','requested','sent','reason','age_days','severity','rules'];const out=[head.join(';')];for(const r of rows){const q=evaluate(r),vals=[r.id,r.item_id,r.barcode,r.title,r.from,r.to,r.requested,r.sent,r.reason,r.sent?r.age_sent:r.age_requested,q.severity,q.hits.map(x=>x.id).join(',')];out.push(vals.map(csv).join(';'))}download(out.join('\r\n'),'qualite-transferts.csv')}
function csv(v){const s=String(v??'');return/[;"\r\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s}function download(text,name){const a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',e=>{if(e.target?.id==='apply-cancel')applyCancel();if(e.target?.id==='clear-sim'){state.simulation=null;renderBatch()}});
renderShell();loadMemory();
})();
