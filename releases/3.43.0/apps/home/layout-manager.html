<div id="kt-home-layout-manager"><div class="kthl-loading">Chargement de l’organisation de l’accueil…</div></div>
<style>
#kt-home-layout-manager{font-family:Arial,Helvetica,sans-serif;max-width:1050px;margin:0 auto;color:#26313a}#kt-home-layout-manager *{box-sizing:border-box}.kthl-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:16px}.kthl-head h2{margin:0 0 5px}.kthl-card{background:#fff;border:1px solid #d8dee3;border-radius:8px;padding:16px;margin-bottom:14px}.kthl-help{background:#f3f8fb;border:1px solid #c7d8e3;padding:11px 13px;border-radius:6px;margin-bottom:14px}.kthl-list{display:grid;gap:8px}.kthl-row{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:11px 12px;border:1px solid #dfe4e8;border-radius:7px;background:#fafbfc;cursor:grab}.kthl-row.dragging{opacity:.45}.kthl-row.drop-before{border-top:3px solid #1f6fb2}.kthl-grip{font-size:20px;color:#6b7680;text-align:center;user-select:none}.kthl-name{font-weight:700}.kthl-meta{display:block;font-weight:400;font-size:12px;color:#66727c;margin-top:3px}.kthl-badge{display:inline-block;font-size:11px;border-radius:10px;padding:2px 7px;background:#eef1f3;color:#56616b;margin-left:6px}.kthl-badge.off{background:#f7e9e8;color:#8a3029}.kthl-switch{display:flex;align-items:center;gap:6px;white-space:nowrap}.kthl-actions{display:flex;gap:7px;flex-wrap:wrap}.kthl-btn{border:1px solid #aeb8c4;background:#fff;border-radius:5px;padding:7px 10px;cursor:pointer}.kthl-btn.primary{background:#1f6fb2;border-color:#1f6fb2;color:#fff}.kthl-btn:disabled{opacity:.55;cursor:not-allowed}.kthl-status{padding:10px 12px;border-radius:6px;margin-top:12px}.kthl-status.ok{background:#edf8e7;color:#355d23}.kthl-status.err{background:#fff0f0;color:#8a2626}.kthl-status.info{background:#f3f8fb;color:#395e76}.kthl-empty{padding:20px;text-align:center;color:#66727c}.kthl-note{font-size:12px;color:#66727c;margin-top:10px}@media(max-width:720px){.kthl-row{grid-template-columns:28px 1fr}.kthl-switch,.kthl-moves{grid-column:2}.kthl-head{display:block}}
</style>
<script>
(function(){"use strict";const KT=window.KohaTools,root=document.getElementById("kt-home-layout-manager"),host=KT?.getService?.("module-host"),layoutSvc=KT?.getService?.("home-layout"),remote=KT?.getService?.("remote-config"),cid="home-layout-manager";if(!KT||!root||!host||!layoutSvc)return;
const clone=v=>JSON.parse(JSON.stringify(v));const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const homeModules=()=>host.list().filter(x=>x.displayMode==="home-widget"||x.displayMode==="hybrid");let canonical=clone(KT.Config.getCanonicalPersistent(cid,true)||{}),draft=layoutSvc.normalize(canonical.homeLayout||{},homeModules()),dirty=false,dragId=null;
function moduleState(id){const c=KT.Config.getCanonical(id);return c?.enabled!==false&&c?.mode!=="off"}
function item(id){return homeModules().find(x=>x.id===id)}
function normalizeDraft(){draft=layoutSvc.normalize(draft,homeModules())}
function move(id,delta){normalizeDraft();const i=draft.order.indexOf(id),j=i+delta;if(i<0||j<0||j>=draft.order.length)return;[draft.order[i],draft.order[j]]=[draft.order[j],draft.order[i]];dirty=true;render()}
function moveBefore(id,before){normalizeDraft();if(id===before)return;const a=draft.order.filter(x=>x!==id),j=a.indexOf(before);if(j<0)a.push(id);else a.splice(j,0,id);draft.order=a;dirty=true;render()}
function setVisible(id,yes){const h=new Set(draft.hidden||[]);yes?h.delete(id):h.add(id);draft.hidden=[...h];dirty=true;render()}
function render(){normalizeDraft();const writable=!!remote?.canWrite?.(),rows=draft.order.map((id,idx)=>{const d=item(id);if(!d)return"";const on=moduleState(id),visible=!draft.hidden.includes(id);return `<div class="kthl-row" draggable="true" data-id="${esc(id)}"><div class="kthl-grip" title="Glisser-déposer">⋮⋮</div><div><span class="kthl-name">${esc(d.title||id)}</span>${!on?'<span class="kthl-badge off">module désactivé</span>':d.displayMode==='hybrid'?'<span class="kthl-badge">page + accueil</span>':'<span class="kthl-badge">accueil</span>'}<span class="kthl-meta">${esc(id)} · position ${idx+1}</span></div><label class="kthl-switch"><input type="checkbox" data-visible="${esc(id)}" ${visible?'checked':''}> Afficher sur l’accueil</label><div class="kthl-moves"><button class="kthl-btn" data-up="${esc(id)}" ${idx===0?'disabled':''} title="Monter">↑</button> <button class="kthl-btn" data-down="${esc(id)}" ${idx===draft.order.length-1?'disabled':''} title="Descendre">↓</button></div></div>`}).join("");root.innerHTML=`<div class="kthl-head"><div><h2>Accueil & annonces</h2><p>Choisissez l’ordre d’apparition des widgets sur la page d’accueil Koha.</p></div><a class="kthl-btn" href="/cgi-bin/koha/mainpage.pl">Voir l’accueil</a></div><div class="kthl-help"><strong>Glissez les blocs dans l’ordre souhaité.</strong> Le bouton « Afficher sur l’accueil » masque uniquement le widget d’accueil : il ne désactive pas le module ni sa page éventuelle. Les futurs modules d’accueil seront ajoutés automatiquement à la fin de la liste.</div><div class="kthl-card"><div class="kthl-list">${rows||'<div class="kthl-empty">Aucun module d’accueil détecté.</div>'}</div><div class="kthl-note">Les anciennes annonces encore présentes sont adoptées par KohaTools : leur ordre et leur visibilité suivent déjà ce réglage pendant la migration.</div></div><div class="kthl-actions"><button class="kthl-btn primary" id="kthl-save" ${!writable?'disabled':''}>Enregistrer pour tous les postes</button><button class="kthl-btn" id="kthl-default">Rétablir l’ordre par défaut</button><button class="kthl-btn" id="kthl-all">Tout afficher</button></div>${!writable?'<div class="kthl-status info">L’écriture de la configuration globale est actuellement désactivée pour ce poste. Le réglage reste consultable, mais seul un contexte autorisé peut le publier.</div>':''}<div id="kthl-status"></div>`;bind()}
function bind(){root.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>move(b.dataset.up,-1));root.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>move(b.dataset.down,1));root.querySelectorAll("[data-visible]").forEach(x=>x.onchange=()=>setVisible(x.dataset.visible,x.checked));root.querySelectorAll(".kthl-row").forEach(r=>{r.ondragstart=e=>{dragId=r.dataset.id;r.classList.add("dragging");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",dragId)};r.ondragend=()=>{dragId=null;root.querySelectorAll(".kthl-row").forEach(x=>x.classList.remove("dragging","drop-before"))};r.ondragover=e=>{e.preventDefault();if(dragId&&dragId!==r.dataset.id)r.classList.add("drop-before")};r.ondragleave=()=>r.classList.remove("drop-before");r.ondrop=e=>{e.preventDefault();r.classList.remove("drop-before");const id=dragId||e.dataTransfer.getData("text/plain");if(id)moveBefore(id,r.dataset.id)}});root.querySelector("#kthl-default")?.addEventListener("click",()=>{draft={order:layoutSvc.defaultOrder(homeModules()),hidden:[],adoptLegacy:true};dirty=true;render()});root.querySelector("#kthl-all")?.addEventListener("click",()=>{draft.hidden=[];dirty=true;render()});root.querySelector("#kthl-save")?.addEventListener("click",save)}
async function save(){normalizeDraft();const s=root.querySelector("#kthl-status");s.className="kthl-status info";s.textContent="Enregistrement…";const full=clone(KT.Config.getCanonicalPersistent(cid,true)||canonical);full.homeLayout=clone(draft);const r=await remote?.saveCanonical?.(cid,full);if(r?.ok){canonical=clone(KT.Config.getCanonicalPersistent(cid,true)||full);dirty=false;s.className="kthl-status ok";s.textContent="Ordre de l’accueil enregistré pour l’installation. Il sera appliqué immédiatement sur l’accueil Koha.";host.refreshHome?.()}else{s.className="kthl-status err";s.textContent="Impossible d’enregistrer globalement : "+(r?.error||"écriture désactivée")}}
window.addEventListener("beforeunload",e=>{if(!dirty)return;e.preventDefault();e.returnValue=""});render();})();
</script>
