<section class="kt-navette" id="kt-navette-root"></section>
<style>
.kt-navette{background:#fff;border:1px solid #d8dee4;border-radius:8px;padding:14px}.kt-navette-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.kt-navette-head img{width:42px;height:42px;object-fit:contain}.kt-navette h3{margin:0;font-size:16px}.kt-navette-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.kt-navette-day{border:1px solid #e6e9ed;border-radius:7px;padding:9px}.kt-navette-day strong{display:block;margin-bottom:5px}.kt-navette-stop{font-size:13px;padding:3px 0}.kt-navette-empty{color:#667085}
</style>
<script>
(()=>{const cfg=window.KohaTools?.Config?.getCanonical?.('planning-navette-mediabus')?.installation||{},root=document.getElementById('kt-navette-root');if(!root)return;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const schedule=cfg.schedule&&typeof cfg.schedule==='object'?cfg.schedule:{};const days=Object.entries(schedule);const truck=cfg.assetTruckUrl?`<img src="${esc(cfg.assetTruckUrl)}" alt="">`:'<span aria-hidden="true" style="font-size:32px">🚚</span>';root.innerHTML=`<div class="kt-navette-head">${truck}<div><h3>${esc(cfg.title||'Planning navette / médiabus')}</h3><small>${esc(cfg.subtitle||'Planning de la semaine')}</small></div></div>${days.length?`<div class="kt-navette-grid">${days.map(([day,stops])=>`<div class="kt-navette-day"><strong>${esc(day)}</strong>${(Array.isArray(stops)?stops:[stops]).map(s=>`<div class="kt-navette-stop">${esc(typeof s==='string'?s:(s.label||s.site||''))}${typeof s==='object'&&s.time?` · ${esc(s.time)}`:''}</div>`).join('')}</div>`).join('')}</div>`:'<div class="kt-navette-empty">Planning non configuré pour cette installation.</div>'}`;})();
</script>
