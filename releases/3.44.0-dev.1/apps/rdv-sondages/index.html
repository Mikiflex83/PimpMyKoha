/*
  RDV & SONDAGES — application KohaTools pré-plugin
  --------------------------------------------------
  - Authentification Firebase anonyme pour attribuer un UID technique au navigateur.
  - Les demandes et réponses publiques sont limitées à leur propriétaire (ownerUid).
  - Les rôles member/admin sont accordés explicitement dans rdv_access/{uid}.
  - Aucun mot de passe d'administration n'est embarqué dans le JavaScript.
  - Les règles Firestore à copier sont fournies dans prerequisites/firebase/rdv-sondages.rules.
*/

// CONFIGURATION FIREBASE
// -----------------------------------------------------------------------------

const MODULE_ID = 'rdv-sondages';
const moduleConfig = window.KohaTools?.Config?.getCanonical?.(MODULE_ID) || {};
const firebaseMeta = window.KohaTools?.getService?.('firebase-module')?.require?.(MODULE_ID, moduleConfig.firebase);
const firebaseConfig = window.KohaTools?.getService?.('firebase-module')?.publicConfig?.(MODULE_ID, firebaseMeta, { throwOnError: true });
const firebaseAppName = firebaseMeta?.appName || 'KohaToolsRdvSondages';
const firebaseApp = getApps().find(app => app.name === firebaseAppName) || initializeApp(firebaseConfig, firebaseAppName);
const db = firebaseMeta?.databaseId && firebaseMeta.databaseId !== '(default)' ? getFirestore(firebaseApp, firebaseMeta.databaseId) : getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);
const ACCESS_COLLECTION = String(moduleConfig?.installation?.adminAccess?.accessCollection || "rdv_access");
let authUser = null;
let accessRole = "public";

async function ensureFirebaseIdentity() {
  if (auth.currentUser) { authUser = auth.currentUser; return authUser; }
  const credential = await signInAnonymously(auth);
  authUser = credential.user || auth.currentUser || null;
  return authUser;
}

async function refreshAccessRole() {
  if (!authUser) { accessRole = "public"; return accessRole; }
  try {
    const snap = await getDoc(doc(db, ACCESS_COLLECTION, authUser.uid));
    budgetRead(snap);
    const data = snap.exists() ? (snap.data() || {}) : {};
    accessRole = data.approved === true && ["member","admin"].includes(String(data.role||"")) ? String(data.role) : "public";
  } catch (_) { accessRole = "public"; }
  return accessRole;
}
function isAdminRole(){ return accessRole === "admin"; }
function isMemberRole(){ return accessRole === "member" || accessRole === "admin"; }

const ktHost = window.KohaTools?.getService?.('module-host');
const ktBudget = window.KohaTools?.getService?.('firebase-budget');
const budgetRead = snap => { try { ktBudget?.record?.(firebaseMeta.projectId,'reads',Number(snap?.size ?? (snap?.exists?.() ? 1 : 0)),{kind:'firestore'}); } catch (_) {} };

// -----------------------------------------------------------------------------
// EMAILJS — notifications sans backend
// -----------------------------------------------------------------------------

let emailQueue = Promise.resolve();
let lastEmailAt = 0;

function emailConfigured() {
  return Boolean(
    state.settings.adminEmail &&
    state.settings.emailjsServiceId &&
    state.settings.emailjsTemplateId &&
    state.settings.emailjsPublicKey &&
    window.emailjs
  );
}

function emailSlotText(slot, themeIdsOrId) {
  if (!slot) return "Créneau non disponible";

  const ids = Array.isArray(themeIdsOrId)
    ? themeIdsOrId
    : (themeIdsOrId ? [themeIdsOrId] : (slot.themeId ? [slot.themeId] : []));

  const themesText = ids.length
    ? themeNamesText(ids)
    : (slot.themeId ? (themeById(slot.themeId)?.name || "Thème") : "Sujet au choix");

  const start = toDate(slot.startAt);
  const end = toDate(slot.endAt);

  return [
    start ? fmtDate(start) : "",
    start && end ? `${fmtTime(start)} → ${fmtTime(end)}` : "",
    themesText,
    slot.location || ""
  ].filter(Boolean).join(" · ");
}

function queueEmail(toEmail, subject, message, replyTo = "") {
  if (!toEmail) return Promise.resolve(false);

  if (!emailConfigured()) {
    console.warn("EmailJS n'est pas encore configuré.");
    return Promise.resolve(false);
  }

  const cfg = { ...state.settings };

  const execute = async () => {
    // EmailJS limite l'envoi à environ une requête par seconde.
    const elapsed = Date.now() - lastEmailAt;
    if (elapsed < 1100) {
      await new Promise(resolve => setTimeout(resolve, 1100 - elapsed));
    }

    const result = await window.emailjs.send(
      cfg.emailjsServiceId,
      cfg.emailjsTemplateId,
      {
        to_email: toEmail,
        subject,
        message,
        from_name: cfg.notificationName || "Rendez-vous réseau",
        reply_to: replyTo || cfg.adminEmail || ""
      },
      {
        publicKey: cfg.emailjsPublicKey,
        blockHeadless: true
      }
    );

    lastEmailAt = Date.now();
    return result;
  };

  // Sérialise les mails : utile pour les actions groupées.
  emailQueue = emailQueue
    .catch(() => {})
    .then(execute);

  return emailQueue;
}

function sendEmailQuietly(toEmail, subject, message, replyTo = "") {
  queueEmail(toEmail, subject, message, replyTo).catch(err => {
    console.error("Notification EmailJS non envoyée :", err);
  });
}

function notifyNewBooking(booking, slot) {
  if (!state.settings.adminEmail) return;

  const slotText = emailSlotText(slot, bookingThemeIds(booking));

  sendEmailQuietly(
    state.settings.adminEmail,
    `[${state.settings.notificationName || "Rendez-vous réseau"}] Nouvelle demande — ${booking.userName}`,
    [
      "Nouvelle demande de rendez-vous",
      "",
      `Collègue : ${booking.userName}`,
      `Médiathèque / service : ${booking.branch || "—"}`,
      `Email : ${booking.email || "—"}`,
      `Créneau : ${slotText}`,
      `Besoin : ${booking.message || "—"}`,
      "",
      "La demande est en attente de validation dans l'administration."
    ].join("\\n"),
    booking.email || ""
  );
}

function notifyBookingStatus(booking, status) {
  if (!booking?.email) return;

  const slot = state.slots.find(s => s.id === booking.slotId);
  const slotText = emailSlotText(slot, bookingThemeIds(booking));

  const copy = {
    approved: {
      subject: "Votre demande est confirmée",
      text: "Votre demande de rendez-vous a été validée."
    },
    rejected: {
      subject: "Votre demande a été refusée",
      text: "Votre demande de rendez-vous a été refusée."
    },
    cancelled: {
      subject: "Votre rendez-vous a été annulé",
      text: "Votre demande / inscription a été annulée."
    }
  }[status];

  if (!copy) return;

  const lines = [
    `Bonjour ${booking.userName || booking.firstName || ""},`,
    "",
    copy.text,
    "",
    `Créneau : ${slotText}`
  ];

  if (booking.adminComment) {
    lines.push("", `Message : ${booking.adminComment}`);
  }

  sendEmailQuietly(
    booking.email,
    `[${state.settings.notificationName || "Rendez-vous réseau"}] ${copy.subject}`,
    lines.join("\\n"),
    state.settings.adminEmail || ""
  );
}

function notifyAdminCancellation(booking) {
  if (!state.settings.adminEmail) return;

  const slot = state.slots.find(s => s.id === booking.slotId);

  sendEmailQuietly(
    state.settings.adminEmail,
    `[${state.settings.notificationName || "Rendez-vous réseau"}] Annulation — ${booking.userName || "Collègue"}`,
    [
      "Annulation d'un rendez-vous",
      "",
      `Collègue : ${booking.userName || "—"}`,
      `Médiathèque / service : ${booking.branch || "—"}`,
      `Email : ${booking.email || "—"}`,
      `Créneau : ${emailSlotText(slot, bookingThemeIds(booking))}`
    ].join("\\n"),
    booking.email || ""
  );
}

function notifySlotAffected(slotId, actionText, slotOverride = null) {
  const slot = slotOverride || state.slots.find(s => s.id === slotId);
  if (!slot) return;

  state.bookings
    .filter(b =>
      b.slotId === slotId &&
      ["pending", "approved"].includes(b.status) &&
      b.email
    )
    .forEach(booking => {
      sendEmailQuietly(
        booking.email,
        `[${state.settings.notificationName || "Rendez-vous réseau"}] Modification de votre créneau`,
        [
          `Bonjour ${booking.userName || booking.firstName || ""},`,
          "",
          actionText,
          "",
          `Créneau : ${emailSlotText(slot, bookingThemeIds(booking))}`,
          `Statut de votre demande : ${booking.status === "approved" ? "confirmée" : "en attente"}.`
        ].join("\\n"),
        state.settings.adminEmail || ""
      );
    });
}

const LOCAL_BOOKINGS_KEY = "doodleKohaBookingIds";
const LOCAL_VISITOR_KEY = "doodleKohaVisitor";
const LOCAL_CLIENT_KEY = "doodleKohaClientKey";

function getClientKey() {
  let key = localStorage.getItem(LOCAL_CLIENT_KEY);
  if (!key) {
    key = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
    localStorage.setItem(LOCAL_CLIENT_KEY, key);
  }
  return key;
}

function getLocalBookingIds() {
  try { return JSON.parse(localStorage.getItem(LOCAL_BOOKINGS_KEY) || "[]"); }
  catch (_) { return []; }
}

function rememberBookingId(id) {
  const ids = new Set(getLocalBookingIds());
  ids.add(id);
  localStorage.setItem(LOCAL_BOOKINGS_KEY, JSON.stringify([...ids]));
}

function forgetBookingId(id) {
  localStorage.setItem(LOCAL_BOOKINGS_KEY, JSON.stringify(getLocalBookingIds().filter(x => x !== id)));
}

function getSavedVisitor() {
  try { return JSON.parse(localStorage.getItem(LOCAL_VISITOR_KEY) || "{}"); }
  catch (_) { return {}; }
}

function saveVisitor(visitor) {
  localStorage.setItem(LOCAL_VISITOR_KEY, JSON.stringify(visitor));
}

const BRANCHES = (Array.isArray(window.KohaTools?.Config?.getCanonical?.('rdv-sondages')?.installation?.branchOptions) ? window.KohaTools.Config.getCanonical('rdv-sondages').installation.branchOptions : ['AUTRE']);

const $ = (sel, ctx = root) => ctx.querySelector(sel);
const $$ = (sel, ctx = root) => [...ctx.querySelectorAll(sel)];

const esc = (value = "") =>
  String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[ch]);

function uid() {
  return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
}

function pad(n) { return String(n).padStart(2, "0"); }

function dayName(day) {
  const names = {
    0:"Dim",
    1:"Lun",
    2:"Mar",
    3:"Mer",
    4:"Jeu",
    5:"Ven",
    6:"Sam"
  };

  return names[Number(day)] ?? String(day ?? "");
}

function localDateKey(date) {
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
}

function dateKey(date) {
  return localDateKey(date);
}

function dateFromKey(key, time = "00:00") {
  const [y,m,d] = key.split("-").map(Number);
  const [hh,mm] = time.split(":").map(Number);
  return new Date(y, m - 1, d, hh, mm, 0, 0);
}

function fmtDate(d) {
  return new Intl.DateTimeFormat("fr-FR", {
    weekday:"long", day:"numeric", month:"long", year:"numeric"
  }).format(d);
}

function fmtShortDate(d) {
  return new Intl.DateTimeFormat("fr-FR", {
    weekday:"short", day:"2-digit", month:"2-digit"
  }).format(d);
}

function fmtTime(d) {
  return new Intl.DateTimeFormat("fr-FR", {
    hour:"2-digit", minute:"2-digit"
  }).format(d);
}

function toDate(value) {
  if (!value) return null;
  if (typeof value.toDate === "function") return value.toDate();
  if (value instanceof Date) return value;
  return new Date(value);
}

function minutesToTime(total) {
  const h = Math.floor(total / 60);
  const m = total % 60;
  return `${pad(h)}:${pad(m)}`;
}

function timeToMinutes(s) {
  const [h,m] = s.split(":").map(Number);
  return h * 60 + m;
}

function toast(message, type = "ok") {
  const el = document.createElement("div");
  el.className = `dk-toast ${type}`;
  el.textContent = message;
  $(".dk-toasts").appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 250);
  }, 3200);
}

function setBusy(button, busy, text = "Traitement…") {
  if (!button) return;
  if (busy) {
    button.dataset.originalText = button.textContent;
    button.disabled = true;
    button.textContent = text;
  } else {
    button.disabled = false;
    button.textContent = button.dataset.originalText || button.textContent;
  }
}


function bookingThemeIds(booking) {
  if (Array.isArray(booking?.themeIds) && booking.themeIds.length) {
    return booking.themeIds.filter(Boolean);
  }
  return booking?.themeId ? [booking.themeId] : [];
}

function bookingThemeNames(booking) {
  const names = bookingThemeIds(booking)
    .map(id => themeById(id)?.name)
    .filter(Boolean);
  return names.length ? names : ["Thème non défini"];
}

function themeNamesText(ids = []) {
  const names = ids.map(id => themeById(id)?.name).filter(Boolean);
  return names.length ? names.join(", ") : "Sujet au choix";
}

const LOCAL_POLL_RESPONSES_KEY = "doodleKohaPollResponseIds";

function getLocalPollResponses() {
  try { return JSON.parse(localStorage.getItem(LOCAL_POLL_RESPONSES_KEY) || "{}"); }
  catch (_) { return {}; }
}

function rememberPollResponse(pollId, responseId) {
  const all = getLocalPollResponses();
  all[pollId] = responseId;
  localStorage.setItem(LOCAL_POLL_RESPONSES_KEY, JSON.stringify(all));
}

function localPollResponseId(pollId) {
  return getLocalPollResponses()[pollId] || "";
}

function normalizeIdentityValue(value) {
  return String(value || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function pollIdentityKey({ email = "", firstName = "", lastName = "", branch = "" } = {}) {
  if (email) return `mail:${normalizeIdentityValue(email)}`;

  return [
    "person",
    normalizeIdentityValue(firstName),
    normalizeIdentityValue(lastName),
    normalizeIdentityValue(branch)
  ].join(":");
}

function pollResponseDocId(pollId, identityKey) {
  const raw = `${pollId}|${identityKey}`;

  // deterministic, Firestore-safe id. btoa handles ASCII after encodeURIComponent.
  const encoded = btoa(unescape(encodeURIComponent(raw)))
    .replace(/[+/=]/g, "_")
    .slice(0, 120);

  return `r_${encoded}`;
}

function existingPollResponseForIdentity(pollId, identityKey) {
  return state.pollResponses.find(
    r => r.pollId === pollId && r.identityKey === identityKey
  ) || null;
}


function themeById(id) {
  return state.themes.find(t => t.id === id);
}

function approvedBookingsForSlot(slotId) {
  return state.bookings.filter(b => b.slotId === slotId && b.status === "approved");
}

function pendingBookingsForSlot(slotId) {
  return state.bookings.filter(b => b.slotId === slotId && b.status === "pending");
}

function myBookingForSlot(slotId) {
  const ownIds = new Set(getLocalBookingIds());
  return state.bookings.find(b =>
    ownIds.has(b.id) &&
    b.slotId === slotId &&
    ["pending","approved"].includes(b.status)
  );
}

function slotFreePlaces(slot) {
  const cap = Number(slot.capacity || 1);
  return Math.max(0, cap - approvedBookingsForSlot(slot.id).length);
}

function isFutureSlot(slot) {
  const start = toDate(slot.startAt);
  return start && start.getTime() > Date.now();
}

// -----------------------------------------------------------------------------
// FIRESTORE LIVE DATA

let rdvBudgetListenerStops = [];
function trackRdvListener(label) {
  try {
    const stop = ktBudget?.listenerStart?.(firebaseMeta.projectId, label, 'firestore');
    if (typeof stop === 'function') rdvBudgetListenerStops.push(stop);
  } catch (_) {}
}

function stopListeners() {
  state.unsubscribe.forEach(fn => {
    try { fn(); } catch (_) {}
  });
  state.unsubscribe = [];
  rdvBudgetListenerStops.forEach(fn => { try { fn(); } catch (_) {} });
  rdvBudgetListenerStops = [];
}

function startListeners() {
  stopListeners();

  trackRdvListener("settings-notifications");
  state.unsubscribe.push(
    onSnapshot(doc(db, "settings", "notifications"), snap => {
      budgetRead(snap);
      if (snap.exists()) {
        state.settings = {
          adminEmail: String(snap.data()?.adminEmail || ""),
          notificationName: String(snap.data()?.notificationName || "Rendez-vous réseau"),
          emailjsServiceId: String(snap.data()?.emailjsServiceId || ""),
          emailjsTemplateId: String(snap.data()?.emailjsTemplateId || ""),
          emailjsPublicKey: String(snap.data()?.emailjsPublicKey || "")
        };
      }
      renderApp();
    }, console.error)
  );

  trackRdvListener("themes");
  state.unsubscribe.push(
    onSnapshot(query(collection(db, "themes"), limit(500)), snap => {
      budgetRead(snap);
      state.themes = snap.docs.map(d => ({ id:d.id, ...d.data() }))
        .filter(x => x.active !== false)
        .sort((a,b) => (a.order ?? 999) - (b.order ?? 999) || a.name.localeCompare(b.name));
      renderApp();
    }, console.error)
  );

  trackRdvListener("slots");
  state.unsubscribe.push(
    onSnapshot(query(collection(db, "slots"), limit(500)), snap => {
      budgetRead(snap);
      state.slots = snap.docs.map(d => ({ id:d.id, ...d.data() }))
        .sort((a,b) => (toDate(a.startAt)?.getTime() || 0) - (toDate(b.startAt)?.getTime() || 0));
      renderApp();
    }, console.error)
  );

  trackRdvListener("bookings");
  state.unsubscribe.push(
    onSnapshot(state.adminMode ? query(collection(db, "bookings"), limit(1000)) : query(collection(db, "bookings"), where("ownerUid","==",authUser?.uid || "__none__"), limit(1000)), snap => {
      budgetRead(snap);
      state.bookings = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      renderApp();
    }, console.error)
  );


  trackRdvListener("polls");
  state.unsubscribe.push(
    onSnapshot(query(collection(db, "polls"), limit(200)), snap => {
      budgetRead(snap);
      state.polls = snap.docs.map(d => ({ id:d.id, ...d.data() }))
        .sort((a,b) =>
          (toDate(b.createdAt)?.getTime() || 0) -
          (toDate(a.createdAt)?.getTime() || 0)
        );
      renderApp();
    }, console.error)
  );

  trackRdvListener("poll-responses");
  state.unsubscribe.push(
    onSnapshot(state.adminMode ? query(collection(db, "pollResponses"), limit(1000)) : query(collection(db, "pollResponses"), where("ownerUid","==",authUser?.uid || "__none__"), limit(1000)), snap => {
      budgetRead(snap);
      state.pollResponses = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      renderApp();
    }, console.error)
  );


  if (isMemberRole()) {
    trackRdvListener("participants");
    state.unsubscribe.push(
      onSnapshot(query(collection(db, "participants"), limit(1000)), snap => {
        budgetRead(snap);
        state.participants = snap.docs
          .map(d => ({ id:d.id, ...d.data() }))
          .sort((a,b) =>
            String(a.lastName || "").localeCompare(String(b.lastName || ""), "fr") ||
            String(a.firstName || "").localeCompare(String(b.firstName || ""), "fr")
          );
        renderApp();
      }, console.error)
    );
  } else {
    state.participants = [];
  }

  if (state.adminMode) {
    trackRdvListener("recurrence-rules");
    state.unsubscribe.push(
      onSnapshot(query(collection(db, "recurrenceRules"), limit(200)), snap => {
      budgetRead(snap);
        state.recurrenceRules = snap.docs.map(d => ({ id:d.id, ...d.data() }))
          .sort((a,b) => String(a.name || "").localeCompare(String(b.name || "")));
        renderApp();
      }, console.error)
    );
  }
}

function deepLinkHash(kind, id = "") {
  const params = new URLSearchParams();
  params.set("dk", kind);
  if (id) params.set("id", id);
  return `#${params.toString()}`;
}

function deepLinkUrl(kind, id = "") {
  const url = new URL(window.location.href);
  url.hash = deepLinkHash(kind, id).slice(1);
  return url.toString();
}

function readDeepLink() {
  const hash = String(window.location.hash || "").replace(/^#/, "");
  const params = new URLSearchParams(hash);
  const kind = String(params.get("dk") || "");
  const id = String(params.get("id") || "");
  const action = String(params.get("action") || "");

  if (!["slots","polls","mine","slot","poll"].includes(kind)) {
    return { kind:"", id:"", action:"" };
  }

  return { kind, id, action };
}

async function copyPermanentLink(kind, id = "") {
  const url = deepLinkUrl(kind, id);

  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(url);
    } else {
      const textarea = document.createElement("textarea");
      textarea.value = url;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      root.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
    }

    toast("Lien copié. Vous pouvez le coller dans un mail.");
  } catch (err) {
    console.error(err);
    toast("Impossible de copier automatiquement le lien.", "error");
  }
}

function applyDeepLinkFromLocation() {
  const { kind } = readDeepLink();

  if (kind === "slots" || kind === "slot") {
    state.activeView = "slots";

    if (kind === "slot") {
      // Un lien direct doit retrouver le créneau même si les filtres locaux
      // de l'utilisateur auraient normalement pu le masquer.
      state.filters.theme = "";
      state.filters.onlyAvailable = false;
      state.slotsDisplayMode = "list";
    }
  } else if (kind === "polls" || kind === "poll") {
    state.activeView = "polls";
  } else if (kind === "mine") {
    state.activeView = "mine";
  }
}

function bindPermanentLinkButtons() {
  $$("[data-copy-link]").forEach(button => {
    button.addEventListener("click", async e => {
      e.preventDefault();
      e.stopPropagation();

      await copyPermanentLink(
        button.dataset.copyLink,
        button.dataset.copyId || ""
      );
    });
  });
}

function focusDeepLinkedItem() {
  const hash = window.location.hash;

  if (!hash || state.deepLinkHandledHash === hash) return;

  const { kind, id, action } = readDeepLink();
  let target = null;

  if (kind === "slot" && id) {
    target = $$("[data-slot-card]").find(node => node.dataset.slotCard === id) || null;
  }

  if (kind === "poll" && id) {
    target = $$("[data-poll-card]").find(node => node.dataset.pollCard === id) || null;
  }

  if (!target) return;

  state.deepLinkHandledHash = hash;

  requestAnimationFrame(() => {
    target.classList.add("dk-deep-link-target");
    target.scrollIntoView({
      behavior:"smooth",
      block:"center",
      inline:"nearest"
    });

    if (kind === "poll" && action === "answer") {
      const poll = state.polls.find(item => item.id === id);

      if (poll && pollEffectiveState(poll) === "open") {
        openPollResponseModal(id);
      }
    }
  });
}

function visibleFutureSlots() {
  return state.slots.filter(slot => {
    if (slot.active === false || !isFutureSlot(slot)) return false;
    if (state.filters.theme && slot.themeId && slot.themeId !== state.filters.theme) return false;
    if (state.filters.onlyAvailable && slotFreePlaces(slot) <= 0 && !myBookingForSlot(slot.id)) return false;
    return true;
  });
}


function startOfCurrentWeek() {
  const now = new Date();
  const day = now.getDay() || 7;
  const monday = new Date(now);
  monday.setHours(0,0,0,0);
  monday.setDate(now.getDate() - day + 1 + (state.weekOffset * 7));
  return monday;
}

function weekCaption() {
  const monday = startOfCurrentWeek();
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);

  const fmt = d => new Intl.DateTimeFormat("fr-FR", {
    day:"numeric",
    month:"short"
  }).format(d);

  return `${fmt(monday)} → ${fmt(sunday)}`;
}

function renderWeekView(slots) {
  const monday = startOfCurrentWeek();
  const days = Array.from({ length:7 }, (_,i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });

  const minHour = 8;
  const maxHour = 19;

  let html = `<div class="dk-week">`;

  html += `<div class="dk-week-cell dk-week-head"></div>`;
  days.forEach(day => {
    html += `
      <div class="dk-week-cell dk-week-head">
        ${esc(new Intl.DateTimeFormat("fr-FR", {
          weekday:"short", day:"2-digit", month:"2-digit"
        }).format(day))}
      </div>
    `;
  });

  for (let hour = minHour; hour <= maxHour; hour++) {
    html += `<div class="dk-week-cell dk-week-time">${pad(hour)}:00</div>`;

    days.forEach(day => {
      const key = dateKey(day);
      const daySlots = slots.filter(slot => {
        const start = toDate(slot.startAt);
        return dateKey(start) === key && start.getHours() === hour;
      });

      html += `<div class="dk-week-cell">`;

      daySlots.forEach(slot => {
        const mine = myBookingForSlot(slot.id);
        const free = slotFreePlaces(slot);
        const theme = themeById(slot.themeId);
        const canBook = !mine && free > 0;

        html += `
          <div
            class="dk-week-slot ${mine ? "mine" : ""} ${free <= 0 && !mine ? "full" : ""}"
            data-week-book="${slot.id}"
            role="button"
            tabindex="0"
            aria-label="${
              canBook
                ? `Réserver le créneau de ${fmtTime(toDate(slot.startAt))}`
                : mine
                  ? "Vous avez déjà une demande pour ce créneau"
                  : "Créneau complet"
            }"
          >
            <strong>${fmtTime(toDate(slot.startAt))} → ${fmtTime(toDate(slot.endAt))}</strong>
            <div>${esc(slot.themeId ? (theme?.name || "Thème") : "Sujet au choix")}</div>

            <div class="dk-muted">
              ${free} place${free > 1 ? "s" : ""}
            </div>

            <div class="dk-week-action">
              ${
                canBook
                  ? "Cliquer pour réserver"
                  : mine
                    ? (mine.status === "approved" ? "Déjà confirmé" : "Demande en attente")
                    : "Complet"
              }
            </div>
          </div>
        `;
      });

      html += `</div>`;
    });
  }

  html += `</div>`;
  return html;
}

          <input type="checkbox" id="dk-filter-available" ${state.filters.onlyAvailable?"checked":""}>

        </label>

        <div class="dk-view-toggle" style="margin-left:auto">
          <button class="dk-btn dk-btn-sm ${state.slotsDisplayMode==="list"?"dk-btn-primary":"dk-btn-light"}" data-display-mode="list">
            Liste
          </button>
          <button class="dk-btn dk-btn-sm ${state.slotsDisplayMode==="week"?"dk-btn-primary":"dk-btn-light"}" data-display-mode="week">

          </button>

        ${state.slotsDisplayMode === "week" ? `
          <div class="dk-inline" style="width:100%;justify-content:flex-end">
            <button class="dk-btn dk-btn-light dk-btn-sm" id="dk-prev-week">← Semaine précédente</button>
            <strong>${esc(weekCaption())}</strong>
            <button class="dk-btn dk-btn-light dk-btn-sm" id="dk-current-week">Aujourd'hui</button>
            <button class="dk-btn dk-btn-light dk-btn-sm" id="dk-next-week">Semaine suivante →</button>
          </div>
        ` : ""}
      </div>

      <div id="dk-slots-container"></div>
    </section>
  `;

  $("#dk-filter-theme").addEventListener("change", e => {
    state.filters.theme = e.target.value;
    renderSlotsView();
  });

  $("#dk-filter-available").addEventListener("change", e => {
    state.filters.onlyAvailable = e.target.checked;
    renderSlotsView();
  });

  $$("[data-display-mode]").forEach(button => {
    button.addEventListener("click", () => {
      state.slotsDisplayMode = button.dataset.displayMode;
      renderSlotsView();
    });
  });

  $("#dk-prev-week")?.addEventListener("click", () => {
    state.weekOffset -= 1;
    renderSlotsView();
  });

  $("#dk-next-week")?.addEventListener("click", () => {
    state.weekOffset += 1;
    renderSlotsView();
  });

  $("#dk-current-week")?.addEventListener("click", () => {
    state.weekOffset = 0;
    renderSlotsView();
  });

  const container = $("#dk-slots-container");

  if (!slots.length) {
    container.innerHTML = `<div class="dk-empty">Aucun créneau ne correspond aux critères.</div>`;
  } else if (state.slotsDisplayMode === "week") {
    container.innerHTML = renderWeekView(slots);
  } else {
    const groups = new Map();

    slots.forEach(slot => {
      const key = dateKey(toDate(slot.startAt));
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(slot);
    });

    container.innerHTML = [...groups.entries()].map(([key, items]) => `
      <div class="dk-day-group">
        <div class="dk-day-title">${esc(fmtDate(dateFromKey(key)))}</div>
        <div class="dk-slot-list">
          ${items.map(slotCardHtml).join("")}
        </div>
      </div>
    `).join("");
  }

  $$("[data-book]").forEach(button => {
    button.addEventListener("click", () => openBookingModal(button.dataset.book));
  });

  $$("[data-cancel-booking]").forEach(button => {
    button.addEventListener("click", () => cancelBooking(button.dataset.cancelBooking));
  });

  $$("[data-week-book]").forEach(card => {
    const activate = () => {
      const slotId = card.dataset.weekBook;
      const slot = state.slots.find(s => s.id === slotId);

      if (!slot) {
        toast("Ce créneau n'existe plus.", "error");
        return;
      }

      const mine = myBookingForSlot(slotId);

      if (mine) {
        toast(
          mine.status === "approved"
            ? "Vous êtes déjà inscrit à ce créneau."
            : "Vous avez déjà une demande en attente pour ce créneau."
        );
        return;
      }

      if (slotFreePlaces(slot) <= 0) {
        toast("Ce créneau est complet.", "error");
        return;
      }

      openBookingModal(slotId);
    };

    card.addEventListener("click", activate);

    card.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        activate();
      }
    });
  });
}

function slotCardHtml(slot) {
  const free = slotFreePlaces(slot);
  const pending = pendingBookingsForSlot(slot.id).length;
  const mine = myBookingForSlot(slot.id);
  const theme = themeById(slot.themeId);
  const allThemes = !slot.themeId;
  const start = toDate(slot.startAt);
  const end = toDate(slot.endAt);

  let status;
  if (mine?.status === "approved") status = `<span class="dk-badge ok">Confirmé</span>`;
  else if (mine?.status === "pending") status = `<span class="dk-badge pending">En attente</span>`;
  else if (free <= 0) status = `<span class="dk-badge full">Complet</span>`;
  else status = `<span class="dk-badge ok">${free} place${free>1?"s":""}</span>`;

  return `
    <article class="dk-slot" data-slot-card="${slot.id}">
      <div>
        <div class="dk-time">${fmtTime(start)} → ${fmtTime(end)}</div>
        <div class="dk-meta">${slot.duration || Math.round((end-start)/60000)} min</div>
      </div>
      <div>
        <div class="dk-theme">${allThemes ? "Sujet au choix" : esc(theme?.name || "Thème")}</div>
        <div class="dk-meta">
          ${slot.location ? `${esc(slot.location)} · ` : ""}
          ${Number(slot.capacity || 1)} place${Number(slot.capacity||1)>1?"s":""}
          ${pending ? ` · ${pending} demande${pending>1?"s":""} en attente` : ""}
        </div>
      </div>
      <div>${status}</div>
      <div class="dk-actions">
        ${mine ? `
          <button class="dk-btn dk-btn-danger dk-btn-sm" data-cancel-booking="${mine.id}">
            Annuler
          </button>
        ` : free > 0 ? `
          <button class="dk-btn dk-btn-primary dk-btn-sm" data-book="${slot.id}">
            Demander
          </button>
        ` : ""}

        <button
          class="dk-btn dk-btn-light dk-btn-sm dk-share-link"
          type="button"
          data-copy-link="slot"
          data-copy-id="${slot.id}"
          title="Copier le lien permanent vers ce créneau"
        >
          🔗 Lien
        </button>
      </div>
    </article>
  `;
}

async function cancelBooking(bookingId) {
  const ownIds = new Set(getLocalBookingIds());
  const booking = state.bookings.find(b => b.id === bookingId);
  if (!booking || !ownIds.has(bookingId)) return;

  if (!confirm("Annuler cette demande / inscription ?")) return;

  try {
    const bookingRef = doc(db, "bookings", bookingId);

    if (booking.status === "approved") {
      const slotRef = doc(db, "slots", booking.slotId);
      await runTransaction(db, async tx => {
        const bookingSnap = await tx.get(bookingRef);
        const slotSnap = await tx.get(slotRef);
        if (!bookingSnap.exists()) throw new Error("Demande introuvable.");
        if (!slotSnap.exists()) throw new Error("Créneau introuvable.");
        if (bookingSnap.data().status !== "approved") throw new Error("Cette inscription a déjà changé.");
        const current = Number(slotSnap.data().confirmedCount || 0);
        tx.update(bookingRef, {
          status:"cancelled",
          cancelledAt:serverTimestamp(),
          updatedAt:serverTimestamp()
        });
        tx.update(slotRef, {
          confirmedCount: Math.max(0, current - 1),
          updatedAt: serverTimestamp()
        });
      });
    } else {
      await updateDoc(bookingRef, {
        status:"cancelled",
        cancelledAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      });
    }

    forgetBookingId(bookingId);
    notifyBookingStatus(booking, "cancelled");
    notifyAdminCancellation(booking);
    toast("Demande annulée.");
  } catch (err) {
    console.error(err);
    toast(err.message || "Impossible d'annuler.", "error");
  }
}

function participantName(participant) {
  return `${participant?.firstName || ""} ${participant?.lastName || ""}`.trim() || "Participant";
}

function normalizeHeader(value) {
  return String(value || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]/g, "");
}

function detectDelimiter(textValue) {
  const firstUsefulLine = String(textValue || "")
    .split(/\r?\n/)
    .find(line => line.trim());

  if (!firstUsefulLine) return ";";

  const candidates = [";", "\t", ",", "|"];
  let best = ";";
  let bestCount = -1;

  candidates.forEach(delimiter => {
    const count = firstUsefulLine.split(delimiter).length - 1;
    if (count > bestCount) {
      best = delimiter;
      bestCount = count;
    }
  });

  return best;
}

function splitDelimitedLine(line, delimiter) {
  const values = [];
  let current = "";
  let quoted = false;

  for (let i = 0; i < line.length; i++) {
    const char = line[i];

    if (char === '"') {
      if (quoted && line[i + 1] === '"') {
        current += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (char === delimiter && !quoted) {
      values.push(current.trim());
      current = "";
    } else {
      current += char;
    }
  }

  values.push(current.trim());
  return values;
}

function parseParticipantsText(rawText) {
  const clean = String(rawText || "").replace(/^\uFEFF/, "").trim();
  if (!clean) throw new Error("Le fichier est vide.");

  const delimiter = detectDelimiter(clean);
  const lines = clean.split(/\r?\n/).filter(line => line.trim());

  if (!lines.length) throw new Error("Aucune ligne à importer.");

  const rows = lines.map(line => splitDelimitedLine(line, delimiter));
  const first = rows[0].map(normalizeHeader);

  const aliases = {
    firstName:["prenom","firstname","first"],
    lastName:["nom","lastname","surname","name"],
    email:["email","mail","courriel","adresseemail"],
    branch:["mediatheque","service","site","branch","bibliotheque","etablissement"]
  };

  const findColumn = aliasesList =>
    first.findIndex(cell => aliasesList.includes(cell));

  const indexes = {
    firstName:findColumn(aliases.firstName),
    lastName:findColumn(aliases.lastName),
    email:findColumn(aliases.email),
    branch:findColumn(aliases.branch)
  };

  const hasHeader = Object.values(indexes).some(index => index >= 0);
  const dataRows = hasHeader ? rows.slice(1) : rows;

  // Sans en-tête : Prénom ; Nom ; Email ; Médiathèque/service
  const fallback = {
    firstName:0,
    lastName:1,
    email:2,
    branch:3
  };

  const parsed = dataRows.map((row,index) => {
    const get = field => {
      const col = indexes[field] >= 0 ? indexes[field] : fallback[field];
      return String(row[col] || "").trim();
    };

    const firstName = get("firstName");
    const lastName = get("lastName");
    const email = get("email").toLowerCase();
    const branch = get("branch");

    return {
      row:index + (hasHeader ? 2 : 1),
      firstName,
      lastName,
      email,
      branch
    };
  }).filter(p => p.firstName || p.lastName || p.email);

  if (!parsed.length) throw new Error("Aucun participant exploitable.");

  const invalid = parsed.filter(item =>
    !item.firstName ||
    !item.lastName ||
    (item.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(item.email))
  );

  if (invalid.length) {
    const lines = invalid.slice(0,8).map(item => item.row).join(", ");
    throw new Error(
      `${invalid.length} ligne${invalid.length > 1 ? "s" : ""} invalide${invalid.length > 1 ? "s" : ""} (prénom + nom requis, email valide si renseigné). Ligne${invalid.length > 1 ? "s" : ""} : ${lines}${invalid.length > 8 ? "…" : ""}`
    );
  }

  const unique = new Map();

  parsed.forEach(item => {
    const key = item.email
      ? `mail:${item.email}`
      : `name:${normalizeHeader(item.firstName)}:${normalizeHeader(item.lastName)}:${normalizeHeader(item.branch)}`;

    unique.set(key, item);
  });

  return { delimiter, participants:[...unique.values()] };
}

function participantIsUsed(participantId) {
  const selectedInPoll = state.polls.some(poll =>
    Array.isArray(poll.participantIds) &&
    poll.participantIds.includes(participantId)

  const hasResponse = state.pollResponses.some(response =>
    response.participantId === participantId
  );

  return selectedInPoll || hasResponse;
}

async function bulkDeleteParticipants() {
  const ids = getSelectedIds("participants");
  if (!ids.length) return;

  const deletable = ids.filter(id => !participantIsUsed(id));
  const blocked = ids.filter(id => participantIsUsed(id));

  if (!deletable.length) {
    toast(
      "Aucun participant sélectionné ne peut être supprimé car ils sont utilisés dans un sondage ou possèdent déjà une réponse.",
      "error"
    );
    return;
  }

  const message = blocked.length
    ? `${deletable.length} participant${deletable.length > 1 ? "s" : ""} sera${deletable.length > 1 ? "ont" : ""} supprimé${deletable.length > 1 ? "s" : ""}. ${blocked.length} sera${blocked.length > 1 ? "ont" : ""} conservé${blocked.length > 1 ? "s" : ""} car utilisé${blocked.length > 1 ? "s" : ""} dans un sondage. Continuer ?`
    : `Supprimer définitivement ${deletable.length} participant${deletable.length > 1 ? "s" : ""} ?`;

  if (!confirm(message)) return;

  try {
    for (let i = 0; i < deletable.length; i += 350) {
      const batch = writeBatch(db);

      deletable.slice(i, i + 350).forEach(id => {
        batch.delete(doc(db, "participants", id));
      });

      await batch.commit();
    }

    if (blocked.length) {
      toast(
        `${deletable.length} supprimé${deletable.length > 1 ? "s" : ""}, ${blocked.length} conservé${blocked.length > 1 ? "s" : ""} car utilisé${blocked.length > 1 ? "s" : ""}.`
      );
    } else {
      toast(
        `${deletable.length} participant${deletable.length > 1 ? "s" : ""} supprimé${deletable.length > 1 ? "s" : ""}.`
      );
    }
  } catch (err) {
    console.error(err);
    toast("Suppression groupée impossible.", "error");
  }
}

          "Ce participant est utilisé dans un sondage ou possède déjà une réponse. Désactivez-le plutôt.",

function pollEffectiveState(poll) {
  const manual = poll.manualState || "auto";
  if (manual === "open") return "open";
  if (manual === "closed") return "closed";

  const now = Date.now();
  const opens = toDate(poll.openAt)?.getTime() || null;
  const closes = toDate(poll.closeAt)?.getTime() || null;

  if (opens && now < opens) return "scheduled";
  if (closes && now > closes) return "closed";
  return "open";
}

function pollStatusBadge(poll) {
  const stateValue = pollEffectiveState(poll);
  const map = {
    open:["ok","Ouvert"],
    scheduled:["pending","Programmé"],
    closed:["neutral","Clôturé"]
  };
  const [cls,label] = map[stateValue] || ["neutral",stateValue];
  return `<span class="dk-badge ${cls}">${label}</span>`;
}

function pollScheduleText(poll) {
  const parts = [];
  if (poll.openAt) parts.push(`Ouverture : ${fmtDateTime(toDate(poll.openAt))}`);
  if (poll.closeAt) parts.push(`Fermeture : ${fmtDateTime(toDate(poll.closeAt))}`);
  if (!parts.length) parts.push("Sans dates imposées");
  return parts.join(" · ");
}

function fmtDateTime(d) {
  if (!d) return "";
  return new Intl.DateTimeFormat("fr-FR", {
    day:"2-digit",
    month:"2-digit",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  }).format(d);
}

function pollQuestionAnswerHtml(question, existing = null) {
  const required = question.required !== false;
  const req = required ? "required" : "";

  if (question.type === "text") {
    return `
      <textarea
        class="dk-textarea"
        name="q_${question.id}"
        ${req}
        maxlength="2000"
      >${esc(existing || "")}</textarea>
    `;
  }

  if (question.type === "single") {
    return (question.options || []).map(option => `
      <label class="dk-theme-choice">
        <input
          type="radio"
          name="q_${question.id}"
          value="${option.id}"
          ${existing === option.id ? "checked" : ""}
          ${req}
        >
        <span>${esc(option.label)}</span>
      </label>
    `).join("");
  }

  if (question.type === "multiple") {
    const selected = Array.isArray(existing) ? existing : [];
    return (question.options || []).map(option => `
      <label class="dk-theme-choice">
        <input
          type="checkbox"
          name="q_${question.id}"
          value="${option.id}"
          ${selected.includes(option.id) ? "checked" : ""}
        >
        <span>${esc(option.label)}</span>
      </label>
    `).join("");
  }

  if (question.type === "availability") {
    const values = existing && typeof existing === "object" ? existing : {};

    return (question.options || []).map(option => `
      <div class="dk-poll-option-row">
        <strong>${esc(option.label)}</strong>

        <label>
          <input type="radio" name="q_${question.id}_${option.id}" value="yes"
            ${values[option.id] === "yes" ? "checked" : ""} ${req}>
          Oui
        </label>

        <label>
          <input type="radio" name="q_${question.id}_${option.id}" value="maybe"
            ${values[option.id] === "maybe" ? "checked" : ""}>
          Si besoin
        </label>

        <label>
          <input type="radio" name="q_${question.id}_${option.id}" value="no"
            ${values[option.id] === "no" ? "checked" : ""}>
          Non
        </label>
      </div>
    `).join("");
  }

  return "";
}


function pollAllowedParticipants(poll) {
  const active = state.participants.filter(p => p.active !== false);

  if (poll.participantMode === "selected") {
    const selected = new Set(poll.participantIds || []);
    return state.participants.filter(p => selected.has(p.id));
  }

  return active;
}

function matrixResponseForParticipant(pollId, participantId) {
  const identityKey = `participant:${participantId}`;

  return state.pollResponses.find(r =>
    r.pollId === pollId &&
    (
      r.participantId === participantId ||
      r.identityKey === identityKey
    )
  ) || null;
}

function matrixResponseControlsHtml(poll, existing = null) {
  const mode = poll.matrixSelectionMode || "single";
  const options = poll.matrixOptions || [];

  if (mode === "single") {
    const current = existing?.matrixAnswer?.selected?.[0] || "";

    return options.map(option => `
      <div class="dk-choice-response-row">
        <div class="dk-choice-response-label">${esc(option.label)}</div>
        <div class="dk-choice-response-control">
          <label>
            <input
              type="radio"
              name="matrix_choice"
              value="${option.id}"
              ${current === option.id ? "checked" : ""}
            >
            <span>Choisir</span>
          </label>
        </div>
      </div>
    `).join("");
  }

  if (mode === "multiple") {
    const selected = Array.isArray(existing?.matrixAnswer?.selected)
      ? existing.matrixAnswer.selected
      : [];

    return options.map(option => `
      <div class="dk-choice-response-row">
        <div class="dk-choice-response-label">${esc(option.label)}</div>
        <div class="dk-choice-response-control">
          <label>
            <input
              type="checkbox"
              name="matrix_choice"
              value="${option.id}"
              ${selected.includes(option.id) ? "checked" : ""}
            >
            <span>Sélectionner</span>
          </label>
        </div>
      </div>
    `).join("");
  }

  const ranks = existing?.matrixAnswer?.ranks || {};

  return options.map(option => `
    <div class="dk-choice-response-row">
      <div class="dk-choice-response-label">${esc(option.label)}</div>
      <div class="dk-choice-response-control">
        <select class="dk-select" name="matrix_rank_${option.id}">
          <option value="">Non classé</option>
          ${options.map((_,index) => `
            <option
              value="${index+1}"
              ${Number(ranks[option.id]) === index+1 ? "selected" : ""}
            >
              Priorité ${index+1}
            </option>
          `).join("")}
        </select>
      </div>
    </div>
  `).join("");
}

function parseMatrixResponse(form, poll) {
  const mode = poll.matrixSelectionMode || "single";

  if (mode === "single") {
    const value = String(form.get("matrix_choice") || "");
    if (!value) throw new Error("Choisissez une possibilité.");
    return { selected:[value], ranks:{} };
  }

  if (mode === "multiple") {
    const values = form.getAll("matrix_choice").map(String).filter(Boolean);
    if (!values.length) throw new Error("Choisissez au moins une possibilité.");
    return { selected:values, ranks:{} };
  }

  const ranks = {};
  const usedRanks = new Set();

  for (const option of (poll.matrixOptions || [])) {
    const raw = String(form.get(`matrix_rank_${option.id}`) || "");
    if (!raw) continue;

    const rank = Number(raw);
    if (usedRanks.has(rank)) {
      throw new Error("Chaque rang de priorité ne peut être utilisé qu'une seule fois.");
    }

    usedRanks.add(rank);
    ranks[option.id] = rank;
  }

  if (!Object.keys(ranks).length) {
    throw new Error("Classez au moins une possibilité.");
  }

  return { selected:[], ranks };
}

function openPollResponseModal(pollId) {

        <div class="dk-field">

              <option
                value="${participant.id}"
                ${existing?.participantId === participant.id ? "selected" : ""}

              </option>
            `).join("")}

          </div>
        </div>

        <div id="dk-matrix-participant-info" style="margin-top:10px"></div>

        <div class="dk-separator"></div>
      ` : poll.collectIdentity !== false ? `
        <div class="dk-form-grid">
          <div class="dk-field">
            <label>Prénom</label>
            <input class="dk-input" name="firstName" required
              value="${esc(existing?.firstName || saved.firstName || "")}">
          </div>

          <div class="dk-field">
            <label>Nom</label>
            <input class="dk-input" name="lastName" required
              value="${esc(existing?.lastName || saved.lastName || "")}">
          </div>

          <div class="dk-field">
            <label>Médiathèque / service</label>
            <select class="dk-select" name="branch" required>
              <option value="">Sélectionner…</option>
              ${BRANCHES.map(branch => `
                <option ${String(existing?.branch || saved.branch || "") === branch ? "selected" : ""}>
                  ${esc(branch)}
                </option>
              `).join("")}
            </select>
          </div>

          <div class="dk-field">
            <label>Email</label>
            <input class="dk-input" type="email" name="email" required
              value="${esc(existing?.email || saved.email || "")}">
          </div>
        </div>

        <div class="dk-separator"></div>
      ` : `
        <div class="dk-note">
          Ce sondage est configuré en réponse anonyme.
          Une réponse multiple depuis un autre navigateur ne peut pas être empêchée
          sans identifier la personne.
        </div>
      `}

      ${isMatrix ? `
        <div class="dk-note" style="margin-bottom:12px">
          ${poll.matrixSelectionMode === "single"
            ? "Sélectionnez une seule possibilité."
            : poll.matrixSelectionMode === "multiple"
              ? "Vous pouvez sélectionner plusieurs possibilités."
              : "Classez vos choix par ordre de priorité : Priorité 1 = votre premier choix. Vous pouvez laisser certaines possibilités non classées."}
        </div>

        <div class="dk-participant-header">
          <div class="dk-small dk-muted">Réponse de</div>
          <strong id="dk-matrix-row-name">${esc(existing?.userName || "Ma réponse")}</strong>
        </div>

        <div class="dk-choice-response-list" id="dk-matrix-response-controls">

      ` : `
        ${(poll.questions || []).map((question,index) => `
          <div class="dk-poll-question">
            <div>
              <strong>${index + 1}. ${esc(question.label)}</strong>
              ${question.required === false ? `<span class="dk-muted dk-small"> · facultatif</span>` : ""}
              ${question.type === "multiple"
                ? `<div class="dk-small dk-muted">Vous pouvez sélectionner plusieurs réponses.</div>`
                : ""}
            </div>

            <div style="margin-top:8px">
              ${pollQuestionAnswerHtml(question, existing?.answers?.[question.id])}

      ${poll.allowComment !== false ? `

          <textarea
            class="dk-textarea"
            name="comment"
            maxlength="2000"
            placeholder="Vous pouvez ajouter une remarque, une précision ou un commentaire…"
          >${esc(existing?.comment || "")}</textarea>

      ` : ""}

      <div class="dk-form-actions">

        </button>
      </div>

  if (isMatrix) {
    const participantSelect = $("#dk-matrix-participant");

    const updateParticipantContext = () => {
      const participantId = participantSelect.value;
      const participant = allowedParticipants.find(p => p.id === participantId);

      existing = participantId
        ? matrixResponseForParticipant(pollId, participantId)
        : null;

      $("#dk-matrix-row-name").textContent = participant
        ? participantName(participant)
        : "Ma réponse";

      $("#dk-matrix-participant-info").innerHTML = participant ? `
        <div class="dk-note">
          <strong>${esc(participantName(participant))}</strong>
          ${participant.email ? ` · ${esc(participant.email)}` : ""}
          ${participant.branch ? ` · ${esc(participant.branch)}` : ""}
          ${existing ? `<br><span class="dk-small">Une réponse existe déjà pour ce participant.</span>` : ""}
        </div>
      ` : "";

      if (existing && !poll.allowEdit) {
        $("#dk-matrix-participant-info").innerHTML += `
          <div class="dk-note dk-danger-note" style="margin-top:7px">
            Cette personne a déjà répondu et la modification est désactivée.
          </div>
        `;
      }

      // Met à jour la zone de choix avec une éventuelle réponse existante.
      const controls = $("#dk-matrix-response-controls");
      if (controls) {
        controls.innerHTML = matrixResponseControlsHtml(poll, existing);
      }

      const commentField = $('#dk-poll-response-form textarea[name="comment"]');
      if (commentField) {
        commentField.value = existing?.comment || "";
      }

      const submitButton = $('#dk-poll-response-form [type="submit"]');
      if (submitButton) {
        submitButton.disabled = Boolean(existing && !poll.allowEdit);
        submitButton.textContent = existing
          ? (poll.allowEdit ? "Mettre à jour ma réponse" : "Réponse déjà enregistrée")
          : "Envoyer ma réponse";
      }
    };

    participantSelect.addEventListener("change", updateParticipantContext);
    updateParticipantContext();
  }

  $("#dk-poll-response-form").addEventListener("submit", async e => {
    e.preventDefault();

    if (pollEffectiveState(poll) !== "open") {
      toast("Le sondage vient d'être clôturé.", "error");
      return;
    }

    const form = new FormData(e.currentTarget);
    const answers = {};
    const comment = poll.allowComment !== false
      ? String(form.get("comment") || "").trim()
      : "";
    let matrixAnswer = null;

    try {
      if (isMatrix) {
        matrixAnswer = parseMatrixResponse(form, poll);
      } else {
        for (const question of (poll.questions || [])) {
          if (question.type === "text") {
            const value = String(form.get(`q_${question.id}`) || "").trim();
            if (question.required !== false && !value) {
              throw new Error(`Répondez à : ${question.label}`);
            }
            answers[question.id] = value;
          }

          if (question.type === "single") {
            const value = String(form.get(`q_${question.id}`) || "");
            if (question.required !== false && !value) {
              throw new Error(`Choisissez une réponse pour : ${question.label}`);
            }
            answers[question.id] = value;
          }

          if (question.type === "multiple") {
            const values = form.getAll(`q_${question.id}`).map(String);
            if (question.required !== false && !values.length) {
              throw new Error(`Choisissez au moins une réponse pour : ${question.label}`);
            }
            answers[question.id] = values;
          }

          // Compatibilité uniquement avec d'anciens sondages V4/V5.
          if (question.type === "availability") {
            const values = {};
            for (const option of (question.options || [])) {
              const value = String(form.get(`q_${question.id}_${option.id}`) || "");
              if (question.required !== false && !value) {
                throw new Error(`Indiquez votre disponibilité pour : ${option.label}`);
              }
              values[option.id] = value;
            }
            answers[question.id] = values;
          }
        }
      }
    } catch (err) {
      toast(err.message, "error");
      return;
    }

    let identity = {};
    let participantId = "";

    if (isMatrix) {
      participantId = String(form.get("participantId") || "");
      const participant = allowedParticipants.find(p => p.id === participantId);

      if (!participant) {
        toast("Sélectionnez votre nom dans la liste.", "error");
        return;
      }

      existing = matrixResponseForParticipant(pollId, participantId);

      if (existing && !poll.allowEdit) {
        toast("Une réponse existe déjà pour cette personne.", "error");
        return;
      }

      identity = {
        participantId,
        firstName:participant.firstName || "",
        lastName:participant.lastName || "",
        userName:participantName(participant),
        branch:participant.branch || "",
        email:participant.email || ""
      };
    } else if (poll.collectIdentity !== false) {
      const firstName = String(form.get("firstName") || "").trim();
      const lastName = String(form.get("lastName") || "").trim();
      const branch = String(form.get("branch") || "").trim();
      const email = String(form.get("email") || "").trim().toLowerCase();

      if (!firstName || !lastName || !branch || !email) {
        toast("Renseignez vos coordonnées.", "error");
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        toast("Adresse email invalide.", "error");
        return;
      }

      identity = {
        firstName,
        lastName,
        userName:`${firstName} ${lastName}`.trim(),
        branch,
        email
      };

      saveVisitor({ firstName, lastName, branch, email });
    }

    if (!isMatrix && poll.collectIdentity !== false) {
      const identityKey = pollIdentityKey(identity);
      const already = existingPollResponseForIdentity(pollId, identityKey);

      if (already && !poll.allowEdit) {
        toast("Une réponse existe déjà pour cette personne.", "error");
        return;
      }

      if (already) {
        existing = already;
      }
    }

    const button = e.currentTarget.querySelector("[type=submit]");
    setBusy(button, true);

    try {
      const identityKey = isMatrix
        ? `participant:${participantId}`
        : (poll.collectIdentity !== false ? pollIdentityKey(identity) : "");

      const payload = {
        pollId,
        identityKey,
        answers,
        matrixAnswer:isMatrix ? matrixAnswer : null,
        comment,
        ...identity,
        ownerUid: authUser?.uid || "",
        updatedAt:serverTimestamp()
      };

      let responseId = existing?.id || "";

      if (isMatrix) {
        const identityKey = `participant:${participantId}`;
        responseId = pollResponseDocId(pollId, identityKey);
        const responseRef = doc(db, "pollResponses", responseId);

        await setDoc(responseRef, {
          ...payload,
          createdAt:existing?.createdAt || serverTimestamp()
        }, { merge:true });

        rememberPollResponse(pollId, responseId);
      } else if (poll.collectIdentity !== false) {
        responseId = pollResponseDocId(pollId, identityKey);
        const responseRef = doc(db, "pollResponses", responseId);

        const existingByIdentity = existingPollResponseForIdentity(pollId, identityKey);

        if (existingByIdentity && !poll.allowEdit) {
          throw new Error("Une réponse existe déjà pour cette personne.");
        }

        await setDoc(responseRef, {
          ...payload,
          createdAt:existingByIdentity?.createdAt || serverTimestamp()
        }, { merge:true });

        rememberPollResponse(pollId, responseId);
      } else if (existing && poll.allowEdit) {
        await updateDoc(doc(db, "pollResponses", existing.id), payload);
      } else {
        // Un sondage réellement anonyme ne permet pas d'identifier une personne
        // de façon fiable. On garde donc l'unicité par navigateur uniquement.
        const ref = await addDoc(collection(db, "pollResponses"), {
          ...payload,
          createdAt:serverTimestamp()
        });
        responseId = ref.id;
        rememberPollResponse(pollId, responseId);
      }

      closeModal();
      toast(existing ? "Réponse mise à jour." : "Réponse enregistrée.");
    } catch (err) {
      console.error(err);
      toast("Impossible d'enregistrer la réponse.", "error");
      setBusy(button, false);
    }
  });
}

function bindPollQuestionEditor(container) {
  const typeHelp = {
    single:"Le participant choisit une seule réponse.",
    multiple:"Le participant peut cocher plusieurs réponses.",
    text:"Le participant écrit librement sa réponse."
  };

  container.querySelectorAll("[data-remove-poll-question]").forEach(button => {
    button.onclick = () => {
      button.closest("[data-poll-question]")?.remove();
    };
  });

  container.querySelectorAll("[data-poll-question]").forEach(card => {
    const select = card.querySelector("[data-q-type]");
    const wrap = card.querySelector("[data-q-options-wrap]");
    const list = card.querySelector("[data-options-list]");
    const addButton = card.querySelector("[data-add-poll-option]");
    const title = card.querySelector("[data-options-title]");
    const help = card.querySelector("[data-q-type-help]");

    const bindOptionRemoveButtons = () => {
      card.querySelectorAll("[data-remove-poll-option]").forEach(button => {
        button.onclick = () => {
          const rows = [...card.querySelectorAll("[data-poll-option]")];

          if (rows.length <= 2 && select.value !== "text") {
            toast("Gardez au moins deux réponses proposées.", "error");
            return;
          }

          button.closest("[data-poll-option]")?.remove();
        };
      });
    };

    const updateTypeUi = () => {
      const type = select.value;
      help.textContent = typeHelp[type] || "";

      if (type === "text") {
        wrap.style.display = "none";
        return;
      }

      wrap.style.display = "";

      title.textContent = "Réponses proposées";
      addButton.textContent = "+ Ajouter une réponse";

      const rows = [...card.querySelectorAll("[data-poll-option]")];

      if (!rows.length) {
        list.innerHTML = pollOptionEditorRows(card.dataset.pollQuestion, [], type);
        bindOptionRemoveButtons();
      }

      card.querySelectorAll("[data-option-label]").forEach((input,index) => {
        input.placeholder = `Réponse ${index + 1}`;
      });
    };

    addButton.onclick = () => {
      const id = `${card.dataset.pollQuestion}_${uid()}`;

      list.insertAdjacentHTML("beforeend", `
        <div class="dk-answer-builder-row" data-poll-option="${id}">
          <input
            class="dk-input"
            data-option-label
            placeholder="Nouvelle réponse"
          >

          <button
            type="button"
            class="dk-btn dk-btn-danger dk-btn-sm"
            data-remove-poll-option
          >
            Supprimer
          </button>
        </div>
      `);

      bindOptionRemoveButtons();
      list.querySelector(`[data-poll-option="${id}"] [data-option-label]`)?.focus();
    };

    select.onchange = updateTypeUi;

    bindOptionRemoveButtons();
    updateTypeUi();
  });
}

function parsePollQuestions(container) {
  const questions = [];

  for (const card of container.querySelectorAll("[data-poll-question]")) {
    const id = card.dataset.pollQuestion || uid();
    const label = card.querySelector("[data-q-label]").value.trim();
    const type = card.querySelector("[data-q-type]").value;
    const required = card.querySelector("[data-q-required]").checked;

    if (!label) {
      throw new Error("Chaque question doit avoir un intitulé.");
    }

    let options = [];

    if (type !== "text") {
      const rows = [...card.querySelectorAll("[data-poll-option]")];

      options = rows.map((row,index) => ({
        id: row.dataset.pollOption || `${id}_o${index+1}`,
        label: row.querySelector("[data-option-label]").value.trim()
      })).filter(option => option.label);

      if (options.length < 2) {
        throw new Error(
          type === "availability"
            ? `Ajoutez au moins deux propositions pour « ${label} ».`
            : `Ajoutez au moins deux réponses possibles pour « ${label} ».`
        );
      }
    }

    questions.push({ id, label, type, required, options });
  }

  if (!questions.length) {
    throw new Error("Ajoutez au moins une question.");
  }

  return questions;
}


function matrixOptionRows(options = []) {
  const rows = options.length
    ? options
    : [
        { id:uid(), label:"" },
        { id:uid(), label:"" }
      ];

  return rows.map((option,index) => `
    <div class="dk-answer-builder-row" data-matrix-option="${option.id || uid()}">
      <input
        class="dk-input"
        data-matrix-option-label
        value="${esc(option.label || "")}"
        placeholder="Possibilité ${index + 1}"
      >

      <button
        type="button"
        class="dk-btn dk-btn-danger dk-btn-sm"
        data-remove-matrix-option
      >
        Supprimer
      </button>
    </div>
  `).join("");
}

function bindMatrixOptionEditor(container) {
  const bindRemove = () => {
    container.querySelectorAll("[data-remove-matrix-option]").forEach(button => {
      button.onclick = () => {
        const rows = [...container.querySelectorAll("[data-matrix-option]")];
        if (rows.length <= 2) {
          toast("Gardez au moins deux possibilités.", "error");
          return;
        }
        button.closest("[data-matrix-option]")?.remove();
      };
    });
  };

  $("#dk-add-matrix-option")?.addEventListener("click", () => {
    const id = uid();

    container.insertAdjacentHTML("beforeend", `
      <div class="dk-answer-builder-row" data-matrix-option="${id}">
        <input
          class="dk-input"
          data-matrix-option-label
          placeholder="Nouvelle possibilité"
        >

        <button
          type="button"
          class="dk-btn dk-btn-danger dk-btn-sm"
          data-remove-matrix-option
        >
          Supprimer
        </button>
      </div>
    `);

    bindRemove();
    container.querySelector(`[data-matrix-option="${id}"] [data-matrix-option-label]`)?.focus();

function parseMatrixOptions(container) {
  const options = [...container.querySelectorAll("[data-matrix-option]")]
    .map((row,index) => ({
      id:row.dataset.matrixOption || uid(),
      label:row.querySelector("[data-matrix-option-label]").value.trim(),
      order:index
    }))
    .filter(option => option.label);

  if (options.length < 2) {
    throw new Error("Ajoutez au moins deux possibilités dans le tableau.");
  }

  return options;
}

function matrixSelectionModeLabel(mode) {
  return {
    single:"Une seule possibilité",
    multiple:"Plusieurs possibilités",
    ranked:"Classement par ordre de priorité"
  }[mode] || "Une seule possibilité";
}

function openPollEditor(pollId = "") {
  const existing = pollId ? state.polls.find(p => p.id === pollId) : null;
  const existingMode = existing?.mode || "questionnaire";

  const questions = existing?.questions?.length
    ? existing.questions
    : [{
        id:uid(),
        label:"",
        type:"single",
        required:true,
        options:[
          { id:uid(), label:"" },
          { id:uid(), label:"" }
        ]
      }];

  const matrixOptions = Array.isArray(existing?.matrixOptions) && existing.matrixOptions.length
    ? existing.matrixOptions
    : [
        { id:uid(), label:"" },
        { id:uid(), label:"" }
      ];

  const toLocalInput = value => {
    const d = toDate(value);
    if (!d) return "";
    const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
    return local.toISOString().slice(0,16);
  };

  openModal(`
    <div class="dk-modal-head">

      </div>
      <button class="dk-close" data-close-modal>×</button>
    </div>

    ${existing && state.pollResponses.some(r => r.pollId === existing.id) ? `
      <div class="dk-note dk-danger-note" style="margin-bottom:12px">
        Ce sondage possède déjà des réponses. Évitez de modifier sa structure
        si vous souhaitez conserver des résultats parfaitement comparables.
      </div>
    ` : ""}

    <form id="dk-poll-editor-form" novalidate>
      <div class="dk-form-grid">
        <div class="dk-field dk-span-2">
          <label>Titre</label>
          <input class="dk-input" name="title" required maxlength="200"
            value="${esc(existing?.title || "")}">
        </div>

        <div class="dk-field dk-span-2">
          <label>Description</label>
          <textarea class="dk-textarea" name="description" maxlength="2000">${esc(existing?.description || "")}</textarea>
        </div>

        <div class="dk-field dk-span-2">
          <label>Type de sondage</label>

          <div class="dk-poll-mode-choice">
            <label class="dk-poll-mode-card">
              <input
                type="radio"
                name="mode"
                value="questionnaire"
                ${existingMode === "questionnaire" ? "checked" : ""}
              >
              <strong>Questionnaire</strong>
              <div class="dk-small dk-muted" style="margin-top:5px">
                Plusieurs questions avec réponse unique, multiple ou texte libre.
              </div>
            </label>

            <label class="dk-poll-mode-card">
              <input
                type="radio"
                name="mode"
                value="matrix"
                ${existingMode === "matrix" ? "checked" : ""}
              >
              <strong>Tableau de choix</strong>
              <div class="dk-small dk-muted" style="margin-top:5px">
                Une personne par ligne, une possibilité par colonne.
              </div>
            </label>
          </div>
        </div>

        <div class="dk-field">
          <label>Ouverture programmée</label>
          <input class="dk-input" type="datetime-local" name="openAt"
            value="${toLocalInput(existing?.openAt)}">
        </div>

        <div class="dk-field">
          <label>Fermeture programmée</label>
          <input class="dk-input" type="datetime-local" name="closeAt"
            value="${toLocalInput(existing?.closeAt)}">
        </div>

        <div class="dk-field">
          <label>Identification</label>
          <label class="dk-switchline">
            <input type="checkbox" name="collectIdentity" ${existing?.collectIdentity === false ? "" : "checked"}>
            <span>Réponses nominatives — une seule réponse par personne</span>
          </label>
        </div>

        <div class="dk-field">
          <label>Modification</label>
          <label class="dk-switchline">
            <input type="checkbox" name="allowEdit" ${existing?.allowEdit === false ? "" : "checked"}>
            <span>Autoriser la modification depuis le même navigateur</span>
          </label>
        </div>

        <div class="dk-field dk-span-2">
          <label class="dk-switchline">
            <input type="checkbox" name="allowComment" ${existing?.allowComment === false ? "" : "checked"}>

          </label>
        </div>
      </div>

      <div id="dk-questionnaire-editor">

        <div class="dk-inline" style="justify-content:space-between">

          <button type="button" class="dk-btn dk-btn-light dk-btn-sm" id="dk-add-poll-question">
            + Ajouter une question
          </button>
        </div>

        <div id="dk-poll-questions">

        </div>
      </div>

      <div id="dk-matrix-editor">

        <h3>Tableau de choix</h3>

        <div class="dk-note" style="margin-bottom:12px">
          Dans les résultats, chaque participant apparaîtra sur une ligne et

              Une seule possibilité
            </option>
            <option value="multiple" ${existing?.matrixSelectionMode==="multiple" ? "selected" : ""}>
              Plusieurs possibilités
            </option>
            <option value="ranked" ${existing?.matrixSelectionMode==="ranked" ? "selected" : ""}>

            </option>

            En mode priorité, 1 correspond au choix le plus important.
          </div>

        <div style="height:12px"></div>

        <div class="dk-field">
          <label>Participants autorisés</label>

        <div style="height:12px"></div>

          <label style="margin:0"><strong>Possibilités / colonnes</strong></label>

    </form>
  `);

  const questionsContainer = $("#dk-poll-questions");
  const matrixContainer = $("#dk-matrix-options");

  bindPollQuestionEditor(questionsContainer);
  bindMatrixOptionEditor(matrixContainer);

  const updateModeEditor = () => {
    const formEl = $("#dk-poll-editor-form");
    if (!formEl) return;

    const mode = $('input[name="mode"]:checked', formEl)?.value || "questionnaire";

    const questionnaireEditor = $("#dk-questionnaire-editor");
    const matrixEditor = $("#dk-matrix-editor");

    if (questionnaireEditor) {
      questionnaireEditor.style.display = mode === "questionnaire" ? "" : "none";
    }

    if (matrixEditor) {
      matrixEditor.style.display = mode === "matrix" ? "" : "none";
    }

    if (mode === "matrix" && typeof renderParticipantPicker === "function") {
      renderParticipantPicker();
    }
  };

  $$('input[name="mode"]', $("#dk-poll-editor-form")).forEach(input => {

  const renderParticipantPicker = () => {
    const host = $("#dk-poll-participants-picker");
    if (!host || participantPickerRendered) return;

    const activeParticipants = state.participants.filter(p => p.active !== false);

    host.innerHTML = `
      <div class="dk-participant-picker">

          >

          <div class="dk-inline" style="margin-top:8px">
            <button type="button" class="dk-btn dk-btn-light dk-btn-sm" id="dk-select-all-poll-participants">
              Tout sélectionner
            </button>
            <button type="button" class="dk-btn dk-btn-light dk-btn-sm" id="dk-unselect-all-poll-participants">
              Tout désélectionner
            </button>
            <span class="dk-small dk-muted" id="dk-participant-selection-count"></span>
          </div>

          <div class="dk-participant-picker-list">
            ${activeParticipants.length ? activeParticipants.map(participant => `
              <label
                class="dk-participant-picker-row"
                data-poll-participant-search="${esc(
                  `${participantName(participant)} ${participant.email || ""} ${participant.branch || ""}`.toLowerCase()
                )}"

      if (area) area.style.display = participantMode === "selected" ? "" : "none";

      }
