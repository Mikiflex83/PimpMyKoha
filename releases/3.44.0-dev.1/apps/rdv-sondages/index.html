    $$('input[name="participantMode"]', $("#dk-poll-editor-form")).forEach(input => {
      input.addEventListener("change", updateParticipantPicker);
    });

    $$('input[name="participantIds"]', $("#dk-poll-editor-form")).forEach(input => {
      input.addEventListener("change", updateParticipantPicker);
    });

    $("#dk-participant-poll-search")?.addEventListener("input", e => {
      const q = e.target.value.trim().toLowerCase();
      $$("[data-poll-participant-search]").forEach(row => {
        row.style.display = !q || row.dataset.pollParticipantSearch.includes(q) ? "" : "none";
      });
    });

    $("#dk-select-all-poll-participants")?.addEventListener("click", () => {
      $$('input[name="participantIds"]', $("#dk-poll-editor-form")).forEach(input => {
        const row = input.closest("[data-poll-participant-search]");
        if (!row || row.style.display !== "none") input.checked = true;
      });
      updateParticipantPicker();
    });

    $("#dk-unselect-all-poll-participants")?.addEventListener("click", () => {
      $$('input[name="participantIds"]', $("#dk-poll-editor-form")).forEach(input => {
        input.checked = false;
      });
      updateParticipantPicker();
    });

    updateParticipantPicker();
  };

  updateModeEditor();

  $("#dk-add-poll-question").addEventListener("click", () => {
    questionsContainer.insertAdjacentHTML(
      "beforeend",
      pollQuestionEditorHtml({
        id:uid(),
        type:"single",
        required:true,
        options:[
          { id:uid(), label:"" },
          { id:uid(), label:"" }
        ]
      })
    );
    bindPollQuestionEditor(questionsContainer);
  });

  $("#dk-poll-editor-form").addEventListener("submit", async e => {
    e.preventDefault();

    const showPollSaveError = message => {
      const box = $("#dk-poll-save-error");
      if (box) {
        box.textContent = message;
        box.style.display = "";
      }
      toast(message, "error");
    };

    const hidePollSaveError = () => {
      const box = $("#dk-poll-save-error");
      if (box) {
        box.textContent = "";
        box.style.display = "none";
      }
    };

    hidePollSaveError();

    const form = new FormData(e.currentTarget);
    const title = String(form.get("title") || "").trim();
    const description = String(form.get("description") || "").trim();
    const mode = String(form.get("mode") || "questionnaire");
    const participantMode = mode === "matrix"
      ? String(form.get("participantMode") || "all")
      : "";
    const participantIds = mode === "matrix"
      ? form.getAll("participantIds").map(String).filter(Boolean)
      : [];
    const openAtRaw = String(form.get("openAt") || "");
    const closeAtRaw = String(form.get("closeAt") || "");

    if (!title) {
      showPollSaveError("Le titre est obligatoire.");
      return;
    }

    let questionsParsed = [];
    let matrixOptionsParsed = [];

    try {
      if (mode === "questionnaire") {
        if (!questionsContainer) {
          throw new Error("L'éditeur des questions n'est pas disponible.");
        }
        questionsParsed = parsePollQuestions(questionsContainer);
      } else {
        if (!matrixContainer) {
          throw new Error("L'éditeur du tableau n'est pas disponible.");
        }
        matrixOptionsParsed = parseMatrixOptions(matrixContainer);

        if (participantMode === "selected" && !participantIds.length) {
          throw new Error("Sélectionnez au moins un participant.");
        }

        if (!state.participants.some(p => p.active !== false)) {
          throw new Error("Ajoutez d'abord des participants dans Admin → Participants.");
        }
      }
    } catch (err) {
      showPollSaveError(err.message);
      return;
    }

    const openAt = openAtRaw ? Timestamp.fromDate(new Date(openAtRaw)) : null;
    const closeAt = closeAtRaw ? Timestamp.fromDate(new Date(closeAtRaw)) : null;

    if (openAt && closeAt && toDate(closeAt) <= toDate(openAt)) {
      showPollSaveError("La fermeture doit être postérieure à l'ouverture.");
      return;
    }

    const payload = {
      title,
      description,
      mode,
      openAt,
      closeAt,
      collectIdentity:form.get("collectIdentity") === "on",
      allowEdit:form.get("allowEdit") === "on",
      allowComment:form.get("allowComment") === "on",
      manualState:existing?.manualState || "auto",
      questions:mode === "questionnaire" ? questionsParsed : [],
      matrixOptions:mode === "matrix" ? matrixOptionsParsed : [],
      matrixSelectionMode:mode === "matrix"
        ? String(form.get("matrixSelectionMode") || "single")
        : "",
      participantMode:mode === "matrix" ? participantMode : "",
      participantIds:mode === "matrix" && participantMode === "selected"
        ? participantIds
        : [],
      updatedAt:serverTimestamp()
    };

    const button = e.currentTarget.querySelector("[type=submit]");
    setBusy(button, true);

    try {
      if (existing) {
        await updateDoc(doc(db, "polls", existing.id), payload);
      } else {
        await addDoc(collection(db, "polls"), {
          ...payload,
          createdAt:serverTimestamp()
        });
      }

      closeModal();
      toast(existing ? "Sondage modifié." : "Sondage créé.");
    } catch (err) {
      console.error("Erreur enregistrement sondage :", err);
      showPollSaveError(
        err?.message
          ? `Enregistrement impossible : ${err.message}`
          : "Enregistrement du sondage impossible."
      );
      setBusy(button, false);
    }
  });
}

async function setPollManualState(pollId, manualState) {
  await updateDoc(doc(db, "polls", pollId), {
    manualState,
    updatedAt:serverTimestamp()
  });

  toast(
    manualState === "open"
      ? "Sondage ouvert manuellement."
      : manualState === "closed"
        ? "Sondage clôturé manuellement."
        : "Le sondage suit de nouveau sa programmation."
  );
}

async function deletePollComplete(pollId) {
  const responses = state.pollResponses.filter(r => r.pollId === pollId);

  if (!confirm(
    `Supprimer définitivement ce sondage et ${responses.length} réponse${responses.length>1?"s":""} ?`
  )) return;

  try {
    await commitWriteChunks(
      responses,
      (batch, response) => {
        batch.delete(doc(db, "pollResponses", response.id));
      }
    );

    await deleteDoc(doc(db, "polls", pollId));
    toast("Sondage supprimé.");
  } catch (err) {
    console.error(err);
    toast("Suppression du sondage impossible.", "error");
  }
}

function pollOptionLabel(question, optionId) {
  return question.options?.find(o => o.id === optionId)?.label || optionId || "—";
}

function matrixCellHtml(poll, response, option) {
  const mode = poll.matrixSelectionMode || "single";
  const answer = response.matrixAnswer || {};

  if (mode === "ranked") {
    const rank = answer.ranks?.[option.id];
    return rank ? `<strong>${Number(rank)}</strong>` : `<span class="dk-muted">—</span>`;
  }

  const selected = Array.isArray(answer.selected) ? answer.selected : [];
  return selected.includes(option.id)
    ? `<strong>✓</strong>`
    : `<span class="dk-muted">—</span>`;
}

function matrixAggregateHtml(poll, responses) {
  const mode = poll.matrixSelectionMode || "single";

  if (mode === "ranked") {
    return `
      <div class="dk-table-wrap">
        <table class="dk-table">
          <thead>
            <tr>
              <th>Possibilité</th>
              <th>Classée par</th>
              <th>Rang moyen</th>
              <th>Priorité n°1</th>
            </tr>
          </thead>
          <tbody>
            ${(poll.matrixOptions || []).map(option => {
              const ranks = responses
                .map(r => Number(r.matrixAnswer?.ranks?.[option.id] || 0))
                .filter(Boolean);

              const average = ranks.length
                ? (ranks.reduce((a,b) => a+b,0) / ranks.length).toFixed(2)
                : "—";

              const first = ranks.filter(rank => rank === 1).length;

              return `
                <tr>
                  <td><strong>${esc(option.label)}</strong></td>
                  <td>${ranks.length}</td>
                  <td>${average}</td>
                  <td>${first}</td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  return `
    <div class="dk-table-wrap">
      <table class="dk-table">
        <thead>
          <tr>
            <th>Possibilité</th>
            <th>Sélections</th>
          </tr>
        </thead>
        <tbody>
          ${(poll.matrixOptions || []).map(option => {
            const count = responses.filter(r =>
              Array.isArray(r.matrixAnswer?.selected) &&
              r.matrixAnswer.selected.includes(option.id)
            ).length;

            return `
              <tr>
                <td><strong>${esc(option.label)}</strong></td>
                <td>${count}</td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function pollQuestionResultsHtml(question, responses) {
  if (question.type === "text") {
    const values = responses
      .map(r => String(r.answers?.[question.id] || "").trim())
      .filter(Boolean);

    return values.length
      ? `<div>${values.map(v => `<div class="dk-result-row">${esc(v)}</div>`).join("")}</div>`
      : `<div class="dk-muted">Aucune réponse.</div>`;
  }

  if (question.type === "availability") {
    return `
      <div class="dk-table-wrap">
        <table class="dk-table">
          <thead>
            <tr>
              <th>Proposition</th>
              <th>Oui</th>
              <th>Si besoin</th>
              <th>Non</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody>
            ${(question.options || []).map(option => {
              let yes = 0, maybe = 0, no = 0;

              responses.forEach(r => {
                const value = r.answers?.[question.id]?.[option.id];
                if (value === "yes") yes++;
                else if (value === "maybe") maybe++;
                else if (value === "no") no++;
              });

              const score = yes * 2 + maybe;
              return `
                <tr>
                  <td><strong>${esc(option.label)}</strong></td>
                  <td>${yes}</td>
                  <td>${maybe}</td>
                  <td>${no}</td>
                  <td><strong>${score}</strong></td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  const counts = Object.fromEntries((question.options || []).map(o => [o.id, 0]));

  responses.forEach(r => {
    const value = r.answers?.[question.id];

    if (question.type === "multiple") {
      (Array.isArray(value) ? value : []).forEach(id => {
        if (id in counts) counts[id]++;
      });
    } else {
      if (value in counts) counts[value]++;
    }
  });

  const max = Math.max(1, ...Object.values(counts));

  return (question.options || []).map(option => {
    const count = counts[option.id] || 0;
    const pct = Math.round((count / max) * 100);

    return `
      <div class="dk-result-row">
        <div class="dk-inline" style="justify-content:space-between">
          <span>${esc(option.label)}</span>
          <strong>${count}</strong>
        </div>
        <div class="dk-result-bar">
          <div class="dk-result-fill" style="width:${pct}%"></div>
        </div>
      </div>
    `;
  }).join("");
}

function csvEscape(value) {
  const s = String(value ?? "");
  return `"${s.replaceAll('"','""')}"`;
}

function exportPollCsv(poll, responses) {
  const isMatrix = (poll.mode || "questionnaire") === "matrix";

  let headers = [];
  let rows = [];

  if (isMatrix) {
    headers = [
      "Participant",
      "Médiathèque",
      "Email",
      "Statut",
      ...(poll.allowComment !== false ? ["Commentaire"] : []),
      "Date de réponse",
      ...(poll.matrixOptions || []).map(option => option.label)
    ];

    const participants = pollAllowedParticipants(poll);

    rows = participants.map(participant => {
      const r = matrixResponseForParticipant(poll.id, participant.id);

      const cells = (poll.matrixOptions || []).map(option => {
        if (!r) return "";

        if (poll.matrixSelectionMode === "ranked") {
          return r.matrixAnswer?.ranks?.[option.id] || "";
        }

        return Array.isArray(r.matrixAnswer?.selected) &&
          r.matrixAnswer.selected.includes(option.id)
          ? "Oui"
          : "";
      });

      return [
        participantName(participant),
        participant.branch || "",
        participant.email || "",
        r ? "Répondu" : "En attente",
        ...(poll.allowComment !== false ? [r?.comment || ""] : []),
        r ? fmtDateTime(toDate(r.updatedAt || r.createdAt)) : "",
        ...cells
      ];
    });
  } else {
    const questions = poll.questions || [];

    headers = [
      "Participant",
      "Médiathèque",
      "Email",
      ...(poll.allowComment !== false ? ["Commentaire"] : []),
      "Date",
      ...questions.map(q => q.label)
    ];

    rows = responses.map(r => {
      const answers = questions.map(q => {
        const value = r.answers?.[q.id];

        if (q.type === "text") return value || "";
        if (q.type === "single") return pollOptionLabel(q, value);

        if (q.type === "multiple") {
          return (Array.isArray(value) ? value : [])
            .map(id => pollOptionLabel(q,id))
            .join(" | ");
        }

        // Compatibilité avec anciens sondages de disponibilité.
        if (q.type === "availability") {
          return (q.options || []).map(option => {
            const answer = value?.[option.id];
            const label = answer === "yes" ? "Oui" : answer === "maybe" ? "Si besoin" : answer === "no" ? "Non" : "";
            return `${option.label}: ${label}`;
          }).join(" | ");
        }

        return "";
      });

      return [
        r.userName || (poll.collectIdentity === false ? "Anonyme" : ""),
        r.branch || "",
        r.email || "",
        ...(poll.allowComment !== false ? [r.comment || ""] : []),
        fmtDateTime(toDate(r.updatedAt || r.createdAt)),
        ...answers
      ];
    });
  }

  const csv = [headers, ...rows]
    .map(row => row.map(csvEscape).join(";"))
    .join("\\r\\n");

  const blob = new Blob(["\\ufeff" + csv], { type:"text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `sondage-${String(poll.title || "export").replace(/[^a-z0-9]+/gi,"-").toLowerCase()}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function getSelectedIds(scope) {
  return $$(`.dk-row-check[data-scope="${scope}"]:checked`).map(input => input.value);
}

function updateBulkSelection(scope) {
  const checks = $$(`.dk-row-check[data-scope="${scope}"]`);
  const selected = checks.filter(input => input.checked);
  const all = $(`.dk-check-all[data-scope="${scope}"]`);
  const bar = $(`.dk-bulkbar[data-scope="${scope}"]`);
  const count = $(`.dk-bulk-count[data-scope="${scope}"]`);

  checks.forEach(input => {
    input.closest("tr")?.classList.toggle("dk-selected-row", input.checked);
  });

  if (all) {
    all.checked = checks.length > 0 && selected.length === checks.length;
    all.indeterminate = selected.length > 0 && selected.length < checks.length;
  }

  if (bar) bar.dataset.empty = selected.length ? "0" : "1";
  if (count) count.textContent = `${selected.length} sélectionné${selected.length > 1 ? "s" : ""}`;
}

function bindBulkSelection(scope) {
  const all = $(`.dk-check-all[data-scope="${scope}"]`);

  all?.addEventListener("change", () => {
    $$(`.dk-row-check[data-scope="${scope}"]`).forEach(input => {
      input.checked = all.checked;
    });
    updateBulkSelection(scope);
  });

  $$(`.dk-row-check[data-scope="${scope}"]`).forEach(input => {
    input.addEventListener("change", () => updateBulkSelection(scope));
  });

  $(`[data-clear-selection="${scope}"]`)?.addEventListener("click", () => {
    $$(`.dk-row-check[data-scope="${scope}"]`).forEach(input => {
      input.checked = false;
    });
    updateBulkSelection(scope);
  });

  updateBulkSelection(scope);
}

async function runSequentially(ids, action, { continueOnError = true } = {}) {
  const errors = [];
  for (const id of ids) {
    try {
      await action(id);
    } catch (err) {
      console.error(err);
      errors.push({ id, error: err });
      if (!continueOnError) break;
    }
  }
  return errors;
}

async function commitWriteChunks(items, writer, chunkSize = 400) {
  for (let i = 0; i < items.length; i += chunkSize) {
    const batch = writeBatch(db);
    items.slice(i, i + chunkSize).forEach(item => writer(batch, item));
    await batch.commit();
  }
}

async function approveBookingSilent(bookingId, adminComment = "") {
  const bookingForMail = state.bookings.find(b => b.id === bookingId);
  const bookingRef = doc(db, "bookings", bookingId);

  await runTransaction(db, async transaction => {
    const bookingSnap = await transaction.get(bookingRef);

    if (!bookingSnap.exists()) {
      throw new Error("Demande introuvable.");
    }

    const booking = bookingSnap.data();

    if (booking.status !== "pending") {
      throw new Error("Cette demande a déjà été traitée.");
    }

    const slotRef = doc(db, "slots", booking.slotId);
    const slotSnap = await transaction.get(slotRef);

    if (!slotSnap.exists()) {
      throw new Error("Créneau introuvable.");
    }

    const slot = slotSnap.data();

    if (slot.active === false) {
      throw new Error("Ce créneau est fermé.");
    }

    const current = Number(slot.confirmedCount || 0);
    const capacity = Number(slot.capacity || 1);

    if (current >= capacity) {
      throw new Error("Ce créneau est déjà complet.");
    }

    transaction.update(slotRef, {
      confirmedCount:current + 1,
      updatedAt:serverTimestamp()
    });

    transaction.update(bookingRef, {
      status:"approved",
      adminComment,
      approvedAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });
  });

  if (bookingForMail) {
    notifyBookingStatus({ ...bookingForMail, adminComment }, "approved");
  }
}

async function bulkSetSlotsActive(active) {
  const ids = getSelectedIds("slots");
  if (!ids.length) return;

  const verb = active ? "ouvrir" : "fermer";
  if (!confirm(`${verb[0].toUpperCase() + verb.slice(1)} ${ids.length} créneau${ids.length > 1 ? "x" : ""} ?`)) return;

  try {
    await commitWriteChunks(
      ids,
      (batch, id) => {
        batch.update(doc(db, "slots", id), {
          active,
          updatedAt:serverTimestamp()
        });
      }
    );

    ids.forEach(id => {
      const originalSlot = state.slots.find(s => s.id === id);
      notifySlotAffected(
        id,
        active
          ? "Le créneau associé à votre demande a été rouvert par l'administrateur."
          : "Le créneau associé à votre demande a été fermé par l'administrateur.",
        originalSlot ? { ...originalSlot, active } : null
      );
    });

    toast(`${ids.length} créneau${ids.length > 1 ? "x" : ""} ${active ? "ouvert" : "fermé"}${ids.length > 1 ? "s" : ""}.`);
  } catch (err) {
    console.error(err);
    toast("Modification groupée impossible.", "error");
  }
}

async function bulkDeleteSlots() {
  const ids = getSelectedIds("slots");
  if (!ids.length) return;

  const blocked = ids.filter(slotId =>
    state.bookings.some(
      b => b.slotId === slotId && ["pending","approved"].includes(b.status)
    )
  );

  const deletable = ids.filter(id => !blocked.includes(id));

  if (!deletable.length) {
    toast("Tous les créneaux sélectionnés ont des demandes actives. Fermez-les plutôt.", "error");
    return;
  }

  let message = `Supprimer définitivement ${deletable.length} créneau${deletable.length > 1 ? "x" : ""} ?`;
  if (blocked.length) {
    message += `\n\n${blocked.length} créneau(x) avec demande active seront ignorés.`;
  }
  if (!confirm(message)) return;

  try {
    await commitWriteChunks(
      deletable,
      (batch, id) => batch.delete(doc(db, "slots", id))
    );

    if (blocked.length) {
      toast(`${deletable.length} supprimé(s), ${blocked.length} ignoré(s).`);
    } else {
      toast(`${deletable.length} créneau${deletable.length > 1 ? "x" : ""} supprimé${deletable.length > 1 ? "s" : ""}.`);
    }
  } catch (err) {
    console.error(err);
    toast("Suppression groupée impossible.", "error");
  }
}

async function updateSlotWithScope(slot, scope, payload) {
  let targets = [slot];

  if (slot.recurrenceRuleId && scope !== "single") {
    targets = state.slots.filter(s => s.recurrenceRuleId === slot.recurrenceRuleId);

    if (scope === "future") {
      const currentStart = toDate(slot.startAt).getTime();
      targets = targets.filter(s => toDate(s.startAt).getTime() >= currentStart);
    }
  }

  const requestedCapacity = Number(payload.capacity || 1);
  const capacityBlocked = targets.filter(target => {
    const approved = state.bookings.filter(
      booking => booking.slotId === target.id && booking.status === "approved"
    ).length;

    const confirmed = Number(target.confirmedCount || 0);
    return requestedCapacity < Math.max(approved, confirmed);
  });

  if (capacityBlocked.length) {
    throw new Error(
      `Capacité trop faible : ${capacityBlocked.length} créneau${capacityBlocked.length > 1 ? "x" : ""} possède${capacityBlocked.length > 1 ? "nt" : ""} déjà plus d'inscription${capacityBlocked.length > 1 ? "s" : ""} confirmée${capacityBlocked.length > 1 ? "s" : ""}.`
    );
  }

  const refOldStart = toDate(slot.startAt);
  const refNewStart = toDate(payload.startAt);
  const deltaMs = refNewStart.getTime() - refOldStart.getTime();
  const newDurationMs = toDate(payload.endAt).getTime() - refNewStart.getTime();

  const updates = targets.map(target => {
    let targetPayload = { ...payload };

    if (target.id !== slot.id) {
      const oldTargetStart = toDate(target.startAt);
      const shiftedStart = new Date(oldTargetStart.getTime() + deltaMs);
      const shiftedEnd = new Date(shiftedStart.getTime() + newDurationMs);

      targetPayload = {
        ...payload,
        startAt: Timestamp.fromDate(shiftedStart),
        endAt: Timestamp.fromDate(shiftedEnd),
        duration: Math.round(newDurationMs / 60000)
      };
    }

    return {
      target,
      targetPayload,
      updatedSlot: {
        ...target,
        ...targetPayload
      }
    };
  });

  await commitWriteChunks(
    updates,
    (batch, item) => {
      batch.update(doc(db, "slots", item.target.id), item.targetPayload);
    }
  );

  updates.forEach(({ target, updatedSlot }) => {
    notifySlotAffected(
      target.id,
      "Le créneau associé à votre demande a été modifié par l'administrateur.",
      updatedSlot
    );
  });
}

async function deleteSlotWithScope(slot, scope) {
  let targets = [slot];

  if (slot.recurrenceRuleId && scope !== "single") {
    targets = state.slots.filter(s => s.recurrenceRuleId === slot.recurrenceRuleId);

    if (scope === "future") {
      const currentStart = toDate(slot.startAt).getTime();
      targets = targets.filter(s => toDate(s.startAt).getTime() >= currentStart);
    }
  }

  const blocked = targets.filter(target =>
    state.bookings.some(
      b => b.slotId === target.id && ["pending","approved"].includes(b.status)
    )
  );

  if (blocked.length) {
    throw new Error(
      `${blocked.length} créneau${blocked.length>1?"x":""} possède${blocked.length>1?"nt":""} une demande active. Fermez-le(s) plutôt que les supprimer.`
    );
  }

  if (!confirm(`Supprimer définitivement ${targets.length} créneau${targets.length>1?"x":""} ?`)) return;

  await commitWriteChunks(
    targets,
    (batch, target) => batch.delete(doc(db, "slots", target.id))
  );

  toast(`${targets.length} créneau${targets.length>1?"x":""} supprimé${targets.length>1?"s":""}.`);
}

async function deleteSlot(slotId) {
  const related = state.bookings.filter(b => b.slotId === slotId && ["pending","approved"].includes(b.status));
  if (related.length) {
    return toast("Ce créneau possède une demande active. Fermez-le plutôt que le supprimer.", "error");
  }
  if (!confirm("Supprimer définitivement ce créneau ?")) return;
  await deleteDoc(doc(db, "slots", slotId));
}

async function bulkGenerateRecurrences() {
  const ids = getSelectedIds("recurrence");
  if (!ids.length) return;

  if (!confirm(`Générer les créneaux manquants pour ${ids.length} récurrence${ids.length > 1 ? "s" : ""} ?`)) return;

  let generated = 0;
  let failures = 0;

  for (const id of ids) {
    try {
      generated += await generateRecurrenceSilent(id);
    } catch (err) {
      console.error(err);
      failures++;
    }
  }

  if (failures) {
    toast(`${generated} créneau(x) généré(s), ${failures} règle(s) en échec.`, "error");
  } else {
    toast(`${generated} créneau(x) généré(s) au total.`);
  }
}

}

    const fromDate = String(f.get("fromDate") || "");
    const toDate = String(f.get("toDate") || "");
    const windowStart = String(f.get("windowStart") || "");
    const windowEnd = String(f.get("windowEnd") || "");
    const slotMinutes = Number(f.get("slotMinutes") || 0);
    const capacity = Number(f.get("capacity") || 0);

    if (!fromDate || !toDate || toDate < fromDate) {
      return toast("La date de fin doit être égale ou postérieure à la date de début.", "error");
    }

    if (timeToMinutes(windowEnd) <= timeToMinutes(windowStart)) {
      return toast("La fin de plage doit être après le début.", "error");
    }

    if (!Number.isFinite(slotMinutes) || slotMinutes <= 0) {
      return toast("Durée de créneau invalide.", "error");
    }

    if (!Number.isFinite(capacity) || capacity < 1) {
      return toast("Capacité invalide.", "error");
    }

    const button = e.currentTarget.querySelector("[type=submit]");
    setBusy(button, true);

    try {
      await addDoc(collection(db, "recurrenceRules"), {
        name: String(f.get("name")).trim(),
        weekdays,
        fromDate,
        toDate,
        windowStart,
        windowEnd,
        slotMinutes,
        capacity,
        themeId: String(f.get("themeId") || ""),
        location: String(f.get("location") || "").trim(),
        excludedDates: [],
        active: true,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      closeModal();
      toast("Récurrence créée. Vous pouvez maintenant générer les créneaux.");
    } catch (err) {
      console.error(err);
      toast("Création impossible.", "error");
      setBusy(button, false);
    }
  });
}

function buildRecurrenceOccurrences(ruleId) {
  const rule = state.recurrenceRules.find(r => r.id === ruleId);
  if (!rule) throw new Error("Règle introuvable.");

  const from = dateFromKey(rule.fromDate);
  const to = dateFromKey(rule.toDate);
  to.setHours(23,59,59,999);

  const excluded = new Set(rule.excludedDates || []);
  const startMinutes = timeToMinutes(rule.windowStart);
  const endMinutes = timeToMinutes(rule.windowEnd);
  const duration = Number(rule.slotMinutes || 30);

  const existing = new Set(
    state.slots
      .filter(slot => slot.recurrenceRuleId === ruleId)
      .map(slot => slot.occurrenceKey)
      .filter(Boolean)
  );

  const occurrences = [];

  for (
    let current = new Date(from);
    current <= to;
    current.setDate(current.getDate() + 1)
  ) {
    const currentKey = dateKey(current);

    if (!(rule.weekdays || []).includes(current.getDay())) continue;
    if (excluded.has(currentKey)) continue;

    for (
      let min = startMinutes;
      min + duration <= endMinutes;
      min += duration
    ) {
      const startTime = minutesToTime(min);
      const endTime = minutesToTime(min + duration);
      const occurrenceKey = `${currentKey}_${startTime}`;

      if (existing.has(occurrenceKey)) continue;

      occurrences.push({
        currentKey,
        startTime,
        endTime,
        occurrenceKey
      });
    }
  }

  return { rule, duration, occurrences };
}

async function generateRecurrenceSilent(ruleId) {
  const { rule, duration, occurrences } = buildRecurrenceOccurrences(ruleId);

  if (!occurrences.length) return 0;

  for (let i = 0; i < occurrences.length; i += 400) {
    const batch = writeBatch(db);

    occurrences.slice(i, i + 400).forEach(item => {
      const ref = doc(collection(db, "slots"));
      const startDate = dateFromKey(item.currentKey, item.startTime);
      const endDate = dateFromKey(item.currentKey, item.endTime);

      batch.set(ref, {
        startAt:Timestamp.fromDate(startDate),
        endAt:Timestamp.fromDate(endDate),
        duration,
        capacity:Number(rule.capacity || 1),
        confirmedCount:0,
        themeId:rule.themeId || "",
        location:rule.location || "",
        active:true,
        source:"recurrence",
        recurrenceRuleId:ruleId,
        occurrenceKey:item.occurrenceKey,
        createdAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      });
    });

    await batch.commit();
  }

  return occurrences.length;
}

async function generateRecurrence(ruleId) {
  try {
    const { occurrences } = buildRecurrenceOccurrences(ruleId);

    if (!occurrences.length) {
      toast("Aucun nouveau créneau à générer.");
      return;
    }

    if (!confirm(`Créer ${occurrences.length} nouveau(x) créneau(x) ?`)) {
      return;
    }

    const count = await generateRecurrenceSilent(ruleId);
    toast(`${count} créneau(x) généré(s).`);
  } catch (err) {
    console.error(err);
    toast(err.message || "Impossible de générer les créneaux.", "error");
  }
}
