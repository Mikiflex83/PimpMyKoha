<div id="kt-journal">
  <div class="ktj-head"><div><h1>Journaux de suivi</h1><p class="ktj-sub">Plusieurs journaux indépendants, un seul chargé à la fois.</p></div><span class="ktj-status" id="ktj-status">Initialisation…</span></div>

    </div>
    <div class="ktj-actions" style="margin-top:10px"><button type="submit" id="ktj-save">Ajouter l’entrée</button><button type="button" class="secondary" id="ktj-cancel-edit" hidden>Annuler la modification</button></div>
  </form>
  <div class="ktj-card">
    <div class="ktj-toolbar">
      <div class="ktj-filters"><input type="search" id="ktj-search" placeholder="Rechercher dans les entrées…"><select id="ktj-filter-type"><option value="">Tous les types</option></select><label style="display:flex;align-items:center;gap:6px;margin:0"><input type="checkbox" id="ktj-deleted" style="width:auto"> Afficher les supprimées</label></div>
      <div class="ktj-actions"><button type="button" class="secondary" id="ktj-refresh">Actualiser</button><button type="button" class="secondary" id="ktj-csv">CSV</button><button type="button" class="success" id="ktj-pdf">PDF</button></div>
    </div>

    <div class="ktj-table-wrap" style="margin-top:10px"><table id="ktj-table"><thead><tr><th>Date</th><th>Auteur</th><th>Type</th><th>Description</th><th>Actions</th></tr></thead><tbody></tbody></table></div>

  </div>
  <details class="ktj-card ktj-settings" id="ktj-settings" hidden>
  <summary>Paramètres du journal et de l’installation</summary>

  <div class="ktj-settings-grid"><div><label>Titre</label><input id="ktj-setting-title"></div><div><label>Taille d’une page</label><input id="ktj-setting-page" type="number" min="25" max="200" step="25"></div><div class="wide"><label>Sous-titre</label><input id="ktj-setting-subtitle"></div><div class="wide"><label>Types d’action — un par ligne</label><textarea id="ktj-setting-types" rows="8"></textarea></div></div>

  <div class="ktj-journal-admin"><span class="ktj-note" id="ktj-storage-note"></span></div>
  <h3 style="margin:18px 0 8px">Connexion Firestore de cette installation</h3>
  <div class="ktj-note" id="ktj-backend-note" style="margin-bottom:10px"></div>
  <div class="ktj-settings-grid">
    <div><label>Project ID</label><input id="ktj-fb-project" autocomplete="off"></div>
    <div><label>Database ID</label><input id="ktj-fb-database" autocomplete="off" placeholder="(default)"></div>
    <div><label>API key Firebase Web</label><input id="ktj-fb-api" autocomplete="off"></div>
    <div><label>App ID</label><input id="ktj-fb-app" autocomplete="off"></div>
    <div><label>Auth domain</label><input id="ktj-fb-auth" autocomplete="off"></div>
    <div><label>Storage bucket</label><input id="ktj-fb-storage" autocomplete="off"></div>

  </div>
  <div class="ktj-actions" style="margin-top:10px"><button type="button" id="ktj-test-backend" class="secondary">Tester la connexion</button><button type="button" id="ktj-save-backend">Enregistrer la connexion de l’installation</button></div>
  <div class="ktj-journal-admin"><span class="ktj-note" id="ktj-backend-status"></span></div>
</details>
</div>
<div id="kt-journal-modal"><div class="box"><div class="top"><div><h2 style="margin:0">Historique</h2><div class="ktj-status" id="ktj-history-note"></div></div><button type="button" class="secondary" id="ktj-close-history">Fermer</button></div><table><thead><tr><th>Date</th><th>Action</th><th>Détails</th></tr></thead><tbody></tbody></table></div></div>

<script type="module">

const MODULE_ID='tracking-journal',MAX_JOURNALS=25;

const $=s=>root.querySelector(s),escCsv=v=>{const s=String(v??'');return /[;"\r\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s},localDate=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};

function normalizedJournal(j,i=0){const id=slug(j?.id||j?.title||`journal-${i+1}`);return {id,title:String(j?.title||'Journal de suivi').trim().slice(0,120)||'Journal de suivi',subtitle:String(j?.subtitle||'').trim().slice(0,300),pageSize:Math.max(25,Math.min(200,Number(j?.pageSize)||100)),entryTypes:[...new Set((Array.isArray(j?.entryTypes)?j.entryTypes:DEFAULT_TYPES).map(x=>String(x).trim()).filter(Boolean))].slice(0,50),entriesCollection:String(j?.entriesCollection||`journals/${id}/entries`).trim(),logsCollection:String(j?.logsCollection||`journals/${id}/logs`).trim()}}
function normalizeFirebase(raw={}){return {kind:'firestore',enabled:raw.enabled!==false,installationId:String(raw.installationId||'').trim(),allowedHosts:Array.isArray(raw.allowedHosts)?raw.allowedHosts.map(x=>String(x).trim()).filter(Boolean):[],sdkVersion:String(raw.sdkVersion||'11.7.3'),appName:String(raw.appName||'KohaToolsTrackingJournal'),apiKey:String(raw.apiKey||'').trim(),authDomain:String(raw.authDomain||'').trim(),projectId:String(raw.projectId||'').trim(),storageBucket:String(raw.storageBucket||'').trim(),messagingSenderId:String(raw.messagingSenderId||'').trim(),appId:String(raw.appId||'').trim(),databaseId:String(raw.databaseId||'(default)').trim()||'(default)',anonymousAuth:raw.anonymousAuth===true}}

function normalizeConfig(){const c=canonical(),raw=c.journal||{},currentInstall=installationId(),profileInstall=String(raw.profileInstallationId||'').trim(),profileMatches=!profileInstall||!currentInstall||profileInstall===currentInstall,sourceJournals=profileMatches&&Array.isArray(raw.journals)&&raw.journals.length?raw.journals:[{id:'general',title:'Journal général',subtitle:'Journal partagé de cette installation.',pageSize:100,entryTypes:DEFAULT_TYPES,entriesCollection:'journals/general/entries',logsCollection:'journals/general/logs'}],journals=sourceJournals.map(normalizedJournal),seen=new Set(),unique=[];for(const j of journals){if(seen.has(j.id))continue;seen.add(j.id);unique.push(j)}const requested=profileMatches?raw.defaultJournalId:'general',def=unique.some(j=>j.id===requested)?requested:unique[0].id;const firebase=normalizeFirebase(c.firebase||raw?.backend?.firebase||{});return {profileInstallationId:profileMatches?(profileInstall||currentInstall):(currentInstall||''),defaultJournalId:def,maxHistoryRows:Math.max(10,Math.min(200,Number(raw.maxHistoryRows)||100)),journals:unique.slice(0,MAX_JOURNALS),firebase,realtime:false}}
function backendProblem(conn){return KT?.getService?.('firebase-module')?.problem?.(MODULE_ID,conn)||''}
function appNameFor(conn){if(conn?.appName)return conn.appName;const tail=String(conn.appId||'').replace(/[^a-zA-Z0-9]/g,'').slice(-8)||'app';return `KohaToolsTrackingJournal_${slug(conn.projectId)}_${tail}`}
async function connectBackend(conn=cfg?.firebase,{probe=false}={}){const c=normalizeFirebase(conn),problem=backendProblem(c);if(problem){db=null;activeConnection=null;status(problem,true);fillBackendSettings();return false}try{const options=KT?.getService?.('firebase-module')?.publicConfig?.(MODULE_ID,c,{throwOnError:true});const name=appNameFor(c);const app=getApps().find(a=>a.name===name)||initializeApp(options,name);db=c.databaseId&&c.databaseId!=='(default)'?getFirestore(app,c.databaseId):getFirestore(app);const auth=getAuth(app);const credential=auth.currentUser?{user:auth.currentUser}:await signInAnonymously(auth);const uid=credential.user.uid;const accessRef=doc(db,'journal_access',uid);const accessSnap=await getDoc(accessRef);if(!accessSnap.exists()){await setDoc(accessRef,{approved:false,role:'pending',createdAt:serverTimestamp()});throw new Error(`Poste Journaux non approuvé. UID Firebase : ${uid}. Approuvez journal_access/${uid} dans Firebase.`)}const access=accessSnap.data()||{};if(access.approved!==true||!['member','admin'].includes(String(access.role||'')))throw new Error(`Poste Journaux en attente d’approbation. UID Firebase : ${uid}.`);activeConnection=c;if(probe&&jc){const snap=await getDocs(query(collection(db,jc.entriesCollection),limit(1)));record('reads',snap.size)}status(`Connecté à Firestore · ${c.projectId}${c.databaseId&&c.databaseId!=='(default)'?' / '+c.databaseId:''}`);fillBackendSettings();return true}catch(e){db=null;activeConnection=null;report('backend-connect-failed',e);status(`Connexion Firestore impossible : ${String(e?.message||e)}`,true);fillBackendSettings();return false}}

function hydrateUi(){const sel=$('#ktj-journal-select');const current=jc?.id||selectedId();sel.innerHTML='';for(const j of cfg.journals){const o=document.createElement('option');o.value=j.id;o.textContent=j.title;sel.appendChild(o)}sel.value=current;$('#ktj-title').textContent=jc.title;$('#ktj-subtitle').textContent=jc.subtitle||'';$('#ktj-journalmeta').textContent=`${cfg.journals.length} journal${cfg.journals.length>1?'x':''} · aucun autre journal n’est lu en arrière-plan`;document.title=`${jc.title} › Journaux de suivi › Koha`;const types=jc.entryTypes.length?jc.entryTypes:DEFAULT_TYPES;const type=$('#ktj-type'),filter=$('#ktj-filter-type'),currentType=type.value,currentFilter=filter.value;type.innerHTML='';for(const x of types){const o=document.createElement('option');o.value=x;o.textContent=x;type.appendChild(o)}if(types.includes(currentType))type.value=currentType;filter.innerHTML='<option value="">Tous les types</option>';for(const x of types){const o=document.createElement('option');o.value=x;o.textContent=x;filter.appendChild(o)}if(types.includes(currentFilter))filter.value=currentFilter;$('#ktj-limit-note').textContent=`${jc.title} · lecture bornée à ${jc.pageSize} entrées par page. L’historique n’est lu qu’à la demande.`;fillSettings();fillBackendSettings()}

function resetForm(){editingId=null;$('#ktj-form').reset();$('#ktj-date').value=localDate();$('#ktj-author').value=localStorage.getItem('KohaTools.trackingJournal.author')||detectAuthor();$('#ktj-save').textContent="Ajouter l’entrée";$('#ktj-cancel-edit').hidden=true}
function detectAuthor(){const el=document.querySelector('.loggedinusername[data-loggedinusername],.loggedinusername');return String(el?.dataset?.loggedinusername||el?.textContent||'').trim().replace(/\s+/g,' ').slice(0,100)}
async function saveEntry(ev){ev?.preventDefault();if(!db)return alert('La connexion Firestore du module n’est pas configurée ou disponible.');const date=$('#ktj-date').value,author=$('#ktj-author').value.trim(),type=$('#ktj-type').value,desc=$('#ktj-desc').value.trim();if(!date||!author||!type||!desc)return alert('Merci de remplir tous les champs.');localStorage.setItem('KohaTools.trackingJournal.author',author);const stamp=Timestamp.fromDate(new Date(date+'T12:00:00'));const payload={date,author,type,desc,timestamp:stamp,deleted:false,journalId:jc.id,updatedAt:serverTimestamp()};const auditPayload={date,author,type,desc,timestamp:date,deleted:false,journalId:jc.id};const btn=$('#ktj-save');btn.disabled=true;try{if(editingId){const prev=byId.get(editingId)?.data||{};await updateDoc(doc(db,jc.entriesCollection,editingId),payload);record('writes',1);await logAction('Modification',editingId,{before:prev,after:auditPayload},author)}else{const ref=await addDoc(collection(db,jc.entriesCollection),{...payload,createdAt:serverTimestamp()});record('writes',1);await logAction('Création',ref.id,{after:auditPayload},author)}resetForm();await fetchPage()}catch(e){report('entry-save-failed',e);alert("Impossible d’enregistrer l’entrée.")}finally{btn.disabled=false}}
function bindRowButtons(){tbody.querySelectorAll('.edit').forEach(b=>b.onclick=()=>{const r=byId.get(b.dataset.id);if(!r)return;editingId=r.id;$('#ktj-date').value=r.data.date||localDate();$('#ktj-author').value=r.data.author||'';if(r.data.type&&!Array.from($('#ktj-type').options).some(o=>o.value===r.data.type)){const o=document.createElement('option');o.value=r.data.type;o.textContent=r.data.type+' (historique)';$('#ktj-type').appendChild(o)}$('#ktj-type').value=r.data.type||jc.entryTypes[0];$('#ktj-desc').value=r.data.desc||'';$('#ktj-save').textContent='Mettre à jour';$('#ktj-cancel-edit').hidden=false;$('#ktj-form').scrollIntoView({behavior:'smooth',block:'start'})});tbody.querySelectorAll('.delete').forEach(b=>b.onclick=async()=>{const r=byId.get(b.dataset.id);if(!r||!confirm(`Masquer cette entrée du journal « ${jc.title} » ?`))return;b.disabled=true;try{await updateDoc(doc(db,jc.entriesCollection,r.id),{deleted:true,updatedAt:serverTimestamp()});record('writes',1);await logAction('Suppression logique',r.id,{before:r.data},$('#ktj-author').value.trim());await fetchPage()}catch(e){report('delete-failed',e)}finally{b.disabled=false}});tbody.querySelectorAll('.restore').forEach(b=>b.onclick=async()=>{const r=byId.get(b.dataset.id);if(!r)return;b.disabled=true;try{await updateDoc(doc(db,jc.entriesCollection,r.id),{deleted:false,updatedAt:serverTimestamp()});record('writes',1);await logAction('Restauration',r.id,{before:r.data},$('#ktj-author').value.trim());await fetchPage()}catch(e){report('restore-failed',e)}finally{b.disabled=false}});tbody.querySelectorAll('.history').forEach(b=>b.onclick=()=>openHistory(b.dataset.id))}
async function openHistory(id){if(!db)return alert('Connexion Firestore indisponible.');modal.classList.add('open');historyBody.innerHTML='<tr><td colspan="3">Chargement…</td></tr>';const max=cfg.maxHistoryRows,col=collection(db,jc.logsCollection);try{let snap;try{snap=await getDocs(query(col,where('entryId','==',id),orderBy('timestamp','desc'),limit(max)))}catch(_){snap=await getDocs(query(col,where('entryId','==',id),limit(max)))}record('reads',snap.size);const logs=snap.docs.map(x=>x.data()).sort((a,b)=>toDate(b.timestamp)-toDate(a.timestamp));historyBody.innerHTML='';$('#ktj-history-note').textContent=`${jc.title} · ${logs.length===max?`affichage limité aux ${max} événements les plus récents`:`${logs.length} événement(s)`}.`;if(!logs.length)historyBody.innerHTML='<tr><td colspan="3">Aucun historique disponible.</td></tr>';for(const log of logs){const tr=document.createElement('tr'),d=document.createElement('td'),a=document.createElement('td'),x=document.createElement('td');d.textContent=toDate(log.timestamp).toLocaleString('fr-FR');a.textContent=log.action||'';const pre=document.createElement('pre');pre.textContent=JSON.stringify(log.details||{},null,2);x.appendChild(pre);tr.append(d,a,x);historyBody.appendChild(tr)}}catch(e){report('history-failed',e);historyBody.innerHTML='<tr><td colspan="3">Impossible de charger l’historique.</td></tr>'}}
function safeName(v){return slug(v).replaceAll('-','_')||'journal'}
function exportCsv(){const out=[['journal','date','auteur','type','description','supprime'].join(';')];for(const r of filtered())out.push([jc.title,r.data.date,r.data.author,r.data.type,r.data.desc,r.data.deleted?'1':'0'].map(escCsv).join(';'));const a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff'+out.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=`journal-${safeName(jc.title)}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500)}
function canonicalPayload(nextCfg,firebaseOverride=null){const c=canonical(),journal={...(c.journal||{}),...nextCfg};for(const k of ['title','subtitle','pageSize','entryTypes','entriesCollection','logsCollection','firebaseProjectId','backend','firebase'])delete journal[k];const out={...c,journal};if(firebaseOverride)out.firebase=firebaseOverride;return out}
async function persistConfig(nextCfg,message,{firebase=null}={}){if(!canWrite())return false;const r=await remote.saveCanonical(MODULE_ID,canonicalPayload(nextCfg,firebase));if(!r.ok)throw new Error(r.error||'save-failed');cfg={...nextCfg,...(firebase?{firebase}: {})};const cur=cfg.journals.find(j=>j.id===jc?.id)||cfg.journals.find(j=>j.id===cfg.defaultJournalId)||cfg.journals[0];jc=cur;hydrateUi();status(message||'Paramètres enregistrés.');return true}
async function saveSettings(){if(!canWrite())return;const types=$('#ktj-setting-types').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),updated=normalizedJournal({...jc,title:$('#ktj-setting-title').value.trim()||'Journal de suivi',subtitle:$('#ktj-setting-subtitle').value.trim(),pageSize:Number($('#ktj-setting-page').value)||100,entryTypes:types.length?types:DEFAULT_TYPES});updated.entriesCollection=jc.entriesCollection;updated.logsCollection=jc.logsCollection;const next={...cfg,journals:cfg.journals.map(j=>j.id===jc.id?updated:j)};const btn=$('#ktj-save-settings');btn.disabled=true;try{jc=updated;await persistConfig(next,'Paramètres du journal enregistrés.');await fetchPage()}catch(e){report('settings-save-failed',e);alert('Impossible d’enregistrer les paramètres.')}finally{btn.disabled=false}}
async function createJournal(){if(!canWrite())return;if(cfg.journals.length>=MAX_JOURNALS)return alert(`Limite de ${MAX_JOURNALS} journaux atteinte.`);const title=prompt('Nom du nouveau journal :','');if(!title?.trim())return;let id=slug(title),n=2;while(cfg.journals.some(j=>j.id===id))id=`${slug(title).slice(0,36)}-${n++}`;const created=normalizedJournal({id,title:title.trim(),subtitle:'',pageSize:100,entryTypes:DEFAULT_TYPES,entriesCollection:`journals/${id}/entries`,logsCollection:`journals/${id}/logs`});const next={...cfg,journals:[...cfg.journals,created]};try{jc=created;await persistConfig(next,`Journal « ${created.title} » créé.`);localStorage.setItem('KohaTools.trackingJournal.selected',created.id);rows=[];byId=new Map();lastDoc=null;hasMore=false;resetForm();await fetchPage();$('#ktj-settings').open=true}catch(e){report('journal-create-failed',e);alert('Impossible de créer le journal.') }}
async function setDefault(){if(!canWrite()||cfg.defaultJournalId===jc.id)return;try{await persistConfig({...cfg,defaultJournalId:jc.id},`« ${jc.title} » est maintenant le journal par défaut.`);fillSettings()}catch(e){report('journal-default-failed',e);alert('Impossible de modifier le journal par défaut.')}}
function fillSettings(){if(!jc)return;$('#ktj-setting-title').value=jc.title;$('#ktj-setting-subtitle').value=jc.subtitle||'';$('#ktj-setting-page').value=jc.pageSize;$('#ktj-setting-types').value=(jc.entryTypes||[]).join('\n');$('#ktj-storage-note').textContent=`Stockage : ${jc.entriesCollection} / ${jc.logsCollection}. Les données de ce journal sont isolées des autres.`;$('#ktj-set-default').disabled=cfg.defaultJournalId===jc.id;$('#ktj-set-default').textContent=cfg.defaultJournalId===jc.id?'Journal par défaut':'Définir comme journal par défaut'}
function fillBackendSettings(){if(!canWrite())return;const c=cfg?.firebase||{};$('#ktj-fb-project').value=c.projectId||'';$('#ktj-fb-database').value=c.databaseId||'(default)';$('#ktj-fb-api').value=c.apiKey||'';$('#ktj-fb-app').value=c.appId||'';$('#ktj-fb-auth').value=c.authDomain||'';$('#ktj-fb-storage').value=c.storageBucket||'';$('#ktj-fb-sender').value=c.messagingSenderId||'';const current=installationId()||'(non défini)';$('#ktj-backend-note').textContent=`Installation KohaTools : ${current}. Cette connexion appartient uniquement au module Journaux de suivi. Elle peut différer de tous les autres modules Firebase. Aucune clé privée/service account ne doit être saisie ici.`;const problem=backendProblem(c);$('#ktj-backend-status').textContent=problem?problem:(activeConnection?.projectId===c.projectId?`Connexion active : ${c.projectId}`:`Connexion configurée : ${c.projectId||'aucune'}`)}
function backendDraft(){return normalizeFirebase({...cfg.firebase,installationId:installationId(),allowedHosts:cfg.firebase?.allowedHosts||[location.hostname],projectId:$('#ktj-fb-project').value,databaseId:$('#ktj-fb-database').value,apiKey:$('#ktj-fb-api').value,appId:$('#ktj-fb-app').value,authDomain:$('#ktj-fb-auth').value,storageBucket:$('#ktj-fb-storage').value,messagingSenderId:$('#ktj-fb-sender').value})}
async function testBackend(){const btn=$('#ktj-test-backend'),draft=backendDraft(),problem=backendProblem(draft);if(problem)return alert(problem);btn.disabled=true;try{const ok=await connectBackend(draft,{probe:true});$('#ktj-backend-status').textContent=ok?`Test réussi sur ${draft.projectId}. Enregistrez la connexion pour la rendre permanente.`:'Test échoué.'}finally{btn.disabled=false}}
async function saveBackend(){if(!canWrite())return;const btn=$('#ktj-save-backend'),draft=backendDraft(),problem=backendProblem(draft);if(problem)return alert(problem);btn.disabled=true;try{await persistConfig(cfg,`Connexion Firebase du module enregistrée : ${draft.projectId}.`,{firebase:draft});const ok=await connectBackend(draft,{probe:true});if(ok){rows=[];byId=new Map();lastDoc=null;hasMore=false;await fetchPage()}}catch(e){report('backend-save-failed',e);alert(`Impossible d’enregistrer la connexion : ${String(e?.message||e)}`)}finally{btn.disabled=false}}
async function changeJournal(){const id=$('#ktj-journal-select').value;if(editingId&&!confirm('Abandonner la modification en cours et changer de journal ?')){$('#ktj-journal-select').value=jc.id;return}selectJournal(id);await fetchPage()}
function cleanup(){if(destroyed)return;destroyed=true;window.removeEventListener('keydown',onKey);modal.classList.remove('open')}
const onKey=e=>{if(e.key==='Escape')modal.classList.remove('open')};window.addEventListener('keydown',onKey);host?.onUnmount?.(MODULE_ID,cleanup);
$('#ktj-form').addEventListener('submit',saveEntry);$('#ktj-cancel-edit').onclick=resetForm;$('#ktj-search').oninput=render;$('#ktj-filter-type').onchange=render;$('#ktj-deleted').onchange=()=>fetchPage();$('#ktj-refresh').onclick=()=>fetchPage();$('#ktj-more').onclick=()=>fetchPage({append:true});$('#ktj-journal-select').onchange=changeJournal;$('#ktj-csv').onclick=exportCsv;$('#ktj-pdf').onclick=()=>{if(typeof window.html2pdf!=='function')return alert('Export PDF indisponible.');window.html2pdf().set({margin:.35,filename:`journal-${safeName(jc.title)}.pdf`,html2canvas:{scale:1.5},jsPDF:{unit:'in',format:'a4',orientation:'landscape'}}).from($('#ktj-table')).save()};$('#ktj-close-history').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
if(canWrite()){$('#ktj-settings').hidden=false;$('#ktj-new-journal').hidden=false;$('#ktj-save-settings').onclick=saveSettings;$('#ktj-new-journal').onclick=createJournal;$('#ktj-set-default').onclick=setDefault;$('#ktj-test-backend').onclick=testBackend;$('#ktj-save-backend').onclick=saveBackend}
cfg=normalizeConfig();selectJournal(selectedId(),{persist:false});const connected=await connectBackend();if(connected)await fetchPage();else render();
</script>
