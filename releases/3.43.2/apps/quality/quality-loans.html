<style>
#dql-app{--g:#6f8f32;--gd:#526d22;--b:#d8dee3;--m:#697680;--bg:#f6f7f8;--danger:#fff1f1;--warn:#fff8e8;max-width:1700px;margin:0 auto 40px;color:#28343d}#dql-app *{box-sizing:border-box}.dql-loading{padding:35px;text-align:center;color:#66727c}.dql-hero{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:20px 24px;border:1px solid #cedbbd;border-left:5px solid var(--g);border-radius:7px;background:linear-gradient(135deg,#fff,#f5f9ef);margin-bottom:14px}.dql-kicker{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--gd)}.dql-hero h2{margin:3px 0;color:var(--gd);font-size:25px}.dql-hero p{margin:3px 0;color:var(--m)}.dql-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.dql-status{display:none;padding:10px 13px;margin-bottom:12px;border:1px solid var(--b);border-radius:5px}.dql-status.visible{display:block}.dql-status.loading{background:#f2f7fa}.dql-status.ok{background:#f2f8eb;border-color:#cadcb2}.dql-status.error{background:var(--danger);border-color:#e1b5b5;color:#822929}.dql-flow{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:7px;margin-bottom:13px}.dql-step{padding:10px;border:1px solid var(--b);border-radius:7px;background:#fff;text-align:left}.dql-step:hover,.dql-step.active{border-color:#9fb878;background:#fbfdf8}.dql-step.active{box-shadow:inset 0 -3px 0 var(--g)}.dql-step-num{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;border-radius:50%;background:#e9edf0;font-weight:700}.dql-step strong{display:block;margin-top:4px}.dql-step small{display:block;color:var(--m)}.dql-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-bottom:12px}.dql-stat{padding:12px 14px;border:1px solid var(--b);border-radius:7px;background:#fff}.dql-stat span{display:block;color:var(--m);font-size:10px;font-weight:700;text-transform:uppercase}.dql-stat strong{display:block;margin-top:3px;color:var(--gd);font-size:23px}.dql-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;margin-bottom:12px;border:1px solid var(--b);border-radius:6px;background:var(--bg)}.dql-toolbar input,.dql-toolbar select,.dql-input{height:35px;border:1px solid #bcc6cd;border-radius:5px;background:#fff;padding:5px 8px}.dql-search{flex:1;min-width:240px;max-width:600px}.dql-search input{width:100%}.dql-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin:4px 0 11px}.dql-head h3{margin:0;color:#39444d}.dql-head p{margin:3px 0;color:var(--m)}.dql-info,.dql-warning,.dql-danger{padding:10px 12px;margin-bottom:11px;border-radius:5px;font-size:13px}.dql-info{background:#f3f8fb;border:1px solid #c7d8e3}.dql-warning{background:var(--warn);border:1px solid #e4cf96;color:#725c22}.dql-danger{background:var(--danger);border:1px solid #e1b5b5;color:#822929}.dql-quality{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.dql-card{padding:13px;border:1px solid var(--b);border-radius:7px;background:#fff}.dql-card h4{margin:0 0 8px}.dql-card .value{display:block;font-size:25px;font-weight:700;color:var(--gd)}.dql-card small,.dql-note{color:var(--m);font-size:12px}.dql-table-wrap{overflow-x:auto;border:1px solid var(--b);border-radius:7px}.dql-table{width:100%;margin:0!important}.dql-table th{white-space:nowrap;background:#f5f6f7;color:#52606a}.dql-table td,.dql-table th{vertical-align:middle!important}.dql-table tr.selected{background:#f5f9ef}.dql-badge{display:inline-block;padding:2px 7px;margin:1px 2px 1px 0;border-radius:11px;background:#e8edf0;color:#52606a;font-size:11px;font-weight:650}.dql-badge.critical{background:#f9dddd;color:#8a2b2b}.dql-badge.review{background:#fff0c9;color:#725c22}.dql-badge.atypical{background:#e9f3fb;color:#37617a}.dql-badge.ok{background:#e6f1d8;color:#4d6a20}.dql-selection{display:flex;justify-content:space-between;gap:9px;align-items:center;padding:8px 10px;margin-bottom:9px;border:1px solid var(--b);border-radius:5px;background:#f8f9fa}.dql-pagination{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;color:#6f7a82;font-size:12px}.dql-empty{padding:35px;border:1px dashed #c7cfd5;border-radius:7px;text-align:center;color:#78848c;background:#fafbfb}.dql-fingerprint{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-bottom:1px solid #edf0f2}.dql-fingerprint:last-child{border:0}.dql-settings{width:100%;border-collapse:collapse}.dql-settings td,.dql-settings th{padding:7px;border-bottom:1px solid #edf0f2;text-align:left}.dql-feedback{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}.dql-feedback button{font-size:10px;padding:2px 5px}.dql-sim{padding:12px;border:1px solid #c7d8e3;border-radius:7px;background:#f7fbfd;margin-bottom:12px}.dql-sim-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.dql-sim-cell{padding:8px;border:1px solid #dbe5eb;border-radius:5px;background:#fff}.dql-sim-cell strong{display:block;font-size:20px;color:var(--gd)}.dql-progress{height:8px;overflow:hidden;border-radius:20px;background:#e6eaed}.dql-progress span{display:block;height:100%;background:var(--g)}.dql-progress-box{margin:9px 0 12px;padding:10px;border:1px solid var(--b);border-radius:6px;background:#fff}.dql-progress-info{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px;color:var(--m)}.dql-checkbox{width:18px;height:18px}
@media(max-width:1100px){.dql-flow{grid-template-columns:repeat(3,1fr)}.dql-stats,.dql-quality,.dql-sim-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.dql-flow,.dql-stats,.dql-quality,.dql-sim-grid{grid-template-columns:1fr}.dql-hero,.dql-head,.dql-selection{flex-direction:column;align-items:stretch}}
</style>
<script>
(function(){
'use strict';
if(window.__dracQualityLoansV1)return;window.__dracQualityLoansV1=true;
const CFG={MODULE:'loans',VERSION:'1.5.0',API:'/api/v1',ROWS:50,API_PAGE:100,MIN_GAP:250,DEEP_LIMIT:300,SETTINGS_KEY:'drac_quality_loans_settings_v1',MEMORY_SCRIPT:'__KOHATOOLS_ASSET_ROOT__apps/quality/shared/quality-memory-firebase.js?ktv=3.43.2',DEFAULTS:{oldDays:365,veryOldDays:730,overdueDays:180,criticalOverdueDays:730,idleDays:365,claimDays:90,claimCriticalDays:365,unseenRenewals:3}};
const root=document.getElementById('dql-app');if(!root)return;const SEV={ok:0,atypical:1,review:2,critical:3};
function loadSettings(){try{return {...CFG.DEFAULTS,...JSON.parse(localStorage.getItem(CFG.SETTINGS_KEY)||'{}')}}catch(_){return {...CFG.DEFAULTS}}}
const state={tab:'overview',rows:[],loading:false,stop:false,settings:loadSettings(),search:'',severity:'',library:'',minAge:0,page:1,selected:new Set(),deep:new Map(),deepRunning:false,deepDone:0,writeUnlocked:false,simulation:null,resolutions:[],memoryStatus:null,remoteFeedback:[]};
let tail=Promise.resolve(),lastEnd=0;function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function queue(task){const p=tail.catch(()=>{}).then(async()=>{const w=Math.max(0,CFG.MIN_GAP-(Date.now()-lastEnd));if(w)await sleep(w);try{return await task()}finally{lastEnd=Date.now()}});tail=p.catch(()=>{});return p}function kfetch(url,opt={}){return queue(()=>fetch(url,{credentials:'same-origin',cache:'no-store',...opt}))}
function $(id){return document.getElementById(id)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){return new Intl.NumberFormat('fr-FR').format(Number(v)||0)}function daysSince(v){if(!v)return null;const t=Date.parse(v);return Number.isFinite(t)?Math.max(0,Math.floor((Date.now()-t)/86400000)):null}function daysOverdue(v){if(!v)return null;const t=Date.parse(v);return Number.isFinite(t)?Math.floor((Date.now()-t)/86400000):null}function ageBucket(d){if(d==null)return'unknown';if(d<30)return'lt30';if(d<90)return'30_89';if(d<180)return'90_179';if(d<365)return'180_364';if(d<730)return'365_729';if(d<1095)return'730_1094';return'1095_plus'}function countBucket(n){n=Number(n)||0;return n===0?'0':n===1?'1':n<=3?'2_3':n<=6?'4_6':'7_plus'}

const RULES=[
{id:'LOAN-001',title:'Prêt ancien',severity:'atypical',test:(x,s)=>daysSince(x.checkout_date)>=s.oldDays},
{id:'LOAN-002',title:'Prêt très ancien',severity:'review',test:(x,s)=>daysSince(x.checkout_date)>=s.veryOldDays},
{id:'LOAN-003',title:'Échéance très dépassée',severity:'review',test:(x,s)=>(daysOverdue(x.due_date)||0)>=s.overdueDays},
{id:'LOAN-004',title:'Échéance très fortement dépassée',severity:'review',test:(x,s)=>(daysOverdue(x.due_date)||0)>=s.criticalOverdueDays},
{id:'LOAN-005',title:'Aucune activité depuis longtemps',severity:'review',test:(x,s)=>activityDays(x)>=s.idleDays},
{id:'LOAN-006',title:'Prêt ancien + très en retard + figé',severity:'critical',test:(x,s)=>daysSince(x.checkout_date)>=s.oldDays&&(daysOverdue(x.due_date)||0)>=s.overdueDays&&activityDays(x)>=s.idleDays},
{id:'LOAN-007',title:'Renouvellements sans présentation élevés',severity:'review',test:(x,s)=>(Number(x.unseen_renewals)||0)>=s.unseenRenewals},
{id:'LOAN-008',title:'Erreur d’auto-renouvellement persistante',severity:'review',test:(x)=>!!x.auto_renew_error&&(daysOverdue(x.due_date)||0)>=30},
{id:'LOAN-009',title:'Exemplaire perdu pendant un prêt (état Koha possible)',severity:'atypical',deep:true,test:(x,s,d)=>!!d?.item_lost},
{id:'LOAN-010',title:'Exemplaire retiré pendant un prêt (selon politique locale)',severity:'review',deep:true,test:(x,s,d)=>!!d?.item_withdrawn},
{id:'LOAN-011',title:'Exemplaire devenu non prêtable pendant le prêt',severity:'atypical',deep:true,test:(x,s,d)=>!!d?.item_not_for_loan},
{id:'LOAN-012',title:'Réclamation de retour ancienne',severity:'review',deep:true,test:(x,s,d)=>!!d?.claim_open&&d.claim_age>=s.claimDays},
{id:'LOAN-013',title:'Réclamation de retour très ancienne',severity:'critical',deep:true,test:(x,s,d)=>!!d?.claim_open&&d.claim_age>=s.claimCriticalDays},
{id:'LOAN-014',title:'Exemplaire revu après ouverture de la réclamation',severity:'review',deep:true,test:(x,s,d)=>!!d?.claim_open&&!!d?.last_seen_after_claim},
{id:'LOAN-015',title:'Lecteur expiré + prêt très ancien',severity:'review',deep:true,test:(x,s,d)=>!!d?.patron_expired&&daysSince(x.checkout_date)>=s.veryOldDays},
{id:'LOAN-016',title:'Transfert associé à un exemplaire encore prêté',severity:'review',deep:true,test:(x,s,d)=>!!d?.has_transfer},
{id:'LOAN-017',title:'Réservation sur exemplaire extrêmement en retard',severity:'review',deep:true,test:(x,s,d)=>!!d?.has_hold&&(daysOverdue(x.due_date)||0)>=s.overdueDays}
];
function activityDate(x){const vals=[x.last_renewed_date,x.timestamp,x.checkout_date].map(Date.parse).filter(Number.isFinite);return vals.length?new Date(Math.max(...vals)).toISOString():null}function activityDays(x){return daysSince(activityDate(x))??99999}
function evaluate(x){const d=state.deep.get(String(x.checkout_id));const hits=[];for(const r of RULES){if(r.deep&&!d)continue;try{if(r.test(x,state.settings,d))hits.push(r)}catch(_){}}let severity='ok';for(const h of hits)if(SEV[h.severity]>SEV[severity])severity=h.severity;return {hits,severity,deep:!!d}}
function severityBadge(s){const l={critical:'Critique',review:'À vérifier',atypical:'Atypique',ok:'Sans alerte'}[s]||s;return `<span class="dql-badge ${s}">${l}</span>`}

renderShell();bindGlobal();loadMemory();
function step(id,n,t,s){return `<button class="dql-step ${state.tab===id?'active':''}" data-tab="${id}"><span class="dql-step-num">${n}</span><strong>${t}</strong><small>${s}</small></button>`}
function renderShell(){root.innerHTML=`<div class="dql-hero"><div><div class="dql-kicker">KOHA · QUALITÉ DU CATALOGUE</div><h2>Prêts & litiges</h2><p>Rendre visibles les prêts très anciens ou figés, les réclamations de retour et les états contradictoires, sans jamais inventer un retour.</p></div><div class="dql-actions"><button id="dql-refresh" class="btn btn-primary"><i class="fa fa-play"></i> Charger les prêts</button><button id="dql-stop" class="btn btn-default"><i class="fa fa-stop"></i> Arrêter</button><button id="dql-export" class="btn btn-default"><i class="fa fa-download"></i> Export CSV</button></div></div><div id="dql-status" class="dql-status"></div><div class="dql-flow">${step('overview',1,'Vue d’ensemble','Stock actif')}${step('anomalies',2,'Anomalies','Prêts figés')}${step('explore',3,'Exploration','Motifs rares')}${step('batch',4,'Traitements par lot','Litiges supervisés')}${step('rules',5,'Règles','Seuils & apprentissage')}${step('memory',6,'Mémoire Firebase','RGPD strict')}</div><div class="dql-stats"><div class="dql-stat"><span>Prêts actifs</span><strong id="st-total">—</strong></div><div class="dql-stat"><span>Critiques</span><strong id="st-critical">—</strong></div><div class="dql-stat"><span>À vérifier</span><strong id="st-review">—</strong></div><div class="dql-stat"><span>Analyse approfondie</span><strong id="st-deep">0</strong></div><div class="dql-stat"><span>Sélection</span><strong id="st-selected">0</strong></div></div><div class="dql-toolbar"><div class="dql-search"><input id="dql-search" type="search" placeholder="ID prêt, exemplaire, notice, titre, bibliothèque…"></div><select id="dql-severity"><option value="">Toutes classes</option><option value="critical">Critiques</option><option value="review">À vérifier</option><option value="atypical">Atypiques</option><option value="ok">Sans alerte</option></select><select id="dql-library"><option value="">Toutes bibliothèques de prêt</option></select><select id="dql-age"><option value="0">Tout âge</option><option value="180">≥ 180 j</option><option value="365">≥ 1 an</option><option value="730">≥ 2 ans</option><option value="1095">≥ 3 ans</option><option value="1825">≥ 5 ans</option></select></div><div id="dql-content"></div>`;bindGlobal();updateStats();renderCurrent()}
function bindGlobal(){root.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;state.page=1;renderShell()}));$('dql-refresh')?.addEventListener('click',()=>loadRows(true));$('dql-stop')?.addEventListener('click',()=>{state.stop=true;setStatus('Arrêt demandé après la requête en cours.','ok')});$('dql-export')?.addEventListener('click',exportCsv);$('dql-search')?.addEventListener('input',e=>{state.search=e.target.value.trim().toLowerCase();state.page=1;renderCurrent()});$('dql-severity')?.addEventListener('change',e=>{state.severity=e.target.value;state.page=1;renderCurrent()});$('dql-library')?.addEventListener('change',e=>{state.library=e.target.value;state.page=1;renderCurrent()});$('dql-age')?.addEventListener('change',e=>{state.minAge=Number(e.target.value)||0;state.page=1;renderCurrent()})}
function setStatus(msg,kind='loading'){const e=$('dql-status');if(!e)return;e.className=`dql-status visible ${kind}`;e.innerHTML=msg}
function updateStats(){if(!$('st-total'))return;let c=0,r=0;for(const x of state.rows){const q=evaluate(x);if(q.severity==='critical')c++;else if(q.severity==='review')r++}$('st-total').textContent=fmt(state.rows.length);$('st-critical').textContent=fmt(c);$('st-review').textContent=fmt(r);$('st-deep').textContent=fmt(state.deep.size);$('st-selected').textContent=fmt(state.selected.size)}
function normalize(x){return {...x,title:x.item?.biblio?.title||'',barcode:x.item?.external_id||x.external_id||'',home_library_id:x.item?.home_library_id||'',holding_library_id:x.item?.holding_library_id||'',item_lost:Number(x.item?.lost_status)||0,item_withdrawn:Number(x.item?.withdrawn)||0,item_not_for_loan:Number(x.item?.not_for_loan_status)||0}}
async function loadRows(force=false){if(state.loading)return;state.loading=true;state.stop=false;state.rows=[];state.deep.clear();state.selected.clear();state.page=1;setStatus('Lecture sérialisée des prêts actifs via l’API Koha…','loading');try{let page=1;while(!state.stop){const u=new URL(`${CFG.API}/checkouts`,location.origin);u.searchParams.set('_page',page);u.searchParams.set('_per_page',CFG.API_PAGE);u.searchParams.set('_order_by','checkout_date');const r=await kfetch(u,{headers:{Accept:'application/json','x-koha-embed':'item,item.biblio,library'}});if(!r.ok)throw new Error(`API checkouts HTTP ${r.status}`);const arr=await r.json();if(!Array.isArray(arr))throw new Error('Réponse checkouts inattendue.');state.rows.push(...arr.map(normalize));setStatus(`${fmt(state.rows.length)} prêts actifs reçus…`,'loading');if(arr.length<CFG.API_PAGE)break;page++;if(page>10000)throw new Error('Pagination anormale interrompue.')}populateLibraries();setStatus(`${fmt(state.rows.length)} prêts actifs chargés${state.stop?' avant l’arrêt demandé':''}. L’analyse approfondie n’est lancée que sur demande.`,'ok')}catch(e){setStatus(`Chargement : ${esc(e.message)}`,'error')}finally{state.loading=false;updateStats();renderCurrent()}}
function populateLibraries(){const sel=$('dql-library');if(!sel)return;const cur=state.library,vals=[...new Set(state.rows.map(x=>x.library_id).filter(Boolean))].sort();sel.innerHTML='<option value="">Toutes bibliothèques de prêt</option>'+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');sel.value=cur}
function filtered(){return state.rows.filter(x=>{const q=evaluate(x);if(state.severity&&q.severity!==state.severity)return false;if(state.library&&x.library_id!==state.library)return false;if(state.minAge&&(daysSince(x.checkout_date)||0)<state.minAge)return false;if(state.search){const hay=[x.checkout_id,x.item_id,x.patron_id,x.title,x.barcode,x.library_id].join(' ').toLowerCase();if(!hay.includes(state.search))return false}return true})}
function paginate(rows){const pages=Math.max(1,Math.ceil(rows.length/CFG.ROWS));state.page=Math.min(Math.max(1,state.page),pages);const start=(state.page-1)*CFG.ROWS;return {items:rows.slice(start,start+CFG.ROWS),page:state.page,pages,total:rows.length}}
function renderCurrent(){if(!state.rows.length&&!state.loading&&!['rules','memory'].includes(state.tab)){$('dql-content').innerHTML='<div class="dql-empty">Aucun prêt chargé.</div>';return}if(state.tab==='overview')renderOverview();else if(state.tab==='anomalies')renderAnomalies();else if(state.tab==='explore')renderExplore();else if(state.tab==='batch')renderBatch();else if(state.tab==='rules')renderRules();else renderMemory();updateStats()}
function renderOverview(){const total=state.rows.length,old=state.rows.filter(x=>(daysSince(x.checkout_date)||0)>=state.settings.oldDays).length,very=state.rows.filter(x=>(daysSince(x.checkout_date)||0)>=state.settings.veryOldDays).length,over=state.rows.filter(x=>(daysOverdue(x.due_date)||0)>=state.settings.overdueDays).length;$('dql-content').innerHTML=`<div class="dql-head"><div><h3>1 · Vue d’ensemble</h3><p>L’ancienneté est un signal, pas une preuve d’anomalie.</p></div><div class="dql-actions"><button id="dql-deep-priority" class="btn btn-primary">Analyser les prêts prioritaires</button></div></div><div class="dql-quality"><div class="dql-card"><strong>≥ ${state.settings.oldDays} jours</strong><span class="value">${fmt(old)}</span><small>Prêts anciens</small></div><div class="dql-card"><strong>≥ ${state.settings.veryOldDays} jours</strong><span class="value">${fmt(very)}</span><small>Très anciens</small></div><div class="dql-card"><strong>Retard ≥ ${state.settings.overdueDays} j</strong><span class="value">${fmt(over)}</span><small>Échéances très dépassées</small></div><div class="dql-card"><strong>Approfondis</strong><span class="value">${fmt(state.deep.size)}</span><small>Exemplaire, litige, transfert, lecteur</small></div></div><div class="dql-info"><strong>Principe de sécurité :</strong> ce module ne fait jamais de retour automatique. Un prêt très ancien reste un prêt tant qu’un professionnel n’a pas établi la situation physique du document.</div>`;$('dql-deep-priority').addEventListener('click',()=>deepAnalyze(state.rows.filter(x=>(daysSince(x.checkout_date)||0)>=state.settings.oldDays).slice(0,CFG.DEEP_LIMIT)))}
function renderAnomalies(){const rows=filtered(),p=paginate(rows);$('dql-content').innerHTML=`<div class="dql-head"><div><h3>2 · Anomalies et prêts figés</h3><p>${fmt(rows.length)} résultat(s) avec les filtres actuels.</p></div><div class="dql-actions"><button id="dql-deep-filtered" class="btn btn-default">Analyse approfondie des résultats</button></div></div>${table(p.items)}${pager(p)}`;bindTable();$('dql-deep-filtered').addEventListener('click',()=>deepAnalyze(rows.slice(0,CFG.DEEP_LIMIT)))}
function table(rows){if(!rows.length)return'<div class="dql-empty">Aucun résultat.</div>';return `<div class="dql-table-wrap"><table class="table table-striped dql-table"><thead><tr><th></th><th>Prêt</th><th>Document</th><th>Prêté le</th><th>Échéance</th><th>Activité</th><th>Diagnostic</th><th>Contrôle</th></tr></thead><tbody>${rows.map(rowHtml).join('')}</tbody></table></div>`}
function fbButtons(id,rule){return `<span class="dql-feedback"><button class="btn btn-default btn-xs dql-fb" data-id="${id}" data-rule="${rule}" data-d="anomaly">Anomalie</button><button class="btn btn-default btn-xs dql-fb" data-id="${id}" data-rule="${rule}" data-d="normal">Normal</button><button class="btn btn-default btn-xs dql-fb" data-id="${id}" data-rule="${rule}" data-d="watch">Surveiller</button></span>`}
function rowHtml(x){const q=evaluate(x),d=state.deep.get(String(x.checkout_id));return `<tr class="${state.selected.has(String(x.checkout_id))?'selected':''}"><td><input class="dql-checkbox dql-select" type="checkbox" data-id="${x.checkout_id}" ${state.selected.has(String(x.checkout_id))?'checked':''}></td><td><strong>#${x.checkout_id}</strong><br><small>${esc(x.library_id||'—')}</small></td><td><strong>${esc(x.title||'(titre indisponible)')}</strong><br><small>item #${x.item_id}${x.barcode?` · ${esc(x.barcode)}`:''}</small></td><td>${dateCell(x.checkout_date)}<br><small>${fmt(daysSince(x.checkout_date)||0)} j</small></td><td>${dateCell(x.due_date)}<br><small>${(daysOverdue(x.due_date)||0)>0?`${fmt(daysOverdue(x.due_date))} j de retard`:'non dépassée'}</small></td><td>${dateCell(activityDate(x))}<br><small>${fmt(activityDays(x))} j</small></td><td>${severityBadge(q.severity)}<br>${q.hits.map(h=>`<span class="dql-rulehit"><span class="dql-badge ${h.severity}">${h.id}</span> ${esc(h.title)}${fbButtons(x.checkout_id,h.id)}</span>`).join('')||'<span class="dql-note">aucune règle</span>'}${d?`<br><small>litige ${d.claim_open?'ouvert':'—'} · transfert ${d.has_transfer?'oui':'non'} · lecteur expiré ${d.patron_expired?'oui':'non'}</small>`:'<br><small>analyse approfondie non faite</small>'}<div class="dql-note">Appréciation globale indépendante</div>${fbButtons(x.checkout_id,'DOSSIER')}</td><td><div class="dql-actions"><a class="btn btn-default btn-xs" target="_blank" href="/cgi-bin/koha/members/moremember.pl?borrowernumber=${x.patron_id}">Lecteur</a><a class="btn btn-default btn-xs" target="_blank" href="/cgi-bin/koha/catalogue/moredetail.pl?itemnumber=${x.item_id}&biblionumber=${x.item?.biblio_id||''}">Exemplaire</a></div></td></tr>`}
function dateCell(v){if(!v)return'—';const d=new Date(v);return Number.isFinite(d.getTime())?d.toLocaleDateString('fr-FR'):'—'}
function pager(p){return `<div class="dql-pagination"><button id="dql-prev" class="btn btn-default btn-xs" ${p.page<=1?'disabled':''}>Précédent</button><span>Page ${p.page}/${p.pages} · ${fmt(p.total)} résultat(s)</span><button id="dql-next" class="btn btn-default btn-xs" ${p.page>=p.pages?'disabled':''}>Suivant</button></div>`}
function bindTable(){root.querySelectorAll('.dql-select').forEach(c=>c.addEventListener('change',e=>{const id=e.target.dataset.id;e.target.checked?state.selected.add(id):state.selected.delete(id);updateStats()}));root.querySelectorAll('.dql-fb').forEach(b=>b.addEventListener('click',()=>sendFeedback(b.dataset.id,b.dataset.rule,b.dataset.d)));$('dql-prev')?.addEventListener('click',()=>{state.page--;renderCurrent()});$('dql-next')?.addEventListener('click',()=>{state.page++;renderCurrent()})}

async function deepAnalyze(rows){if(state.deepRunning)return;rows=rows.filter(x=>!state.deep.has(String(x.checkout_id))).slice(0,CFG.DEEP_LIMIT);if(!rows.length)return setStatus('Tous ces prêts ont déjà été analysés en profondeur.','ok');state.deepRunning=true;state.deepDone=0;setStatus(`Analyse approfondie de ${fmt(rows.length)} prêt(s), strictement séquentielle…`,'loading');try{for(const x of rows){const d=await loadDeep(x);state.deep.set(String(x.checkout_id),d);state.deepDone++;setStatus(`Analyse approfondie ${state.deepDone}/${rows.length}…`,'loading');if(state.stop)break}setStatus(`${fmt(state.deepDone)} prêt(s) analysés en profondeur.`,'ok')}catch(e){setStatus(`Analyse approfondie : ${esc(e.message)}`,'error')}finally{state.deepRunning=false;updateStats();renderCurrent()}}
async function loadDeep(x){const out={item_lost:!!x.item_lost,item_withdrawn:!!x.item_withdrawn,item_not_for_loan:!!x.item_not_for_loan,claim_open:false,claim_age:0,last_seen_after_claim:false,has_transfer:false,has_hold:false,patron_expired:false};try{const biblioId=x.item?.biblio_id||x.item?.biblio?.biblio_id;if(biblioId){const u=new URL(`${CFG.API}/biblios/${biblioId}/items`,location.origin);u.searchParams.set('_per_page','10');u.searchParams.set('q',JSON.stringify({item_id:Number(x.item_id)}));const r=await kfetch(u,{headers:{Accept:'application/json','x-koha-embed':'return_claims,transfer,first_hold'}});if(r.ok){const items=await r.json();const item=Array.isArray(items)?items.find(i=>String(i.item_id)===String(x.item_id)):null;if(item){out.item_lost=!!Number(item.lost_status);out.item_withdrawn=!!Number(item.withdrawn);out.item_not_for_loan=!!Number(item.not_for_loan_status);out.has_transfer=!!item.transfer;out.has_hold=!!item.first_hold;const claims=Array.isArray(item.return_claims)?item.return_claims:[];const open=claims.filter(c=>!c.resolution&&!c.resolved_on).sort((a,b)=>Date.parse(a.created_on)-Date.parse(b.created_on))[0];if(open){out.claim_open=true;out.claim_id=open.claim_id;out.claim_age=daysSince(open.created_on)||0;out.claim_created_on=open.created_on;const seen=Date.parse(item.last_seen_date||0),created=Date.parse(open.created_on||0);out.last_seen_after_claim=Number.isFinite(seen)&&Number.isFinite(created)&&seen>created}}}}}catch(_){}
try{const r=await kfetch(`${CFG.API}/patrons/${x.patron_id}`,{headers:{Accept:'application/json'}});if(r.ok){const p=await r.json();out.patron_expired=!!(p.expiry_date&&Date.parse(p.expiry_date)<Date.now())}}catch(_){}return out}

function fingerprint(x){const d=state.deep.get(String(x.checkout_id));return {age_bucket:ageBucket(daysSince(x.checkout_date)),overdue_bucket:ageBucket(Math.max(0,daysOverdue(x.due_date)||0)),last_activity_bucket:ageBucket(activityDays(x)),renewals_bucket:countBucket(x.renewals_count),unseen_renewals_bucket:countBucket(x.unseen_renewals),has_return_claim:!!d?.claim_open,claim_age_bucket:d?.claim_open?ageBucket(d.claim_age):'none',patron_expired:!!d?.patron_expired,item_lost:!!d?.item_lost,item_withdrawn:!!d?.item_withdrawn,item_not_for_loan:!!d?.item_not_for_loan,has_transfer:!!d?.has_transfer,has_hold:!!d?.has_hold}}
function renderExplore(){const map=new Map();for(const x of filtered()){const fp=fingerprint(x),k=JSON.stringify(fp),g=map.get(k)||{fp,count:0,ids:[]};g.count++;if(g.ids.length<5)g.ids.push(x.checkout_id);map.set(k,g)}const groups=[...map.values()].sort((a,b)=>a.count-b.count);$('dql-content').innerHTML=`<div class="dql-head"><div><h3>3 · Exploration des situations</h3><p>Les combinaisons rares sont affichées en premier. Elles ne sont pas automatiquement considérées comme des anomalies.</p></div><div class="dql-actions"><button id="dql-share-patterns" class="btn btn-default">Partager les 25 motifs principaux</button></div></div><div class="dql-card">${groups.slice(0,100).map((g,i)=>`<div class="dql-fingerprint"><div><strong>${fmt(g.count)} prêt(s)</strong><br><span class="dql-note">${esc(Object.entries(g.fp).map(([k,v])=>`${k}=${v}`).join(' · '))}</span></div><div><button class="btn btn-default btn-xs dql-use-pattern" data-i="${i}">Voir les cas</button></div></div>`).join('')||'<div class="dql-empty">Aucun motif.</div>'}</div>`;root.querySelectorAll('.dql-use-pattern').forEach(b=>b.addEventListener('click',()=>{const g=groups[Number(b.dataset.i)];state.search=String(g.ids[0]||'');state.tab='anomalies';renderShell()}));$('dql-share-patterns').addEventListener('click',()=>sharePatterns(groups.slice(0,25)))}
async function sharePatterns(groups){const mem=window.KohaQualityMemory;if(!mem)return setStatus('Mémoire Firebase non chargée.','error');const st=await mem.connect(CFG.MODULE);if(!st.approved)return setStatus(`Poste Firebase à approuver : ${esc(st.uid||'—')}`,'error');let n=0;for(const g of groups){await mem.observePattern({module:CFG.MODULE,count:g.count,context:g.fp});n++}setStatus(`${n} motifs abstraits partagés. Aucune donnée de prêt/lecteur/document n’a quitté Koha.`,'ok')}

function renderBatch(){const selected=[...state.selected].map(id=>state.rows.find(x=>String(x.checkout_id)===id)).filter(Boolean),claims=selected.filter(x=>state.deep.get(String(x.checkout_id))?.claim_open);$('dql-content').innerHTML=`<div class="dql-head"><div><h3>4 · Traitements par lot</h3><p>Le module n’effectue aucun retour automatique. Les seules écritures proposées ici concernent les réclamations de retour explicitement sélectionnées.</p></div><div class="dql-actions"><button id="dql-select-filtered" class="btn btn-default">Sélectionner les résultats filtrés</button><button id="dql-clear-selected" class="btn btn-default">Désélectionner</button></div></div><div class="dql-selection"><div><strong>${fmt(selected.length)}</strong> prêt(s) sélectionné(s) · <strong>${fmt(claims.length)}</strong> litige(s) ouverts analysés</div><div><button id="dql-unlock" class="btn ${state.writeUnlocked?'btn-warning':'btn-default'}">${state.writeUnlocked?'Écritures déverrouillées':'Déverrouiller les écritures'}</button></div></div><div class="dql-warning"><strong>Jamais de retour fictif :</strong> résoudre une réclamation ne signifie pas retourner le document. Le prêt reste actif tant qu’un vrai retour n’est pas effectué dans Koha.</div><div class="dql-card"><h4>Résoudre des réclamations de retour</h4><p>Analyse d’abord les prêts en profondeur, sélectionne uniquement les dossiers réellement tranchés, puis choisis le motif Koha. Le professionnel connecté est détecté si possible ; sinon renseigne son borrowernumber uniquement localement.</p><div class="dql-actions"><select id="dql-resolution" class="dql-input"><option value="">Choisir un motif RETURN_CLAIM_RESOLUTION</option>${state.resolutions.map(r=>`<option value="${esc(r.value)}">${esc(r.value)} · ${esc(r.description||'')}</option>`).join('')}</select><input id="dql-staff-id" class="dql-input" type="number" min="1" placeholder="Borrowernumber agent (local)"><button id="dql-load-resolutions" class="btn btn-default">Charger les motifs</button><button id="dql-sim-claims" class="btn btn-primary" ${!claims.length?'disabled':''}>Simuler la résolution</button></div></div><div id="dql-simulation">${renderSimulation()}</div>`;$('dql-select-filtered').addEventListener('click',()=>{filtered().forEach(x=>state.selected.add(String(x.checkout_id)));updateStats();renderBatch()});$('dql-clear-selected').addEventListener('click',()=>{state.selected.clear();state.simulation=null;updateStats();renderBatch()});$('dql-unlock').addEventListener('click',()=>{state.writeUnlocked=!state.writeUnlocked;state.simulation=null;renderBatch()});$('dql-load-resolutions').addEventListener('click',loadResolutions);$('dql-sim-claims')?.addEventListener('click',simulateClaims);$('dql-apply-claims')?.addEventListener('click',applyClaims)}
async function loadResolutions(){try{const r=await kfetch(`${CFG.API}/authorised_value_categories/RETURN_CLAIM_RESOLUTION/authorised_values?_per_page=100`,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`HTTP ${r.status}`);state.resolutions=await r.json();renderBatch();setStatus(`${state.resolutions.length} motif(s) de résolution chargé(s).`,'ok')}catch(e){setStatus(`Motifs de résolution : ${esc(e.message)}`,'error')}}
async function simulateClaims(){const code=$('dql-resolution').value,staff=Number($('dql-staff-id').value)||0;if(!code)return setStatus('Choisis un motif de résolution.','error');if(!staff)return setStatus('Renseigne le borrowernumber de l’agent pour cette opération. Il reste uniquement dans le navigateur.','error');const chosen=[...state.selected].map(id=>state.rows.find(x=>String(x.checkout_id)===id)).filter(Boolean);const eligible=[],changed=[];setStatus('Simulation : relecture des exemplaires et des litiges…','loading');for(const x of chosen){const fresh=await loadDeep(x);state.deep.set(String(x.checkout_id),fresh);if(fresh.claim_open&&fresh.claim_id)eligible.push({checkout_id:x.checkout_id,claim_id:fresh.claim_id,item_id:x.item_id});else changed.push(x.checkout_id)}state.simulation={kind:'claims',code,staff,eligible,changed,at:Date.now()};renderBatch();setStatus(`Simulation terminée : ${eligible.length} litige(s) encore éligible(s), ${changed.length} écarté(s).`,'ok')}
function renderSimulation(){const s=state.simulation;if(!s)return'';return `<div class="dql-sim"><h4>Simulation</h4><div class="dql-sim-grid"><div class="dql-sim-cell"><span>Éligibles</span><strong>${fmt(s.eligible.length)}</strong></div><div class="dql-sim-cell"><span>Changements détectés</span><strong>${fmt(s.changed.length)}</strong></div><div class="dql-sim-cell"><span>Motif</span><strong style="font-size:15px">${esc(s.code)}</strong></div><div class="dql-sim-cell"><span>Écritures</span><strong>${state.writeUnlocked?'OUVERTES':'VERROUILLÉES'}</strong></div></div><div class="dql-actions" style="margin-top:10px"><button id="dql-apply-claims" class="btn btn-danger" ${!state.writeUnlocked||!s.eligible.length?'disabled':''}>Résoudre ${fmt(s.eligible.length)} litige(s)</button></div></div>`}
async function applyClaims(){const s=state.simulation;if(!s||!state.writeUnlocked)return;if(!confirm(`Résoudre ${s.eligible.length} réclamation(s) avec le motif ${s.code} ?\n\nAucun retour de document ne sera effectué.`))return;let ok=0,skip=0,fail=0;for(const e of s.eligible){try{const x=state.rows.find(r=>String(r.checkout_id)===String(e.checkout_id));if(!x){skip++;continue}const fresh=await loadDeep(x);if(!fresh.claim_open||String(fresh.claim_id)!==String(e.claim_id)){skip++;continue}const r=await kfetch(`${CFG.API}/return_claims/${e.claim_id}/resolve`,{method:'PUT',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({resolution:s.code,resolved_by:String(s.staff)})});if(!r.ok)throw new Error(`HTTP ${r.status}`);const verify=await loadDeep(x);state.deep.set(String(x.checkout_id),verify);if(!verify.claim_open)ok++;else fail++}catch(_){fail++}setStatus(`Résolution : ${ok} OK · ${skip} ignoré(s) · ${fail} échec(s)…`,'loading')}state.simulation=null;state.writeUnlocked=false;setStatus(`Traitement terminé : ${ok} résolu(s), ${skip} ignoré(s), ${fail} échec(s).` ,fail?'error':'ok');renderBatch()}

function ruleHelp(r){return `<strong>Détecte :</strong> ${esc(r.title)}. <strong>Ce que cela ne prouve pas :</strong> ce signal seul ne démontre ni une erreur ni l’action à effectuer. <strong>Contrôle attendu :</strong> contrôler le prêt, l’exemplaire, le litige éventuel et la situation du lecteur sans enregistrer de retour supposé.${r.deep?' Cette règle ne s’active qu’après l’analyse approfondie.':''}`}
function renderRules(){const s=state.settings;$('dql-content').innerHTML=`<div class="dql-head"><div><h3>5 · Règles et source</h3><p><strong>Source :</strong> API REST Koha des prêts actifs, chargée uniquement sur demande. Les règles apprennent par feedback, mais aucune règle candidate ne devient automatiquement une écriture.</p></div><div class="dql-actions"><button id="dql-save-settings" class="btn btn-primary">Enregistrer localement</button><button id="dql-publish-settings" class="btn btn-default">Publier Firebase</button><button id="dql-learning" class="btn btn-default">Charger l’apprentissage</button></div></div><div class="dql-card"><table class="dql-settings"><tbody>${setting('oldDays','Prêt ancien',s.oldDays)}${setting('veryOldDays','Prêt très ancien',s.veryOldDays)}${setting('overdueDays','Retard important',s.overdueDays)}${setting('criticalOverdueDays','Retard critique',s.criticalOverdueDays)}${setting('idleDays','Sans activité',s.idleDays)}${setting('claimDays','Litige ancien',s.claimDays)}${setting('claimCriticalDays','Litige critique',s.claimCriticalDays)}${setting('unseenRenewals','Renouvellements sans présentation',s.unseenRenewals)}</tbody></table></div><div class="dql-card" style="margin-top:12px"><h4>Règles système</h4><table class="dql-settings"><thead><tr><th>ID</th><th>Règle</th><th>Classe</th><th>Explication</th></tr></thead><tbody>${RULES.map(r=>`<tr><td><code>${r.id}</code></td><td>${esc(r.title)}${r.deep?' <span class="dql-note">(approfondie)</span>':''}</td><td>${severityBadge(r.severity)}</td><td class="dql-note">${ruleHelp(r)}</td></tr>`).join('')}</tbody></table></div><div id="dql-learn-box" style="margin-top:12px">${learningHtml()}</div>`;$('dql-save-settings').addEventListener('click',saveSettings);$('dql-publish-settings').addEventListener('click',publishSettings);$('dql-learning').addEventListener('click',loadLearning)}
function setting(k,l,v){return `<tr><td>${esc(l)} (jours${k==='unseenRenewals'?' / nombre':''})</td><td><input class="dql-rule-setting dql-input" type="number" min="1" max="5000" data-key="${k}" value="${Number(v)||0}"></td></tr>`}
function saveSettings(){root.querySelectorAll('.dql-rule-setting').forEach(i=>state.settings[i.dataset.key]=Math.max(1,Number(i.value)||1));try{localStorage.setItem(CFG.SETTINGS_KEY,JSON.stringify(state.settings))}catch(_){}setStatus('Seuils enregistrés localement.','ok');updateStats();renderRules()}
async function publishSettings(){saveSettings();const mem=window.KohaQualityMemory;if(!mem)return setStatus('Mémoire Firebase absente.','error');const st=await mem.connect(CFG.MODULE);if(!st.approved)return setStatus(`Poste à approuver : ${esc(st.uid||'—')}`,'error');if(st.role!=='admin')return setStatus('Rôle admin requis pour publier les seuils.','error');await mem.saveSettings(CFG.MODULE,state.settings);setStatus('Seuils partagés.','ok')}
function learningHtml(){if(!state.remoteFeedback.length)return'<div class="dql-info">Aucun feedback chargé.</div>';const g=new Map();for(const f of state.remoteFeedback){const id=f.rule_id||'PATTERN',x=g.get(id)||{id,total:0,a:0,n:0,w:0};x.total+=Number(f.total)||0;x.a+=Number(f.count_anomaly)||0;x.n+=Number(f.count_normal)||0;x.w+=Number(f.count_watch)||0;g.set(id,x)}return `<div class="dql-card"><h4>Retours agrégés</h4><table class="dql-settings"><thead><tr><th>Règle</th><th>Total</th><th>Anomalie</th><th>Normal</th><th>Surveiller</th></tr></thead><tbody>${[...g.values()].sort((a,b)=>b.total-a.total).map(x=>`<tr><td><code>${esc(x.id)}</code></td><td>${fmt(x.total)}</td><td>${fmt(x.a)}</td><td>${fmt(x.n)}</td><td>${fmt(x.w)}</td></tr>`).join('')}</tbody></table></div>`}
async function loadLearning(){const mem=window.KohaQualityMemory;if(!mem)return;const st=await mem.connect(CFG.MODULE);if(!st.approved)return setStatus(`Poste à approuver : ${esc(st.uid||'—')}`,'error');state.remoteFeedback=await mem.aggregateFeedback(CFG.MODULE);renderRules();setStatus(`${state.remoteFeedback.length} motif(s) chargé(s).`,'ok')}

async function loadMemory(){if(window.KohaQualityMemory){initMemory();return}try{await new Promise((res,rej)=>{const s=document.createElement('script');s.src=CFG.MEMORY_SCRIPT;s.async=true;s.onload=res;s.onerror=rej;document.head.appendChild(s)});initMemory()}catch(_){state.memoryStatus={status:'missing'}}}
async function initMemory(){try{const mem=window.KohaQualityMemory;mem.onStatus(s=>{state.memoryStatus=s;if(state.tab==='memory')renderMemory()});const st=await mem.connect(CFG.MODULE);state.memoryStatus=st;if(st.approved){const r=await mem.getSettings(CFG.MODULE);if(r&&Object.keys(r).length){state.settings={...state.settings,...r};updateStats()}}}catch(_){}}
function renderMemory(){const mem=window.KohaQualityMemory,st=mem?.getStatus?.()||state.memoryStatus||{};$('dql-content').innerHTML=`<div class="dql-head"><div><h3>6 · Mémoire Firebase</h3><p>La mémoire ne reçoit que des règles et dimensions abstraites. Les données opérationnelles affichées dans ce module restent dans Koha et dans le navigateur courant.</p></div></div><div class="dql-quality"><div class="dql-card"><strong>État</strong><span class="value">${esc(st.status||'absent')}</span><small>client ${esc(st.version||'—')}</small></div><div class="dql-card"><strong>Autorisé</strong><span class="value">${st.approved?'OUI':'NON'}</span><small>${esc(st.role||'—')}</small></div><div class="dql-card"><strong>Protection</strong><span class="value">STRICTE</span><small>pare-feu de champs + règles Firestore</small></div><div class="dql-card"><strong>UID poste</strong><span class="value" style="font-size:13px">${esc(st.uid||'—')}</span><small>clé technique d’autorisation uniquement</small></div></div><div class="dql-info">Sont explicitement exclus de Firebase : patron/borrower IDs, noms, emails, téléphones, cartes, codes-barres, titres, auteurs, notes, biblio/item/hold/checkout/claim/transfer IDs.</div>`}
function feedbackContext(x,ruleId){const q=evaluate(x),d=state.deep.get(String(x.checkout_id)),hit=q.hits.find(h=>h.id===ruleId);return {primary_rule:ruleId||'DOSSIER',severity:hit?.severity||q.severity,nature:ruleId==='DOSSIER'?'case':'operational',certainty:ruleId==='DOSSIER'?'global_judgement':'context_dependent',priority:q.severity,age_bucket:ageBucket(daysSince(x.checkout_date)),overdue_bucket:ageBucket(Math.max(0,daysOverdue(x.due_date)||0)),last_activity_bucket:ageBucket(activityDays(x)),renewals_bucket:countBucket(x.renewals_count),unseen_renewals_bucket:countBucket(x.unseen_renewals),has_return_claim:!!d?.claim_open,claim_age_bucket:d?.claim_open?ageBucket(d.claim_age):'none',patron_expired:!!d?.patron_expired,item_lost:!!d?.item_lost,item_withdrawn:!!d?.item_withdrawn,item_not_for_loan:!!d?.item_not_for_loan,has_transfer:!!d?.has_transfer,has_hold:!!d?.has_hold}}
async function sendFeedback(id,ruleId,decision){const x=state.rows.find(r=>String(r.checkout_id)===String(id)),mem=window.KohaQualityMemory;if(!x||!mem)return setStatus('Mémoire Firebase indisponible.','error');try{const r=await mem.submitFeedback({module:CFG.MODULE,ruleId:ruleId||'DOSSIER',decision,context:feedbackContext(x,ruleId)});setStatus(r.queued?'Feedback abstrait mis en file locale.':`Feedback enregistré pour ${ruleId||'le dossier'}.`,'ok')}catch(e){setStatus(`Feedback bloqué : ${esc(e.message)}`,'error')}}
function exportCsv(){const rows=filtered(),headers=['checkout_id','patron_id','item_id','barcode','titre','library','checkout_date','due_date','age_days','overdue_days','last_activity','severity','rules','claim_open','claim_age','patron_expired','item_lost','item_withdrawn','has_transfer'];const out=[headers.join(';')];for(const x of rows){const q=evaluate(x),d=state.deep.get(String(x.checkout_id))||{};out.push([x.checkout_id,x.patron_id,x.item_id,x.barcode,x.title,x.library_id,x.checkout_date,x.due_date,daysSince(x.checkout_date),daysOverdue(x.due_date),activityDate(x),q.severity,q.hits.map(h=>h.id).join(','),!!d.claim_open,d.claim_age||'',!!d.patron_expired,!!d.item_lost,!!d.item_withdrawn,!!d.has_transfer].map(csv).join(';'))}const blob=new Blob(['\ufeff'+out.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`qualite-prets-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function csv(v){const s=String(v??'');return /[;"\r\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s}
})();
