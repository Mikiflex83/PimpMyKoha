function getKohaSerialQueue(){
    if(window.DracKohaSerialQueue)return window.DracKohaSerialQueue;
    let tail=Promise.resolve();
    let lastEnd=0;
    const MIN_GAP=250;
    const run=(task)=>{
        const job=tail.catch(()=>{}).then(async()=>{
            const wait=Math.max(0,MIN_GAP-(Date.now()-lastEnd));
            if(wait)await new Promise(r=>setTimeout(r,wait));
            try{return await task()}finally{lastEnd=Date.now()}
        });
        tail=job.catch(()=>{});
        return job;
    };
    const fetchSerial=(url,options)=>run(()=>fetch(url,options));
    window.DracKohaSerialQueue={run,fetch:fetchSerial,get pending(){return tail}};
    return window.DracKohaSerialQueue;
}
const KOHA_QUEUE=getKohaSerialQueue();

function createMergeWriteScheduler(){
  let limit=CFG.MERGE_WRITE_CONCURRENCY;
  let active=0;
  let lastStart=0;
  let cooldownUntil=0;
  let timer=null;
  let overloadCount=0;
  let lastOverloadStatus=null;
  const queue=[];
  const listeners=new Set();

  const snapshot=()=>({
    limit,active,queued:queue.length,cooldownUntil,overloadCount,lastOverloadStatus
  });
  const notify=()=>{
    const snap=snapshot();
    listeners.forEach(fn=>{try{fn(snap)}catch(_){}});
  };
  const schedulePump=(delay)=>{
    if(timer)return;
    timer=setTimeout(()=>{timer=null;pump()},Math.max(0,delay));
  };
  const pump=()=>{
    if(timer){clearTimeout(timer);timer=null}
    while(active<limit&&queue.length){
      const now=Date.now();
      const wait=Math.max(0,lastStart+CFG.MERGE_WRITE_MIN_START_GAP_MS-now,cooldownUntil-now);
      if(wait>0){schedulePump(wait);break}
      const item=queue.shift();
      active++;
      lastStart=Date.now();
      notify();
      Promise.resolve()
        .then(item.task)
        .then(item.resolve,item.reject)
        .finally(()=>{active--;notify();pump()});
    }
    notify();
  };
  return {
    run(task){
      return new Promise((resolve,reject)=>{queue.push({task,resolve,reject});notify();pump()});
    },
    setLimit(value){
      const next=Math.max(1,Math.min(CFG.MERGE_WRITE_CONCURRENCY_MAX,Number(value)||CFG.MERGE_WRITE_CONCURRENCY));
      limit=next;
      notify();
      pump();
      return limit;
    },
    reportOverload(status){
      overloadCount++;
      lastOverloadStatus=status;
      if(limit>1)limit--;
      cooldownUntil=Math.max(cooldownUntil,Date.now()+CFG.MERGE_OVERLOAD_BACKOFF_MS);
      notify();
      pump();
    },
    subscribe(fn){listeners.add(fn);return()=>listeners.delete(fn)},
    snapshot
  };
}
const MERGE_WRITES=createMergeWriteScheduler();

async function fetchReportKeyset(){

function normalizeRows(rows){return rows.map(row=>({authid:String(col(row,["AuthID","authid"])).trim(),type:String(col(row,["Type","authtypecode"])).trim(),heading:String(col(row,["Vedette","heading"])).trim(),created:String(col(row,["Créée le","Creee le","datecreated"])).trim(),modified:String(col(row,["Modifiée le","Modifiee le","modification_time"])).trim()})).filter(r=>r.authid)}
function col(row,names){for(const n of names)if(Object.prototype.hasOwnProperty.call(row,n))return row[n]??"";return ""}

function ensureProbableAnalysis(){if(state.probableBuilt)return;state.probableGroups=buildProbableGroups(state.authorities);state.probableBuilt=true;updateFlowState()}
function ensureAuthorityIndexes(){if(state.indexesBuilt)return;buildAuthorityIndexes();state.indexesBuilt=true}
function normalizeHeading(v){return String(v||"").toLocaleLowerCase("fr").normalize("NFKC").replace(/[^\p{L}\p{N}]+/gu," ").replace(/\s+/g," ").trim()}
function fold(v){return normalizeHeading(v).normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function looseHeading(v){return fold(v).replace(/\b(?:ca|circa|vers)\b/g," ").replace(/\b(?:1[0-9]{3}|20[0-9]{2})(?:\s*(?:-|–|—)\s*(?:1[0-9]{3}|20[0-9]{2})?)?\b/g," ").replace(/\s+/g," ").trim()}

// Détection des « doublons possibles » : priorité à la précision.
// On ne fabrique plus un gros groupe en supprimant aveuglément toutes les dates :
// les personnes homonymes portant des années contradictoires sont explicitement écartées.
const PROBABLE_PERSON_TYPES=new Set(["NP","PERS","SAUT","FAM"]);
const PROBABLE_PERSON_BUCKET_MAX=250;

function probablePersonBase(v){
  return fold(v)
    .replace(/\b(?:ca|circa|vers|fl|actif|active|ne|nee|mort|morte|decede|decedee)\b/g," ")
    .replace(/\b(?:1[0-9]{3}|20[0-9]{2})\b/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function probableYears(v){
  const m=String(v||"").match(/\b(?:1[0-9]{3}|20[0-9]{2})\b/g)||[];
  return [...new Set(m)].slice(0,2);
}
function probableDateCompatibility(a,b){
  const A=probableYears(a.heading),B=probableYears(b.heading);
  if(A.length&&B.length){
    if(A[0]!==B[0])return {ok:false,score:0,reason:"Années principales contradictoires"};
    if(A.length>1&&B.length>1&&A[1]!==B[1])return {ok:false,score:0,reason:"Années de fin contradictoires"};
    if(A.length>1&&B.length>1)return {ok:true,score:99,reason:"Même vedette et même datation"};
    return {ok:true,score:97,reason:"Même vedette et année principale identique"};
  }
  if(A.length||B.length)return {ok:true,score:92,reason:"Même vedette ; datation absente d’un côté"};
  return {ok:true,score:94,reason:"Même vedette ; variante de qualificatif de date"};
}
function probablePairKey(a,b){const x=String(a.authid),y=String(b.authid);return Number(x)<=Number(y)?`${x}\u0001${y}`:`${y}\u0001${x}`}
function probableGroupIdentityKey(group){return `${group?.type||""}\u0001${(group?.rows||[]).map(r=>String(r.authid)).sort((a,b)=>(Number(a)||0)-(Number(b)||0)||a.localeCompare(b)).join(",")}`}

function buildExactGroups(rows){const map=new Map();for(const row of rows){const n=normalizeHeading(row.heading);if(!n)continue;const key=`${row.type}\u0001${n}`;if(!map.has(key))map.set(key,{kind:"exact",type:row.type,normalized:n,rows:[]});map.get(key).rows.push(row)}const out=[...map.values()].filter(g=>g.rows.length>1).sort(groupSort);out.forEach((g,i)=>g.id=`e${i}`);return out}
function buildProbableGroups(rows){
  const out=[],seenPairs=new Set(),foldedBuckets=new Map(),personBuckets=new Map();

  // 1) Variantes très proches : même forme une fois les accents neutralisés.
  // Les différences de ponctuation sont déjà absorbées par normalizeHeading et relèvent donc des doublons exacts.
  for(const row of rows){
    const exact=fold(row.heading);
    if(!exact||exact.length<5)continue;
    const key=`${row.type}\u0001${exact}`;
    if(!foldedBuckets.has(key))foldedBuckets.set(key,[]);
    foldedBuckets.get(key).push(row);
  }
  for(const bucket of foldedBuckets.values()){
    if(bucket.length<2||new Set(bucket.map(r=>normalizeHeading(r.heading))).size<2)continue;
    const rowsUnique=[...new Map(bucket.map(r=>[String(r.authid),r])).values()];
    if(rowsUnique.length<2)continue;
    for(let i=0;i<rowsUnique.length;i++)for(let j=i+1;j<rowsUnique.length;j++)seenPairs.add(probablePairKey(rowsUnique[i],rowsUnique[j]));
    out.push({kind:"probable",type:rowsUnique[0].type,normalized:fold(rowsUnique[0].heading),rows:rowsUnique,confidenceScore:99,matchReason:"Même forme après neutralisation des accents"});
  }

  // 2) Noms de personnes : même base textuelle, mais seulement si les dates restent compatibles.
  // On crée volontairement des paires et non de gros clusters : cela évite qu’une autorité non datée
  // serve de pont entre plusieurs homonymes datés différents.
  for(const row of rows){
    if(!PROBABLE_PERSON_TYPES.has(row.type))continue;
    const base=probablePersonBase(row.heading);
    if(!base||base.length<5)continue;
    const key=`${row.type}\u0001${base}`;
    if(!personBuckets.has(key))personBuckets.set(key,[]);
    personBuckets.get(key).push(row);
  }
  for(const [key,bucket] of personBuckets){
    if(bucket.length<2||bucket.length>PROBABLE_PERSON_BUCKET_MAX)continue;
    const base=key.split("\u0001").slice(1).join("\u0001");
    for(let i=0;i<bucket.length;i++){
      for(let j=i+1;j<bucket.length;j++){
        const a=bucket[i],b=bucket[j],pairKey=probablePairKey(a,b);
        if(seenPairs.has(pairKey))continue;
        if(normalizeHeading(a.heading)===normalizeHeading(b.heading))continue;
        const compat=probableDateCompatibility(a,b);
        if(!compat.ok)continue;
        seenPairs.add(pairKey);
        out.push({kind:"probable",type:a.type,normalized:base,rows:[a,b],confidenceScore:compat.score,matchReason:compat.reason});
      }
    }
  }

  out.sort(groupSort);
  out.forEach((g,i)=>g.id=`p${i}`);
  return out;
}
function groupSort(a,b){return (Number(b.confidenceScore)||0)-(Number(a.confidenceScore)||0)||b.rows.length-a.rows.length||a.normalized.localeCompare(b.normalized,"fr")}

const PROBABLE_MARC_PREFILTER_SCORE=97;

function marcSubfieldValues(fields,tag,code){
  const out=[];

function normalizeIdentifier(v){return String(v||"").toUpperCase().normalize("NFKC").replace(/[^A-Z0-9]/g,"")}
function extractMarcIdentity(fields){
  const isni=new Set(marcSubfieldValues(fields,"010","a").map(normalizeIdentifier).filter(v=>v.length>=8));
  const ns035=new Map();
  for(const raw of marcSubfieldValues(fields,"035","a")){
    const m=String(raw).trim().match(/^\(([^)]+)\)\s*(.+)$/);if(!m)continue;

function setIntersection(a,b){const out=[];for(const x of a||[])if(b?.has(x))out.push(x);return out}
function compareMarcIdentity(aFields,bFields){
  const A=extractMarcIdentity(aFields),B=extractMarcIdentity(bFields);
  const commonIsni=setIntersection(A.isni,B.isni);
  if(A.isni.size&&B.isni.size){
    const same=A.isni.size===B.isni.size&&commonIsni.length===A.isni.size;
    if(!same)return {ok:false,strong:false,reason:"Identifiants 010 contradictoires ou multiples"};
  }
  let common035=[];
  for(const [ns,aIds] of A.ns035){
    const bIds=B.ns035.get(ns);if(!bIds)continue;

    const same=aIds.size===bIds.size&&common.length===aIds.size;
    if(!same)return {ok:false,strong:false,reason:`Identifiants 035 contradictoires ou multiples pour ${ns}`};
    common035.push(...common.map(id=>`${ns}:${id}`));
  }
  if(commonIsni.length)return {ok:true,strong:true,reason:"Même identifiant 010"};
  if(common035.length)return {ok:true,strong:true,reason:"Même identifiant 035 dans le même référentiel"};

    if(ids.strong)return {safe:true,reason:`${ids.reason} · ${dates.reason}`};

function autoPreanalysisWindow(a=state.autoSequence){return (a.preanalysisPool?.length||0)+(a.preparedQueue?.length||0)}
function autoHasPendingWork(a=state.autoSequence){return !!(a.preanalysisActive||a.queue?.length||a.preanalysisPool?.length||a.preparedQueue?.length)}
function fillAutomaticPreanalysisPool(){
 const a=state.autoSequence;if(!a.running||a.stopRequested||state.stopAllMerges)return;
 while(autoPreanalysisWindow(a)<CFG.SMART_PREANALYZE_GROUPS&&a.queue.length){
   const group=a.queue.shift();
   if(!group||state.autoExcluded.has(groupStableKey(group))){a.skipped++;continue}
   if(group.rows.length<2||group.rows.length-1>CFG.MERGE_BATCH_MAX){a.skipped++;continue}
   const ids=group.rows.map(r=>String(r.authid));
   a.preanalysisPool.push({group,ids,cursor:0,usages:{},startedAt:Date.now()});a.started++;
 }

function buildAutomaticUsageBatch(){
 const a=state.autoSequence,pool=a.preanalysisPool.filter(e=>e.cursor<e.ids.length);if(!pool.length)return null;
 const temp=new Map(pool.map(e=>[e,e.cursor]));const items=[];const max=CFG.SMART_USAGE_BATCH;
 const remaining=e=>e.ids.length-temp.get(e);
 const take=(e,count)=>{let c=temp.get(e),n=Math.min(count,e.ids.length-c,max-items.length);for(let k=0;k<n;k++)items.push({entry:e,id:e.ids[c+k]});temp.set(e,c+n)};
 const small=pool.filter(e=>remaining(e)<CFG.SMART_PREANALYZE_SMALL_RESERVE).sort((x,y)=>remaining(x)-remaining(y));
 let smallBudget=small.length?Math.min(CFG.SMART_PREANALYZE_SMALL_RESERVE,max):0;
 for(const e of small){if(items.length>=smallBudget)break;take(e,Math.min(remaining(e),smallBudget-items.length))}
 const large=pool.filter(e=>remaining(e)>=CFG.SMART_PREANALYZE_SMALL_RESERVE);
 if(large.length&&items.length<max){
   let cursor=a.preanalysisLargeCursor%large.length,visited=0;
   while(items.length<max&&visited<large.length){const e=large[(cursor+visited)%large.length];take(e,Math.min(CFG.SMART_PREANALYZE_SMALL_RESERVE,max-items.length));visited++}
   a.preanalysisLargeCursor=(cursor+Math.max(1,visited))%Math.max(1,large.length);
 }
 if(items.length<max){
   const leftovers=pool.filter(e=>remaining(e)>0).sort((x,y)=>remaining(x)-remaining(y));
   for(const e of leftovers){if(items.length>=max)break;take(e,max-items.length)}
 }
 return items.length?{items,temp}:null;
}

async function runSmartExactJob(job){
 job.status="running";job.phase=job.preanalyzed?"Pré-analyse déjà effectuée":"Analyse complète des usages";renderMergeOperationPanel();

     }
     const elapsed=performance.now()-started;job.avgMs=job.avgMs?job.avgMs*.85+elapsed*.15:elapsed;job.completedIds.push(duplicate);job.mergeDone++;job.done++;

     if(job.mergeDone%CFG.MERGE_LONG_BREAK_EVERY===0)pause+=CFG.MERGE_LONG_BREAK_MS;else if(job.mergeDone%CFG.MERGE_SHORT_BREAK_EVERY===0)pause+=CFG.MERGE_SHORT_BREAK_MS;
     if(pause>0&&i<usedRows.length-1){job.phase=`Pause de protection ${Math.ceil(pause/1000)} s`;renderMergeOperationPanel();await sleep(pause)}
   }
 }catch(e){fatalError=e;job.error=e;console.error(e)}finally{

   if(fatalError){job.status="error";job.phase=`Erreur : ${fatalError.message}`}

   job.completedIds.forEach(id=>state.mergeSession.deletedIds.add(String(id)));if(job.master)state.mergeSession.masterIds.add(String(job.master));state.mergeSession.totalDone+=job.mergeDone;state.mergeSession.groupCount++;
   if(job.status==="error")state.mergeSession.errorCount++;if(job.status==="stopped")state.mergeSession.stoppedCount++;
   state.mergeSession.history.push({id:job.id,groupId:job.groupId,master:job.master,heading:job.heading,total:job.total,done:job.done,status:job.status,phase:job.phase,avgMs:job.avgMs,error:job.error,mode:job.mode,analysisTotal:job.analysisTotal,analysisDone:job.analysisDone,deleteTotal:job.deleteTotal,deleteQueued:job.deleteQueued,mergeTotal:job.mergeTotal,mergeDone:job.mergeDone});
   if(state.mergeSession.history.length>5)state.mergeSession.history.shift();
   try{job._resolveCompletion?.({status:job.status,error:job.error,master:job.master,mergeDone:job.mergeDone,deleteQueued:job.deleteQueued})}catch(_){}
   job.authorityIds=null;job.rows=[];job.completedIds=[];job.preanalyzed=null;state.mergeJobs.delete(job.id);renderMergeOperationPanel();refreshMergeButtonStates();
   if(state.autoSequence.running&&!state.autoSequence.stopRequested&&!state.stopAllMerges)pumpAutomaticExactSequence();maybeFinalizeMergeSession();

}

function queueSmartDeletions(entries){
 let added=0;for(const e of entries){const id=String(e.id);if(state.deletePipeline.bufferIds.has(id)||state.mergeSession.deletedIds.has(id))continue;state.deletePipeline.bufferIds.add(id);state.deletePipeline.buffer.push({...e,id});added++}
 state.deletePipeline.totalQueued+=added;if(state.deletePipeline.buffer.length>=CFG.SMART_DELETE_BATCH)pumpSmartDeletionPipeline(false);renderMergeOperationPanel();return added;
}
function smartDeleteBusy(){return state.deletePipeline.active||state.deletePipeline.buffer.length>0}
function requestSmartDeleteFlush(){state.deletePipeline.flushRequested=true;pumpSmartDeletionPipeline(true)}

async function submitNativeAuthorityDeletion(ids){
 const csrf=await getCsrf();const body=new URLSearchParams();body.set("csrf_token",csrf);body.set("op","cud-delete");body.set("recordtype","authority");ids.forEach(id=>body.append("record_id",String(id)));
 const response=await KOHA_QUEUE.fetch(CFG.BATCH_DELETE,{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:body.toString()});
 if(!response.ok)throw new Error(`Suppression par lots : HTTP ${response.status}`);
 const doc=new DOMParser().parseFromString(await response.text(),"text/html");const err=doc.querySelector(".alert-warning,.alert-danger");if(err)throw new Error(cleanText(err.textContent));
 const link=doc.querySelector('a[href*="background_jobs.pl"][href*="id="]');if(!link)throw new Error("Koha n’a pas confirmé la mise en file de la suppression par lots.");

async function waitForBackgroundJob(jobId){
 const start=Date.now();while(Date.now()-start<CFG.SMART_DELETE_MAX_WAIT_MS){
   const r=await KOHA_QUEUE.fetch(`${CFG.JOB_API}/${encodeURIComponent(jobId)}`,{credentials:"same-origin",cache:"no-store",headers:{Accept:"application/json"}});
   if(!r.ok)throw new Error(`Suivi tâche #${jobId} : HTTP ${r.status}`);const data=await r.json();const status=String(data.status||"").toLowerCase();
   if(status==="finished")return data;if(status==="cancelled"||status==="failed")throw new Error(`Tâche de suppression #${jobId} : ${status}`);await sleep(CFG.SMART_DELETE_POLL_MS);
 }

async function pumpSmartDeletionPipeline(force=false){
 const p=state.deletePipeline;if(p.active)return;if(force)p.flushRequested=true;if(!p.buffer.length){p.flushRequested=false;renderMergeOperationPanel();maybeFinalizeMergeSession();return}
 if(p.buffer.length<CFG.SMART_DELETE_BATCH&&!p.flushRequested)return;
 const batch=p.buffer.splice(0,CFG.SMART_DELETE_BATCH);batch.forEach(e=>p.bufferIds.delete(String(e.id)));p.active=true;p.error=null;renderMergeOperationPanel();
 try{
   const ids=batch.map(e=>String(e.id));
   const fresh=await inspectAuthorityUsageMap(ids,null);const alreadyGone=ids.filter(id=>!Object.prototype.hasOwnProperty.call(fresh,id));alreadyGone.forEach(id=>state.mergeSession.deletedIds.add(id));
   const safe=ids.filter(id=>Object.prototype.hasOwnProperty.call(fresh,id)&&Number(fresh[id])===0);const changed=ids.filter(id=>Object.prototype.hasOwnProperty.call(fresh,id)&&Number(fresh[id])!==0);
   p.totalSkipped+=changed.length;state.mergeSession.deleteSkipped+=changed.length;
   if(safe.length){
     const jobId=await submitNativeAuthorityDeletion(safe);p.lastJobId=jobId;p.batches++;renderMergeOperationPanel();await waitForBackgroundJob(jobId);
     const after=await inspectAuthorityUsageMap(safe,null);const deleted=safe.filter(id=>!Object.prototype.hasOwnProperty.call(after,id));const remaining=safe.filter(id=>Object.prototype.hasOwnProperty.call(after,id));
     deleted.forEach(id=>state.mergeSession.deletedIds.add(id));p.totalDeleted+=deleted.length;state.mergeSession.totalDeleted+=deleted.length;
     p.totalFailed+=remaining.length;state.mergeSession.deleteFailed+=remaining.length;
   }
 }catch(e){p.error=e;console.error(e);p.totalFailed+=batch.length;state.mergeSession.deleteFailed+=batch.length}
 finally{p.active=false;renderMergeOperationPanel();if(p.buffer.length&&(p.flushRequested||p.buffer.length>=CFG.SMART_DELETE_BATCH))setTimeout(()=>pumpSmartDeletionPipeline(p.flushRequested),0);else if(!p.buffer.length){p.flushRequested=false;maybeFinalizeMergeSession()}}
}

function startMergeJob(group,master,selected,heading,options={}){

 if(conflict){if(!options.skipConfirm)alert(`Impossible de lancer ce groupe : l’autorité #${conflict.id} est déjà utilisée par une autre fusion active (${conflict.job.heading||conflict.job.groupId}).`);return null}

 };

async function runMergeJob(job){
 job.status="running";
 job.phase="Préparation";
 renderMergeOperationPanel();
 let prepared=null;
 let fatalError=null;
 let stopped=false;
 try{
   for(let i=0;i<job.selected.length;i++){
     if(job.stopRequested||state.stopAllMerges){stopped=true;break}
     const duplicate=job.selected[i];
     job.currentDuplicate=duplicate;
     if(!prepared||i%CFG.MERGE_PREPARE_EVERY===0){
       job.phase=`Préparation du maître #${job.master}`;
       renderMergeOperationPanel();
       prepared=await prepareFastMerge(job.master,duplicate);
     }
     job.phase=`Fusion #${duplicate} → #${job.master}`;
     renderMergeOperationPanel();
     const started=performance.now();
     try{
       await executePreparedMerge(job.master,duplicate,prepared);
     }catch(firstError){
       if(job.stopRequested||state.stopAllMerges)throw firstError;
       job.phase=`Nouvelle préparation après erreur sur #${duplicate}`;
       renderMergeOperationPanel();
       prepared=await prepareFastMerge(job.master,duplicate);
       await executePreparedMerge(job.master,duplicate,prepared);
     }
     const elapsed=performance.now()-started;
     job.avgMs=job.avgMs?job.avgMs*.85+elapsed*.15:elapsed;
     job.completedIds.push(duplicate);
     job.done++;
     if(job.done>=job.total)break;
     let pause=Math.max(0,CFG.MERGE_MIN_CYCLE_MS-elapsed);
     if(job.done%CFG.MERGE_LONG_BREAK_EVERY===0)pause+=CFG.MERGE_LONG_BREAK_MS;
     else if(job.done%CFG.MERGE_SHORT_BREAK_EVERY===0)pause+=CFG.MERGE_SHORT_BREAK_MS;
     if(pause>0){
       job.phase=`Pause de protection ${Math.ceil(pause/1000)} s`;
       renderMergeOperationPanel();
       await sleep(pause);
     }
   }
 }catch(e){
   fatalError=e;
   job.error=e;
   console.error(e);
 }finally{
   job.currentDuplicate=null;
   if(fatalError){job.status="error";job.phase=`Erreur : ${fatalError.message}`}
   else if(stopped){job.status="stopped";job.phase="Arrêté proprement"}
   else{job.status="done";job.phase="Terminé"}
   if(job.automatic&&state.autoSequence.running){
     if(job.status==="done")state.autoSequence.finished++;
     else if(job.status==="error")state.autoSequence.errors++;
     else if(job.status==="stopped")state.autoSequence.skipped++;
     saveAutoSession();
   }
   job.completedIds.forEach(id=>state.mergeSession.deletedIds.add(String(id)));
   state.mergeSession.masterIds.add(String(job.master));
   state.mergeSession.totalDone+=job.done;
   state.mergeSession.groupCount++;
   if(job.status==="error")state.mergeSession.errorCount++;
   if(job.status==="stopped")state.mergeSession.stoppedCount++;
   state.mergeSession.history.push({id:job.id,groupId:job.groupId,master:job.master,heading:job.heading,total:job.total,done:job.done,status:job.status,phase:job.phase,avgMs:job.avgMs,error:job.error,mode:job.mode||"merge",mergeTotal:job.total,mergeDone:job.done,deleteTotal:0,deleteQueued:0});
   if(state.mergeSession.history.length>5)state.mergeSession.history.shift();
   job.authorityIds=null;job.selected=[];job.completedIds=[];
   state.mergeJobs.delete(job.id);
   renderMergeOperationPanel();
   refreshMergeButtonStates();
   if(state.autoSequence.running&&!state.autoSequence.stopRequested&&!state.stopAllMerges)pumpAutomaticExactSequence();
   maybeFinalizeMergeSession();
 }
}

async function prepareFastMerge(master,sampleDuplicate){
 const url=new URL(CFG.MERGE_URL,location.origin);
 url.searchParams.append("authid",master);
 url.searchParams.append("authid",sampleDuplicate);
 url.searchParams.set("mergereference",master);
 url.searchParams.set("_",String(Date.now()));
 const preparation=await KOHA_QUEUE.fetch(url,{credentials:"same-origin",cache:"no-store"});
 if(!preparation.ok)throw new Error(`préparation #${sampleDuplicate} : HTTP ${preparation.status}`);
 const preparationDoc=new DOMParser().parseFromString(await preparation.text(),"text/html");
 const preparationError=preparationDoc.querySelector(".alert-warning, .alert-danger");
 if(preparationError)throw new Error(cleanText(preparationError.textContent));
 const form=preparationDoc.querySelector("#mergeform");
 if(!form)throw new Error(`formulaire de fusion introuvable pour #${sampleDuplicate}`);
 const masterMarc=preparationDoc.getElementById(`ulrecord${master}`);
 if(!masterMarc)throw new Error(`MARC du maître #${master} introuvable`);
 const body=new URLSearchParams();
 form.querySelectorAll('input[type="hidden"]').forEach(input=>{if(input.closest(".record"))return;if(input.name)body.append(input.name,input.value)});
 masterMarc.querySelectorAll('input[type="hidden"]').forEach(input=>{if(input.name)body.append(input.name,input.value)});
 body.set("recordid1",String(master));
 body.set("recordid2",String(sampleDuplicate));
 body.set("mergereference",String(master));
 body.set("op","cud-merge");
 return {body:body.toString(),preparedAt:Date.now()};
}

async function executePreparedMerge(master,duplicate,prepared){
 const body=new URLSearchParams(prepared.body);
 body.set("recordid1",String(master));
 body.set("recordid2",String(duplicate));
 body.set("mergereference",String(master));
 body.set("op","cud-merge");
 const merge=await MERGE_WRITES.run(()=>fetch(CFG.MERGE_URL,{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:body.toString()}));
 if(!merge.ok){
   if(CFG.MERGE_OVERLOAD_STATUSES.includes(merge.status))MERGE_WRITES.reportOverload(merge.status);
   throw new Error(`fusion #${duplicate} : HTTP ${merge.status}`);
 }
 const resultDoc=new DOMParser().parseFromString(await merge.text(),"text/html");
 const error=resultDoc.querySelector(".alert-warning, .alert-danger");
 if(error)throw new Error(cleanText(error.textContent));
 const success=[...resultDoc.querySelectorAll('a[href*="/cgi-bin/koha/authorities/detail.pl?authid="]')].some(link=>{try{return new URL(link.href,location.origin).searchParams.get("authid")===String(master)}catch(_){return false}});
 if(!success)throw new Error(`Koha n'a pas confirmé la fusion #${duplicate} → #${master}`);
 registerRelinkChange(duplicate,master,"fusion");
}

function rebuildAuthorityAnalysis(){
 // Reconstruire tous les états dérivés à partir des autorités réellement encore présentes.
 // L'onglet 2 dépend de state.authorities ; il ne doit jamais conserver un probableGroups obsolète.
 if(state.fullLoaded){
   const previousReviews=new Map((state.probableGroups||[]).filter(g=>g.marcReview).map(g=>[probableGroupIdentityKey(g),g.marcReview]));
   state.probableGroups=buildProbableGroups(state.authorities);
   state.probableGroups.forEach(g=>{const review=previousReviews.get(probableGroupIdentityKey(g));if(review)g.marcReview=review});
   state.probableBuilt=true;
   state.indexesBuilt=false;
   state.authorityExactIndex=new Map();
   state.authorityLooseIndex=new Map();
 }
 // L'onglet 1 dispose d'un rapport dédié ; on retire néanmoins immédiatement les authid supprimés
 // des lignes déjà chargées pour que l'affichage courant reste cohérent sans nouvelle requête.
 if(state.exactLoaded){
   const liveIds=new Set(state.authorities.map(r=>String(r.authid)));
   if(state.fullLoaded){
     state.exactRows=state.exactRows.filter(r=>liveIds.has(String(r.authid)));
   }
   state.exactGroups=buildExactGroups(state.exactRows.length?state.exactRows:state.authorities);
 }
 updateFlowState();
}


function applyMergedIds(master,deleted){

 ids.forEach(id=>delete state.usage.values[id]);

function saveRelinkQueue(){safeLocalStorageSet(CFG.RELINK_QUEUE_CACHE,JSON.stringify(state.relinkQueue))}
function pendingRelinkItems(automaticOnly=false){return state.relinkQueue.filter(x=>automaticOnly?(x.status==="pending"&&!!x.masterId):(x.status==="pending"||x.status==="review"||x.status==="error"))}
function registerRelinkChange(oldId,masterId=null,reason="historique"){
 oldId=String(oldId||"").trim();masterId=masterId?String(masterId).trim():null;if(!oldId||oldId===masterId)return;
 let item=state.relinkQueue.find(x=>String(x.oldId)===oldId);
 if(!item){item={oldId,masterId,reason,status:"pending",createdAt:Date.now(),lastScanAt:null,bibliosFound:0,bibliosRelinked:0,reindexed:0,review:0,errors:0,lastError:null};state.relinkQueue.push(item)}
 else{item.masterId=masterId||item.masterId;item.reason=reason||item.reason;item.status="pending";item.lastError=null}
 saveRelinkQueue();updateFlowState();
}
function clearFinishedRelinkItems(){state.relinkQueue=state.relinkQueue.filter(x=>x.status!=="done");saveRelinkQueue();renderRelink();renderStats()}
function addManualRelinkIds(raw){const ids=[...new Set(String(raw||"").split(/[^0-9]+/).filter(Boolean))];ids.forEach(id=>registerRelinkChange(id,null,"historique manuel"));return ids.length}

async function searchBibliosByAuthorityId(authid){
 const out=[],seen=new Set();let offset=0,truncated=false,guard=0;
 while(out.length<CFG.RELINK_MAX_BIBS_PER_AUTH&&guard++<100){
   const url=new URL(CFG.BIBLIO_SEARCH,location.origin);url.searchParams.set("idx","an");url.searchParams.set("q",String(authid));url.searchParams.set("count",String(CFG.RELINK_SEARCH_PAGE_SIZE));if(offset)url.searchParams.set("offset",String(offset));url.searchParams.set("_",String(Date.now()));
   const r=await KOHA_QUEUE.fetch(url,{credentials:"same-origin",cache:"no-store"});if(!r.ok)throw new Error(`Recherche AuthID #${authid} : HTTP ${r.status}`);
   const doc=new DOMParser().parseFromString(await r.text(),"text/html"),rawIds=[],newIds=[];
   doc.querySelectorAll('a[href*="/cgi-bin/koha/catalogue/detail.pl?biblionumber="]').forEach(a=>{try{const id=new URL(a.getAttribute("href"),location.origin).searchParams.get("biblionumber");if(id)rawIds.push(id);if(id&&!seen.has(id)){seen.add(id);newIds.push(id);out.push(id)}}catch(_){}});
   const offsets=[...doc.querySelectorAll('a[href*="offset="]')].map(a=>{try{return Number(new URL(a.getAttribute("href"),location.origin).searchParams.get("offset"))}catch(_){return NaN}}).filter(n=>Number.isFinite(n)&&n>offset).sort((a,b)=>a-b);
   if(out.length>=CFG.RELINK_MAX_BIBS_PER_AUTH){truncated=!!offsets.length||rawIds.length>newIds.length;break}
   if(!offsets.length)break;
   const next=offsets[0];if(next<=offset||!newIds.length){truncated=true;break}offset=next;
 }
 if(guard>=100)truncated=true;
 return {ids:out.slice(0,CFG.RELINK_MAX_BIBS_PER_AUTH),truncated};
}
async function fetchBiblioMarcRaw(id){const r=await KOHA_QUEUE.fetch(`/api/v1/biblios/${encodeURIComponent(id)}`,{credentials:"same-origin",cache:"no-store",headers:{Accept:"application/marc-in-json"}});if(!r.ok)throw new Error(`Notice #${id} : lecture API HTTP ${r.status}`);return r.json()}
async function putBiblioMarcForRelink(id,record){const r=await KOHA_QUEUE.fetch(`/api/v1/biblios/${encodeURIComponent(id)}`,{method:"PUT",credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/marc-in-json",Accept:"application/json"},body:JSON.stringify(record)});if(!r.ok){let detail="";try{detail=cleanText(await r.text())}catch(_){}throw new Error(`Notice #${id} : relink API HTTP ${r.status}${detail?` · ${detail.slice(0,180)}`:""}`)}return true}
function rawMarcFields(record){return Array.isArray(record?.fields)?record.fields:Array.isArray(record)?record:[]}
function rawMarcSubfields(record){const out=[];for(const field of rawMarcFields(record)){for(const [tag,val] of Object.entries(field||{})){if(!val||typeof val!=="object"||!Array.isArray(val.subfields))continue;for(const sf of val.subfields)for(const [code,value] of Object.entries(sf||{}))out.push({tag,code:String(code),value:String(value??"")})}}return out}
function marcAuthorityIds(record){return rawMarcSubfields(record).filter(x=>x.code==="9"||x.code==="3").map(x=>x.value.trim()).filter(Boolean)}
function marcHasAuthorityId(record,id){id=String(id);return marcAuthorityIds(record).some(x=>String(x)===id)}

async function relinkOneBiblio(biblioId,item){
 const before=await fetchBiblioMarcRaw(biblioId),hadOld=marcHasAuthorityId(before,item.oldId);
 // Le moteur de recherche peut être momentanément en retard sur le MARC réel : ne jamais réécrire une notice déjà correcte juste pour rafraîchir l'index.
 if(!hadOld)return {status:"already_correct"};
 await putBiblioMarcForRelink(biblioId,before);await sleep(CFG.RELINK_BIB_DELAY);
 const after=await fetchBiblioMarcRaw(biblioId),oldRemains=marcHasAuthorityId(after,item.oldId),masterPresent=item.masterId?marcHasAuthorityId(after,item.masterId):false;
 if(oldRemains)return {status:"review",reason:`ancien AuthID #${item.oldId} encore présent après relink`};
 if(item.masterId&&!masterPresent)return {status:"review",reason:`ancien lien retiré mais maître #${item.masterId} non retrouvé dans la notice`};
 if(!item.masterId)return {status:"review",reason:`ancien lien #${item.oldId} retiré, mais aucune autorité maître n'était connue pour prouver la nouvelle cible`};
 return {status:"fixed"};
}
async function processRelinkItem(item){
 item.status="running";item.lastScanAt=Date.now();item.lastError=null;saveRelinkQueue();if(state.tab==="relink")renderRelink();
 try{
   const found=await searchBibliosByAuthorityId(item.oldId),bibs=found.ids;item.bibliosFound=bibs.length;let fixed=0,reindexed=0,review=found.truncated?1:0,errors=0;if(found.truncated)item.lastError=`Plus de ${CFG.RELINK_MAX_BIBS_PER_AUTH} notices possibles ou pagination ambiguë : contrôle global recommandé.`;
   for(const id of bibs){if(state.relink.stopRequested)break;try{const r=await relinkOneBiblio(id,item);if(r.status==="fixed")fixed++;else if(r.status==="already_correct")reindexed++;else{review++;if(r.reason)item.lastError=r.reason}}catch(e){errors++;item.lastError=e.message}}
   item.bibliosRelinked=fixed;item.reindexed=reindexed;item.review=review;item.errors=errors;
   if(state.relink.stopRequested)item.status="pending";else if(errors)item.status="error";else if(review)item.status="review";else item.status="done";
   state.relink.bibliosFound+=bibs.length;state.relink.bibliosRelinked+=fixed;state.relink.reindexed+=reindexed;state.relink.review+=review;state.relink.errors+=errors;
 }catch(e){item.status="error";item.errors=(item.errors||0)+1;item.lastError=e.message;state.relink.errors++;console.error(e)}
 finally{item.lastScanAt=Date.now();saveRelinkQueue()}
}
async function startTargetedRelink(options={}){
 if(state.relink.running)return; if(nonMergeOperationRunning()||activeMergeJobCount())return options.automatic?null:alert("Une autre opération est en cours.");
 const queue=pendingRelinkItems(!!options.automatic);if(!queue.length){if(!options.automatic)setStatus("Aucun ancien AuthID à contrôler dans la file de relink ciblé.","ok");return}
 if(!options.automatic&&!confirm(`Contrôler et relinker ${queue.length} ancien(s) AuthID ?\n\nChaque AuthID est recherché dans l'index Koha. Seules les notices trouvées sont relues puis réenregistrées via l'API afin de déclencher le linker natif. Les appels restent strictement séquentiels.`))return;
 state.relink=makeRelinkState({running:true,total:queue.length,lastRunAt:state.relink.lastRunAt});renderRelink();
 try{for(const item of queue){if(state.relink.stopRequested)break;state.relink.currentOldId=item.oldId;await processRelinkItem(item);state.relink.processed++;if(state.tab==="relink")renderRelink()}}
 finally{
   state.relink.running=false;state.relink.currentOldId=null;state.relink.lastRunAt=Date.now();saveRelinkQueue();updateFlowState();renderStats();if(state.tab==="relink")renderRelink();
   const remain=pendingRelinkItems().length;
   const msg=`Relink ciblé : ${fmt(state.relink.processed)}/${fmt(state.relink.total)} ancien(s) AuthID contrôlé(s) · ${fmt(state.relink.bibliosFound)} notice(s) trouvée(s) · ${fmt(state.relink.bibliosRelinked)} corrigée(s) · ${fmt(state.relink.reindexed)} déjà correcte(s) · ${fmt(state.relink.review)} à vérifier · ${fmt(state.relink.errors)} erreur(s)${remain?` · ${fmt(remain)} entrée(s) restent dans la file`:""}.`;
   setStatus(msg,state.relink.errors||state.relink.review?"error":"ok");
 }
}

function relinkStatusBadge(item){const map={pending:["","En attente"],running:["warn","En cours"],done:["good","OK"],review:["warn","À vérifier"],error:["bad","Erreur"]},m=map[item.status]||map.pending;return `<span class="dam-badge ${m[0]}">${m[1]}</span>`}

function parseRelinkReport(raw){if(!raw||!raw.includes("Bib authority heading linking report"))throw new Error("Cette sortie ne ressemble pas au rapport de link_bibs_to_authorities.pl.");const n=label=>{const m=raw.match(new RegExp(label+"\\s*:\\s*(\\d+)","i"));return m?Number(m[1]):0};const summary={bibsChecked:n("Number of bibs checked"),bibsModified:n("Number of bibs modified"),bibsErrors:n("Number of bibs with errors"),linked:n("Number of headings linked"),unlinked:n("Number of headings unlinked"),fuzzy:n("Number of headings fuzzily linked")};summary.totalHeadings=summary.linked+summary.unlinked+summary.fuzzy;const marker="Unlinked headings (from most frequent to least):";const start=raw.indexOf(marker);const unlinked=[];if(start>=0){const tail=raw.slice(start+marker.length);const end=tail.search(/Fuzzily-matched headings|Bib authority heading linking report/i);const section=end>=0?tail.slice(0,end):tail;for(const line of section.split(/\r?\n/)){const m=line.match(/^(.+):\s*(\d+)\s+occurrences\s*$/i);if(m)unlinked.push({heading:m[1].trim(),count:Number(m[2])})}}return {raw,summary,unlinked,importedAt:Date.now()}}

function classifyUnlinked(item){const e=normalizeHeading(item.heading);const exact=state.authorityExactIndex.get(e)||[];if(exact.length===1)return {kind:"exact_unique",label:"Exacte unique",candidates:exact};if(exact.length>1)return {kind:"exact_multiple",label:"Plusieurs exactes",candidates:exact};const l=looseHeading(item.heading);const probable=l?(state.authorityLooseIndex.get(l)||[]):[];if(probable.length)return {kind:"probable",label:"Ressemblante",candidates:probable};return {kind:"absent",label:"Absente",candidates:[]}}
function renderUnlinked(){if(!state.relinkReport.summary){$("dam-content").innerHTML=`<div class="dam-head"><div><h3>4 · Vedettes non liées</h3><p>Cette étape s'appuie sur le rapport du linker Koha.</p></div></div><div class="dam-info">Va d'abord à l'étape 3, importe la sortie <code>--link-report</code>, puis reviens ici. Aucun nouveau parcours SQL du catalogue n'est nécessaire.</div>`;return}const rows=state.relinkReport.unlinked.map(x=>({...x,classification:classifyUnlinked(x)})).filter(x=>(!state.search||x.heading.toLocaleLowerCase("fr").includes(state.search))&&(!state.unlinkedClass||x.classification.kind===state.unlinkedClass));const p=paginate(rows,state.page.unlinked);state.page.unlinked=p.page;$("dam-content").innerHTML=`<div class="dam-head"><div><h3>4 · Vedettes non liées</h3><p>${fmt(rows.length)} forme(s) distincte(s) après filtre. Les rapprochements ci-dessous sont indicatifs : aucune modification automatique n'est faite ici.</p></div></div><div class="dam-info"><strong>Lecture :</strong> « exacte unique » = une seule autorité de même texte dans le fichier chargé ; « plusieurs exactes » = doublon/ambiguïté ; « ressemblante » = forme proche ; « absente » = aucune candidate simple.</div>${rows.length?`<div class="dam-table-wrap"><table class="table table-striped table-hover dam-table"><thead><tr><th>Occurrences</th><th>Vedette non liée</th><th>Diagnostic local</th><th>Candidates</th></tr></thead><tbody>${p.items.map(renderUnlinkedRow).join("")}</tbody></table></div>${pagination("unlinked",p)}`:empty("Aucune vedette non liée ne correspond aux filtres.")}`;bindPagination()}
function renderUnlinkedRow(x){const c=x.classification;const cls=c.kind==="exact_unique"?"good":c.kind==="absent"?"bad":"warn";const candidates=c.candidates.slice(0,5).map(r=>`<a href="${authorityUrl(r.authid)}" target="_blank">#${esc(r.authid)} ${esc(r.type)} · ${esc(r.heading)}</a>`).join("<br>");return `<tr><td><strong>${fmt(x.count)}</strong></td><td>${esc(x.heading)}</td><td><span class="dam-badge ${cls}">${c.label}</span></td><td>${candidates||'<span class="dam-note">Aucune candidate</span>'}${c.candidates.length>5?`<br><span class="dam-note">+ ${c.candidates.length-5} autre(s)</span>`:""}</td></tr>`}

function renderOrphans(){const rows=filteredAuthorities().filter(r=>state.usage.values[r.authid]===0);const known=countKnownUsage();const p=paginate(rows,state.page.orphans);state.page.orphans=p.page;const pct=state.authorities.length?Math.round(known/state.authorities.length*100):0;const unlocked=!!state.workflow.relinkProductionDone;$("dam-content").innerHTML=`<div class="dam-head"><div><h3>5 · Autorités orphelines</h3><p>${fmt(known)} / ${fmt(state.authorities.length)} autorités contrôlées.</p></div><div class="dam-actions">${state.usageRunning?'<button id="dam-stop-usage" class="btn btn-default" type="button"><i class="fa fa-stop"></i> Arrêter après ce lot</button>':`<button id="dam-start-usage" class="btn btn-primary" type="button"><i class="fa fa-search"></i> ${known?'Reprendre l’analyse':'Analyser les liens'}</button>`}<button id="dam-clear-cache" class="btn btn-default" type="button" ${state.usageRunning?'disabled':''}><i class="fa fa-refresh"></i> Tout réanalyser</button></div></div>${unlocked?'<div class="dam-info"><strong>Relink de production confirmé :</strong> la suppression des orphelines est déverrouillée. Koha recalculera encore leur usage avant suppression.</div>':'<div class="dam-danger"><strong>Suppression verrouillée.</strong> Tu peux analyser les usages, mais pas supprimer en masse tant que l’étape 3 n’est pas marquée « relink de production effectué ».</div>'}<div class="dam-info">Analyse volontairement limitée : ${CFG.USAGE_BATCH} autorités par requête puis ${CFG.USAGE_DELAY} ms de pause.</div>${known||state.usageRunning?`<div class="dam-progress-box"><div class="dam-progress-info"><span>${state.usageRunning?'Analyse en cours…':'État de l’analyse'}</span><strong>${fmt(known)} / ${fmt(state.authorities.length)} · ${pct} %</strong></div><div class="dam-progress"><span style="width:${pct}%"></span></div></div>`:""}${rows.length?renderOrphanTable(p,unlocked):empty(known?"Aucune autorité orpheline parmi les résultats contrôlés.":"Lance l'analyse des function renderOrphanTable(p,unlocked){return `<div class="dam-selection"><div class="dam-actions"><button id="dam-select-page" class="btn btn-default btn-sm" type="button">Tout sélectionner sur cette page</button><button id="dam-clear-selection" class="btn btn-default btn-sm" type="button">Désélectionner</button></div><div><strong id="dam-selected-count">0</strong> sélectionnée(s) <button id="dam-delete" class="btn btn-danger" type="button" disabled><i class="fa fa-trash"></i> Préparer la suppression Koha</button></div></div><div class="dam-table-wrap"><table class="table table-striped table-hover dam-table"><thead><tr><th></th><th>AuthID</th><th>Type</th><th>Vedette</th><th>Créée</th><th>Usage</th><th></th></tr></thead><tbody>${p.items.map(r=>`<tr><td><input class="dam-orphan-checkbox" type="checkbox" value="${escAttr(r.authid)}"></td><td><strong>#${esc(r.authid)}</strong></td><td><span class="dam-badge">${esc(r.type||"—")}</span></td><td>${esc(r.heading||"(sans vedette)")}</td><td>${dateShort(r.created)}</td><td><span class="dam-usage-zero"><i class="fa fa-check-circle"></i> 0 notice</span></td><td class="actions"><button type="button" class="btn btn-default btn-xs dam-explore-one" data-authid="${escAttr(r.authid)}">Explorer</button> <a href="${authorityUrl(r.authid)}" target="_blank" class="btn btn-default btn-xs">Voir</a></td></tr>`).join("")}</tbody></table></div>${pagination("orphans",p)}`}
function bindOrphanEvents(unlocked){$("dam-start-usage")?.addEventListener("click",scanUsages);$("dam-stop-usage")?.addEventListener("click",e=>{state.stopUsage=true;e.currentTarget.disabled=true;setStatus("Arrêt demandé : le lot actuel se termine avant l'arrêt.","loading")});$("dam-clear-cache")?.addEventListener("click",()=>{if(!confirm("Effacer tous les résultats d'utilisation déjà calculés ?"))return;clearUsageCache();renderStats();renderOrphans()});$("dam-select-page")?.addEventListener("click",()=>{root.querySelectorAll(".dam-orphan-checkbox").forEach(cb=>cb.checked=true);updateSelection(unlocked)});$("dam-clear-selection")?.addEventListener("click",()=>{root.querySelectorAll(".dam-orphan-checkbox").forEach(cb=>cb.checked=false);updateSelection(unlocked)});root.querySelectorAll(".dam-orphan-checkbox").forEach(cb=>cb.addEventListener("change",()=>updateSelection(unlocked)));$("dam-delete")?.addEventListener("click",()=>sendToNativeDeletion(unlocked))}

async function scanUsages(){if(operationRunning())return alert("Une autre opération est en cours.");const ids=state.authorities.map(r=>r.authid).filter(id=>!Object.prototype.hasOwnProperty.call(state.usage.values,id));if(!ids.length)return setStatus("Toutes les autorités sont déjà contrôlées.","ok");state.usageRunning=true;state.stopUsage=false;renderOrphans();try{let csrf=await getCsrf();let processed=0;for(let i=0;i<ids.length;i+=CFG.USAGE_BATCH){if(state.stopUsage)break;const batch=ids.slice(i,i+CFG.USAGE_BATCH);let usages;try{usages=await usageBatch(batch,csrf)}catch(e){csrf=await getCsrf();usages=await usageBatch(batch,csrf)}batch.forEach(id=>state.usage.values[id]=Object.prototype.hasOwnProperty.call(usages,id)?usages[id]:null);state.usage.updatedAt=Date.now();saveUsage();processed+=batch.length;renderStats();setStatus(`Analyse : ${fmt(processed)} traitée(s) cette session · ${fmt(countKnownUsage())} / ${fmt(state.authorities.length)} au total.`,"loading");if(state.tab==="orphans")renderOrphans();await sleep(CFG.USAGE_DELAY)}setStatus(state.stopUsage?"Analyse arrêtée proprement. Elle pourra reprendre plus tard.":`Analyse terminée : ${fmt(countOrphans())} autorité(s) sans notice liée.`,"ok")}catch(e){console.error(e);setStatus(`Analyse interrompue : ${e.message}`,"error")}finally{state.usageRunning=false;state.stopUsage=false;saveUsage(true);renderStats();if(state.tab==="orphans")renderOrphans()}}

 const response=await KOHA_QUEUE.fetch(CFG.BATCH_DELETE,{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:body.toString()});

const AUDIT_AUTHORIZED_TAGS=new Set(["200","210","215","216","217","220","223","230","231","232","235","240","241","242","243","245","250","260","280"]);
function auditAdd(issues,severity,code,title,detail="",tag="",route="manual"){issues.push({severity,code,title,detail,tag,route})}
function auditFieldList(record){const out=[];for(const field of rawMarcFields(record)){for(const [tag,val] of Object.entries(field||{}))out.push({tag:String(tag),val})}return out}
function auditSubfieldsOf(field){const out=[];const val=field?.val;if(!val||typeof val!=="object"||!Array.isArray(val.subfields))return out;for(const sf of val.subfields)for(const [code,value] of Object.entries(sf||{}))out.push({code:String(code),value:String(value??"")});return out}
function auditDataText(field){return auditSubfieldsOf(field).filter(x=>!["3","5","6","7","8","9"].includes(x.code)&&x.value.trim()).map(x=>`${x.code}:${x.value.trim()}`).join("|")}
function auditNormField(field){return fold(auditSubfieldsOf(field).filter(x=>!["3","5","6","7","8","9"].includes(x.code)&&x.value.trim()).map(x=>x.value.trim()).join(" "))}
function auditGetSub(field,code){return auditSubfieldsOf(field).filter(x=>x.code===code).map(x=>x.value.trim()).filter(Boolean)}
function auditRecordField(record,tag){return auditFieldList(record).filter(x=>x.tag===tag)}
let AUDIT_AUTHORITY_ID_CACHE={length:-1,set:new Set()};function auditKnownAuthorityIds(){const len=(state.authorities||[]).length;if(AUDIT_AUTHORITY_ID_CACHE.length!==len){AUDIT_AUTHORITY_ID_CACHE={length:len,set:new Set((state.authorities||[]).map(x=>String(x.authid)))}}return AUDIT_AUTHORITY_ID_CACHE.set}
function auditIdentifierIssues(record,issues){
 const raw010=fieldEntries(record,"010","a"),valid010=raw010.map(normalizeIsni).filter(Boolean);
 for(const raw of raw010)if(!normalizeIsni(raw))auditAdd(issues,"review","isni_format","ISNI mal formé",`010$a : ${raw}`,"010","manual");
 const isniUnique=new Set(valid010);if(isniUnique.size>1)auditAdd(issues,"critical","isni_conflict","Plusieurs ISNI différents",[...isniUnique].join(" / "),"010","manual");
 if(valid010.length>isniUnique.size)auditAdd(issues,"review","isni_duplicate","ISNI répété à l’identique","La même valeur 010$a est présente plusieurs fois.","010","manual");
 const byNs=new Map();for(const raw of fieldEntries(record,"035","a")){const p=parse035Identifier(raw);if(!p)continue;const set=byNs.get(p.kind)||new Set();set.add(p.value);byNs.set(p.kind,set)}
 for(const [kind,set] of byNs)if(set.size>1)auditAdd(issues,"review",`id_${kind}_multiple`,`Plusieurs identifiants ${kind.toUpperCase()} différents`,[...set].join(" / "),"035","manual");
 const ids=extractAuthorityIdentifiers(record);if(!hasAnyIdentifier(ids))auditAdd(issues,"improve","external_id_missing","Aucun identifiant externe fiable","Aucun pivot ISNI/VIAF/IdRef/BnF/Wikidata : alignement externe à envisager, mais aucune écriture automatique ne sera tentée sans pivot.","0XX","cataloguing");
}
function auditDateIssues(record,issues){
 const current=new Date().getFullYear()+1;for(const field of auditRecordField(record,"200")){for(const raw of auditGetSub(field,"f")){const ys=[...String(raw).matchAll(/(?:^|\D)(1[0-9]{3}|20[0-9]{2})(?=\D|$)/g)].map(m=>Number(m[1]));if(ys.some(y=>y>current))auditAdd(issues,"review","date_future","Date de personne dans le futur",`200$f : ${raw}`,"200","manual");if(ys.length>=2&&ys[1]<ys[0])auditAdd(issues,"critical","date_reverse","Dates de personne incohérentes",`La seconde année (${ys[1]}) est antérieure à la première (${ys[0]}).`,"200","manual")}}
}
function auditAccessPointIssues(row,record,issues){
 const fields=auditFieldList(record),auth=fields.filter(f=>/^2\d\d$/.test(f.tag));const standard=auth.filter(f=>AUDIT_AUTHORIZED_TAGS.has(f.tag));
 if(!standard.length)auditAdd(issues,"critical","authorized_missing","Aucun point d’accès autorisé UNIMARC/A reconnu","Une notice d’autorité doit contenir un champ du bloc 2XX.","2XX","manual");
 const unknown=auth.filter(f=>!AUDIT_AUTHORIZED_TAGS.has(f.tag));if(unknown.length)auditAdd(issues,"review","authorized_unknown","Zone 2XX non reconnue par le jeu de contrôle",unknown.map(x=>x.tag).join(", "),"2XX","manual");
 const keys=new Map();for(const f of standard){const key=`${f.tag}|${auditNormField(f)}`;if(!auditNormField(f))auditAdd(issues,"review","authorized_empty","Point d’accès autorisé sans contenu exploitable",f.tag,f.tag,"manual");keys.set(key,(keys.get(key)||0)+1)}for(const [key,n] of keys)if(n>1)auditAdd(issues,"review","authorized_duplicate","Point d’accès autorisé répété à l’identique",`${key.split("|")[0]} · ${n} occurrences`,key.split("|")[0],"manual");
 if(standard.length>1){const distinct=new Set(standard.map(f=>auditNormField(f)).filter(Boolean));if(distinct.size>1){const controlled=standard.every(f=>auditGetSub(f,"7").length||auditGetSub(f,"8").length);if(!controlled)auditAdd(issues,"review","authorized_multiple","Plusieurs formes 2XX distinctes sans codage de langue/script partout","Les répétitions 2XX peuvent être légitimes pour des écritures alternatives, mais doivent être qualifiées.","2XX","manual")}}
 const authNorms=new Set(standard.map(auditNormField).filter(Boolean));
 const variants=fields.filter(f=>/^4\d\d$/.test(f.tag)),seen4=new Map();for(const f of variants){const n=auditNormField(f);if(!n)continue;if(authNorms.has(n))auditAdd(issues,"review","variant_equals_authorized","Forme rejetée identique à la forme retenue",f.tag,f.tag,"manual");const k=`${f.tag}|${n}`;seen4.set(k,(seen4.get(k)||0)+1)}for(const [k,n] of seen4)if(n>1)auditAdd(issues,"review","variant_duplicate","Forme rejetée dupliquée",`${k.split("|")[0]} · ${n} occurrences`,k.split("|")[0],"manual");
 const known=auditKnownAuthorityIds(),relations=fields.filter(f=>/^5\d\d$/.test(f.tag)||/^7\d\d$/.test(f.tag)),seenRel=new Map();for(const f of relations){const ids=auditGetSub(f,"3");for(const id of ids){if(String(id)===String(row.authid))auditAdd(issues,"critical","relation_self","Relation d’autorité vers elle-même",`${f.tag}$3 = ${id}`,f.tag,"manual");else if(state.fullLoaded&&!known.has(String(id)))auditAdd(issues,"review","relation_missing","Relation vers un AuthID absent du référentiel chargé",`${f.tag}$3 = ${id}`,f.tag,"manual");const k=`${f.tag}|${id}`;seenRel.set(k,(seenRel.get(k)||0)+1)}if(/^5/.test(f.tag)&&!ids.length&&auditDataText(f))auditAdd(issues,"improve","relation_unlinked","Relation 5XX sans $3",`${f.tag} contient une relation textuelle sans lien d’autorité ; la notice reste exploitable mais la relation n’est pas machine-liée.`,f.tag,"cataloguing");if(/^7/.test(f.tag)){const lang=auditGetSub(f,"8");if(!lang.length)auditAdd(issues,"review","parallel_language_missing","7XX sans $8",`${f.tag} doit être qualifié par la langue de catalogage / langue du point d’accès lorsqu’il porte des données parallèles.`,f.tag,"manual");else if(lang.some(v=>v.length!==6))auditAdd(issues,"review","parallel_language_format","$8 de 7XX de longueur inattendue",`${f.tag}$8 : ${lang.join(" / ")}`,f.tag,"manual")}}
 for(const [k,n] of seenRel)if(n>1)auditAdd(issues,"review","relation_duplicate","Relation répétée vers la même autorité",`${k.replace("|","$3=")} · ${n} occurrences`,k.split("|")[0],"manual");
}
function auditCodedAndSourceIssues(record,issues){
 if(!String(record?.leader||"").trim())auditAdd(issues,"review","leader_missing","Leader MARC absent","Le label de notice n’est pas présent dans la représentation MARC reçue.","Leader","manual");
 if(!auditRecordField(record,"001").length)auditAdd(issues,"review","field001_missing","Zone 001 absente","Identifiant de notice absent du MARC d’autorité.","001","manual");
 const f100=auditRecordField(record,"100");if(!f100.length)auditAdd(issues,"review","field100_missing","Zone 100 absente","Les données générales de traitement ne sont pas présentes.","100","manual");else{const vals=f100.flatMap(f=>auditGetSub(f,"a"));if(!vals.length||vals.some(v=>v.length<12))auditAdd(issues,"review","field100_format","Zone 100 incomplète ou mal formée","100$a doit contenir les données codées attendues.","100","manual")}
 const f801=auditRecordField(record,"801");if(!f801.length)auditAdd(issues,"review","field801_missing","Zone 801 absente","La source d’origine du record doit être identifiable.","801","manual");else for(const f of f801){const country=auditGetSub(f,"a"),agency=auditGetSub(f,"b"),date=auditGetSub(f,"c");if(!country.length||country.some(v=>!/^[A-Za-z]{2}$/.test(v)))auditAdd(issues,"review","field801_country","801$a absent ou non conforme",country.join(" / ")||"absent","801","manual");if(!agency.length)auditAdd(issues,"review","field801_agency","801$b absent","Agence responsable non renseignée.","801","manual");if(date.length&&date.some(v=>!/^\d{8}$/.test(v)))auditAdd(issues,"review","field801_date","801$c au format inattendu",date.join(" / "),"801","manual")}
 if(!auditRecordField(record,"152").length)auditAdd(issues,"review","field152_missing","Zone 152 absente","Le format UNIMARC/A prévoit la zone 152 parmi les éléments obligatoires ; les règles/système doivent être contrôlés selon votre politique de catalogage.","152","manual");else{const vals=auditRecordField(record,"152").flatMap(f=>auditSubfieldsOf(f).filter(x=>["a","b"].includes(x.code)&&x.value.trim()));if(!vals.length)auditAdd(issues,"review","field152_empty","Zone 152 sans règle ni système","152 présent mais sans $a ni $b exploitable.","152","manual")};
 if(!auditRecordField(record,"810").length)auditAdd(issues,"improve","source810_missing","Aucune source 810 documentée","La notice peut être valide, mais sa justification documentaire est faible.","810","cataloguing");
 const f100a=f100.flatMap(f=>auditGetSub(f,"a"))[0]||"",catLang=f100a.length>=12?f100a.slice(9,12):"";if(catLang){for(const f of auditFieldList(record).filter(x=>/^2\d\d$/.test(x.tag))){for(const v of auditGetSub(f,"8")){const l=v.slice(0,3);if(l&&!/[|# ]{3}/.test(l)&&l!==catLang)auditAdd(issues,"review","language_mismatch","Langue de catalogage incohérente entre 100 et 2XX",`100 : ${catLang} · ${f.tag}$8 : ${v}`,f.tag,"manual")}}}

async function fetchAuthorityMarcRaw(id){const response=await KOHA_QUEUE.fetch(`/api/v1/authorities/${encodeURIComponent(id)}`,{credentials:"same-origin",cache:"no-store",headers:{Accept:"application/marc-in-json"}});if(!response.ok)throw new Error(`Autorité #${id} : HTTP ${response.status}`);return response.json()}

async function enrichOneSafeResult(result){
 const row=state.authorities.find(r=>String(r.authid)===String(result.authid));if(!row)throw new Error("Autorité absente du référentiel courant");
 const id=String(row.authid),usageMap=await inspectAuthorityUsageMap([id],null);
 if(!Object.prototype.hasOwnProperty.call(usageMap,id))return {blocked:true,reason:"Usage actuel impossible à confirmer : écriture automatique refusée"};

function commonPrefix(a,b){let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;return i}

function normalizeMarcJson(data){
 const fields=[];const source=Array.isArray(data?.fields)?data.fields:Array.isArray(data)?data:[];
 for(const f of source){for(const [tag,val] of Object.entries(f||{})){if(typeof val==='string'){fields.push({tag,ind:'',value:val})}else if(val&&typeof val==='object'){const ind=`${val.ind1||' '} ${val.ind2||' '}`;const subs=(val.subfields||[]).map(sf=>Object.entries(sf||{}).map(([c,v])=>`$${c} ${v}`).join(' ')).join(' · ');fields.push({tag,ind,value:subs})}}}
 return fields;
}
function marcMap(fields){const m=new Map();for(const f of fields){const k=f.tag;const arr=m.get(k)||[];arr.push(`${f.ind?f.ind+' ':''}${f.value}`.trim());m.set(k,arr)}return m}
function renderMarcCompare(aFields,bFields){const A=marcMap(aFields),B=marcMap(bFields),tags=[...new Set([...A.keys(),...B.keys()])].sort();return `<div class="dam-table-wrap"><table class="table dam-table"><thead><tr><th>Zone</th><th>Autorité A</th><th>Autorité B</th></tr></thead><tbody>${tags.map(tag=>{const av=(A.get(tag)||[]).join('<br>'),bv=(B.get(tag)||[]).join('<br>'),same=stripTags(av)===stripTags(bv);return `<tr style="${same?'opacity:.55':'background:#fff8e8'}"><td><strong>${esc(tag)}</strong></td><td>${av||'<span class="dam-note">—</span>'}</td><td>${bv||'<span class="dam-note">—</span>'}</td></tr>`}).join('')}</tbody></table></div>`}
async function showAuthorityComparison(leftId,rightId){
 const a=state.authorities.find(r=>r.authid===leftId),b=state.authorities.find(r=>r.authid===rightId);if(!a||!b)return;const score=similarityText(a.heading,b.heading);
 $("dam-content").innerHTML=`<div class="dam-head"><div><h3>Comparer deux autorités</h3><p>Chargement séquentiel du MARC via l’API Koha…</p></div><button type="button" class="btn btn-default" id="dam-back-explorer">Retour</button></div><div class="dam-loading"><i class="fa fa-spinner fa-spin"></i> Lecture des deux autorités…</div>`;$("dam-back-explorer")?.addEventListener('click',renderExplorer);
 try{const af=await fetchAuthorityMarc(a.authid);const bf=await fetchAuthorityMarc(b.authid);const html=`<div class="dam-head"><div><h3>Comparer deux autorités</h3><p>Les lignes différentes sont mises en évidence. Contrôle humain obligatoire.</p></div><button type="button" class="btn btn-default" id="dam-back-explorer">Retour à l’explorateur</button></div><div class="dam-warning"><strong>${score}% de proximité de forme.</strong> Ce score ne prouve pas une identité.</div><div class="dam-card-grid"><div class="dam-card"><strong>#${esc(a.authid)} · ${esc(a.heading)}</strong><br><small>Usage ${stripTags(usageHtml(state.usage.values[a.authid]))}</small><div style="margin-top:8px"><a class="btn btn-default btn-sm" target="_blank" href="${linkedBibliosUrl(a)}">Notices liées</a></div></div><div class="dam-card"><strong>#${esc(b.authid)} · ${esc(b.heading)}</strong><br><small>Usage ${stripTags(usageHtml(state.usage.values[b.authid]))}</small><div style="margin-top:8px"><a class="btn btn-default btn-sm" target="_blank" href="${linkedBibliosUrl(b)}">Notices liées</a></div></div></div>${renderMarcCompare(af,bf)}`;$("dam-content").innerHTML=html;$("dam-back-explorer")?.addEventListener('click',renderExplorer)}catch(e){$("dam-content").innerHTML=`<div class="dam-danger"><strong>Comparaison impossible :</strong> ${esc(e.message)}<br><small>Les fiches natives Koha restent accessibles.</small></div><button type="button" class="btn btn-default" id="dam-back-explorer">Retour</button>`;$("dam-back-explorer")?.addEventListener('click',renderExplorer)}
}

function filteredAuthorities(){return state.authorities.filter(r=>(!state.type||r.type===state.type)&&(!state.search||`${r.authid} ${r.type} ${r.heading}`.toLocaleLowerCase("fr").includes(state.search)))}
function populateTypes(){populateTypesFromRows(state.authorities)}
function populateTypesFromRows(rows){const select=$("dam-type");const current=state.type;const types=[...new Set((rows||[]).map(r=>r.type).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"fr"));select.innerHTML='<option value="">Tous les types</option>'+types.map(t=>`<option value="${escAttr(t)}">${esc(t)}</option>`).join("");if(types.includes(current))select.value=current;else{state.type="";select.value=""}}
function chooseMaster(rows){const allKnown=rows.every(r=>Object.prototype.hasOwnProperty.call(state.usage.values,r.authid)&&Number.isFinite(Number(state.usage.values[r.authid])));return [...rows].sort((a,b)=>{if(allKnown){const d=Number(state.usage.values[b.authid])-Number(state.usage.values[a.authid]);if(d)return d}const da=parseDate(a.created),db=parseDate(b.created);if(da!==db)return da-db;return Number(a.authid)-Number(b.authid)})[0]?.authid}

function paginate(list,requested){const total=list.length,pages=Math.max(1,Math.ceil(total/CFG.ROWS_PER_PAGE)),page=Math.min(Math.max(1,requested||1),pages),start=(page-1)*CFG.ROWS_PER_PAGE;return {items:list.slice(start,start+CFG.ROWS_PER_PAGE),page,pages,total}}
function pagination(tab,p){if(p.pages<=1)return "";const from=(p.page-1)*CFG.ROWS_PER_PAGE+1,to=Math.min(p.total,p.page*CFG.ROWS_PER_PAGE);return `<div class="dam-pagination"><span>${fmt(from)}–${fmt(to)} sur ${fmt(p.total)}</span><div class="dam-pagination-buttons"><button class="btn btn-default btn-sm dam-page" type="button" data-tab="${tab}" data-page="${p.page-1}" ${p.page<=1?'disabled':''}><i class="fa fa-chevron-left"></i></button><span>Page ${p.page} / ${p.pages}</span><button class="btn btn-default btn-sm dam-page" type="button" data-tab="${tab}" data-page="${p.page+1}" ${p.page>=p.pages?'disabled':''}><i class="fa fa-chevron-right"></i></button></div></div>`}
function bindPagination(){root.querySelectorAll(".dam-page").forEach(b=>b.addEventListener("click",()=>{const page=Number(b.dataset.page);if(page<1)return;state.page[b.dataset.tab]=page;renderCurrentTab();root.scrollIntoView({behavior:"smooth",block:"start"})}))}
function resetPages(){state.page={exact:1,probable:1,unlinked:1,orphans:1,audit:1,enrich:1,explorer:1,all:1}}

function loadUsageCache(){
 try{
   const raw=localStorage.getItem(CFG.USAGE_CACHE);
   if(!raw)return {updatedAt:0,values:{}};
   const parsed=JSON.parse(raw);
   if(parsed&&parsed.format==="compact-v1"&&typeof parsed.data==="string"){
     const values={};let previous=0;
     if(parsed.data){
       for(const token of parsed.data.split(",")){
         const pos=token.indexOf(":");if(pos<1)continue;
         const delta=parseInt(token.slice(0,pos),36);if(!Number.isFinite(delta)||delta<0)continue;
         const id=previous+delta;previous=id;
         const rawValue=token.slice(pos+1);
         values[String(id)]=rawValue==="x"?null:parseInt(rawValue,36);
       }
     }
     return {updatedAt:Number(parsed.updatedAt)||0,values};
   }
   if(parsed&&typeof parsed==="object"&&parsed.values&&typeof parsed.values==="object")return {updatedAt:Number(parsed.updatedAt)||0,values:parsed.values};
 }catch(_){}
 return {updatedAt:0,values:{}};
}
function encodeUsageCache(maxEntries=null){
 const values=state.usage?.values||{},ids=Object.keys(values);
 const limit=maxEntries===null?ids.length:Math.min(ids.length,Math.max(0,Number(maxEntries)||0));
 const parts=new Array(limit);let previous=0;
 for(let i=0;i<limit;i++){
   const id=Number(ids[i]);
   if(!Number.isSafeInteger(id)||id<0){parts[i]="";continue}
   const delta=id-previous;previous=id;
   const v=values[ids[i]];
   const encoded=v===null?"x":Math.max(0,Math.trunc(Number(v)||0)).toString(36);
   parts[i]=`${delta.toString(36)}:${encoded}`;
 }
 return JSON.stringify({format:"compact-v1",updatedAt:Number(state.usage?.updatedAt)||0,partial:limit<ids.length,data:parts.filter(Boolean).join(",")});
}
function isQuotaError(error){return !!error&&(error.name==="QuotaExceededError"||error.name==="NS_ERROR_DOM_QUOTA_REACHED"||error.code===22||error.code===1014)}
function safeLocalStorageSet(key,value){try{localStorage.setItem(key,value);return true}catch(error){if(!isQuotaError(error))console.warn("[Autorités] stockage local indisponible",error);return false}}
function safeLocalStorageRemove(key){try{localStorage.removeItem(key);return true}catch(_){return false}}
function persistUsageCacheNow(){
 if(usagePersistence.timer){clearTimeout(usagePersistence.timer);usagePersistence.timer=null}
 const limits=usagePersistence.maxEntries===null?[null,...CFG.USAGE_CACHE_FALLBACK_LIMITS]:[usagePersistence.maxEntries];
 for(const limit of limits){
   try{
     localStorage.setItem(CFG.USAGE_CACHE,encodeUsageCache(limit));
     usagePersistence.lastSavedAt=Date.now();usagePersistence.maxEntries=limit;return true;
   }catch(error){
     if(!isQuotaError(error)){console.warn("[Autorités] cache d’usage non sauvegardé",error);return false}
   }
 }
 console.warn("[Autorités] quota localStorage atteint : la session continue en mémoire sans interrompre Koha.");
 return false;
}
function saveUsage(force=false){
 const elapsed=Date.now()-usagePersistence.lastSavedAt;
 if(force||!usagePersistence.lastSavedAt||elapsed>=CFG.USAGE_CACHE_SAVE_INTERVAL_MS)return persistUsageCacheNow();
 if(!usagePersistence.timer){
   usagePersistence.timer=setTimeout(()=>persistUsageCacheNow(),Math.max(0,CFG.USAGE_CACHE_SAVE_INTERVAL_MS-elapsed));
 }
 return true;
}
function clearUsageCache(){
 if(usagePersistence.timer){clearTimeout(usagePersistence.timer);usagePersistence.timer=null}
 usagePersistence.lastSavedAt=0;usagePersistence.maxEntries=null;state.usage={updatedAt:0,values:{}};safeLocalStorageRemove(CFG.USAGE_CACHE);
}
function saveWorkflow(){safeLocalStorageSet(CFG.WORKFLOW_CACHE,JSON.stringify(state.workflow));renderStats()}
function countKnownUsage(){return state.authorities.reduce((n,r)=>n+(Object.prototype.hasOwnProperty.call(state.usage.values,r.authid)?1:0),0)}
function countOrphans(){return state.authorities.reduce((n,r)=>n+(state.usage.values[r.authid]===0?1:0),0)}
async function getCsrf(){const response=await KOHA_QUEUE.fetch(CFG.BATCH_DELETE,{credentials:"same-origin",cache:"no-store"});if(!response.ok)throw new Error(`Impossible de récupérer le jeton CSRF (${response.status}).`);const doc=new DOMParser().parseFromString(await response.text(),"text/html");const token=doc.querySelector('input[name="csrf_token"]')?.value;if(!token)throw new Error("Jeton CSRF Koha introuvable.");return token}

function setStatus(message,type){const box=$("dam-status");box.className=`dam-status visible ${type||""}`;box.innerHTML=(type==="loading"?'<i class="fa fa-spinner fa-spin"></i> ':"")+esc(message)}
function setOperation(message,visible){const box=$("dam-operation");box.classList.toggle("visible",!!visible);box.innerHTML=visible?`<i class="fa fa-spinner fa-spin"></i> ${esc(message)}`:""}
function usageHtml(v){if(v===undefined)return '<span class="dam-usage-unknown">non vérifié</span>';if(v===null)return '<span class="dam-usage-unknown">inconnu</span>';if(Number(v)===0)return '<span class="dam-usage-zero">0</span>';return `<span class="dam-usage-used">${fmt(v)}</span>`}
function updateSelection(unlocked){const count=root.querySelectorAll(".dam-orphan-checkbox:checked").length;text("dam-selected-count",String(count));const b=$("dam-delete");if(b)b.disabled=count===0||!unlocked}
function authorityUrl(id){return `${CFG.AUTH_DETAIL}?authid=${encodeURIComponent(id)}`}
function empty(message){return `<div class="dam-empty"><i class="fa fa-inbox"></i>${esc(message)}</div>`}
function hidden(form,name,value){const input=document.createElement("input");input.type="hidden";input.name=name;input.value=value;form.appendChild(input)}
function text(id,value){const e=$(id);if(e)e.textContent=value}
function fmt(v){return new Intl.NumberFormat("fr-FR").format(Number(v)||0)}
function parseDate(v){if(!v)return Number.MAX_SAFE_INTEGER;const p=Date.parse(String(v).replace(" ","T"));return Number.isFinite(p)?p:Number.MAX_SAFE_INTEGER}
function dateShort(v){if(!v)return "—";const t=parseDate(v);return t===Number.MAX_SAFE_INTEGER?esc(v):new Intl.DateTimeFormat("fr-FR").format(new Date(t))}
function cleanText(v){return String(v||"").replace(/\s+/g," ").trim()}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function escAttr(v){return esc(v)}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function $(id){return document.getElementById(id)}
function loadJson(key,fallback){try{const raw=localStorage.getItem(key);if(!raw)return structuredCloneSafe(fallback);const x=JSON.parse(raw);return x&&typeof x==="object"?x:structuredCloneSafe(fallback)}catch(_){return structuredCloneSafe(fallback)}}
function structuredCloneSafe(x){return JSON.parse(JSON.stringify(x))}
async function copyText(text){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(text);const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}

})();
</script>
