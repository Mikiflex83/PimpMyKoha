<div id="dq-center-app"><div style="padding:28px;text-align:center;color:#66727c">Initialisation du Centre qualité Koha…</div></div>
<style>
#dq-center-app{--g:#6f8f32;--gd:#526d22;--gl:#f2f7e9;--b:#d8dee3;--m:#697680;--bg:#f6f7f8;--warn:#fff8e8;--danger:#fff1f1;max-width:1500px;margin:0 auto 40px;color:#28343d}#dq-center-app *{box-sizing:border-box}.dqc-hero{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:22px 25px;margin-bottom:15px;border:1px solid #cedbbd;border-left:5px solid var(--g);border-radius:8px;background:linear-gradient(135deg,#fff,#f5f9ef)}.dqc-kicker{color:var(--gd);font-size:11px;font-weight:700;letter-spacing:.12em}.dqc-hero h2{margin:3px 0 4px;color:var(--gd);font-size:26px}.dqc-hero p{margin:0;color:var(--m)}.dqc-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.dqc-badge{display:inline-block;padding:3px 8px;border-radius:12px;background:#e8edf0;color:#52606a;font-size:11px;font-weight:700}.dqc-badge.ok{background:#e6f1d8;color:#4d6a20}.dqc-badge.warn{background:#fff0c9;color:#725c22}.dqc-badge.bad{background:#f9dddd;color:#8a2b2b}.dqc-status{display:none;padding:10px 12px;margin-bottom:13px;border:1px solid var(--b);border-radius:6px}.dqc-status.visible{display:block}.dqc-status.ok{background:#f2f8eb;border-color:#cadcb2}.dqc-status.loading{background:#f3f8fb;border-color:#c7d8e3}.dqc-status.error{background:var(--danger);border-color:#e1b5b5;color:#822929}.dqc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.dqc-card{position:relative;padding:16px;border:1px solid var(--b);border-radius:8px;background:#fff;min-height:180px}.dqc-card h3{margin:0 0 5px;color:#39444d;font-size:18px}.dqc-card p{margin:0 0 12px;color:var(--m);font-size:13px}.dqc-card .dqc-num{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;margin-right:8px;border-radius:50%;background:var(--gl);color:var(--gd);font-weight:800}.dqc-card .dqc-actions{display:flex;gap:7px;flex-wrap:wrap;position:absolute;left:16px;right:16px;bottom:14px}.dqc-card a.btn{flex:1}.dqc-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.dqc-panel{margin-top:14px;padding:15px;border:1px solid var(--b);border-radius:8px;background:#fff}.dqc-panel h3{margin:0 0 8px}.dqc-info,.dqc-warn,.dqc-danger{padding:10px 12px;margin:10px 0;border-radius:6px;font-size:13px}.dqc-info{background:#f3f8fb;border:1px solid #c7d8e3}.dqc-warn{background:var(--warn);border:1px solid #e4cf96;color:#725c22}.dqc-danger{background:var(--danger);border:1px solid #e1b5b5;color:#822929}.dqc-table{width:100%;border-collapse:collapse}.dqc-table th,.dqc-table td{padding:8px 9px;border-bottom:1px solid #e8ecef;text-align:left;vertical-align:middle}.dqc-table th{background:#f7f8f9;font-size:12px}.dqc-table input{width:100%;min-width:260px;height:34px;padding:5px 8px;border:1px solid #bcc6cd;border-radius:5px}.dqc-actions-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.dqc-code{font-family:monospace;font-size:12px;background:#f4f6f7;padding:2px 5px;border-radius:4px}.dqc-note{font-size:12px;color:var(--m)}@media(max-width:1100px){.dqc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.dqc-grid{grid-template-columns:1fr}.dqc-hero{flex-direction:column}.dqc-badges{justify-content:flex-start}.dqc-card{min-height:0}.dqc-card .dqc-actions{position:static;margin-top:14px}.dqc-table input{min-width:0}}
</style>
<script>
(function(){
'use strict';
const root=document.getElementById('dq-center-app');if(!root||root.dataset.ready)return;root.dataset.ready='1';
const CFG={VERSION:'1.5.0',URL_KEY:'dq_quality_center_urls_v1'};
const NATIVE_MODULES={authorities:'quality-authorities',reservations:'quality-reservations',loans:'quality-loans',transfers:'quality-transfers',items:'quality-items',biblios:'quality-biblios',serials:'quality-serials',patrons:'quality-patrons',rulelab:'quality-rule-lab'};
const MODULES=[
 {id:'authorities',num:'01',title:'Autorités',desc:'Doublons, fusions, orphelines, relink, audit UNIMARC/A et enrichissement.',sql:false},
 {id:'reservations',num:'02',title:'Réservations',desc:'Réservations anciennes, figées, impossibles, exploration et annulation supervisée par lot.',sql:false},
 {id:'loans',num:'03',title:'Prêts & litiges',desc:'Prêts très anciens ou figés, réclamations de retour, combinaisons d’état anormales.',sql:false},
 {id:'transfers',num:'04',title:'Transferts / navette',desc:'Demandés non envoyés, transits bloqués et états incompatibles.',sql:true,sqlLabel:'Rapport SQL 04'},
 {id:'items',num:'05',title:'Exemplaires',desc:'Intégrité, états figés, cohérence notice/exemplaires et lots de maintenance.',sql:false},
 {id:'biblios',num:'06',title:'Notices',desc:'Audit UNIMARC/B, doublons, notices fantômes et enrichissement assisté.',sql:false},
 {id:'serials',num:'07',title:'Périodiques',desc:'Abonnements expirés/figés, fascicules attendus, réclamations et manquants.',sql:true,sqlLabel:'Rapport SQL 07'},
 {id:'patrons',num:'08',title:'Lecteurs',desc:'Doublons, comptes expirés, contacts incohérents et contrôle avant traitement.',sql:false},
 {id:'rulelab',num:'09',title:'Laboratoire des règles',desc:'Supervise le backend Firebase du module Qualité sélectionné ; il ne possède pas de base Firebase propre.',sql:false}
];
function access(){return window.KohaTools?.getService?.('access-control')}
function isAdmin(){return access()?.can?.('admin')===true}
function canUse(m){const target=NATIVE_MODULES[m.id];return !target||access()?.moduleAllowed?.(target)!==false}
function visibleModules(){return MODULES.filter(canUse)}
function dataModules(){return visibleModules().filter(m=>m.id!=='rulelab')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadUrls(){try{return JSON.parse(localStorage.getItem(CFG.URL_KEY)||'{}')}catch(_){return{}}}
function saveUrls(v){localStorage.setItem(CFG.URL_KEY,JSON.stringify(v||{}))}
let urls=loadUrls();
function status(msg,type='loading'){const b=document.getElementById('dqc-status');if(!b)return;b.textContent=msg;b.className='dqc-status visible '+type}
function moduleUrl(id){const local=String(urls[id]||'').trim();if(local)return local;const target=NATIVE_MODULES[id];return target?String(window.KohaTools?.getService?.('module-host')?.url?.(target)||'').trim():''}
function firebaseStatus(id){const target=NATIVE_MODULES[id],helper=window.KohaTools?.getService?.('firebase-module');return helper?.status?.(target)||{configured:false,problem:'Service de validation indisponible',projectId:null}}
function backendRows(){return dataModules().map(m=>({m,st:firebaseStatus(m.id)}))}
function cards(){return visibleModules().map(m=>{const u=moduleUrl(m.id),st=m.id==='rulelab'?null:firebaseStatus(m.id),meta=isAdmin()?`<div class="dqc-meta"><span class="dqc-badge ok">Disponible</span>${st?`<span class="dqc-badge ${st.configured?'ok':'warn'}">${st.configured?'Prêt':'À configurer'}</span>`:''}</div>`:'';return `<div class="dqc-card"><h3><span class="dqc-num">${m.num}</span>${esc(m.title)}</h3><p>${esc(m.desc)}</p>${meta}<div class="dqc-actions">${u?`<a class="btn btn-primary" href="${esc(u)}">Ouvrir</a>`:'<button class="btn btn-default" disabled>Indisponible</button>'}</div></div>`}).join('')}
function render(){const rows=backendRows(),ok=rows.filter(x=>x.st.configured).length;root.innerHTML=`<div class="dqc-hero"><div><div class="dqc-kicker">KOHA · QUALITÉ</div><h2>Centre qualité Koha</h2><p>Point d’entrée des modules indépendants de maintenance et d’exploration qualité.</p></div><div class="dqc-badges"><span class="dqc-badge ok">V${CFG.VERSION}</span><span class="dqc-badge ${ok===rows.length?'ok':'warn'}">Firebase ${ok}/${rows.length}</span></div></div><div id="dqc-status" class="dqc-status"></div><div class="dqc-grid">${cards()}</div>${isAdmin()?`<div class="dqc-panel"><h3>Réglages administrateur</h3><div class="dqc-info">Ces informations servent uniquement à l’administration du Centre qualité.</div><h4>Navigation des modules</h4><div class="dqc-info">KohaTools fournit automatiquement les URL des modules. Les champs ci-dessous restent des surcharges locales de compatibilité.</div><div style="overflow:auto"><table class="dqc-table"><thead><tr><th>Module</th><th>URL de la page Koha</th></tr></thead><tbody>${visibleModules().map(m=>`<tr><td><strong>${m.num} · ${esc(m.title)}</strong></td><td><input class="dqc-url" data-id="${m.id}" value="${esc(moduleUrl(m.id))}" placeholder="/cgi-bin/koha/... ou URL complète"></td></tr>`).join('')}</tbody></table></div><div class="dqc-actions-row"><button id="dqc-save" class="btn btn-primary">Enregistrer les URL</button><button id="dqc-clear" class="btn btn-default">Effacer</button></div></div><div class="dqc-panel"><h3>Backends Firebase indépendants</h3><div class="dqc-info">Le Centre n’a pas de Firebase métier propre. Chaque module ci-dessous possède sa connexion canonique et peut pointer vers un projet différent. Le Laboratoire utilise le backend du module qu’il supervise.</div><div style="overflow:auto"><table class="dqc-table"><thead><tr><th>Module</th><th>État</th><th>Projet configuré</th></tr></thead><tbody>${rows.map(({m,st})=>`<tr><td><strong>${esc(m.title)}</strong></td><td><span class="dqc-badge ${st.configured?'ok':'warn'}">${st.configured?'Configuré':'À configurer'}</span></td><td><span class="dqc-code">${esc(st.projectId||'—')}</span>${st.problem?`<div class="dqc-note">${esc(st.problem)}</div>`:''}</td></tr>`).join('')}</tbody></table></div><div class="dqc-danger"><strong>Isolation :</strong> modifier le Firebase d’un module Qualité ne modifie aucun autre module. Plusieurs modules peuvent volontairement partager le même projet ; ce partage n’est pas une dépendance de code.</div></div><div class="dqc-panel"><h3>Dépendances V1</h3><p><span class="dqc-code">04 Transferts</span> nécessite <strong>RAPPORT_SQL_04_TRANSFERTS</strong>. <span class="dqc-code">07 Périodiques</span> nécessite <strong>RAPPORT_SQL_07_PERIODIQUES</strong>.</p><p class="dqc-note">Le Centre ne charge aucune donnée métier : il sert de navigation et de diagnostic des configurations.</p></div>`:''}`;bind()}
function bind(){document.getElementById('dqc-save')?.addEventListener('click',()=>{const next={};root.querySelectorAll('.dqc-url').forEach(i=>{if(i.value.trim())next[i.dataset.id]=i.value.trim()});urls=next;saveUrls(urls);render();status('URL enregistrées localement.','ok')});document.getElementById('dqc-clear')?.addEventListener('click',()=>{if(confirm('Effacer les URL locales des modules sur ce navigateur ?')){urls={};saveUrls(urls);render()}})}
render();
})();
</script>
