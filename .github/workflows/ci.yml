name: Validate Pimp My Koha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate distribution
        run: node scripts/validate-dist.mjs
      - name: Test Stable / Canary / Dev selector
        run: node scripts/test-channel-loader.mjs
      - name: Test access control
        run: node scripts/test-access-control.mjs
      - name: Test navigation and prerequisites
        run: node scripts/test-navigation.mjs
      - name: Test fresh-install candidate sandbox
        run: node scripts/test-fresh-install-canary.mjs
