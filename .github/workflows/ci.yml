name: Validate Pimp My Koha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate distribution
        run: node scripts/validate-dist.mjs
      - name: Test Stable / Canary / Dev selector
        run: node scripts/test-channel-loader.mjs
      - name: Test access control
        run: node scripts/test-access-control.mjs
      - name: Test prerequisite scopes and version gates
        run: node scripts/test-prerequisite-gates.mjs
      - name: Test fresh-install certification contract
        run: node scripts/test-fresh-install-certification.mjs
      - name: Test safe configuration promotion
        run: node scripts/test-certifier-promotion.mjs
      - name: Test user workflows and access model
        run: node scripts/test-user-workflows.mjs
      - name: Test fresh-install native gates
        run: node scripts/test-fresh-install-native-gates.mjs
